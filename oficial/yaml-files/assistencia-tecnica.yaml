openapi: 3.1.1
info:
  title: Assistência Técnica
  version: 1.24.0
paths: {}
components:
  schemas:
    TechnicalAssistanceWebhookPayload:
      description: Payload do webhook de assistência técnica
      type: object
      required:
        - enterpriseId
        - unitId
        - solicitationId
      properties:
        enterpriseId:
          type: integer
          description: Código do empreendimento
          format: int32
          example: 1
        unitId:
          type: integer
          description: Código da unidade
          format: int32
          example: 1
        solicitationId:
          type: integer
          description: Código da solicitação
          format: int32
          example: 1
      example:
        enterpriseId: 1
        unitId: 1
        solicitationId: 1
    ServiceOrderWebhookPayload:
      description: Payload do webhook de ordem de serviço
      type: object
      required:
        - enterpriseId
        - unitId
        - solicitationId
        - serviceOrderId
      properties:
        enterpriseId:
          type: integer
          description: Código do empreendimento da ordem de serviço
          format: int32
          example: 1
        unitId:
          type: integer
          description: Código da unidade da ordem de serviço
          format: int32
          example: 1
        solicitationId:
          type: integer
          description: Código da solicitação da ordem de serviço
          format: int32
          example: 1
        serviceOrderId:
          type: integer
          description: Código da ordem de serviço
          format: int32
          example: 1
      example:
        enterpriseId: 1
        unitId: 1
        solicitationId: 1
        serviceOrderId: 1
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags:
  - name: Assistência Técnica
security:
  - basicAuth: []
webhooks:
  TECHNICAL_ASSISTANCE_ANALYSIS:
    post:
      tags:
        - Webhooks - Assistência Técnica
      operationId: webhookTechnicalAssistanceAnalysis
      summary: Webhook de assistência técnica em análise
      description: Webhook disparado sempre que uma assistência técnica entra em análise
      requestBody:
        description: JSON com os dados da assistência técnica em análise
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicalAssistanceWebhookPayload'
      responses:
        2XX:
          description: O evento TECHNICAL_ASSISTANCE_ANALYSIS foi recebido com sucesso
      x-audience:
        - public
  TECHNICAL_ASSISTANCE_CANCELED:
    post:
      tags:
