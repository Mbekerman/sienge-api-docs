openapi: 3.1.1
info:
  title: Histórico de Notificação de Cobranças
  version: 1.24.0
  description: Consulta de históricos de notificações enviadas aos clientes
paths:
  /collections-notification-history/{collectionNotificationHistoryId}:
    get:
      x-original-file: collections-notification-history-v1.yaml
      x-audience:
        - public
      tags:
        - Histórico de Notificação de Cobranças
      summary: Busca o histórico da notificação de cobrança no Sienge
      operationId: buscaHistoricoNotificacaoCobranca
      parameters:
        - name: collectionNotificationHistoryId
          in: path
          description: Código do histórico da notificação de cobrança a ser apresentado
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Histórico de notificação de cobrança encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionNotificationHistory'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Consulta dados detalhados do histórico de notificação de cobrança pelo
        identificador (REST)
components:
  schemas:
    CollectionNotificationHistory:
      type: object
      description: >-
        Histórico detalhado de notificações de cobrança incluindo e-mail, SMS e
        webhook
      properties:
        id:
          type: integer
          description: Código do histórico da notificação de cobrança
          format: int32
          example: 12345
        sentEmail:
          type: string
          description: Enviou e-mail. "S" (Sim) ou "N" (Não)
          example: S
        sentSMS:
          type: string
          description: Enviou SMS. "S" (Sim) ou "N" (Não)
          example: 'N'
        notificationRegistered:
          type: string
          description: Enviou a notificação para webhook. "S" (Sim) ou "N" (Não)
          example: S
        client:
          type: string
          description: Id e Nome do cliente concatenado
          example: 123 - João Silva
        receivableBillId:
          description: Identificador do título a receber
          example: 10
          format: int32
          type: integer
        installmentId:
          description: Identificador da parcela do título
          example: 1
          format: int32
          type: integer
        sentDate:
          type: string
          format: date
          description: Data de envio
          example: '2024-01-15'
        dueDate:
          description: Data de vencimento. Formato ISO 8601 (yyyy-MM-dd).
          example: 2018-12-22T00:00:00.000Z
          format: date
          type: string
        installmentValue:
          description: Valor da parcela
          example: 1000
          format: double
          type: number
        notificationMessage:
          type: string
          description: Mensagem de feedback da notificação
          example: Notificação enviada com sucesso
        emailAddress:
          type: string
          description: Endereço de e-mail
          example: cliente@exemplo.com
        emailSubject:
          type: string
          description: Assunto do e-mail
          example: Lembrete de Vencimento - Título 9876
        emailMessage:
          type: string
          description: Mensagem do e-mail
          example: 'Seu título vence em 2024-02-15. Valor: R$ 1.500,00'
        smsSubject:
          type: string
          description: Assunto do SMS
          example: Lembrete Vencimento
        smsMessage:
          type: string
          description: Mensagem do SMS
          example: 'Título 9876 vence em 15/02. Valor: R$ 1.500,00'
        billetValue:
          type: string
          description: Valor do boleto
          example: R$ 1.500,00
    CollectionNotifiedWebhookPayload:
      type: object
      description: Payload do webhook de notificação de cobrança gerada
      required:
        - collectionHistoryId
      properties:
        collectionHistoryId:
          type: integer
          description: Identificador do histórico de notificação de cobrança
          example: 0
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
webhooks:
  COLLECTION_NOTIFIED:
    post:
      tags:
        - Webhooks - Histórico de Notificação de Cobranças
      operationId: collectionNotifiedWebhook
      summary: Notificação de cobrança gerada
      description: >-
        Sempre que é gerado um histórico de notificação de cobrança, realizada
        pela rotina de configuração de notificação de cobrança
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionNotifiedWebhookPayload'
      responses:
        2XX:
          description: O evento COLLECTION_NOTIFIED foi processado com sucesso
      x-audience:
        - public
