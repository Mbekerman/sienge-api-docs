openapi: 3.1.1
info:
  title: Lotes Contábeis (Contabilidade)
  version: 1.24.0
  description: API de operações de lotes contábeis da contabilidade
paths:
  /batch:
    post:
      tags:
        - Lotes Contábeis (Contabilidade)
      summary: Salva lotes contábeis
      operationId: postBatch
      requestBody:
        description: Lista de objetos lotes
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountacyBatchEntry'
        required: true
      responses:
        '201':
          description: Lotes salvos com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountacyBatchApiSuccess'
        '400':
          description: Requisição para salvar lotes contábeis inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: O recurso salvar lote requisitado não foi encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '415':
          $ref: '#/components/responses/415'
        '422':
          description: Entidade não processada - (Salva Lotes contábeis)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          $ref: '#/components/responses/429'
        '500':
          description: Erro interno do servidor (Lotes Contábeis) - (Contabilidade)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: accountancy-batch-v1.yaml
      description: Salva os lotes contábeis (REST)
      x-audience:
        - public
    get:
      x-original-file: accountancy-batch-v1.yaml
      x-audience:
        - public
      tags:
        - Lotes Contábeis (Contabilidade)
      summary: Busca lotes contábeis
      operationId: getLotesContatabeis
      parameters:
        - $ref: '#/components/parameters/CompanyIdQueryRequired'
        - name: batchType
          in: query
          description: Tipo do lote
          schema:
            $ref: '#/components/schemas/BatchTypeEnum'
        - name: batchStatus
          in: query
          description: Situação do lote
          schema:
            $ref: '#/components/schemas/BatchStatusEnum'
        - name: batchDescription
          in: query
          description: Descrição do lote.
          schema:
            type: string
            default: Lote gerado via API
        - $ref: '#/components/parameters/StartDateQueryRequired'
          description: Data inicial do lote
        - $ref: '#/components/parameters/EndDateQueryRequired'
          description: Data final do lote
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lotes encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountacyBatchEntryPaginationResult'
        '400':
          description: Requisição mal formada - (Consultar Lotes Contábeis)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: O recurso requisitado não foi encontrado - (Busca lotes contábeis)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '415':
          $ref: '#/components/responses/415'
        '422':
          description: Entidade não processada - (Consulta Lotes Contábeis)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Consulta lotes contábeis (REST)
components:
  schemas:
    AccountacyBatchEntry:
      description: Estrutura que representa os dados de entrada de um lote contábil
      required:
        - companyId
        - endDate
        - startDate
      type: object
      properties:
        companyId:
          type: integer
          description: Código de empresa
          example: 1
        batchType:
          $ref: '#/components/schemas/BatchTypeEnum'
          description: >-
            Tipo do lote, podendo ser NORMAL, COMPANY_CLOSURE, TAX_CLOSURE ou
            EQUITY_EQUIVALENCE.
        batchDescription:
          type: string
          description: Descrição do lote contábil
          example: Lote gerado via API
        startDate:
          type: string
          description: Data inicial do lote.
          format: date
          example: {}
        endDate:
          type: string
          description: Data final do lote.
          format: date
          example: {}
    AccountacyBatchApiSuccess:
      description: >-
        Estrutura que representa a resposta de sucesso após salvar um lote
        contábil
      type: object
      properties:
        successMessage:
          type: string
          description: Mensagem de Sucesso
          example: Lote 10 gerado com sucesso
        status:
          type: number
          example: 201
    AccountacyBatchEntryPaginationResult:
      description: >-
        Estrutura de resposta paginada contendo a lista de lotes contábeis
        encontrados
      type: object
      required:
        - resultSetMetadata
        - results
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de lotes retornados como resultado da pesquisa
          items:
            $ref: '#/components/schemas/AccountacyBatchEntryResponse'
          example:
            - companyId: 1
              batchType: NORMAL
              batchDescription: Lote gerado via API
              batchStatus: OPENED
              startDate: '2017-12-01'
              endDate: '2017-12-20'
    BatchTypeEnum:
      type: string
      description: Tipo do lote contábil
      enum:
        - NORMAL
        - COMPANY_CLOSURE
        - TAX_CLOSURE
        - EQUITY_EQUIVALENCE
      example: NORMAL
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    AccountacyBatchEntryResponse:
      description: Estrutura de resposta detalhada de um lote contábil encontrado
      allOf:
        - $ref: '#/components/schemas/AccountacyBatchEntry'
        - type: object
          properties:
            batchStatus:
              $ref: '#/components/schemas/BatchStatusEnum'
              description: Situação do lote, podendo ser OPENED, CLOSED ou MAINTENANCE.
    BatchStatusEnum:
      type: string
      description: Situação do lote contábil
      enum:
        - OPENED
        - CLOSED
        - MAINTENANCE
      example: OPENED
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    CompanyIdQueryRequired:
      description: Código da empresa
      in: query
      name: companyId
      required: true
      schema:
        example: 1
        type: integer
    StartDateQueryRequired:
      description: Data inicial para filtro de período
      in: query
      name: startDate
      required: true
      schema:
        example: '2023-01-01'
        format: date
        type: string
    EndDateQueryRequired:
      description: Data final para filtro de período
      in: query
      name: endDate
      required: true
      schema:
        example: '2023-01-31'
        format: date
        type: string
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
