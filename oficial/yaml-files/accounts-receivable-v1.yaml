openapi: 3.1.1
info:
  title: Títulos do Contas a Receber
  version: 1.24.0
  description: API de títulos do contas a receber.
paths:
  /accounts-receivable/receivable-bills:
    get:
      x-original-file: accounts-receivable-v1.yaml
      x-section: Títulos
      x-audience:
        - public
      tags:
        - Títulos
      summary: Busca os títulos do cliente no Sienge
      description: >-
        Busca os títulos a receber do cliente no Sienge, com informações de
        parcelas e apropriações financeiras (REST)
      operationId: findReceivableBills
      parameters:
        - $ref: '#/components/parameters/CustomerIdQueryRequired'
        - $ref: '#/components/parameters/CompanyId'
        - name: costCenterId
          in: query
          description: Código do centro de custo
          schema:
            type: integer
            example: 10
        - name: paidOff
          in: query
          description: Filtrar apenas títulos quitados
          schema:
            type: boolean
            default: false
            example: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Títulos encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseReceivableBills'
              example:
                resultSetMetadata:
                  count: 1
                  offset: 0
                  limit: 100
                results:
                  - customerId: 57
                    receivableBillId: 300
                    documentId: CT
                    documentNumber: UND102B
                    issueDate: '2018-12-22'
                    receivableBillValue: 100
                    companyId: 1
                    defaulting: false
                    subjudice: false
                    note: Observação do título
                    payOffDate: '2025-02-09'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /accounts-receivable/receivable-bills/{receivableBillId}:
    get:
      x-original-file: accounts-receivable-v1.yaml
      x-section: Títulos
      x-audience:
        - public
      tags:
        - Títulos
      summary: Busca os títulos no Sienge pelo número
      description: >-
        Busca os títulos a receber no Sienge pelo número do título, juntamente
        com informações de parcelas e apropriações financeiras (REST)
      operationId: findReceivableBillsForId
      parameters:
        - name: receivableBillId
          in: path
          description: 'Número do título | Exemplo: 300'
          required: true
          schema:
            type: integer
            format: int32
            example: 300
      responses:
        '200':
          description: Título encontrado pelo número do título
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivableBillById'
              example:
                customerId: 57
                receivableBillId: 300
                documentId: CT
                documentNumber: UND102B
                issueDate: '2018-12-22'
                receivableBillValue: 100
                companyId: 1
                defaulting: false
                subjudice: false
                normal: true
                inBilling: false
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /accounts-receivable/receivable-bills/{receivableBillId}/installments:
    get:
      x-original-file: accounts-receivable-v1.yaml
      x-section: Parcelas do título
      x-audience:
        - public
      tags:
        - Parcelas do título
      summary: Busca as parcelas do título
      description: Busca as parcelas do título a receber com o número informado (REST)
      operationId: findReceivableInstallments
      parameters:
        - $ref: '#/components/parameters/ReceivableBillId'
        - name: carrierIdIn
          in: query
          description: 'Id dos portadores para incluir na consulta | Exemplo: 120, 263'
          schema:
            type: integer
            format: int32
            example: 120
        - name: carrierIdNotIn
          in: query
          description: 'Id dos portadores para excluir da consulta  | Exemplo: 120, 263'
          style: form
          explode: false
          schema:
            type: array
            example:
              - 120
              - 263
            items:
              type: integer
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Parcelas encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseReceivableBillInstallments'
              example:
                resultSetMetadata:
                  count: 1
                  offset: 0
                  limit: 100
                results:
                  - receivableBillId: 300
                    installmentId: 1
                    carrierId: 5
                    conditionTypeId: PM
                    dueDate: '2018-01-10'
                    balanceDue: 1000
                    generatedTicket: true
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /accounts-receivable/receivable-bills/{receivableBillId}/installments/{installmentId}/change-due-date:
    patch:
      tags:
        - Parcelas do título
      summary: Altera venc. da parcela e status da cobrança para Em Aberto
      operationId: changeDueDate
      x-section: Parcelas do título
      x-original-file: accounts-receivable-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/ReceivableBillId'
        - name: installmentId
          in: path
          description: 'Número da parcela | Exemplo: 2'
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        description: Informações necessárias para alterar data de vencimento
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceivableBillInstallmentDueDate'
            example:
              newDueDate: '2021-05-25'
        required: true
      responses:
        '204':
          description: Parcela alterada com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Altera data de vencimento da parcela e o status da cobrança para Em
        Aberto. Será possível registrar nova cobrança na sequência. Não será
        possível alterar parcelas com baixas e a nova data de vencimento não
        poderá ser menor que a data corrente. (REST)
  /accounts-receivable/{receivableBillId}/budget-categories:
    get:
      x-original-file: accounts-receivable-v1.yaml
      x-section: Apropriação financeira do título
      x-audience:
        - public
      tags:
        - Apropriação financeira do título
      summary: Busca as apropriações financeiras do título
      description: >-
        Busca as apropriações financeiras do título a receber com o número
        informado (REST)
      operationId: getAccountsReceivableIdBudgetCategories
      parameters:
        - name: receivableBillId
          in: path
          description: Número do título em que as apropriações financeiras estão vinculados
          required: true
          schema:
            type: integer
            format: int32
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Apropriações financeiras encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseReceivableBillBudgetCategories'
              example:
                resultSetMetadata:
                  count: 1
                  offset: 0
                  limit: 100
                results:
                  - costCenterId: 10
                    paymentCategoriesId: '2010101'
                    percentage: 100
                    links:
                      - rel: accounts-receivable
                        href: http://../v1/accounts-receivable/1
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  schemas:
    GetResponseReceivableBills:
      required:
        - resultSetMetadata
        - results
      type: object
      description: Lista de títulos a receber
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de títulos
          items:
            $ref: '#/components/schemas/ReceivableBill'
          example:
            - customerId: 57
              receivableBillId: 300
              documentId: CT
              documentNumber: UND102B
              issueDate: '2018-12-22'
              receivableBillValue: 100
              companyId: 1
              defaulting: false
              subjudice: false
    ReceivableBillById:
      description: Dados do título a receber por ID
      allOf:
        - $ref: '#/components/schemas/BaseReceivableBill'
        - type: object
          properties:
            normal:
              type: boolean
              description: Em situação normal
              example: true
            inBilling:
              type: boolean
              description: Em situação Em cobrança
              example: false
    GetResponseReceivableBillInstallments:
      required:
        - resultSetMetadata
        - results
      type: object
      description: Lista de parcelas do título a receber
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de Parcelas do título
          items:
            $ref: '#/components/schemas/ReceivableBillInstallment'
          example:
            - receivableBillId: 300
              installmentId: 1
              carrierId: 5
              conditionTypeId: PM
              dueDate: '2018-01-10'
              balanceDue: 1000
              generatedTicket: true
    ReceivableBillInstallmentDueDate:
      required:
        - newDueDate
      type: object
      description: Resultado da nova data de vencimento da parcela
      properties:
        newDueDate:
          type: string
          description: 'Nova data de vencimento da parcela. Formato esperado: yyyy-MM-dd.'
          format: date
          example: {}
    GetResponseReceivableBillBudgetCategories:
      required:
        - resultSetMetadata
        - results
      type: object
      description: Resultado com lista de apropriações financeiras do título a receber
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          allOf:
            - $ref: '#/components/schemas/FinancialAppropriationsListDescription'
            - type: array
              items:
                $ref: '#/components/schemas/ReceivableBillBudgetCategories'
          example:
            - costCenterId: 10
              paymentCategoriesId: '2010101'
              percentage: 100
              links:
                - rel: accounts-receivable
                  href: http://../v1/accounts-receivable/1
    ReceivableInstallmentWebhookPayload:
      description: Payload do webhook de parcela do contas a receber
      type: object
      required:
        - receivableBillId
        - installmentId
      properties:
        receivableBillId:
          type: integer
          description: ID do título a receber
          format: int32
          example: 0
        installmentId:
          description: Identificador da parcela do título
          example: 1
          format: int32
          type: integer
    AssignmentRightsAgreementWebhookPayload:
      description: Payload do webhook de cessão de direito
      type: object
      required:
        - receivableBillId
        - dtRightAssignment
        - customersIdBefore
        - customersIdAfter
      properties:
        receivableBillId:
          type: integer
          description: Identificador do título a receber para cessão de direito
          format: int32
          example: 0
        dtRightAssignment:
          type: string
          description: Data da cessão de direito
          format: date
          example: '2023-01-01'
        customersIdBefore:
          type: array
          description: IDs dos clientes antes da cessão
          items:
            type: integer
            format: int32
          example:
            - 1
            - 2
            - 3
        customersIdAfter:
          type: array
          description: IDs dos clientes após a cessão
          items:
            type: integer
            format: int32
          example:
            - 4
            - 5
            - 6
      example:
        receivableBillId: 0
        dtRightAssignment: '2023-01-01'
        customersIdBefore:
          - 1
          - 2
          - 3
        customersIdAfter:
          - 4
          - 5
          - 6
    ReceivableBillSituationWebhookPayload:
      description: Payload do webhook de alteração de situação do título
      type: object
      required:
        - receivableBillId
        - situation
      properties:
        receivableBillId:
          type: array
          description: IDs dos títulos a receber
          items:
            type: integer
            format: int32
          example:
            - 1
            - 2
        situation:
          type: string
          description: Nova situação do título
          example: string
      example:
        receivableBillId:
          - 1
          - 2
        situation: string
    ReceiptProcessedWebhookPayload:
      description: Payload do webhook de baixa/recebimento processado
      type: object
      required:
        - billId
        - installmentId
      properties:
        billId:
          type: integer
          description: ID do título para baixa/recebimento
          format: int32
          example: 0
        installmentId:
          description: Identificador da parcela do título
          example: 1
          format: int32
          type: integer
    KeysHandoverWebhookPayload:
      description: Payload do webhook de entrega de chaves
      type: object
      required:
        - titleNumber
        - customerId
        - contractNumber
        - dtKeysHandover
      properties:
        titleNumber:
          type: integer
          allOf:
            - $ref: '#/components/schemas/ReceivableBillNumberDescription'
          format: int32
          example: 1
        customerId:
          type: integer
          description: ID do cliente
          format: int32
          example: 10
        contractNumber:
          type: string
          description: Número do contrato
          example: ABC123
        dtKeysHandover:
          type: string
          description: Data da entrega de chaves
          format: date
          example: '2025-01-01'
      example:
        titleNumber: 1
        customerId: 10
        contractNumber: ABC123
        dtKeysHandover: '2025-01-01'
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    ReceivableBill:
      description: Dados do título a receber
      allOf:
        - $ref: '#/components/schemas/BaseReceivableBill'
        - type: object
          properties:
            payOffDate:
              type: string
              description: Data de quitação (Formato ISO 8601 yyyy-MM-dd)
              format: date
              example: {}
    BaseReceivableBill:
      type: object
      description: Dados básicos do título a receber
      properties:
        customerId:
          type: integer
          description: Número do código do cliente
          format: int32
          example: 57
        receivableBillId:
          allOf:
            - $ref: '#/components/schemas/InstallmentIdDescription'
            - type: integer
              format: int32
        documentId:
          type: string
          description: 'Código do documento | Exemplo: CT'
        documentNumber:
          type: string
          description: 'Número do documento | Exemplo: UND102B'
        issueDate:
          description: Data de emissão. Formato ISO 8601 (yyyy-MM-dd).
          example: 2018-12-22T00:00:00.000Z
          format: date
          type: string
        receivableBillValue:
          type: number
          description: Valor do título bruto
          format: double
        companyId:
          type: integer
          description: Código da empresa do título
          format: int32
        defaulting:
          type: boolean
          description: Em situação de inadimplência
          example: false
        subjudice:
          type: boolean
          description: Em situação sub judice
          example: false
        note:
          type: string
          description: observação constante do título
        unityName:
          type: string
          description: Identificador da unidade principal do título
          example: AP 303
    ReceivableBillInstallment:
      type: object
      description: Dados da parcela do título a receber
      properties:
        receivableBillId:
          type: integer
          description: Número do título da parcela
          format: int32
        installmentId:
          allOf:
            - description: Número da parcela
              example: 1
              format: int32
              type: integer
            - example: 1
        carrierId:
          type: integer
          description: Número do portador
          format: int32
          example: 5
        conditionType:
          type: string
          description: Código da condição de pagamento
          example: PM
        dueDate:
          description: Data de vencimento. Formato ISO 8601 (yyyy-MM-dd).
          example: 2018-12-22T00:00:00.000Z
          format: date
          type: string
        balanceDue:
          type: number
          description: Saldo devedor original
          format: double
          example: 1000
        generatedTicket:
          type: boolean
          description: Possui cobrança/boleto gerado
          example: true
    FinancialAppropriationsListDescription:
      description: Lista de apropriações financeiras do título
    ReceivableBillBudgetCategories:
      type: object
      description: Dados da apropriação financeira do título a receber
      properties:
        costCenterId:
          allOf:
            - $ref: >-
                #/components/schemas/CostCenterFinancialAppropriationIdDescription
            - type: integer
              format: int32
        paymentCategoriesId:
          maxLength: 9
          minLength: 1
          type: string
          description: 'Código do plano financeiro (sem máscara) | Exemplo: 2010101'
        percentage:
          maximum: 100
          type: number
          description: >-
            Percentual apropriado do centro de custo |  Máximo de casas
            decimais: 12 | Exemplo: 100.00
          format: double
        links:
          allOf:
            - $ref: '#/components/schemas/Links'
            - items:
                $ref: '#/components/schemas/ResourceLink'
    ReceivableBillNumberDescription:
      description: Número do título
    InstallmentIdDescription:
      description: Código da parcela
    CostCenterFinancialAppropriationIdDescription:
      description: Código do centro de custo da apropriação financeira
    Links:
      description: Links para acessar outros recursos
      example:
        - href: https://../v1/purchase-..
          rel: Recurso
      items:
        $ref: '#/components/schemas/Link'
      type: array
    ResourceLink:
      type: object
      description: Descrição do link para acesso a outros recursos
      properties:
        rel:
          allOf:
            - description: Nome da recurso associado
              example: Recurso
              type: string
            - example: accounts-receivable
        href:
          allOf:
            - description: URL do recurso associado
              example: https://../v1/purchase-..
              type: string
            - example: http://../v1/accounts-receivable/1
    Link:
      description: Representa um link para outro recurso.
      properties:
        href:
          description: URL do recurso associado
          example: https://../v1/purchase-..
          type: string
        rel:
          description: Nome da recurso associado
          example: Recurso
          type: string
      type: object
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
