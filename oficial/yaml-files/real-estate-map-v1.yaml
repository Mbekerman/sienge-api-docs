openapi: 3.1.1
info:
  title: Mapa Imobiliário Consolidado
  version: 1.24.0
  description: API REST Mapa Imobiliário Consolidado
paths:
  /real-estate-map:
    get:
      x-original-file: real-estate-map-v1.yaml
      x-audience:
        - public
      tags:
        - Mapa Imobiliário Consolidado
      summary: Consulta o Mapa Imobiliário por empreendimento e período
      operationId: getRealEstateMapDate
      parameters:
        - name: costCentersId
          in: query
          description: Códigos dos centros de custo cadastrados no Sienge.
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
            example:
              - 10
              - 20
              - 30
        - name: startDate
          in: query
          description: Data de início do período da consulta (ISO 8601 yyyy-MM-dd).
          required: true
          schema:
            type: string
            format: date
            example: '2022-01-01'
        - name: endDate
          in: query
          description: Data do fim do período da consulta (ISO 8601 yyyy-MM-dd).
          required: true
          schema:
            type: string
            format: date
            example: '2022-12-01'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Resultado da pesquisa retornado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationResultRealEstateMap'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna os dados do Mapa Imobiliário para os empreendimentos e período
        informados nos parâmetros. (REST)
components:
  schemas:
    PaginationResultRealEstateMap:
      description: Resultado paginado da consulta do Mapa Imobiliário Consolidado
      required:
        - resultSetMetadata
        - results
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de mapas imobiliários retornados como resultado da pesquisa
          items:
            $ref: '#/components/schemas/RealEstateMapResponse'
          example:
            - enterpriseData:
                companyId: 1
                companyName: Softplan
                enterpriseId: 12
                enterpriseName: empreendimento softplan
                units: 51
                monthYear: 08/2022
              vgvData:
                vgv: 10034.94
                vgvVariation: 21034.94
                poc: 100
                variationPoc: 100
              corporateIncome:
                appropriateIncome: 17800.94
                appropriateMonthlyIncome: 71034.94
                customerBalance: 69754
              accumulatedReceipts:
                accumulatedReceipt: 4787800.94
                monthlyReceipt: 21034.95
                receivingDistractedUnit: 0
              budgetedAndIncurredCost:
                budgetedCost: 98500.94
                variationBudgetedCost: 1034.95
                accumulatedIncurredCost: 87500
                costToIncur: 6500
                monthlyIncurredCost: 500
              corporateCost:
                appropriateCost: 48500.94
                monthlyAppropriateCost: 834.95
                stock: 875000
                guarantee: 165000
                commission: 5000
              margin:
                accumulatedRevenue: 448500.24
                accruedCost: 430000.95
                grossProfit: 18499.29
                grossMarginPercentage: 0.0412
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    RealEstateMapResponse:
      type: object
      properties:
        enterpriseData:
          $ref: '#/components/schemas/EnterpriseData'
        vgvData:
          $ref: '#/components/schemas/VgvData'
        corporateIncome:
          $ref: '#/components/schemas/CorporateIncome'
        accumulatedReceipts:
          $ref: '#/components/schemas/AccumulatedReceipts'
        budgetedAndIncurredCost:
          $ref: '#/components/schemas/BudgetedAndIncurredCost'
        corporateCost:
          $ref: '#/components/schemas/CorporateCost'
        margin:
          $ref: '#/components/schemas/Margin'
      description: Mapa-imobiliário
    EnterpriseData:
      type: object
      properties:
        companyId:
          type: integer
          description: Código da empresa
          format: int32
          example: 1
        companyName:
          type: string
          description: Nome da empresa
          example: Softplan
        enterpriseId:
          type: integer
          description: Código do empreendimento
          format: int32
          example: 12
        enterpriseName:
          type: string
          description: Nome do empreendimento
          example: empreendimento softplan
        units:
          type: integer
          description: Quantidade de unidades
          format: int32
          example: 51
        monthYear:
          type: string
          description: Mês ano
          example: 08/2022
      description: Dados do empreendimento
    VgvData:
      type: object
      properties:
        vgv:
          type: number
          description: Valor do VGV
          example: 10034.94
        vgvVariation:
          type: number
          description: Valor da variação VGV
          example: 21034.94
        poc:
          type: number
          description: Valor do POC
          example: 100
        variationPoc:
          type: number
          description: Valor da variação do POC
          example: 100
      description: Dados do VGV
    CorporateIncome:
      type: object
      properties:
        appropriateIncome:
          type: number
          description: Valor da receita apropriada
          example: 17800.94
        appropriateMonthlyIncome:
          type: number
          description: Valor da receita apropriada mensal
          example: 71034.94
        customerBalance:
          type: number
          description: Contas a receber e/ou adiantamento de cliente
          example: 69754
      description: Receita societária
    AccumulatedReceipts:
      type: object
      properties:
        accumulatedReceipt:
          type: number
          description: Valor do recebimento acumulado
          example: 4787800.94
        monthlyReceipt:
          type: number
          description: Valor do recebimento mensal
          example: 21034.95
        receivingDistractedUnit:
          type: number
          description: Valor de recebimento das unidades distratadas
          example: 0
      description: Recebimentos acumulados
    BudgetedAndIncurredCost:
      type: object
      properties:
        budgetedCost:
          type: number
          description: Valor do custo orçado
          example: 98500.94
        variationBudgetedCost:
          type: number
          description: Valor da variação do custo orçado
          example: 1034.95
        accumulatedIncurredCost:
          type: number
          description: Valor incorrido acumulado
          example: 87500
        costToIncur:
          type: number
          description: Custo a incorrer
          example: 6500
        monthlyIncurredCost:
          type: number
          description: Custo incorrido mensal
          example: 500
      description: Custo orçado e incorrido
    CorporateCost:
      type: object
      properties:
        appropriateCost:
          type: number
          description: Valor do custo apropriado
          example: 48500.94
        monthlyAppropriateCost:
          type: number
          description: Valor do custo apropriado mensal
          example: 834.95
        stock:
          type: number
          description: Estoque
          example: 875000
        guarantee:
          type: number
          description: Provisão de garantia
          example: 165000
        commission:
          type: number
          description: Comissões
          example: 5000
      description: Custo societário
    Margin:
      type: object
      properties:
        accumulatedRevenue:
          type: number
          description: Valor da receita acumulada
          example: 448500.24
        accruedCost:
          type: number
          description: Valor do custo acumulado
          example: 430000.95
        grossProfit:
          type: number
          description: Lucro bruto
          example: 18499.29
        grossMarginPercentage:
          type: number
          description: Percentual de lucro
          example: 0.0412
      description: Margem de lucro
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
