openapi: 3.1.1
info:
  title: Planejamentos de Obra
  version: 1.24.0
  description: API de Planejamentos de Obra
paths:
  /building-projects/{buildingId}/sheets/{buildingUnitId}/tasks:
    get:
      x-original-file: building-projects-v1.yaml
      x-audience:
        - public
      tags:
        - Planejamentos de Obra
      summary: Retorna tarefas da planilha atual do planejamento da obra
      operationId: getBuildingProjectsIdSheetsIdTasks
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: Identificador único da obra no qual tarefas serão manipuladas
        - name: buildingUnitId
          in: path
          description: Código da unidade construtiva da obra do planejamento
          required: true
          schema:
            type: integer
            format: int32
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            Retorna um array com as tarefas da planilha da versão atual do
            planejamento da respectiva obra, sendo uma planilha para cada
            unidade construtiva (building unit). Se não existir nenhuma, retorna
            um array vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseTask'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna um array com as tarefas da versão atual da planilha de
        planejamento de uma obra, sendo uma planilha para cada unidade
        construtiva (building unit). O planejamento em questão é identificado
        pelo respectivo código da obra (buildingId), considerando por padrão a
        versão atual do planejamento. (REST)
    put:
      tags:
        - Planejamentos de Obra
      summary: Insere tarefas na planilha de planejamento da obra
      operationId: putBuildingProjectsIdSheetsIdTasks
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: >-
            Identificador numérico único da construção no sistema, utilizado
            para localizar o planejamento específico a ser manipulado
        - name: buildingUnitId
          in: path
          description: >-
            Identificador numérico único da unidade construtiva onde as tarefas
            serão inseridas ou consultadas no planejamento da obra
          required: true
          schema:
            type: integer
            format: int32
        - name: allowDeleteTaskCostItem
          in: query
          description: Permite deletar qualquer custo tarefa vinculado à uma tarefa.
          schema:
            type: boolean
            default: true
      requestBody:
        description: |-
          Tarefas que serão inseridas.

            Nível das tarefas: Deve ser sempre maior que zero. Não pode haver "gaps" entre as tarefas, ou seja, uma tarefa de nível 1 deve ser sucedida por uma nível 2, porém como as tarefas são inseridas na ordem da estrutura do planejamento, uma tarefa de nível 3 pode ser sucedida por uma de nível 2, 1 ou 4, nunca por uma nível 5;

            Datas de início e fim: Devem observar o intervalo de início e fim da obra;

            Custos: Quando o "costItems" não for informado no body ou for informado como null, os custos não sofrerão qualquer modificação. Quando informado um array, todos os custos existentes serão excluídos e substituídos pelos custos informados no array. Portanto, se o array for vazio, irá apagar todos os custos.

            Se for enviar o Custo de Tarefas, procure enviar de todas que realmente possuem. Isso permitirá realizar análises mais precisas do payload da requisição quando alguma validação ou erro ocorrer.
        content:
          application/json:
            schema:
              type: array
              example:
                - id: 1
                  description: Alvenaria de tijolo vazado
                  level: 1
                  startDate: '2019-06-20'
                  finishDate: '2019-08-13'
                - id: 2
                  description: Assentamento de alvenaria
                  level: 2
                  startDate: '2019-06-20'
                  finishDate: '2019-08-13'
                  plannedExecutions:
                    - year: 2021
                      month: 1
                      plannedPercentage: 3.23
                    - year: 2021
                      month: 2
                      plannedPercentage: 64.51
                    - year: 2021
                      month: 3
                      plannedPercentage: 32.26
                  costItems:
                    - sheetItemId: '453'
                      costRatio: 25
                    - sheetItemId: '1687'
                      costRatio: 50.5024
                - id: 3
                  description: Pintura Latex
                  level: 1
                  startDate: '2019-06-30'
                  finishDate: '2019-07-05'
                - id: 4
                  description: Preparo da supefície
                  level: 2
                  startDate: '2019-06-30'
                  finishDate: '2019-07-02'
                - id: 5
                  description: Aplicação de tinta
                  level: 2
                  startDate: '2019-07-02'
                  finishDate: '2019-07-05'
              items:
                $ref: '#/components/schemas/TaskDtoForPut'
        required: true
      responses:
        '204':
          description: Sem conteúdo
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: building-projects-v1.yaml
      description: >-
        Insere um array de tarefas em uma nova versão da planilha de
        planejamento de uma obra, sendo uma planilha para cada unidade
        construtiva (building unit). O planejamento em questão é identificado
        pelo respectivo código da obra (buildingId), considerando por padrão a
        versão atual do planejamento. (REST)
      x-audience:
        - public
components:
  schemas:
    GetResponseTask:
      type: object
      description: Resposta contendo metadados e lista de tarefas do planejamento de obra
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          items:
            $ref: '#/components/schemas/TaskDtoForGet'
          example:
            - id: 10
              presentationId: 1
              description: Alvenaria de Tijolo Furado
              level: 2
              startDate: '2019-05-06'
              finishDate: '2019-05-10'
              duration: 4
              summary: false
              location: Bloco A
              unitOfMeasure: m2
              quantity: 23.3205
              totalPrice: 209.91
              pricesByCategory:
                - category: MATERIAL
                  totalPrice: 209.91
              plannedExecutions:
                - year: 2019
                  month: 6
                  duration: 1
                  plannedPercentage: 3.23
    TaskDtoForPut:
      type: object
      description: >-
        Representa a estrutura de dados necessária para inserir ou atualizar uma
        tarefa no planejamento de obras, definindo seus atributos essenciais
        como identificação, cronograma, distribuição temporal de execução e
        vínculos com itens orçamentários
      properties:
        id:
          type: number
          description: >-
            Número sequencial que identifica unicamente a tarefa dentro do
            projeto, mantendo-se constante durante todo o ciclo de vida do
            planejamento
          example: 2
        description:
          type: string
          description: >-
            Identificador textual da tarefa que descreve seu escopo e finalidade
            dentro do planejamento da obra, permitindo sua clara identificação e
            diferenciação das demais atividades
          example: Alvenaria Estrutural
        level:
          type: number
          description: >-
            Posição hierárquica da tarefa na estrutura de decomposição do
            trabalho, onde cada nível representa um grau de detalhamento
            progressivo do planejamento
          example: 1
        startDate:
          type: string
          description: >-
            Define a data em que a atividade será iniciada dentro do cronograma
            do projeto, sendo um marco crucial para o sequenciamento das tarefas
            e controle do progresso
          example: {}
        finishDate:
          type: string
          description: >-
            Estabelece a data limite para conclusão da atividade, servindo como
            marco final para o cálculo da duração e distribuição dos recursos
          example: {}
        plannedExecutions:
          type: array
          description: >
            Percentuais de execução planejados por mês.

            - A soma dos percentuais informados para cada tarefa deve ser igual
            a `100`;

            - Todos os meses compreendidos no período de execução da tarefa
            devem ser representados neste array, mesmo que o percentual de
            alguns meses seja zero. Por exemplo, se uma tarefa foi planejada
            para iniciar no dia 05 de janeiro de 2019 e terminar no dia 20 de
            março de 2019, é obrigatório informar os percentuais de execuçao de
            janeiro, fevereiro e março;

            - O preenchimento deste campo é opcional. Se o campo
            plannedExecutions não constar no JSON ou se seu valor for NULL ou um
            array vazio, os percentuais de execução da tarefa serão distribuídos
            de forma linear considerando as configurações do calendário da obra.
            No caso de tarefas já existentes, se as datas da tarefa forem
            alteradas sem passar a execução planejada por mês, o comportamento
            do sistema irá variar conforme as configurações do parâmetro `862`.
          items:
            $ref: '#/components/schemas/PlannedExecutionDtoForPut'
        costItems:
          type: array
          description: >
            Apropriação de custo da tarefa nos itens do orçamento.

            - Caso o valor seja `NULL` as apropriações de custo da tarefa não
            serão atualizadas ou removidas;

            - Caso o valor seja um array vazio (`[]`) as apropriações de custo
            existentes para a tarefa serão removidas;

            - Itens de orçamento com unidades de medida diferentes não podem ser
            vinculados a uma mesma tarefa (exceto, quando permitido pelo
            parâmetro `869`);

            - A soma dos percentuais de apropriação de custo, referentes a um
            mesmo item de orçamento, não pode superar 100%;

            - Uma tarefa pode apropriar custos vinculados a mais de um item de
            orçamento.
          items:
            $ref: '#/components/schemas/CostItemDto'
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    TaskDtoForGet:
      type: object
      description: >-
        Representa uma tarefa no contexto do planejamento de obras, contendo
        informações essenciais como identificação, cronograma, custos,
        localização e métricas de execução. Esta estrutura é utilizada para
        retornar os dados detalhados de tarefas existentes.
      properties:
        id:
          description: Identificador único imutável da tarefa
          example: 10
          type: number
        presentationId:
          description: >-
            Código visível da tarefa, representa a posição dela na estrutura do
            planejamento
          example: 1
          type: number
        description:
          type: string
          description: >-
            Nome ou título que identifica a tarefa no planejamento da obra,
            fornecendo uma descrição clara e concisa do trabalho a ser realizado
          example: Alvenaria de Tijolo Furado
        level:
          type: number
          description: Nível da tarefa no planejamento
          example: 2
        startDate:
          type: string
          description: Data de início da tarefa no formato yyyy-MM-dd
          example: {}
        finishDate:
          type: string
          description: Data de término da tarefa no formato yyyy-MM-dd
          example: {}
        duration:
          type: number
          description: >-
            Duração da tarefa considerando apenas dias úteis. A configuração de
            dias úteis é feita no calendário da obra
          example: 4
        summary:
          type: boolean
          description: Indica se o registro representa um agrupamento de tarefas
          example: false
        location:
          type: string
          description: Localização de onde a tarefa foi planejada para ser realizada
          example: Bloco A
        unitOfMeasure:
          type: string
          description: Unidade de medida da tarefa
          example: m2
        quantity:
          type: number
          description: Quantidade planejada da tarefa com precisão de 4 casas
          example: 23.3205
        totalPrice:
          type: number
          description: >-
            Preço total da tarefa com precisão de 2 casas. Equivalente a soma
            dos preços totais por tipo de insumo
          example: 209.91
        pricesByCategory:
          type: array
          description: >-
            Preços da tarefa detalhados por tipo de insumo (por exemplo
            material, mão de obra e equipamento).
          items:
            $ref: '#/components/schemas/PriceByCategoryTotalPrice'
        plannedExecutions:
          type: array
          description: >
            Percentuais de execução planejados por mês.

            - A soma dos percentuais informados para cada tarefa deve ser igual
            a `100`;

            - Todos os meses compreendidos no período de execução da tarefa
            devem ser representados neste array, mesmo que o percentual de
            alguns meses seja zero. Por exemplo, se uma tarefa foi planejada
            para iniciar no dia 05 de janeiro de 2019 e terminar no dia 20 de
            março de 2019, é obrigatório informar os percentuais de execuçao de
            janeiro, fevereiro e março;

            - O preenchimento deste campo é opcional. Se o campo
            plannedExecutions não constar no JSON ou se seu valor for `NULL` ou
            um array vazio, os percentuais de execução da tarefa serão
            distribuídos de forma linear considerando as configurações do
            calendário da obra. No caso de tarefas já existentes, se as datas da
            tarefa forem alteradas sem passar a execução planejada por mês, o
            comportamento do sistema irá variar conforme as configurações do
            parâmetro `862`.
          items:
            $ref: '#/components/schemas/PlannedExecutionDtoForGet'
        costItems:
          type: array
          description: >
            Retorna as apropriações de custo da tarefa nos itens do orçamento ou
            um array vazio quando uma tarefa não possuir custos apropriados. 

            - Tarefas agrupadoras não possuem custos apropriados.

            - A soma dos percentuais de apropriação de custo, referentes a um
            mesmo item de orçamento, não pode superar 100%;

            - Uma tarefa pode ter custos apropriados em mais de um item de
            orçamento.
          example:
            - sheetItemId: '453'
              costRatio: 25
            - sheetItemId: '1687'
              costRatio: 50.5024
          items:
            $ref: '#/components/schemas/CostItemDto'
    PlannedExecutionDtoForPut:
      type: object
      description: >
        Representa a distribuição mensal do percentual de execução planejado
        para uma tarefa do cronograma.

        Permite definir quanto da tarefa deve ser executada em cada mês do seu
        período de duração.
      properties:
        year:
          type: number
          description: >-
            Ano da execução. Aceita um número inteiro com, no mínimo, quatro
            casas.
          example: 2019
        month:
          type: number
          description: >-
            Mês da execução. Aceita um número inteiro entre `1` (janeiro) e `12`
            (dezembro).
          example: 4
        plannedPercentage:
          type: number
          description: >-
            Percentual de execução planejado para o respectivo mês. Aceita um
            número entre `0` e `100`, com no máximo duas casas decimais.
          example: 23.87
    CostItemDto:
      type: object
      description: >
        Define a relação entre tarefa do cronograma e itens do orçamento,
        estabelecendo

        como os custos são distribuídos percentualmente entre diferentes
        componentes do projeto.
      properties:
        sheetItemId:
          type: string
          description: Identificador único do item de orçamento
        costRatio:
          type: number
          description: Percentual de apropriação do item de orçamento na tarefa
    PriceByCategoryTotalPrice:
      type: object
      description: >-
        Representa o detalhamento financeiro por categoria de insumo, permitindo
        visualizar a composição de custos de uma tarefa discriminada por tipo
        (material, mão de obra, equipamento etc), incluindo seus valores totais
      properties:
        category:
          type: string
          description: Tipo de insumo correspondente aos preços totais e unitários.
          example: MATERIAL
          enum:
            - EQUIPMENT
            - LABOR
            - INCREMENTAL_COST_ITEM
            - MATERIAL
            - TRANSPORT_ITEM
            - OTHER
            - OFFICE_SUPPLY
            - FUELS_AND_LUBRICANTS
            - MAINTENANCE_MATERIAL
        totalPrice:
          type: number
          description: >-
            Preço total para tipo de insumo correspondente com precisão de 2
            casas
          example: 209.91
    PlannedExecutionDtoForGet:
      type: object
      description: >
        Detalha a distribuição mensal do percentual de execução previsto para
        cada tarefa do cronograma.

        Fornece uma visão temporal da execução, incluindo ano, mês, duração e
        percentual planejado por período.
      properties:
        year:
          type: number
          description: Ano da execução. Retorna um número inteiro.
        month:
          type: number
          description: >-
            Mês da execução. Retorna um número inteiro entre `1` (janeiro) e
            `12` (dezembro).
        duration:
          type: number
          description: >-
            Duração da tarefa, dentro do mês e ano, considerando apenas dias
            úteis. Retorna um número inteiro entre '1' e '31' (Quantidade máxima
            de dias em um mês).
        plannedPercentage:
          type: number
          description: >-
            Percentual de execução planejado para o respectivo mês. Retorna um
            número entre `0` e `100`, com no máximo duas casas decimais. A soma
            dos percentuais vai, sempre, totalizar 100.
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    BuildingIdPath:
      description: Identificador único da obra
      in: path
      name: buildingId
      required: true
      schema:
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
