openapi: 3.1.1
info:
  title: Comissões (Antigo)
  version: 1.24.0
  description: API para controle de comissões de vendas (operações legadas).
paths:
  /sales-commissions:
    get:
      x-original-file: commissions-forecasts-v1.yaml
      x-audience:
        - public
      tags:
        - Comissões (Antigo)
      summary: Lista comissões de venda para contratos e corretores.
      operationId: getSalesComissions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: contractId
          in: query
          description: O código do contrato de vendas da comissão.
          schema:
            type: integer
            format: int32
            example: 1001
        - name: brokerId
          in: query
          description: O código do corretor da comissão.
          schema:
            type: integer
            format: int32
            example: 501
        - name: customerId
          in: query
          description: O código do cliente do contrato de vendas da comissão.
          schema:
            type: integer
            format: int32
            example: 2001
      responses:
        '200':
          description: Comissões encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesCommissionGetResponse'
              example:
                resultSetMetadata:
                  count: 1
                  offset: 0
                  limit: 10
                results:
                  - id: 101
                    contractId: 1001
                    brokerId: 501
                    customerId: 2001
                    installmentsNumber: 3
                    billId: 3001
                    rate: 5
                    value: 1000
                    baseValue: 18000
                    type: V
                    installments:
                      - id: 1
                        dueDate: '2024-09-01'
                        amount: 333.33
                        status: Aguardando autorização
                      - id: 2
                        dueDate: '2024-10-01'
                        amount: 333.33
                        status: Autorizada
                      - id: 3
                        dueDate: '2024-11-01'
                        amount: 333.34
                        status: Liberada
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna todas as comissões de venda encontradas conforme os filtros
        informados. (REST)
  /sales-commissions-forecasts:
    post:
      tags:
        - Comissões (Antigo)
      summary: Cria previsão de comissão para contrato e corretor.
      operationId: postSalesComissionForecasts
      requestBody:
        description: Previsão de comissão para inserção
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionForecast'
            example:
              contractId: 1001
              brokerId: 501
              rate: 5.5
              value: 1000
              dueDate: '2024-09-01'
              indexerId: 10
              baseDate: '2024-08-01'
              installmentsNumber: 3
              type: V
        required: true
      responses:
        '201':
          description: Previsão de comissão foi criada
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: commissions-forecasts-v1.yaml
      description: >-
        Cria e armazena uma nova previsão de comissão de venda para o contrato e
        corretor informados. (REST)
      x-audience:
        - public
components:
  schemas:
    SalesCommissionGetResponse:
      description: Resposta com metadados e lista de comissões recuperadas por pesquisa.
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          description: Lista de comissões retornadas como resultado da pesquisa
          type: array
          items:
            $ref: '#/components/schemas/SalesCommission'
          example:
            - id: 101
              contractId: 1001
              brokerId: 501
              customerId: 2001
              installmentsNumber: 3
              billId: 3001
              rate: 5
              value: 1000
              baseValue: 18000
              type: V
              installments:
                - id: 1
                  dueDate: '2024-09-01'
                  amount: 333.33
                  status: Aguardando autorização
                - id: 2
                  dueDate: '2024-10-01'
                  amount: 333.33
                  status: Autorizada
                - id: 3
                  dueDate: '2024-11-01'
                  amount: 333.34
                  status: Liberada
    CommissionForecast:
      description: Objeto de previsão de comissão a ser criada para um contrato e corretor.
      required:
        - brokerId
        - contractId
        - dueDate
      type: object
      properties:
        contractId:
          type: integer
          description: Código do contrato de vendas que será vinculado.
          format: int32
          example: 1001
        brokerId:
          type: integer
          description: Código do corretor que será vinculado.
          format: int32
          example: 501
        rate:
          maximum: 100
          minimum: 0.01
          type: number
          description: >-
            Percentual de comissão. Formato -> 00.00 <br/> Não é obrigatório
            informar caso o 'value' seja informado, porém um dos dois devem ser
            informados. <br/> Se os dois campos ('rate' e 'value') forem
            informados será validado se os valores estão corretos, com base no
            valor total do contrato.
          format: double
          example: 5.5
        value:
          type: number
          description: >-
            Valor de comissão. Formato -> 0000000000.00 <br/> Não é obrigatório
            informar caso o 'rate' seja informado, porém um dos dois devem ser
            informados. <br/> Se os dois campos ('rate' e 'value') forem
            informados será validado se os valores estão corretos, com base no
            valor total do contrato.
          format: double
          example: 1000
        dueDate:
          type: string
          description: >-
            Data de vencimento da primeira parcela. <br/> Formato YYYY-MM-DD.
            Exemplo -> 2019-06-01. <br/>
          format: date
          example: {}
        indexerId:
          type: integer
          description: >-
            Código do indexador para correção. Caso não seja informado, será
            considerado o indexador neutro.
          format: int32
          example: 10
        baseDate:
          type: string
          description: >-
            Data base pra correção. <br/> Formato YYYY-MM-DD. Exemplo ->
            2019-06-01. <br/> Caso não seja informado ou seja informado uma data
            que não possua valor cadastrado para o indexador ('indexerId'), será
            considerado a última data dísponível.
          format: date
          example: {}
        installmentsNumber:
          type: integer
          description: >-
            Quantidade de parcelas. <br/> Caso não seja informado, será
            considerado uma parcela.
          format: int32
          example: 3
        type:
          maxLength: 1
          minLength: 1
          type: string
          description: >-
            Tipo de comissão. Valores possíveis: <br/> 'V' - Vendas <br/> 'G' -
            Gerenciamento <br/> Caso não seja informado, será considerado 'V'.
          example: V
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    SalesCommission:
      description: Detalhes de uma comissão de venda registrada no sistema.
      type: object
      properties:
        id:
          description: Código da comissão
          example: 123
          format: int32
          type: integer
        contractId:
          type: integer
          description: Código do contrato de vendas da comissão
          format: int32
          example: 1001
        brokerId:
          type: integer
          description: Código do corretor da comissão.
          format: int32
          example: 501
        customerId:
          description: Código do cliente
          example: 123
          format: int32
          type: integer
        installmentsNumber:
          type: integer
          description: Número de parcelas da comissão.
          format: int32
          example: 3
        billId:
          type: integer
          description: Número do título da comissão.
          format: int32
          example: 3001
        rate:
          type: integer
          description: Percentual de comissão.
          format: int32
          example: 5
        value:
          type: number
          description: Valor da comissão.
          format: double
          example: 1000
        baseValue:
          type: integer
          description: Valor base da comissão.
          format: int32
          example: 18000
        type:
          type: string
          description: 'Tipo de comissão: V - Vendas, G - Gerenciamento'
          enum:
            - V
            - G
          example: V
        installments:
          type: array
          description: Parcelas da comissão
          items:
            $ref: '#/components/schemas/CommissionInstallment'
    CommissionInstallment:
      description: Detalhes de uma parcela de comissão de venda.
      type: object
      properties:
        id:
          type: integer
          description: Número da parcela.
          format: int32
          example: 1
        dueDate:
          description: Data de vencimento. Formato ISO 8601 (yyyy-MM-dd).
          example: 2018-12-22T00:00:00.000Z
          format: date
          type: string
        amount:
          description: Valor da parcela
          example: 1000
          format: double
          type: number
        status:
          type: string
          description: >-
            Situação atual da parcela (Aguardando autorização, Autorizada,
            Liberada, Totalmente paga, Cancelada).
          example: Aguardando autorização
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
