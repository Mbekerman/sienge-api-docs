openapi: 3.1.1
info:
  title: Balancete de Verificação
  version: 1.24.0
  description: API do relatório de balancete de verificação da contabilidade.
paths:
  /trial-balance:
    get:
      x-original-file: trial-balance-v1.yaml
      x-audience:
        - public
      tags:
        - Balancete de Verificação
      summary: Busca dados do balancete de verificação
      operationId: getTrialBalance
      parameters:
        - name: companyId
          in: query
          description: Código da empresa
          required: true
          schema:
            type: integer
            example: 10
        - name: initialPeriod
          in: query
          description: Período inicial
          required: true
          schema:
            type: string
            format: date
            example: '2025-01-01'
        - name: finalPeriod
          in: query
          description: Período final
          required: true
          schema:
            type: string
            format: date
            example: '2025-01-31'
        - name: accountId
          in: query
          description: >-
            Código da conta, podendo ser o código contábil ou reduzido. A conta
            precisa ser analítica
          schema:
            type: string
            example: 1.01.03.01
        - name: desconsiderClosingBalance
          in: query
          description: Flag de desconsiderar zeramento
          schema:
            type: boolean
            default: false
            example: false
        - name: reportType
          in: query
          description: >-
            Tipo do relatório, podendo ser Societário (CORPORATE) ou Fiscal
            (TAX)
          schema:
            type: string
            enum:
              - CORPORATE
              - TAX
            example: CORPORATE
        - name: onlyAccountsWithMovements
          in: query
          description: Flag para considera apenas contas com movimentação
          schema:
            type: boolean
            default: true
            example: true
        - name: thirdParties
          in: query
          description: Apresentar saldo de terceiros
          schema:
            type: boolean
            default: false
            example: false
      responses:
        '200':
          description: Busca com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialBalancePaginationResult'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Busca dos dados do balancete de verificação (REST)
components:
  schemas:
    TrialBalancePaginationResult:
      description: Resultado paginado da consulta do balancete de verificação
      required:
        - resultSetMetadata
        - results
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de contas retornados como resultado da pesquisa
          items:
            $ref: '#/components/schemas/TrialBalance'
          example:
            - companyId: 1
              reducedCode: 100
              accountGroup: ASSETS
              account: 1.01.03.01
              accountName: Ativo circulante
              accountType: ANALYTICAL
              debit: 414.19
              credit: 455.19
              operatingBalance:
                value: 41
                type: C
              balances:
                previous:
                  value: 1000
                  type: D
                current:
                  value: 1041
                  type: C
              thirdParties:
                name: José Maria
                code: 50
                debit: 120.55
                credit: 80.1
                previousCredit:
                  value: 500
                  type: C
                previousDebit:
                  value: 200
                  type: D
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    TrialBalance:
      description: Registro de balancete de verificação consolidado por conta
      required:
        - companyId
      type: object
      properties:
        companyId:
          type: integer
          description: Código empresa
          example: 1
        reducedCode:
          type: integer
          description: Código reduzido
          example: 100
        accountGroup:
          type: string
          description: Grupo da conta
          example: ASSETS
          enum:
            - ASSETS
            - LIABILITIES
            - INCOME
            - EXPENSES
            - TRANSITION
        account:
          type: string
          description: Código contábil da conta
          example: 1.01.03.01
        accountName:
          type: string
          description: Nome da conta
          example: Ativo circulante
        accountType:
          type: string
          description: Tipo da conta
          example: ANALYTICAL
          enum:
            - ANALYTICAL
            - SYNTHETIC
        debit:
          type: number
          description: Débitos no período
          example: 414.19
        credit:
          type: number
          description: Créditos no período
          example: 455.19
        operatingBalance:
          $ref: '#/components/schemas/Balance'
        balances:
          type: object
          properties:
            previous:
              $ref: '#/components/schemas/Balance'
            current:
              $ref: '#/components/schemas/Balance'
        thirdParties:
          $ref: '#/components/schemas/ThirdParties'
    Balance:
      description: Representa o saldo e o tipo (débito/crédito)
      type: object
      properties:
        value:
          type: number
          description: Valor do saldo
          example: 455.6
        type:
          type: string
          description: Tipo de saldo, podendo ser [D]ébito ou [C]rédito
          example: D
          enum:
            - D
            - C
    ThirdParties:
      description: Detalhamento de saldos por terceiros vinculados à conta
      type: object
      properties:
        name:
          type: string
          description: Nome do terceiro
          example: José Maria
        code:
          type: integer
          description: Código do terceiro
          example: 50
        debit:
          type: number
          description: Débito no período
          example: 120.55
        credit:
          type: number
          description: Crédito no período
          example: 80.1
        previousCredit:
          type: object
          description: Valor saldo anterior a crédito
          allOf:
            - $ref: '#/components/schemas/Balance'
        previousDebit:
          type: object
          description: Valor saldo anterior a débito
          allOf:
            - $ref: '#/components/schemas/Balance'
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
