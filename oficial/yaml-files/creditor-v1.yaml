        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Busca o credor no Sienge (REST)
    patch:
      tags:
        - Credores
      summary: Atualiza informações referentes ao credor
      operationId: updateCreditor
      parameters:
        - name: creditorId
          in: path
          description: Código do credor a ser atualizado
          required: true
          schema:
            type: integer
      requestBody:
        description: >-
          Objeto para atualização do credor, não é necessário envio de todos os
          campos.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditorUpdate'
        required: true
