          example: '3'
          type: string
      type: object
    CreditorPhone:
      description: Telefone do credor
      properties:
        ddd:
          description: Número do DDD
          example: '48'
          type: string
        extension:
          description: Indica o ramal do telefone
          example: 231A
          type: string
        main:
          description: Indica se é o número de telefone principal
          example: true
          type: boolean
        number:
          description: Número do telefone, com mascára
          example: 99999-8888
          type: string
        observation:
          description: Observação do telefone
          example: Telefone para emergência
          type: string
        type:
          description: |-
            Indica o tipo de telefone :
              - 1 - Telefone Residencial
              - 2 - Telefone Residencial Alternativo
              - 3 - Telefone Celular
              - 4 - Telefone Celular Alternativo
              - 5 - Telefone Comercial
              - 6 - Telefone Comercial Alternativo
              - 7 - Telefone Fax
              - 8 - Telefone Fax Alternativo
              - 9 - Telefone Rádio
              - 10 - Telefone Rádio Alternativo
          example: 1
          type: integer
      type: object
    TaxClassificationId:
      description: |-
        Código da Classificação Tributária:
          - 1: MEI
          - 2: Simples Nacional
          - 3: Lucro Presumido
          - 4: Lucro Real
          - 5: Lucro Arbitrado
          - 6: Isenta
          - 7: Imune
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
      example: 2
      type: integer
    BankInformation:
      description: Informação bancária do credor
      properties:
        accountNumber:
          description: Código da conta
          example: '13354'
          type: string
        accountType:
          description: Corretor ('P' or 'C')
          example: P
          type: string
        agency:
          description: Código da agência
          example: '4611'
          type: string
        bank:
          description: Código do banco
          example: '001'
          type: string
        checkDigit:
          description: Dígito verificador da conta
          example: '6'
          type: string
        cnpj:
          description: CNPJ do credor
          example: 12.345.678/0001-90
          type: string
        cpf:
          description: CPF do credor
          example: 123.456.789-00
          type: string
        defaultFlag:
          description: Informação bancária padrão ('S' or 'N')
          example: S
          type: string
        id:
          description: Sequencial da informação bancária
          example: 1
          format: int32
          type: integer
        nameOfBank:
          description: Nome do Banco
          example: Banco do Brasil S.A.
          type: string
        nameOfRecipient:
          description: Nome do favorecido
          example: John Doe
          type: string
        paymentForm:
          description: Nome da forma de Pagamento
          example: Boleto
          type: string
      type: object
    AccountStatements:
      description: Objeto de informação bancaria
      properties:
        accountBeneficiaryCnpjNumber:
          description: CNPJ do beneficiário sem máscara
          example: '00506302000136'
          type: string
        accountBeneficiaryCpfNumber:
          description: CPF do beneficiário sem máscara
          example: '22853233014'
          type: string
        accountBeneficiaryName:
          description: Nome do beneficiário
          example: John Doe
          type: string
        accountDac:
          description: DAC da conta
          example: '1'
          type: string
        accountDigit:
          description: Dígito da conta
          example: '6'
          type: string
        accountNumber:
          description: Número da conta
          example: '13354'
          type: string
        accountType:
          description: Tipo de conta 'C' para corrente 'P' para poupança
          example: C
          type: string
        bankBranchDigit:
          description: Dígito da agência
          example: '6'
          type: string
        bankBranchName:
          description: Nome da agência
          example: Agência da praça
          type: string
        bankBranchNumber:
          description: Número da agência
          example: '4611'
          type: string
        bankCode:
          description: Código do banco
          example: '001'
          type: string
        defaultFlag:
          description: Informação bancária padrão ('S' or 'N')
          example: S
          type: string
      type: object
    GetPixInformation:
      description: Retorna as informações de pix
      properties:
        beneficiary:
          description: Nome do favorecido
          example: John Doe
          type: string
        cpfCnpjBeneficiary:
          description: CPF ou CNPJ do favorecido
          example: '12345678900'
          type: string
        defaultFlag:
          description: Informação pix padrão ('S' or 'N')
          example: S
          type: string
        id:
          description: Sequencial da informação pix
          example: 123456
          type: integer
        key:
          description: Chave pix
          example: '123456'
          type: string
        type:
          description: >-
            Tipo da chave pix ('C' - CNPJ/CPF, 'T' - Telefone, 'E' - E-mail e
            'A' - Aleatória)
          example: C
          type: string
      type: object
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    CreditorId:
      description: Código do credor a ser apresentado
      in: path
      name: creditorId
      required: true
      schema:
        type: integer
    CreditorIdInsert:
      description: Código do credor em que será inserido as informações bancárias
      in: path
      name: creditorId
      required: true
      schema:
        type: integer
    CreditorIdUpdate:
      description: Código do credor a ser alterado
      in: path
      name: creditorId
      required: true
      schema:
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
