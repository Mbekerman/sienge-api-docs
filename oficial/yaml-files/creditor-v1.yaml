components:
  schemas:
    GetResponseCreditors:
      type: object
      description: Retorna uma lista de credores
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de Credores retornadas como resultado da pesquisa
          items:
            $ref: '#/components/schemas/Creditor'
          example:
            - id: 123
              name: Nome do credor
              tradeName: Nome fantasia do credor
              cpf: 123.456.789-00
              cnpj: 12.345.678/0001-90
              supplier: S
              broker: 'N'
              employee: 'N'
              active: true
              stateRegistrationNumber: '12345'
              stateRegistrationType: C
              taxClassificationId: 2
              taxClassification: Simples Nacional
              paymentTypeId: 1
              address:
                cityId: 1
                cityName: Florianópolis
                streetName: Rua dos Acarás
                number: '321'
                complement: Bloco 1
                neighborhood: Centro
                zipCode: '88050555'
              phones:
                - ddd: '48'
                  number: 99999-8888
                  main: true
                  type: 1
                  extension: 231A
                  observation: Telefone para emergência
              contacts:
                - contactId: 1
                  name: João da Silva
                  ddd: '48'
                  number: 99999-8888
                  extension: '1255'
                  email: joaodasilva@gmail.com
                  skype: joaodasilva@skype.com
                  msn: joaodasilva@msn.com
              otherContactMethods:
                - type: '3'
                  address: www.joaodasilva.com.br
                  observation: Esta é a página web do João da Silva
    CreditorInsert:
      description: Objeto para inserção do credor
      example:
        accountStatement:
          accountBeneficiaryCnpjNumber: '00506302000136'
