openapi: 3.1.1
info:
  title: Credores
  version: 1.24.0
  description: API REST de credores
paths:
  /creditors:
    get:
      x-original-file: creditor-v1.yaml
      x-audience:
        - public
      tags:
        - Credores
      summary: Busca o credores
      operationId: getAllCreditors
      parameters:
        - name: cpf
          in: query
          description: CPF do credor sem máscara, somento números.
          schema:
            type: string
        - name: cnpj
          in: query
          description: >-
            CNPJ do credor sem máscara, somento números. Pode ser informado
            múltiplos valores.
          schema:
            type: array
            items:
              type: string
            example:
              - 79.164.911/0001-04
              - '77288031000114'
        - name: creditor
          in: query
          description: >-
            Pode pesquisar por um desses três: nome do credor, nome fantasia do
            credor ou código do credor.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista de credores encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseCreditors'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Busca os credores no Sienge (REST)
    post:
      tags:
        - Credores
      summary: Inserção de credor
      operationId: insertCreditor
      requestBody:
        description: Objeto para criação do credores
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditorInsert'
        required: true
      responses:
        '201':
          description: Credor inserido
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: creditor-v1.yaml
      description: Inserção de credor no Sienge (REST)
      x-audience:
        - public
  /creditors/{creditorId}:
    get:
      x-original-file: creditor-v1.yaml
      x-audience:
        - public
      tags:
        - Credores
      summary: Busca o credor
      operationId: getCreditor
      parameters:
        - $ref: '#/components/parameters/CreditorId'
      responses:
        '200':
          description: Credor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creditor'
        '400':
          $ref: '#/components/responses/400'
        '401':
