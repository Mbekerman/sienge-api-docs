openapi: 3.1.1
info:
  title: Bulk-data Saldo Devedor Cliente
  version: 1.24.0
  description: API de leitura dos dados apresentados no relatório saldo devedor do cliente
paths:
  /customer-debt-balance:
    get:
      x-original-file: bulk-data-customer-debt-balance.yaml
      x-audience:
        - public
      tags:
        - Bulk-data Saldo Devedor Cliente
      summary: Realiza leitura de dados do saldo devedor cliente.
      description: >-
        Realiza leitura de dados referentes ao saldo devedor do cliente
        informado. (BULK)
      operationId: getCurrentDebtBalance
      parameters:
        - $ref: '#/components/parameters/StartDueDate'
        - $ref: '#/components/parameters/EndDueDate'
        - $ref: '#/components/parameters/CorrectionDateShort'
        - $ref: '#/components/parameters/PositionDateShort'
        - $ref: '#/components/parameters/ChangeStartDate'
        - $ref: '#/components/parameters/BillReceivableId'
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/OptionalCustomerId'
        - $ref: '#/components/parameters/CostCenterId'
        - $ref: '#/components/parameters/UnitNumber'
        - $ref: '#/components/parameters/DocumentsId'
        - name: bearersId
          in: query
          description: >-
            Lista de códigos dos portadores para incluir na pesquisa (separados
            por vírgula).
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
              format: int32
            example:
              - 1
              - 2
        - $ref: '#/components/parameters/ConditionIdIn'
        - $ref: '#/components/parameters/ConditionIdNotIn'
        - name: interestAmount
          in: query
          description: >-
            Valor dos juros. Se o parâmetro não for fornecido, será considerado
            o valor 0.00.
          schema:
            type: number
            format: double
            default: 0
            example: 10
        - name: commercialDiscount
          in: query
          description: >-
            Valor do desconto comercial. Se o parâmetro não for fornecido, será
            considerado o valor 0.00.
          schema:
            type: number
            format: double
            default: 0
            example: 5
        - name: calculatePresentValue
          in: query
          description: Calcular valor presente (valor default = false).
          schema:
            type: boolean
            default: false
            example: true
        - name: includeAdministrativeRateAmount
          in: query
          description: >-
            Incluir para considerar o valor da taxa administrativa no saldo
            (Valor default = false).
          schema:
            type: boolean
            default: false
            example: true
        - name: includeInsuranceAmount
          in: query
          description: >-
            Incluir para considerar o valor do seguro no saldo (Valor default =
            false).
          schema:
            type: boolean
            default: false
            example: true
        - name: correctAnnualInstallment
          in: query
          description: >-
            Incluir o valor do saldo das parcelas com correção anual (Valor
            default = false).
          schema:
            type: boolean
            default: false
            example: true
        - name: includeReceiptsByAdvanceRebate
          in: query
          description: >-
            Incluir para considerar baixas de abatimento de adiantamento (Valor
            default = false).
          schema:
            type: boolean
            default: false
            example: true
        - name: includeConditionalDiscountValid
          in: query
          description: >-
            Incluir para considerar descontos condicionais (Valor default =
            false).
          schema:
            type: boolean
            default: false
            example: true
        - name: calculateAdditionsUserInformation
          in: query
          description: >
            Incluir para considerar os valores enviados pelo usuário nos
            cálculos, formado pelos campo (proratedIndexerAdditions,
            fineAdditions, interestAmountAdditions, interestTypeAdditions,
            calculateAdditionsDate). (Valor default = false).
          schema:
            type: boolean
            default: false
            example: true
        - name: calculateAdditionsValue
          in: query
          description: Calcula o valor dos acréscimos (Valor default = true).
          schema:
            type: boolean
            default: true
            example: false
        - name: proratedIndexerAdditions
          in: query
          description: >-
            Código do indexador para pró-rata. Se o parâmetro não for fornecido,
            será considerado o valor 0.
          schema:
            type: integer
            default: 0
        - name: fineAdditions
          in: query
          description: >-
            Percentual da multa para calcular os acréscimos (Valor default =
            0.0).
          schema:
            type: number
            format: double
            default: 0
            example: 10
        - name: interestAmountAdditions
          in: query
          description: >-
            Percentual dos juros para calcular os acréscimos (Valor default =
            0.00).
          schema:
            type: number
            format: double
            default: 0
            example: 10
        - name: interestTypeAdditions
          in: query
          description: |-
            Tipo de juros. (valor default: N) Valores possíveis:




              N - Nenhum,
              S - Simples,
              C - Composto,
              F - Fixo,
              P - Price,
              A - SAC,
              U - Anual.
          schema:
            type: string
            default: 'N'
            example: P
        - name: calculateAdditionsDate
          in: query
          description: >-
            Calcular acréscimo até. Se o parâmetro não for fornecido, será
            considerada a data atual. Formato esperado: yyyy-MM-dd.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: >-
            Resultado das informações referentes ao saldo devedor do cliente
            informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCustomerDebtBalance'
              example:
                data:
                  - billReceivableId: 12345
                    company:
                      id: 1
                      name: Empresa Exemplo
                    costCenter:
                      id: 10
                      name: Centro de Custo Exemplo
                    customer:
                      id: 100
                      name: João da Silva
                      document: 123.456.789-00
                    secondaryCustomers:
                      - id: 101
                        name: Maria Souza
                        document: 987.654.321-00
                    emissionDate: '2023-01-10'
                    accountingDate: '2023-01-11'
                    totalValue: 10000.5
                    lastRenegotiationDate: '2023-02-15'
                    correctionDate: '2023-03-01'
                    document: CT.15
                    cancellationDate: '2023-04-01'
                    units:
                      - id: 501
                        number: A101
                    installments:
                      - id: 1
                        paymentTerms:
                          id: PT01
                          descrition: 30 dias após emissão
                        correctionBaseDate: '2023-01-10T00:00:00Z'
                        originalValue: 5000.25
                        correctedValue: 5100.3
                        indexerName: IPCA
                        dueDate: '2023-02-10T00:00:00Z'
                        accoutingReceiptDate: '2023-02-11T00:00:00Z'
                        receiptDate: '2023-02-12T00:00:00Z'
                        receiptBankAccount: 12345-6
                        netReceivedAmount: 5000
                        penalty: 0
                        interest: 100.05
                        lateFee: 0
                        currentBalance: 0
                        updatedValue: 5100.3
                        additionsValue: 0
                        contractualInterest: 0
                        daysLate: 0
                        correctionDate: '2023-03-01'
                        daysForPresentValueDiscount: 0
                        presentValueInterest: 0
                        presentValue: 5100.3
                        discountedCommercialValue: 5100.3
                        interestBaseDate: '2023-01-10T00:00:00Z'
                        installmentInterest: 100.05
                        installmentNumber: '001'
                        status: Paga
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
