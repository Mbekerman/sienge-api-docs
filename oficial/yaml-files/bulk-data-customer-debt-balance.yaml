        company:
          $ref: '#/components/schemas/Company'
        costCenter:
          $ref: '#/components/schemas/CostCenter'
        customer:
          $ref: '#/components/schemas/Customer'
        secondaryCustomers:
          type: array
          description: Lista de clientes secundários.
          items:
            $ref: '#/components/schemas/Customer'
          example:
            - id: 100
              name: João da Silva
              document: 123.456.789-00
        emissionDate:
          description: Data de emissão do título. Formato ISO 8601 (yyyy-MM-dd).
          example: 2024-01-01T00:00:00.000Z
          format: date
          type: string
        accountingDate:
          description: Data contábil. Formato ISO 8601 (yyyy-MM-dd).
          example: 2023-01-10T00:00:00.000Z
          format: date
          type: string
        totalValue:
          description: Valor total.
          example: 1000
          type: number
        lastRenegotiationDate:
          description: Data da última repactuação. Formato ISO 8601 (yyyy-MM-dd).
          example: 2023-01-10T00:00:00.000Z
          format: date
          type: string
        correctionDate:
          description: Data de correção. Formato ISO 8601 (yyyy-MM-dd).
          example: 2023-03-01T00:00:00.000Z
          format: date
          type: string
        document:
          description: Código do documento + "." + Número do documento.
          example: CT.15
          type: string
        cancellationDate:
          description: Data de cancelamento. Formato ISO 8601 (yyyy-MM-dd).
          example: 2023-01-10T00:00:00.000Z
          format: date
          type: string
        units:
          allOf:
            - $ref: '#/components/schemas/UnitsListDescriptionWithDot'
            - type: array
              items:
                $ref: '#/components/schemas/BulkCustomerDebtBalanceUnit'
          example:
            - id: 501
              number: A101
        installments:
          allOf:
            - $ref: '#/components/schemas/InstallmentsListDescriptionWithDot'
            - type: array
              items:
                $ref: '#/components/schemas/BulkCustomerDebtBalanceInstallment'
          example:
            - id: 1
              paymentTerms:
                id: PM
                descrition: Parcelas Mensais
              correctionBaseDate: '2023-01-10T00:00:00Z'
              originalValue: 5000.25
              correctedValue: 5100.3
              indexerName: IPCA
              dueDate: '2023-02-10T00:00:00Z'
