              installmentNumber: '001'
              status: Paga
    Company:
      description: Empresa.
      example:
        id: 1
        name: Empresa Exemplo
      properties:
        id:
          example: 1
          format: int64
          type: integer
        name:
          example: Empresa Exemplo
          type: string
      type: object
    CostCenter:
      description: Centro de custo.
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
      type: object
    Customer:
      description: Cliente.
      properties:
        document:
          description: CPF ou CNPJ formatado (exemplo de CPF '000.000.000-00').
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
      type: object
    UnitsListDescriptionWithDot:
      description: Lista de unidades.
    BulkCustomerDebtBalanceUnit:
      type: object
      description: Unidade
      properties:
        id:
          type: integer
          description: ID da unidade.
          format: int64
        number:
          type: string
          description: Número da unidade retornada.
      example:
        id: 501
        number: A101
    InstallmentsListDescriptionWithDot:
      description: Lista de parcelas.
    BulkCustomerDebtBalanceInstallment:
      type: object
      description: Dados da parcela da API Bulk do Saldo Devedor
      properties:
        id:
          description: Identificador da parcela do título
          example: 1
          format: int32
          type: integer
        paymentTerms:
          $ref: '#/components/schemas/BulkCustomerDebtBalancePaymentTerm'
        correctionBaseDate:
          description: Data base para correção. Formato ISO 8601 (yyyy-MM-dd).
          example: 2023-01-10T00:00:00.000Z
          format: date
          type: string
        originalValue:
          description: Valor original da parcela.
          example: 1000
          type: number
        correctedValue:
          description: Valor corrigido da parcela.
          example: 5100.3
          type: number
        indexerName:
          description: Nome do indexador.
          example: IGP-M
          type: string
        dueDate:
          description: Data de vencimento. Formato ISO 8601 (yyyy-MM-dd).
          example: 2018-12-22T00:00:00.000Z
          format: date
          type: string
        accoutingReceiptDate:
          description: Data de recebimento contábil. Formato ISO 8601 (yyyy-MM-dd).
          example: 2023-02-11T00:00:00.000Z
          format: date
          type: string
        receiptDate:
          description: Data de recebimento. Formato ISO 8601 (yyyy-MM-dd).
          example: 2023-02-12T00:00:00.000Z
          format: date
          type: string
        receiptBankAccount:
          description: Conta bancária de recebimento.
          example: 12345-6
          type: string
        netReceivedAmount:
          description: Valor líquido recebido.
          example: 5000
          type: number
        penalty:
          description: Valor da multa.
          example: 0
          type: number
        interest:
          description: Valor dos juros.
          example: 100.05
          type: number
        lateFee:
          description: Valor da taxa de atraso.
          example: 0
          type: number
        currentBalance:
          description: Saldo atual da parcela.
          format: double
          type: number
        updatedValue:
          description: Valor atualizado.
          example: 5100.3
          type: number
        additionsValue:
          description: Valor de acréscimos.
          example: 0
          type: number
        contractualInterest:
          description: Juros contratuais.
          example: 0
          type: number
        daysLate:
          description: Dias de atraso.
          example: 0
          type: integer
        correctionDate:
          description: Data de correção. Formato ISO 8601 (yyyy-MM-dd).
          example: 2023-03-01T00:00:00.000Z
          format: date
          type: string
        daysForPresentValueDiscount:
          description: Dias para desconto de valor presente.
          example: 0
          type: integer
        presentValueInterest:
          description: Juros de valor presente.
          example: 0
          type: number
        presentValue:
          description: Valor presente.
          example: 5100.3
          type: number
        discountedCommercialValue:
          description: Valor comercial com desconto.
          example: 5100.3
          type: number
        interestBaseDate:
          description: Data base para juros. Formato ISO 8601 (yyyy-MM-dd).
          example: 2023-01-10T00:00:00.000Z
          format: date
          type: string
        installmentInterest:
          description: Juros da parcela.
          example: 100.05
          type: number
        installmentNumber:
          description: >-
            Numero "sequencial" das parcelas 1, 2, 3, ou por "Condição de
            Pagamento" 1/2, 2/2... (Resultado será apresentado conforme
            Parâmetro 651).
          example: 1/2
          type: string
        status:
          type: string
          description: |
            Status da parcela: - Paga - A vencer - Vencida
          example: Paga
    BulkCustomerDebtBalancePaymentTerm:
      type: object
      description: Condições de pagamento.
      properties:
        id:
          type: string
          description: Identificador da condição de pagamento.
        descrition:
          type: string
          description: Descrição da condição de pagamento.
      example:
        id: PM
        descrition: Parcelas Mensais
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    StartDueDate:
      description: Período de vencimento inicial. Formato ISO 8601 (yyyy-MM-dd).
      in: query
      name: startDueDate
      required: true
      schema:
        format: date
        type: string
    EndDueDate:
      description: Período de vencimento final. Formato ISO 8601 (yyyy-MM-dd).
      in: query
      name: endDueDate
      required: true
      schema:
        format: date
        type: string
    CorrectionDateShort:
      description: >-
        Correção até. Se o parâmetro não for fornecido, será considerada a data
        atual. Formato ISO 8601 (yyyy-MM-dd).
      in: query
      name: correctionDate
      schema:
        format: date
        type: string
    PositionDateShort:
      description: >-
        Posição em. Se o parâmetro não for fornecido, será considerada a data
        atual. Formato ISO 8601 (yyyy-MM-dd).
      in: query
      name: positionDate
      schema:
        format: date
        type: string
    ChangeStartDate:
      description: >
        Data Inicial de alteração do Título/Parcela. Buscará apenas
        títulos/parcelas que tiveram alteração durante um intervalo de tempo
        pré-definido. A data final será sempre a data atual. Formato ISO 8601
        (yyyy-MM-dd).
      in: query
      name: changeStartDate
      schema:
        format: date
        type: string
    BillReceivableId:
      description: Número do título a receber
      in: query
      name: billReceivableId
      schema:
        example: 12345
        type: integer
    CompanyId:
      description: Código da empresa (opcional)
      in: query
      name: companyId
      schema:
        example: 101
        type: integer
    OptionalCustomerId:
      description: Código do cliente (opcional)
      in: query
      name: customerId
      schema:
        example: 1001
        type: integer
    CostCenterId:
      description: Código do centro de custo (opcional)
      in: query
      name: costCenterId
      required: false
      schema:
        type: integer
    UnitNumber:
      description: Número da unidade.
      in: query
      name: unitNumber
      schema:
        type: string
    DocumentsId:
      description: >-
        Lista de códigos de documentos (separados por vírgula). <b>Exemplo</b>:
        CT, AT, CM
      in: query
      name: documentsId
      schema:
        example:
          - CT
          - AT
          - CM
        items:
          example: CT
          type: string
        type: array
    ConditionIdIn:
      description: Filtro para incluir condições de pagamento.
      example:
        - AT
        - PM
      explode: false
      in: query
      name: conditionIdIn
      schema:
        example:
          - AT
          - PM
        items:
          type: string
        type: array
      style: form
    ConditionIdNotIn:
      description: Filtro para excluir condições de pagamento.
      example:
        - AT
        - PM
      explode: false
      in: query
      name: conditionIdNotIn
      schema:
        example:
          - AT
          - PM
        items:
          example: PM
          type: string
        type: array
      style: form
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/bulk-data/v1
