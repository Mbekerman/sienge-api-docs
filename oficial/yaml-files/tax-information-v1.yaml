openapi: 3.1.1
info:
  title: Informações Fiscais de Serviço - Contas a Pagar
  version: 1.24.0
  description: API relacionada a informações fiscais do serviço de contas a pagar
paths:
  /bills/{billId}/tax-information:
    post:
      tags:
        - Informações Fiscais de Serviço - Contas a Pagar
      summary: Armazena informações fiscais do tipo Serviço no título
      operationId: insertTaxInformation
      parameters:
        - name: billId
          in: path
          description: Número do título no qual as informações fiscais serão inseridas
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        description: Objeto para criação das informações fiscais
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxInformationInsert'
        required: true
      responses:
        '201':
          description: Informações fiscais inseridas
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: tax-information-v1.yaml
      description: Persiste informações fiscais do tipo Serviço no título informado (REST)
      x-audience:
        - public
  /bills/{billId}/tax-information/items:
    post:
      tags:
        - Informações Fiscais de Serviço - Contas a Pagar
      summary: Armazena dados fiscais de item de serviço do título
      operationId: insertTaxInformationItem
      parameters:
        - name: billId
          in: path
          description: >-
            Número do título no qual será inserido o item nas informações
            fiscais
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        description: Objeto para criação do item das informações fiscais
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxInformationItemInsert'
        required: true
      responses:
        '201':
          description: Item inserido nas informações fiscais
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: tax-information-v1.yaml
      description: >-
        Persiste um item do tipo Serviço nas informações fiscais do título
        informado (REST)
      x-audience:
        - public
components:
  schemas:
    TaxInformationInsert:
      required:
        - branchOfficeId
        - cityServiceId
        - entryDate
        - freightType
        - paymentType
        - pisCofinsCalculationType
        - serviceExecutionDate
        - status
      type: object
      properties:
        status:
          $ref: '#/components/schemas/DocumentStatusEnum'
        cancellationDate:
          type: string
          description: >-
            Data de cancelamento. Formato YYYY-MM-DD. Campo só deve ser
            informado quando o campo 'status' for '2' ou '3'
          example: '2018-01-31'
        creditorTaxingRegime:
          $ref: '#/components/schemas/CreditorTaxingRegimeEnum'
        entryDate:
          type: string
          description: >-
            Data de entrada. Formato YYYY-MM-DD. Deve ser maior ou igual data de
            emissão do título e anterior a data de cancelamento, quando
            informada
          example: '2025-07-01'
        serialNumber:
          type: string
          description: Série da nota fiscal. Tamanho máximo de 3 caracteres
          example: '123'
        paymentType:
          $ref: '#/components/schemas/PaymentTypeEnum'
        branchOfficeId:
          type: integer
          description: Código da filial da empresa
          format: int32
          example: 99
        operationTaxCode:
          type: string
          description: >-
            Código fiscal da operação (CFOP). Preenchimento obrigatório quando o
            modelo do documento do título não se tratar de modelo  fiscal de
            prefeitura. A CFOP informada deverá iniciar com '1' para operações
            dentro do estado, com '2' para operações interestaduais e com '3'
            para operações envolvendo o exterior
          example: '1101'
        cnaeCode:
          type: integer
          description: Código do CNAE para serviços
          format: int32
          example: 3005909
        cityServiceId:
          type: integer
          description: Código do município de prestação de serviços
          format: int32
          example: 1234
        taxSituationServiceCode:
          type: string
          description: >-
            Situação tributária de serviços. A situação tributária de serviços
            precisa estar cadastrada para o município de prestação de serviços
            informado
          example: '01'
        serviceTaxCode:
          type: string
          description: >-
            Código fiscal de prestação de serviços. A CFPS precisa estar
            cadastrada para o município de prestação de serviços informado. Caso
            não preenchido, o campo 'natureServiceId' precisará ser informado
          example: '1001'
        natureServiceId:
          type: string
          description: >-
            Natureza do serviço. Campo livre com tamanho máximo de 100
            caracteres. Caso não preenchido, o campo 'serviceTaxCode' precisará
            ser informado
          example: '1001'
        serviceExecutionDate:
          type: string
          description: Data de execução do serviço. Formato YYYY-MM-DD
          example: '2018-01-31'
        pisCofinsCalculationType:
          $ref: '#/components/schemas/PisCofinsCalculationTypeEnum'
        pisCofinsCreditBaseId:
          type: integer
          description: >-
            Identificador base de crédito para PIS/COFINS. Opções válidas podem
            ser consultas na Tabela 4.3.7 - Tabela Código de Base de Cálculo do
            Crédito. Campo só deve ser informado quando o campo
            'pisCofinsCalculationType' for '2'
          format: int32
          example: 101
        freightType:
          $ref: '#/components/schemas/FreightTypeEnum'
      description: Dados necessários para inserção das informações fiscais
      example:
        status: 0
        cancellationDate: '2018-01-31'
        creditorTaxingRegime: 1
        entryDate: '2025-07-01'
        serialNumber: '123'
        paymentType: 0
        branchOfficeId: 99
        operationTaxCode: '1101'
        cnaeCode: 4120400
        cityServiceId: 1234
        taxSituationServiceCode: '01'
        serviceTaxCode: '1001'
        natureServiceId: '1001'
        serviceExecutionDate: '2025-07-01'
        pisCofinsCalculationType: 2
        pisCofinsCreditBaseId: 101
        freightType: 0
    TaxInformationItemInsert:
      required:
        - cofinsTaxSituation
        - measurementUnit
        - pisTaxSituation
        - quantity
        - serviceCodeId
        - taxService
        - unitPrice
      type: object
      properties:
        taxService:
          type: integer
          description: >-
            Código do serviço fiscal. Deve corresponder a um código de produto
            fiscal ativo do tipo Serviço
          format: int32
          example: 1001
        measurementUnit:
          type: integer
          description: >-
            Unidade de medida. Deve corresponder a um código de unidade de
            medida ativa
          format: int32
          example: 1
        serviceCodeId:
          type: integer
          description: Código de serviço fiscal
          format: int32
          example: 3001
        cnaeCode:
          type: integer
          description: CNAE para serviços
          format: int32
          example: 4120400
        additionalDescription:
          type: string
          description: >-
            Descrição complementar do serviço. Texto livre com tamanho máximo de
            8000 caracteres
          example: Serviço de consultoria técnica
        quantity:
          type: number
          description: Quantidade. Deve ser um valor maior que zero
          example: 5
        unitPrice:
          type: number
          description: Preço unitário. Deve ser um valor maior que zero
          example: 800
        employedMaterialValue:
          type: number
          description: >-
            Material empregado. Campo só deve ser informado se o modelo do
            documento do título for fiscal de prefeitura
          example: 800
        contractedSubcontractValue:
          type: number
          description: Subempreitada contratada
          example: 800
        itemDiscountValue:
          type: number
          description: Desconto do item
          example: 800
        operationTaxCode:
          type: string
          description: >-
            Código fiscal da operação (CFOP). Preenchimento obrigatório quando o
            modelo do documento do título não se tratar de modelo fiscal de
            prefeitura. A CFOP informada deverá iniciar com '1' - para operações
            dentro do estado, com '2' - para operações interestaduais e com '3'
            - para operações envolvendo o exterior
          example: '1101'
        serviceTaxCode:
          type: string
          description: >-
            Código fiscal de prestação de serviços (CFPS). A CFPS precisa estar
            cadastrada para o município de prestação de serviços informado. Caso
            não preenchido, o campo 'natureServiceId' precisará ser informado
          example: '1001'
        natureServiceId:
          type: string
          description: >-
            Natureza do serviço. Texto livre com tamanho máximo de 100
            caracteres. Caso não preenchido, o campo 'serviceTaxCode' precisará
            ser informado
          example: Consultoria
        pisTaxSituation:
          type: string
          description: >-
            Situação tributária do PIS. Deverá ser uma situação tributária de
            entrada válida para o PIS. Opções válidas podem ser consultas na
            Tabela 4.3.3 - Tabela Código da Situação Tributária Referente ao
            PIS/Pasep
          example: '70'
        pisCalculationBasis:
          type: number
          description: Base de cálculo do PIS
          example: 800
        pisRate:
          type: number
          description: Alíquota do PIS (%)
          example: 0.65
        pisWithheldCalculationBasis:
          type: number
          description: Base de cálculo do PIS Retido
          example: 800
        pisWithheldRate:
          type: number
          description: Alíquota do PIS Retido (%)
          example: 0.65
        cofinsTaxSituation:
          type: string
          description: >-
            Situação tributária do COFINS. Deverá ser uma situação tributária de
            entrada válida para o COFINS. Opções válidas podem ser consultas na
            Tabela 4.3.4 - Tabela Código da Situação Tributária Referente à
            COFINS
          example: '70'
        cofinsCalculationBasis:
          type: number
          description: Base de cálculo do COFINS
          example: 800
        cofinsRate:
          type: number
          description: Alíquota do COFINS (%)
          example: 3
        cofinsWithheldCalculationBasis:
          type: number
          description: Base de cálculo do COFINS Retido
          example: 800
        cofinsWithheldRate:
          type: number
          description: Alíquota do COFINS Retido (%)
          example: 3
        issTaxSituation:
          type: string
          description: >-
            Situação tributária de serviços (ISS). A situação tributária de
            serviços precisa estar cadastrada para o município de prestação de
            serviços informado no cadastro das informações fiscais
          example: '70'
        issDeductionPercentage:
          type: number
          description: Dedução de ISS (%)
          example: 2
        issMaterialDeductionValue:
          type: number
          description: Dedução de material (ISS)
          example: 100
        issSubContractDeductionValue:
          type: number
          description: Dedução de subempreitada (ISS)
          example: 100
        issCalculationBasis:
          type: number
          description: Base de cálculo do ISS
          example: 800
        issRate:
          type: number
          description: Alíquota do ISS (%)
          example: 3
        issOthersValue:
          type: number
          description: ISS outros
          example: 100
        issWithheldCalculationBasis:
          type: number
          description: Base de cálculo do ISS Retido
          example: 800
        issWithheldRate:
          type: number
          description: Alíquota do ISS Retido (%)
          example: 3
        inssWithheldCalculationBasis:
          type: number
          description: Base de cálculo do INSS Retido
          example: 800
        inssWithheldRate:
          type: number
          description: Alíquota do INSS Retido (%)
          example: 3
        irffWithheldCalculationBasis:
          type: number
          description: Base de cálculo do IRFF Retido
          example: 800
        irffWithheldRate:
          type: number
          description: Alíquota do IRFF Retido (%)
          example: 3
        csllWithheldCalculationBasis:
          type: number
          description: Base de cálculo do CSLL Retido
          example: 800
        csllWithheldRate:
          type: number
          description: Alíquota do CSLL Retido (%)
          example: 3
      description: Dados necessários para inserção do item das informações fiscais
    DocumentStatusEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
      description: >
        Situação na nota fiscal:

        * 0 - Documento regular

        * 1 - Documento regular extemporâneo

        * 2 - Documento cancelado

        * 3 - Documento cancelado extemporâneo

        * 4 - NF-e ou CT-e - Denegado

        * 5 - NF-e ou CT-e - Numeração inutilizada

        * 6 - Documento Fiscal Complementar

        * 7 - Documento Fiscal Complementar extemporâneo

        * 8 - Documento Fiscal emitido com base em Regime Especial ou Norma
        Específica
      example: 0
    CreditorTaxingRegimeEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
      description: |
        Regime de tributação do credor:
        * 0 - Normal
        * 1 - Simples Nacional
        * 2 - Microempreendedor Individual - MEI
      example: 1
    PaymentTypeEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
      description: |
        Condição de pagamento:
        * 0 - À vista
        * 1 - A prazo
        * 2 - Sem pagamento
      example: 0
    PisCofinsCalculationTypeEnum:
      type: integer
      enum:
        - 1
        - 2
        - 3
      description: |
        Tipo de apuração do PIS/COFINS:
        * 1 - Cumulativo
        * 2 - Não-cumulativo
        * 3 - Não-incide
      example: 2
    FreightTypeEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 9
      description: |
        Modalidade do frete:
        * 0 - Contratação do Frete por conta do Remetente (CIF)
        * 1 - Contratação do Frete por conta do Destinatário (FOB)
        * 2 - Contratação do Frete por conta de Terceiros
        * 3 - Transporte Próprio por conta do Remetente
        * 4 - Transporte Próprio por conta do Destinatário
        * 9 - Sem Ocorrência de Transporte
      example: 0
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
