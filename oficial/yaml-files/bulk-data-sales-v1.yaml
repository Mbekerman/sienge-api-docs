openapi: 3.1.1
info:
  title: Bulk-data Contratos de Vendas
  version: 1.24.0
  description: Bulk-data de Contratos de Vendas.
paths:
  /sales:
    get:
      x-original-file: bulk-data-sales-v1.yaml
      x-audience:
        - public
      tags:
        - Bulk-data Contratos de Vendas
      summary: Consulta os dados dos contratos de vendas.
      operationId: getSales
      parameters:
        - name: enterpriseId
          in: query
          description: Código do empreendimento a ser consultado.
          required: true
          schema:
            type: integer
            example: 456
        - name: createdAfter
          in: query
          description: >-
            Período do contrato inicial (Formato ISO 8601 yyyy-MM-dd | Exemplo:
            2020-11-24).
          required: true
          schema:
            type: string
            format: date
            example: '2020-11-24'
        - name: createdBefore
          in: query
          description: >-
            Período do contrato final (Formato ISO 8601 yyyy-MM-dd | Exemplo:
            2020-11-24).
          required: true
          schema:
            type: string
            format: date
            example: '2020-12-31'
        - name: situation
          in: query
          description: Situação do contrato(PROPOSAL, SOLD or CANCELED).
          required: true
          schema:
            type: string
            example: SOLD
        - name: valueGroupingDescription
          in: query
          description: >-
            Valor do agrupamento. Para filtrar por mais de um valor de
            agrupamento, informe os valores separados por vírgula. Exemplo ->
            Q1,L2
          schema:
            type: string
            example: Q1,L2
      responses:
        '200':
          description: Resultado da pesquisa retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesGetResponseDocument'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Realiza leitura dos contratos de vendas. (BULK)
components:
  schemas:
    SalesGetResponseDocument:
      description: Documento de resposta contendo a lista de contratos de vendas.
      required:
        - data
      type: object
      properties:
        data:
          type: array
