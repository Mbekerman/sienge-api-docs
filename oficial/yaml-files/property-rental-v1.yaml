openapi: 3.1.1
info:
  title: Locação de Imóveis
  version: 1.24.0
  description: APIs para gerenciamento de locação de imóveis próprios.
paths:
  /property-rental:
    get:
      x-original-file: property-rental-v1.yaml
      x-audience:
        - public
      tags:
        - Locação de Imóveis
      summary: Retorna uma lista de contratos de locação de imóveis.
      operationId: getPropertyRental
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - name: contractSeqId
          in: query
          description: Filtrar por código sequencial do contrato
          schema:
            type: integer
            example: 101
        - name: companyId
          in: query
          description: Filtrar por código da empresa
          schema:
            type: integer
            example: 1
        - name: enterpriseId
          in: query
          description: Filtrar por código de empreendimento
          schema:
            type: integer
            example: 1001
        - name: rentalContractNumber
          in: query
          description: Filtrar por código do contrato
          schema:
            type: string
            example: LOC-2023-0001
        - name: unitId
          in: query
          description: Filtrar por código da unidade
          schema:
            type: integer
            example: 1
        - name: customerId
          in: query
          description: Filtrar por código do cliente
          schema:
            type: integer
            example: 1
        - name: situation
          in: query
          description: Filtrar por situação
          schema:
            type: string
            enum:
              - SOLICITADO
              - AUTORIZADO
              - EMITIDO
              - FINALIZADO
              - CANCELADO
            example: SOLICITADO
      responses:
        '200':
          description: Lista de contrato de locação de imóveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPropertyRentalDocument'
              example:
                resultSetMetadata:
                  count: 2
                  offset: 0
                  limit: 10
                results:
                  - contractSeqId: 101
                    companyId: 1
                    enterpriseId: 1001
                    rentalContractNumber: LOC-2023-0001
                    paymentCategoriesId: '10101'
                    contractType: RESIDENCIAL
                    contractDate: '2025-01-01'
                    accountDate: '2025-01-01'
                    initialRentalDate: '2025-01-01'
                    finalRentalDate: '2025-12-31'
                    allowReadjustment: true
                    allowEditInstallment: true
                    note: Contrato de teste
                    situation: SOLICITADO
                    paymentCondition:
                      conditionTypeId: PM
                      conditionTypeName: Pagamento Mensal
                      installmentBaseValue: 100
                      installmentsNumber: 12
                      firstPayment: '2025-01-01'
                      bearerId: 1
                      totalValue: 1200
                    readjustment:
                      indexerId: 1
                      baseDate: '2025-01-01'
                      frequencyFromFirstPayment: true
                      lastReadjustmentDate: '2025-01-01'
                      frequencyReadjustmentMonths: 12
                      readjustmentType: VARIACAO_INDEXADOR
                      formOfReajustment: AUTOMATICO
                      fixPercentage: 10
                    rentalContractUnits:
                      - id: 1
                        name: Unidade 1
                        participationPercentage: 10
                        main: true
                    customers:
                      - id: 1
                        name: Cliente 1
                        participationPercentage: 10
                        main: true
                    contractTermination:
                      terminationType: MANUAL
                      applyContractTerminationClause: true
                      fineApplicationMonths: 12
                      fineValue: 10
                    additions:
                      lateInterestCalculationType: DIARIO
                      dailyLateInterestValue: 10
                      proRataIndexer: 1
                      interestPercentage: 10
                      interestType: JUROS
                      fineRate: 10
                      fineValueWithInterestRate: true
                      insurance: SEGURO
                      insuranceValue: 10
                      administrateTax: 10
                    discounts:
                      lateInterestCalculationType: DIARIO
                      dailyLateInterestValue: 10
                      proRataIndexer: 1
                      interestPercentage: 10
                      interestType: JUROS
                      fineRate: 10
                      fineValueWithInterestRate: true
                      insurance: SEGURO
                      insuranceValue: 10
                      administrateTax: 10
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Lista de locação de imóveis. (REST)
    post:
      tags:
        - Locação de Imóveis
      summary: Cria um novo contrato de locação de imóveis.
      operationId: post
      description: Cria contrato de locação de imóveis. (REST)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyPostPorpertyRentalDocument'
            example:
              companyId: 1
              enterpriseId: 1
              rentalContractNumber: '123456'
              paymentCategoriesId: '10101'
              contractDate: '2025-01-01'
              contractType: RESIDENCIAL
              accountDate: '2025-01-01'
              initialRentalDate: '2025-01-01'
              finalRentalDate: '2025-01-01'
              allowReadjustment: true
              allowEditInstallment: true
              note: Observação
              paymentCondition:
                conditionTypeId: '1'
                installmentBaseValue: 100
                installmentsNumber: 12
                firstPayment: '2025-01-01'
                bearerId: 1
              installments:
                - amount: 100
                  dueDate: '2025-01-01'
              readjustment:
                indexerId: 1
                baseDate: '2025-01-01'
                frequencyFromFirstPayment: true
        required: false
        description: Contrato de locação de imóveis próprio.
      responses:
        '201':
          description: Contrato de locação de imóveis próprios criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePropertyRentalInsertDocument'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: property-rental-v1.yaml
      x-audience:
        - public
components:
  schemas:
    ListPropertyRentalDocument:
      type: object
      description: Lista de contratos de locação de imóveis.
      properties:
        resultSetMetadata:
          type: object
          description: Informações de paginação.
          properties:
            count:
              type: integer
              format: int32
              description: Total de registros.
            offset:
              type: integer
              format: int32
              description: Offset de paginação.
            limit:
              type: integer
              format: int32
              description: Limite de registros.
          example:
            count: 100
            offset: 0
            limit: 20
        results:
          type: array
          items:
            type: object
            description: Contrato de locação de imóveis.
            properties:
              contractSeqId:
                type: integer
                description: Código do contrato de locação.
                format: int32
                example: 101
              companyId:
                type: integer
                description: Código da empresa do contrato de locação.
                format: int32
                example: 1
              enterpriseId:
                type: integer
                description: Código do empreendimento do contrato de locação.
                format: int32
                example: 1001
              rentalContractNumber:
                type: string
                description: Número do contrato de locação.
                example: LOC-2023-0001
              paymentCategoriesId:
                type: string
                description: Plano financeiro do contrato de locação.
                example: '10101'
              contractType:
                type: string
                description: Tipo de contrato.
                enum:
                  - RESIDENCIAL
                  - COMERCIAL
                  - TEMPORADA
              contractDate:
                type: string
                description: Data do contrato de locação.
                example: '2025-01-01'
              accountDate:
                type: string
                description: Data contábil do contrato de locação.
                example: '2025-01-01'
              initialRentalDate:
                type: string
                description: Período inicial de locação.
                example: '2025-01-01'
              finalRentalDate:
                type: string
                description: Período final de locação.
                example: '2025-12-31'
              terminatedDate:
                type: string
                description: Data de encerramento da locação.
                example: '2025-12-31'
              cancelatedDate:
                type: string
                description: Data de cancelamento d locação.
                example: '2025-12-31'
              rentalTime:
                type: integer
                description: Número de meses da locação.
                example: 12
              note:
                type: string
                description: Observação do contrato de locação.
                example: Contrato de teste
              receivableBillId:
                type: integer
                description: Número do título.
                example: 555
              situation:
                type: string
                description: Situação do contrato de locação.
                example: SOLICITADO
              rentalContractUnits:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Código da unidade do contrato.
                      format: int32
                      example: 1
                    name:
                      type: string
                      description: Nome da unidade do contrato.
                      example: Unidade 101
                    participationPercentage:
                      type: number
                      description: Percentual de participação na unidade do contrato.
                      example: 100
                    main:
                      type: boolean
                      description: Unidade principal do contrato.
                      example: true
              rentalContractCustomers:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Código do cliente do contrato de locação.
                      format: int32
                      example: 1
                    name:
                      type: string
                      description: Nome do cliente do contrato de locação.
                      example: João Silva
                    participationPercentage:
                      type: number
                      description: Percentual de participação no contrato de locação.
                      example: 100
                    main:
                      type: boolean
                      description: Cliente principal do contrato de locação.
                      example: true
              paymentCondition:
                type: object
                properties:
                  conditionTypeId:
                    type: string
                    description: Código do tipo de condição do contrato.
                    example: PM
                  conditionTypeName:
                    type: string
                    description: Tipo de condição do contrato.
                    example: Pagamento Mensal
                  installmentBaseValue:
                    type: number
                    description: Valor base das parcelas.
                    example: 1500
                  installmentsNumber:
                    type: integer
                    description: Número de parcelas do contrato de locação.
                    example: 12
                  totalValue:
                    type: number
                    description: Valor total das parcelas do contrato de locação.
                    example: 18000
                  firstPayment:
                    type: string
                    description: >-
                      Data do primeiro vencimento das parcelas do contrato de
                      locação.
                    example: '2025-01-01'
                  bearerId:
                    type: integer
                    description: Código do portador do contrato de locação.
                    example: 1
              contractReadjustmentInformation:
                type: object
                properties:
                  indexerId:
                    type: integer
                    description: Código do indexador de reajuste.
                    example: 1
                  baseDate:
                    type: string
                    description: Data base de reajuste.
                    example: '2025-01-01'
                  lastReadjustmentDate:
                    type: string
                    description: Data do último reajuste.
                    example: '2025-01-01'
                  frequencyFromFirstPayment:
                    type: boolean
                    description: Flag frequência a partir do primeiro vencimento.
                    example: true
                  frequencyReadjustmentMonths:
                    type: integer
                    description: Meses da frequência de reajuste.
                    example: 12
                  readjustmentType:
                    type: string
                    description: Tipo de reajuste.
                    example: VARIACAO_INDEXADOR
                  formOfReajustment:
                    type: string
                    description: Forma de reajuste.
                    example: AUTOMATICO
                  fixPercentage:
                    type: number
                    description: Percentual de reajuste.
                    example: 10
              contractTermination:
                type: object
                properties:
                  terminationType:
                    type: string
                    description: Tipo de encerramento - Manual ou Automático.
                    example: MANUAL
                  applyContractTerminationClause:
                    type: boolean
                    description: Aplicar cláusula de rescisão contratual.
                    example: true
                  fineApplicationMonths:
                    type: integer
                    description: Número de meses para a aplicação de multa.
                    example: 12
                  fineValue:
                    type: number
                    description: Valor da multa.
                    example: 1500
              additions:
                type: object
                properties:
                  lateInterestCalculationType:
                    type: string
                    description: Tipo de acréscimo do contrato de locação.
                    example: DIARIO
                  dailyLateInterestValue:
                    type: number
                    description: Valor da mora dia do contrato de locação.
                    example: 10
                  proRataIndexer:
                    type: integer
                    description: Indexador pro rata do contrato de locação.
                    example: 1
                  interestPercentage:
                    type: number
                    description: Taxa de juros do contrato de locação.
                    example: 1.5
                  interestType:
                    type: string
                    description: Tipo de juros do contrato de locação.
                    example: JUROS
                  fineRate:
                    type: number
                    description: Percentual de multa do contrato de locação.
                    example: 2
                  fineValueWithInterestRate:
                    type: boolean
                    description: Cálculo sobre o valor corrigido + valor dos juros.
                    example: true
                  insurance:
                    type: string
                    description: Tipo de seguro do contrato de locação.
                    example: SEGURO
                  insuranceValue:
                    type: number
                    description: Valor do seguro do contrato de locação.
                    example: 150
                  administrateTax:
                    type: number
                    description: Valor da taxa administrativa do contrato de locação.
                    example: 75
              discount:
                type: object
                properties:
                  discountType:
                    type: string
                    description: Tipo de desconto do contrato de locação.
                    example: PERCENTUAL
                  discountPercentage:
                    type: number
                    description: Percentual de desconto do contrato de locação.
                    example: 5
          example:
            - contractSeqId: 123
              companyId: 1
              enterpriseId: 10
              rentalContractNumber: LOC-2025-001
              paymentCategoriesId: A1
              contractType: RESIDENCIAL
              contractDate: '2025-01-01'
              accountDate: '2025-01-01'
              initialRentalDate: '2025-01-01'
              finalRentalDate: '2025-12-31'
              terminatedDate: '2025-12-31'
              cancelatedDate: '2025-12-31'
              rentalTime: 12
              note: Contrato anual.
              receivableBillId: 555
              situation: ativo
              rentalContractUnits: []
            - contractSeqId: 124
              companyId: 2
              enterpriseId: 20
              rentalContractNumber: LOC-2025-002
              paymentCategoriesId: B2
              contractDate: '2025-02-01'
              accountDate: '2025-02-01'
              initialRentalDate: '2025-02-01'
              finalRentalDate: '2026-01-31'
              terminatedDate: '2026-01-31'
              cancelatedDate: '2026-01-31'
              rentalTime: 12
              note: Contrato renovado.
              receivableBillId: 556
              situation: ativo
              rentalContractUnits: []
    BodyPostPorpertyRentalDocument:
      required:
        - accountDate
        - companyId
        - contractDate
        - enterpriseId
        - finalRentalDate
        - initialRentalDate
        - paymentCategoriesId
        - paymentCondition
        - rentalContractNumber
      type: object
      description: Objeto para criação de contrato de locação de imóveis.
      properties:
        companyId:
          type: integer
          description: Código da empresa do contrato de locação sendo inserido.
          format: int32
          example: 1
        enterpriseId:
          type: integer
          description: Código do empreendimento do contrato de locação sendo inserido.
          format: int32
          example: 1
        rentalContractNumber:
          maxLength: 12
          type: string
          description: Número do contrato de locação sendo inserido.
          example: '123456'
        paymentCategoriesId:
          type: string
          description: Plano financeiro do contrato de locação sendo inserido.
          example: '10101'
        contractType:
          type: string
          description: Tipo de Contrato.
          enum:
            - RESIDENCIAL
            - COMERCIAL
            - TEMPORADA
          example: RESIDENCIAL
        contractDate:
          type: string
          description: Data do contrato de locação sendo inserido.
          example: '2025-01-01'
        accountDate:
          type: string
          description: Data contábil do contrato de locação sendo inserido.
          example: '2025-01-01'
        initialRentalDate:
          type: string
          description: Data inicial do contrato.
          example: '2025-01-01'
        finalRentalDate:
          type: string
          description: Data final do contrato.
          example: '2025-01-01'
        allowReadjustment:
          type: boolean
          description: Editar Reajuste.
          example: true
        allowEditInstallment:
          type: boolean
          description: Editar Parcelas.
          example: true
        note:
          maxLength: 4000
          type: string
          description: Observação.
          example: Observação
        paymentCondition:
          required:
            - bearerId
            - conditionTypeId
            - firstPayment
            - installmentBaseValue
            - installmentsNumber
          type: object
          properties:
            conditionTypeId:
              type: string
              description: Tipo de condição.
              example: '1'
            installmentBaseValue:
              type: number
              description: Valor da parcela de locação.
              example: 100
            installmentsNumber:
              type: integer
              description: Quantidade de parcelas da condição do contrato de locação.
              example: 12
            firstPayment:
              type: string
              description: Data do primeiro vencimento.
              example: '2025-01-01'
            bearerId:
              type: integer
              description: Código do portador da condição do contrato de locação.
              example: 1
          example:
            conditionTypeId: PM
            installmentBaseValue: 100
            installmentsNumber: 12
            firstPayment: '2025-01-01'
            bearerId: 1
        installments:
          type: array
          items:
            required:
              - amount
              - dueDate
            type: object
            properties:
              amount:
                type: number
                description: Valor da parcela do contrato de locação.
                example: 100
              dueDate:
                type: string
                description: Data de vencimento.
                example: '2025-01-01'
          example:
            - amount: 100
              dueDate: '2025-01-01'
        readjustment:
          type: object
          properties:
            indexerId:
              type: integer
              description: Código do indexador de reajuste do contrato de locação.
              example: 1
            baseDate:
              type: string
              description: Data base do reajuste do contrato de locação.
              example: '2025-01-01'
            frequencyFromFirstPayment:
              type: boolean
              description: >-
                Considerar frequência de reajuste das parcelas a partir da data
                do primeiro vencimento.
            frequencyReadjustmentMonths:
              type: integer
              description: Frequência de reajuste em meses
              example: 12
            formOfReajustment:
              type: string
              description: Forma de reajuste a ser aplicada.
              enum:
                - MANUAL
                - AUTOMATICO
              example: MANUAL
            readjustmentType:
              type: string
              description: Tipo de reajuste a ser aplicado.
              enum:
                - VARIACAO_INDEXADOR
                - PERCENTUAL_FIXO
              example: VARIACAO_INDEXADOR
            fixPercentage:
              type: number
              description: >-
                Percentual fixo (É obrigatório quando readjustmentType for igual
                a PERCENTUAL_FIXO).
              example: 10
          example:
            indexerId: 1
            baseDate: '2025-01-01'
            frequencyFromFirstPayment: true
            frequencyReadjustmentMonths: 12
            formOfReajustment: MANUAL
            readjustmentType: VARIACAO_INDEXADOR
            fixPercentage: 10
        units:
          type: array
          items:
            required:
              - id
              - main
              - participationPercentage
            type: object
            properties:
              id:
                type: integer
                description: Código da unidade.
              participationPercentage:
                type: number
                description: Percentual de participação na unidade.
              main:
                type: boolean
                description: Unidade principal.
          example:
            - id: 1
              participationPercentage: 10
              main: true
        customers:
          type: array
          items:
            required:
              - id
              - main
              - participationPercentage
            type: object
            properties:
              id:
                type: integer
                description: Código do cliente.
              participationPercentage:
                type: number
                description: Percentual de participação.
              main:
                type: boolean
                description: Cliente principal.
          example:
            - id: 1
              participationPercentage: 10
              main: true
    ResponsePropertyRentalInsertDocument:
      type: object
      description: Resposta de criação do contrato de locação de imóveis.
      properties:
        contractSeqId:
          type: integer
          format: int32
          description: Código sequencial do contrato.
          example: 101
    PropertyRentalCreatedWebhookPayload:
      type: object
      description: Payload para webhook de criação de contrato de locação
      properties:
        contractSeqId:
          type: integer
          description: Código sequencial único do contrato
          example: 123
        unitId:
          type: integer
          description: Código da unidade
          example: 456
      required:
        - contractSeqId
        - unitId
    PropertyRentalBasicWebhookPayload:
      type: object
      description: Payload básico para webhooks de contrato de locação
      properties:
        contractSeqId:
          type: integer
          description: Código sequencial do contrato
          example: 123
      required:
        - contractSeqId
    PropertyRentalIssuedWebhookPayload:
      type: object
      description: Payload para webhooks de contrato com parcela
      properties:
        contractSeqId:
          type: integer
          description: Código sequencial do contrato de locação
          example: 123
        billId:
          type: integer
          description: Código da parcela
          example: 789
      required:
        - contractSeqId
        - billId
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
