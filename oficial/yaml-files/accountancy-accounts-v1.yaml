openapi: 3.1.1
info:
  title: Contas Contábeis
  version: 1.24.0
  description: API de consulta de contas contábeis
paths:
  /accountancy/accounts:
    get:
      x-original-file: accountancy-accounts-v1.yaml
      x-section: Contas
      x-audience:
        - public
      tags:
        - Contas
      summary: Lista contas contábeis
      description: Lista as contas ordenadas por código. (REST)
      operationId: loadAllAccounts
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: id
          in: query
          description: Código reduzido da conta contábil.
          schema:
            type: integer
        - name: uniqueNumber
          in: query
          description: >-
            Código contábil da conta com a máscara contábil. Exemplo:
            1.2.01.01.0150
          schema:
            type: string
        - name: accountType
          in: query
          description: >-
            Tipo de conta contábil, podendo ser ANALYTICAL ou SYNTHETIC. Caso
            não seja passado nenhum parametro em accountType, ambas as contas
            são retornadas
          schema:
            $ref: '#/components/schemas/AccountTypeEnum'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Resultado da pesquisa retornado com sucesso - (Contas Contábeis)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountancyAccountPaginationResult'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /accountancy/accounts/{id}:
    get:
      x-original-file: accountancy-accounts-v1.yaml
      x-section: Conta modificada
      x-audience:
        - public
      tags:
        - Conta modificada
      summary: Consulta conta específica
      description: Retorna conta modificada. (REST)
      operationId: loadModifiedAccount
      parameters:
        - name: id
          in: path
          description: >-
            Código da empresa e o código da conta contábil separados por
            "underline" (companyId_accountId).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >-
            Resultado da pesquisa para contas contábeis modificadas retornado
            com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountancyAccount'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  schemas:
    AccountancyAccountPaginationResult:
      description: Resultado paginado da listagem de contas contábeis
      type: object
      required:
        - resultSetMetadata
        - results
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de contas retornadas como resultado da pesquisa
          items:
            $ref: '#/components/schemas/AccountancyAccount'
          example:
            - companyId: 10
              id: 1
              uniqueNumber: 1.2.01.01.0150
              name: Caixa geral
              accountType: ANALYTICAL
    AccountancyAccount:
      description: Detalhes de uma conta contábil
      type: object
      properties:
        companyId:
          type: integer
          description: Código da empresa (Contas Contábeis)
          example: 10
        id:
          type: integer
          description: Código reduzido da conta contábil
          example: 1
        uniqueNumber:
          type: string
          description: Código contábil da conta com a máscara contábil
          example: 1.2.01.01.0150
        name:
          type: string
          description: Nome da conta
          example: Caixa geral
        accountType:
          $ref: '#/components/schemas/AccountTypeEnum'
          description: Tipo da conta
    AccountancyAccountWebhookPayload:
      description: Payload do webhook de conta contábil
      type: object
      required:
        - companyId
        - accountId
      properties:
        companyId:
          description: Código da empresa
          example: 123
          format: int32
          type: integer
        accountId:
          type: integer
          description: Código da conta contábil
          format: int32
          example: 0
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    AccountTypeEnum:
      type: string
      description: Tipo de conta contábil
      enum:
        - ANALYTICAL
        - SYNTHETIC
      example: ANALYTICAL
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    CompanyIdQuery:
      description: Código da empresa (opcional)
      in: query
      name: companyId
      required: false
      schema:
        example: 1
        type: integer
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
webhooks:
  ACCOUNTANCY_ACCOUNT_UPDATED:
    post:
      tags:
        - Webhooks - Contas Contábeis
      operationId: webhookAccountancyAccountUpdated
      summary: Webhook de conta contábil atualizada
      description: Webhook disparado sempre que uma conta contábil é atualizada
      requestBody:
        description: JSON com os IDs da conta contábil atualizada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountancyAccountWebhookPayload'
      responses:
        2XX:
          description: O evento ACCOUNTANCY_ACCOUNT_UPDATED foi recebido com sucesso
      x-audience:
        - public
  ACCOUNTANCY_ACCOUNT_CREATED:
    post:
      tags:
        - Webhooks - Contas Contábeis
      operationId: webhookAccountancyAccountCreated
      summary: Webhook de conta contábil criada
      description: Webhook disparado sempre que uma conta contábil é criada
      requestBody:
        description: JSON com os IDs da conta contábil criada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountancyAccountWebhookPayload'
      responses:
        2XX:
          description: O evento ACCOUNTANCY_ACCOUNT_CREATED foi recebido com sucesso
      x-audience:
        - public
  ACCOUNTANCY_ACCOUNT_DELETED:
    post:
      tags:
        - Webhooks - Contas Contábeis
      operationId: webhookAccountancyAccountDeleted
      summary: Webhook de conta contábil deletada
      description: Webhook disparado sempre que uma conta contábil é deletada
      requestBody:
        description: JSON com os IDs da conta contábil deletada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountancyAccountWebhookPayload'
      responses:
        2XX:
          description: O evento ACCOUNTANCY_ACCOUNT_DELETED foi recebido com sucesso
      x-audience:
        - public
