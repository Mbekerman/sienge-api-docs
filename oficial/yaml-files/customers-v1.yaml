openapi: 3.1.1
info:
  title: Clientes
  version: 1.24.0
  description: API de busca de clientes.
paths:
  /customers:
    get:
      x-original-file: customers-v1.yaml
      x-audience:
        - public
      tags:
        - Clientes
      summary: Busca clientes ordenando pelo código.
      operationId: getCustomers
      parameters:
        - name: cpf
          in: query
          description: CPF do cliente sem máscara, somente números.
          schema:
            type: string
            example: '12345678901'
        - name: cnpj
          in: query
          description: CNPJ do cliente sem máscara, somente números.
          schema:
            type: string
            example: '12345678000195'
        - name: internationalId
          in: query
          description: Informação da identificação internacional.
          schema:
            type: string
            example: 123456789AB
        - name: onlyActive
          in: query
          description: >-
            True para filtrar por clientes ativos, false não aplicará o filtro e
            retornará todos os clientes independente de status ativo ou não.
          schema:
            type: boolean
            example: true
        - name: enterpriseId
          in: query
          description: Id do empreendimento, somente números.
          schema:
            type: number
            example: 123
        - name: createdAfter
          in: query
          description: >-
            Data inicial para filtrar clientes pela data de criação. Formato:
            yyyy-MM-dd.
          schema:
            type: string
            example: '2024-01-01'
        - name: createdBefore
          in: query
          description: >-
            Data final para filtrar clientes pela data de criação. Formato:
            yyyy-MM-dd.
          schema:
            type: string
            example: '2024-12-31'
        - name: modifiedAfter
          in: query
          description: >-
            Data inicial para filtrar clientes pela data de última alteração.
            Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2024-01-01'
        - name: modifiedBefore
          in: query
          description: >-
            Data final para filtrar clientes pela data de última alteração.
            Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2024-12-31'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Clientes encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAttachmentResponseDocument'
              example:
                resultSetMetadata:
                  count: 2
                  offset: 0
                  limit: 100
                results:
                  - id: 1
                    personType: F
                    foreigner: 'N'
                    internationalId: 123456789AB
                    createdAt: '2025-01-01'
                    modifiedAt: '2025-01-01'
                    modifiedAtDateTime: '2025-01-01 10:30:45.123'
                    issuingBody: SSP
                    name: João Silva
                    socialName: Maria Silva
                    email: joao.silva@example.com
                    birthDate: '2025-01-01'
                    birthPlace: São Paulo
                    civilStatus: Solteiro
                    cpf: '12345678901'
                    fatherName: Antonio Silva
                    motherName: Maria Silva
                    sex: Masculino
                    issueDateIdentityCard: '2025-01-01'
                    matrimonialRegime: União estável
                    marriageDate: '2025-01-01'
                    nationality: Brasileiro
                    numberIdentityCard: '123456789'
                    profession: Engenheiro
                    mailingAddress: R
                    licenseNumber: '123456789'
                  - id: 2
                    personType: J
                    foreigner: 'N'
                    internationalId: 987654321XY
                    createdAt: '2025-02-01'
                    modifiedAt: '2025-02-01'
                    modifiedAtDateTime: '2025-02-01 08:15:22.456'
                    issuingBody: SSP
                    name: Empresa Exemplo LTDA
                    email: contato@empresaexemplo.com
                    nationality: Brasileiro
                    mailingAddress: C
                    licenseNumber: '987654321'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Busca uma lista de clientes ordenando do cadastro mais recente para o
        mais antigo. (REST)
    post:
      tags:
        - Clientes
      summary: Inclui um novo cliente.
      operationId: insertCustomers
      requestBody:
        description: Objeto para criação do cliente
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInsertDocument'
            example:
              personType: F
              foreigner: 'N'
              typeId: 1
              internationalId: 123456789AB
              subtypeIds:
                - 1
                - 2
              addresses:
                - type: R
                  streetName: Rua das Palmeiras
                  number: '123'
                  complement: Apto 45
                  neighborhood: Centro
                  cityId: 1001
                  city: Florianópolis
                  state: SC
                  zipCode: '88000123'
              phones:
                - type: CE
                  number: '48999998888'
                  extension: '234'
                  description: Celular principal
                  whatsapp: true
              naturalPersonData:
                name: João Silva
                socialName: Maria Silva
                email: joao.silva@example.com
                birthDate: '1990-12-31'
                birthPlace: Florianópolis
                civilStatus: Solteiro
                cpf: '12345678901'
                mailingAddress: R
                fatherName: Antonio Silva
                motherName: Maria Silva
                sex: M
                issueDateIdentityCard: '2008-01-01'
                matrimonialRegime: Comunhão parcial de bens
                marriageDate: '2008-01-01'
                nationality: Brasileiro
                numberIdentityCard: '123456789'
                profession: Engenheiro
                issuingBody: SSP
        required: true
      responses:
        '201':
          description: Cliente criado
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: customers-v1.yaml
      description: Persiste um cliente. (REST)
      x-audience:
        - public
  /customers/{customerId}:
    get:
      x-original-file: customers-v1.yaml
      x-audience:
        - public
      tags:
        - Clientes
      summary: Busca um cliente pelo código.
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerGetDocument'
              example:
                id: 1
                personType: F
                foreigner: 'N'
                internationalId: 123456789AB
                createdAt: '2025-01-01'
                modifiedAt: '2025-01-01'
                modifiedAtDateTime: '2025-01-01 10:30:45.123'
                issuingBody: SSP
                name: João Silva
                socialName: Maria Silva
                email: joao.silva@example.com
                birthDate: '2025-01-01'
                birthPlace: São Paulo
                civilStatus: Solteiro
                cpf: '12345678901'
                fatherName: Antonio Silva
                motherName: Maria Silva
                sex: Masculino
                issueDateIdentityCard: '2025-01-01'
                matrimonialRegime: União estável
                marriageDate: '2025-01-01'
                nationality: Brasileiro
                numberIdentityCard: '123456789'
                profession: Engenheiro
                mailingAddress: R
                licenseNumber: '123456789'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Busca um cliente. (REST)
    patch:
      tags:
        - Clientes
      summary: Atualiza informações do cliente.
      operationId: updateCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        description: >-
          Objeto para atualização do cliente. Se você não quiser atualizar um
          campo, não insira no objeto. Se quiser remover o conteúdo de um campo,
          envie uma string vazia como valor do campo. Campos não  enviados ou
          nulos serão ignorados.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateDocument'
            example:
              internationalId: 123456789AB
              typeId: 1
              naturalPersonData:
                name: João Silva
                socialName: Maria Silva
                email: joao.silva@example.com
                sex: M
                birthDate: '2025-01-01'
                birthPlace: São Paulo
                civilStatus: Solteiro
                cpf: '12345678901'
                fatherName: Antonio Silva
                motherName: Maria Silva
                issueDateIdentityCard: '2025-01-01'
                matrimonialRegime: União estável
                marriageDate: '2025-01-01'
                nationality: Brasileiro
                numberIdentityCard: '123456789'
                profession: Engenheiro
                mailingAddress: R
                licenseNumber: '123456789'
        required: true
      responses:
        '204':
          description: Cliente atualizado
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: customers-v1.yaml
      description: Atualiza informações de um cliente. (REST)
      x-audience:
        - public
  /customers/{customerId}/phones:
    put:
      tags:
        - Telefones do cliente
      summary: Atualiza os telefones do cliente.
      operationId: updatePhones
      x-section: Telefones do cliente
      x-original-file: customers-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        description: >-
          Objeto para atualizar telefones do cliente. É necessário enviar todos
          os telefones do cliente, pois esta ação apagará os telefones antigos e
          irá registrar apenas os telefones enviados nessa requisição.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPhonesUpdateDocument'
            example:
              phones:
                - number: '48999998888'
                  main: true
                  type: CE
                  note: Celular principal
                  idd: '+55'
                  whatsapp: true
        required: true
      responses:
        '204':
          description: Telefones do cliente atualizados
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Atualiza os telefones de um cliente. (REST)
  /customers/{customerId}/spouse:
    put:
      tags:
        - Cônjuge do cliente
      summary: Substitui dados do cônjuge, cria um novo caso não exista.
      operationId: updateSpouse
      x-section: Cônjuge do cliente
      x-original-file: customers-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        description: Objeto para atualizar cônjuge do cliente.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSpouseDocument'
            example:
              cpf: '41833114030'
              name: Ana Paula Souza
              email: ana.paula@example.com
              sex: F
        required: true
      responses:
        '204':
          description: Cônjuge do cliente atualizado
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Atualiza o cônjuge de um cliente, apagando o antigo cônjuge. Se não
        existir, cria. (REST)
  /customers/{customerId}/familyIncomes:
    put:
      tags:
        - Rendas Familiares do cliente
      summary: Atualiza as rendas familiares do cliente.
      operationId: updateFamilyIncomes
      x-section: Rendas Familiares do cliente
      x-original-file: customers-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        description: >-
          Objeto para atualizar rendas familiares do cliente. É necessário
          enviar todas as rendas familiares do cliente, pois esta ação apagará
          as rendas familiares antigas e irá registrar apenas as rendas
          familiares enviadas nessa requisição.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerFamilyIncomeUpdateDocument'
            example:
              - kinsName: Maria Souza
                kinship: Mãe
                incomeValue: 3500.5
                observation: Renda proveniente de aposentadoria
        required: true
      responses:
        '204':
          description: Rendas familiares do cliente atualizadas
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Atualiza as rendas familiares de um cliente. (REST)
  /customers/{customerId}/addresses/{addressType}:
    put:
      tags:
        - Endereços do cliente
      summary: Atualiza os endereços do cliente. Se não existir, cria.
      operationId: updateAddresses
      x-section: Endereços do cliente
      x-original-file: customers-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/AddressType'
      requestBody:
        description: Objeto para atualizar endereços do cliente.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressUpdateDocument'
            example:
              type: R
              streetName: Rua das Palmeiras
              number: '123'
              complement: Apto 45
              neighborhood: Centro
              cityId: 1001
              city: Florianópolis
              state: SC
              zipCode: '88000123'
        required: true
      responses:
        '204':
          description: Endereços do cliente foram atualizados.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Atualiza os endereços de um cliente. Se não existir, cria. (REST)
  /customers/{customerId}/attachments:
    get:
      x-original-file: customers-v1.yaml
      x-section: Anexos do cliente
      x-audience:
        - public
      tags:
        - Anexos do cliente
      summary: Busca as informações de anexos do cliente
      operationId: getCustomerAttachments
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: >-
            Foi encontrado anexos para o cliente, caso retorne vazio foi
            encontrado apenas o cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostumerAttachmentsResponseArray'
              example:
                resultSetMetadata:
                  count: 1
                  limit: 10
                  offset: 0
                results:
                  - attachmentid: 1
                    name: documento.pdf
                    description: Documento do cliente
                    size: 320123
                    contentType: application/pdf
                    links:
                      - rel: contentDownloadLink
                        href: https://api.exemplo.com/attachments/1/download
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Busca as informações dos anexos do cliente (REST)
    post:
      x-original-file: customers-v1.yaml
      x-section: Anexos do cliente
      x-audience:
        - public
      tags:
        - Anexos do cliente
      summary: Inclui um novo anexo ao cliente.
      operationId: insertCustomerAttachment
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - name: description
          in: query
          description: 'Descrição do anexo. Exemplo: "Certidão de nascimento".'
          required: true
          schema:
            type: string
            example: Certidão de nascimento
      requestBody:
        description: Arquivo para inserção do anexo do cliente.
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  description: >-
                    Arquivo para inserção | Tamanho máximo: 70 MB | Tamanho
                    máximo do nome do arquivo: 100 caracteres | Somente 1 Anexo
                    por requisição. Caso seja enviado mais de 1 Anexo, o Sienge
                    vai aceitar somente o primeiro selecionado.
                  format: binary
                  example: documento.pdf
            examples:
              exemplo1:
                summary: Exemplo de PDF
                value:
                  file: documento.pdf
        required: true
      responses:
        '201':
          description: Anexo inserido com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Inclui um anexo ao cliente. (REST)
  /customers/{customerId}/attachments/{attachmentId}:
    get:
      x-original-file: customers-v1.yaml
      x-section: Anexos do cliente
      x-audience:
        - public
      tags:
        - Anexos do cliente
      summary: Download do anexo do cliente
      operationId: downloadCostumerAttachment
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: Anexo encontrado
          content:
            application/json:
              schema:
                type: string
                format: binary
            file:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Download de anexo do cliente (REST)
  /customers/{customerId}/procurator:
    post:
      tags:
        - Procuradores do cliente
      summary: Inclui um novo procurador ao cliente.
      operationId: insertCustomerProcurators
      x-section: Procuradores do cliente
      x-original-file: customers-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        description: Objeto para criação do procurador
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcuratorInsertDocument'
            example:
              name: Carlos Alberto Souza
              cpf: '12345678901'
              procuratorType: CLIENTE
              numberIdentityCard: MG1234567
              email: carlos.souza@email.com
              birthDate: '1970-05-20'
              nationality: Brasileiro
              birthPlace: Belo Horizonte
              professionId: 123
              civilStatusId: 2
              marriageRegime: Comunhão parcial de bens
              marriageDate: '2000-10-10'
              residentialAddress:
                streetName: Rua das Palmeiras
                neighborhood: Centro
                cityId: 1001
                zipCode: '88000123'
                number: '123'
                complement: Apto 45
                state: SC
                city: Florianópolis
              businessAddress:
                streetName: Rua das Palmeiras
                neighborhood: Centro
                cityId: 1001
                zipCode: '88000123'
                number: '123'
                complement: Apto 45
                state: SC
                city: Florianópolis
              proxy:
                registry: Cartório Central
                district: Belo Horizonte
                stateId: 31
                book: Livro A
                sheet: Folha 10
        required: true
      responses:
        '201':
          description: Procurador criado
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Inclui um procurador ao cliente. (REST)
components:
  schemas:
    CustomerAttachmentResponseDocument:
      required:
        - resultSetMetadata
        - results
      type: object
      description: Informações de anexo do cliente.
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
