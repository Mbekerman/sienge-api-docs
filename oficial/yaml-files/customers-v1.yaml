          description: >-
            CNPJ. Formato NNNNNNNNNNNNNN (somente números). Exemplo ->
            87389750000185.
          example: '87389750000185'
        cityRegistrationNumber:
          type: string
          description: Número de inscrição municipal.
          example: '123456789'
        stateRegistrationNumber:
          type: string
          description: Número de inscrição estadual.
          example: '123456789'
        cnaeNumber:
          type: string
          description: Número do CNAE.
          example: '123456789'
        creaNumber:
          type: string
          description: Número do CREA.
          example: '123456789'
        contactName:
          type: string
          description: Nome do contato.
          example: Contato de Exemplo
        establishmentDate:
          type: string
          description: >-
            Data de constituição da empresa. Formato YYYY-MM-DD. Exemplo ->
            2012-12-05.
          example: '2012-12-05'
        note:
          type: string
          description: Observação da pessoa jurídica.
          example: Observação de Exemplo
        site:
          type: string
          description: Endereço de website.
          example: https://www.exemplo.com.br
        shareCapital:
          type: number
          description: Capital social.
          example: 1000000
        technicalManager:
          type: string
          description: Nome do responsável técnico.
          example: Responsável Técnico de Exemplo
    CostumerAttachmentDocument:
      type: object
      description: Informação do anexo do cliente.
      properties:
        attachmentid:
          type: integer
          description: 'ID do anexo | Exemplo: 1'
          format: int32
          example: 1
        name:
          maxLength: 100
          type: string
          description: 'Nome do arquivo | Exemplo: arquivo.pdf'
          example: arquivo.pdf
        description:
          maxLength: 500
          type: string
          description: 'Descrição do anexo | Exemplo: Documento do cliente'
          example: Documento do cliente
        size:
          type: integer
          description: 'Tamanho do arquivo em bytes | Exemplo: 320123'
          format: int32
        contentType:
          type: string
          description: 'Tipo do arquivo (MimeType) | Exemplo: application/pdf'
          example: application/pdf
        links:
          $ref: '#/components/schemas/Links'
    ProcuratorResidentialAddressInsertDocument:
      required:
        - cityId
        - neighborhood
        - streetName
      type: object
      description: Informações do endereço residencial do procurador.
      example:
        streetName: Rua das Flores
        neighborhood: Centro
        cityId: 1234
        zipCode: 12345-678
        number: '100'
        complement: Apto 202
      properties:
        streetName:
          maxLength: 80
          type: string
          description: Logradouro do endereço residencial.
          example: Rua das Flores
        neighborhood:
          maxLength: 40
          type: string
          description: Bairro do endereço residencial.
          example: Centro
        cityId:
          type: integer
          description: Código do município do endereço residencial.
          format: int32
          example: 1234
        zipCode:
          type: string
          description: Código de endereçamento postal (CEP) residencial. Formato NNNNN-NNN.
          example: 12345-678
        number:
          maxLength: 10
          type: string
          description: Número do endereço residencial.
          example: '100'
        complement:
          maxLength: 40
          type: string
          description: Complemento do endereço residencial.
          example: Apto 202
    ProcuratorBusinessAddressInsertDocument:
      type: object
      description: Informações do endereço comercial do procurador.
      example:
        streetName: Rua das Flores
        neighborhood: Centro
        cityId: 1234
        zipCode: 12345-678
        number: '100'
        complement: Apto 202
      properties:
        streetName:
          maxLength: 80
          type: string
          description: Logradouro do endereço comercial.
          example: Rua das Flores
        neighborhood:
          maxLength: 40
          type: string
          description: Bairro do endereço comercial.
          example: Centro
        cityId:
          type: integer
          description: Código do município do endereço comercial.
          format: int32
          example: 1234
        zipCode:
          type: string
          description: Código de endereçamento postal (CEP) comercial. Formato NNNNN-NNN.
          example: 12345-678
        number:
          maxLength: 10
          type: string
          description: Número do endereço comercial.
          example: '100'
        complement:
          maxLength: 40
          type: string
          description: Complemento do endereço comercial.
          example: Apto 202
    ProcuratorProxyInsertDocument:
      type: object
      description: Informações da procuração.
      example:
        registry: Cartório Central
        district: Belo Horizonte
        stateId: 31
        book: Livro A
        sheet: Folha 10
      properties:
        registry:
          maxLength: 40
          type: string
          description: Nome do cartório.
          example: Cartório Central
        district:
          maxLength: 40
          type: string
          description: Comarca do cartório.
          example: Belo Horizonte
        stateId:
          type: integer
          description: Código da unidade federativa (UF) do cartório.
          format: int32
          example: 31
        book:
          maxLength: 20
          type: string
          description: Nome do livro.
          example: Livro A
        sheet:
          maxLength: 10
          type: string
          description: Número da folha.
          example: Folha 10
        date:
          type: string
          description: Data da procuração. Formato YYYY-MM-DD.
          example: '2025-01-01'
        expirationDate:
          type: string
          description: Data de validade da procuração. Formato YYYY-MM-DD.
          example: '2025-01-01'
    ProcuratorSpouseInsertDocument:
      required:
        - cpf
        - name
      type: object
      description: Informações do cônjuge do procurador para inclusão.
      example:
        name: João Silva
        cpf: '12345678901'
        numberIdentityCard: '123456789'
        birthDate: '2025-01-01'
        nationality: Brasil
        birthPlace: Brasil
        professionId: 1
      properties:
        name:
          maxLength: 80
          type: string
          description: Nome do cônjuge do procurador.
          example: João Silva
        cpf:
          type: string
          description: CPF do cônjuge do procurador.
          example: '12345678901'
        birthDate:
          type: string
          description: Data de nascimento do cônjuge do procurador. Formato YYYY-MM-DD.
          example: '2025-01-01'
        birthPlace:
          maxLength: 40
          type: string
          description: Naturalidade do cônjuge do procurador.
          example: Brasil
        nationality:
          maxLength: 40
          type: string
          description: Nacionalidade do cônjuge do procurador.
          example: Brasil
        professionId:
          type: integer
          description: Código da profissão do cônjuge do procurador.
          format: int32
          example: 1
        numberIdentityCard:
          maxLength: 21
          type: string
          description: Número da carteira de identidade (RG) do cônjuge do procurador.
          example: '123456789'
    PhoneInsertDocument:
      required:
        - main
        - number
        - type
      type: object
      description: Informações de telefone para inclusão.
      properties:
        main:
          type: boolean
          description: >-
            Indicador de telefone principal. "True" quando for principal,
            "False" quando não. Deve ser informado apenas um telefone como o
            principal.
          example: true
        type:
          type: string
          description: Tipo de telefone, pode ser "Celular", "Comercial" ou "Residencial".
          enum:
            - CELULAR
            - COMERCIAL
            - RESIDENCIAL
          example: CELULAR
        number:
          type: string
          description: Número de telefone com DDD. Formato DDDNNNNNNNNN ou DDNNNNNNNNN.
          example: '48999998888'
        extension:
          maxLength: 4
          type: string
          description: Ramal do telefone.
          example: '123'
        note:
          maxLength: 80
          type: string
          description: Observação do telefone sendo inserido.
          example: Telefone comercial
    Links:
      description: Links para acessar outros recursos
      example:
        - href: https://../v1/purchase-..
          rel: Recurso
      items:
        $ref: '#/components/schemas/Link'
      type: array
    Link:
      description: Representa um link para outro recurso.
      properties:
        href:
          description: URL do recurso associado
          example: https://../v1/purchase-..
          type: string
        rel:
          description: Nome da recurso associado
          example: Recurso
          type: string
      type: object
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    CustomerId:
      name: customerId
      in: path
      description: Id do cliente.
      required: true
      schema:
        type: integer
        format: int32
      example: 123
    AddressType:
      name: addressType
      in: path
      description: Tipo de endereço. 'C' para Comercial. 'R' para Residencial.
      required: true
      schema:
        type: string
      example: C
    AttachmentId:
      description: ID do anexo
      in: path
      name: attachmentId
      required: true
      schema:
        format: int32
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
webhooks:
  CUSTOMER_CREATED:
    post:
      tags:
        - Webhooks - Clientes
      summary: Webhook disparado quando um cliente é criado
      description: Sempre que um cliente é criado
      operationId: customerCreatedWebhook
      requestBody:
        description: Dados do evento de criação de cliente
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerWebhookPayload'
            example:
              customerId: 123
        required: true
      responses:
        2XX:
          description: O evento CUSTOMER_CREATED foi processado com sucesso
      x-audience:
        - public
  CUSTOMER_UPDATED:
