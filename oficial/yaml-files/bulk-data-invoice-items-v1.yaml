openapi: 3.1.1
info:
  title: Bulk-data Relatório de Notas Fiscais
  version: 1.24.0
  description: Recurso para obtenção dos dados do relatório de Notas Fiscais.
paths:
  /invoice-itens:
    get:
      x-original-file: bulk-data-invoice-items-v1.yaml
      x-audience:
        - public
      tags:
        - Bulk-data Relatório de Notas Fiscais
      summary: Consulta itens das notas fiscais
      operationId: invoiceItens
      parameters:
        - $ref: '#/components/parameters/CompanyIdQueryRequired'
        - $ref: '#/components/parameters/StartDateQueryRequired'
          description: >-
            Data de início para entrada/saída da nota fiscal. <b>Exemplo</b>:
            2022-01-01
        - $ref: '#/components/parameters/EndDateQueryRequired'
          description: >-
            Data fim para entrada/saída da nota fiscal. <b>Exemplo</b>:
            2022-12-31
        - name: showCostCenterId
          in: query
          description: >-
            Define se o código do empreendimento presente nas apropriações
            financeiras da nota será trazido no resultado da consulta. Valores
            válidos: S ou N
          schema:
            type: string
            default: 'N'
      responses:
        '200':
          description: Resultado da pesquisa retornado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvoiceItens'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Retorna as informações de itens das notas fiscais (BULK)
components:
  schemas:
    GetInvoiceItens:
      required:
        - data
      type: object
      description: Lista de itens das notas fiscais retornados como resultado da pesquisa
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Results'
          example:
            - entryExitType: 1
              itemType: P
              entryExitDate: '2022-06-01'
              costCenterId: 123
              documentNumber: NF123456
              documentCode: NFE
              seriesType: '1'
              issueDate: '2022-05-30'
              participantCode: 456
              participantName: Fornecedor Exemplo
              participantFederatedUnit: SP
              participantStateRegistration: '123456789'
              participantCpfCnpj: '12345678000199'
              productCode: 789
              productDescription: Produto A
              unitOfMeasureSymbol: Kg
              ncm: '10061010'
              operationTaxCode: '5102'
              productOriginCode: '0'
              quantity: 10.5
              unitPriceValue: 25.75
              freightValue: 5
              insuranceValue: 0
              ipiExpensesValue: 2
              ancillaryExpensesValue: 1.5
              discountValue: 0.5
              totalItemValue: 263.75
              pisTaxSituation: '01'
              pisCalculationBasis: 250
              pisRate: 1.65
              pisValue: 4.13
              cofinsTaxSituation: '01'
              cofinsCalculationBasis: 250
              cofinsRate: 7.6
              cofinsValue: 19
              icmsTaxSituation: '00'
              icmsCalculationBasis: 250
              icmsRate: 18
              icmsValue: 45
              icmsStCalculationBasis: 0
              icmsStRate: 0
              icmsStValue: 0
              icmsExoneratedValue: 0
              icmsExemptValue: 0
              icmsOtherValue: 0
              ipiTaxSituation: '50'
              ipiCalculationBasis: 250
              ipiRate: 5
              ipiValue: 12.5
              ipiExemptValue: 0
              ipiOtherValue: 0
    Results:
      type: object
      description: Estrutura que representa um item da nota fiscal retornado pela consulta
      properties:
        entryExitType:
          $ref: '#/components/schemas/EntryExitTypeEnum'
        itemType:
          $ref: '#/components/schemas/ItemTypeEnum'
        entryExitDate:
          type: string
          description: Data de entrada/saída da nota fiscal
          format: date
          example: '2022-06-01'
        costCenterId:
          type: integer
          description: >-
            Número do empreendimento. Este atributo é retornado na consulta
            quando o parâmetro showCostCenterId = true
          format: int32
          example: 123
        documentNumber:
          type: string
          description: Número do documento da nota fiscal
          example: NF123456
        documentCode:
          type: string
          description: Código do documento utilizado (CT, NF, NFE)
          example: NFE
        seriesType:
          type: string
          description: Número de série da nota fiscal
          example: '1'
        issueDate:
          type: string
          description: Data de emissão da nota fiscal
          format: date
          example: '2022-05-30'
        participantCode:
          type: integer
          description: >-
            Código do participante da operação, que pode ser o
            credor/cliente/empresa da nota fiscal
          format: int32
          example: 456
        participantName:
          type: string
          description: Nome do participante da operação
          example: Fornecedor Exemplo
        participantFederatedUnit:
          type: string
          description: UF do participante da operação
          example: SP
        participantStateRegistration:
          type: string
          description: Inscrição estadual do participante da operação
          example: '123456789'
        participantCpfCnpj:
          type: string
          description: CPF/CNPJ do participante da operação
          example: '12345678000199'
        productCode:
          type: integer
          description: Código do produto fiscal
          format: int32
          example: 789
        productDescription:
          type: string
          description: Descrição do produto fiscal
          example: Produto A
        unitOfMeasureSymbol:
          type: string
          description: Símbolo da unidade de medida (Kg, m2, m3)
          example: Kg
        ncm:
          type: string
          description: Código do NCM
          example: '10061010'
        operationTaxCode:
          type: string
          description: Código fiscal da operação
          example: '5102'
        productOriginCode:
          type: string
          description: Código da origem da mercadoria (ICMS)
          example: '0'
        quantity:
          type: number
          description: Quantidade do item
          example: 10.5
        unitPriceValue:
          type: number
          description: Valor unitário do item
          example: 25.75
        freightValue:
          type: number
          description: Valor do frete do item
          example: 5
        insuranceValue:
          type: number
          description: Valor do seguro do item
          example: 0
        ipiExpensesValue:
          type: number
          description: Valor total do IPI informado na totalização do item
          example: 2
        ancillaryExpensesValue:
          type: number
          description: Valor de despesas acessórias do item
          example: 1.5
        discountValue:
          type: number
          description: Valor de desconto do item
          example: 0.5
        totalItemValue:
          type: number
          description: Valor total do item
          example: 263.75
        pisTaxSituation:
          type: string
          description: Código da situação tributária do PIS
          example: '01'
        pisCalculationBasis:
          type: number
          description: Valor da base de cálculo do PIS
          example: 250
        pisRate:
          type: number
          description: Valor da alíquota do PIS
          example: 1.65
        pisValue:
          type: number
          description: Valor total do PIS
          example: 4.13
        cofinsTaxSituation:
          type: string
          description: Código da situação tributária do COFINS
          example: '01'
        cofinsCalculationBasis:
          type: number
          description: Valor da base de cálculo do COFINS
          example: 250
        cofinsRate:
          type: number
          description: Valor da alíquota do COFINS
          example: 7.6
        cofinsValue:
          type: number
          description: Valor total do COFINS
          example: 19
        icmsTaxSituation:
          type: string
          description: Código da situação tributária do ICMS
          example: '00'
        icmsCalculationBasis:
          type: number
          description: Valor da base de cálculo do ICMS
          example: 250
        icmsRate:
          type: number
          description: Valor da alíquota do ICMS
          example: 18
        icmsValue:
          type: number
          description: Valor total do ICMS
          example: 45
        icmsStCalculationBasis:
          type: number
          description: Valor da base de cálculo do ICMS-ST
          example: 0
        icmsStRate:
          type: number
          description: Valor da alíquota do ICMS-ST
          example: 0
        icmsStValue:
          type: number
          description: Valor total do ICMS-ST
          example: 0
        icmsExoneratedValue:
          type: number
          description: Valor do ICMS desonerado
          example: 0
        icmsExemptValue:
          type: number
          description: Valor do ICMS isento
          example: 0
        icmsOtherValue:
          type: number
          description: Valor do ICMS outros
          example: 0
        ipiTaxSituation:
          type: string
          description: Código da situação tributária do IPI
          example: '50'
        ipiCalculationBasis:
          type: number
          description: Valor da base de cálculo do IPI
          example: 250
        ipiRate:
          type: number
          description: Valor da alíquota do IPI
          example: 5
        ipiValue:
          type: number
          description: Valor total do IPI
          example: 12.5
        ipiExemptValue:
          type: number
          description: Valor do IPI isento
          example: 0
        ipiOtherValue:
          type: number
          description: Valor do IPI outros
          example: 0
    EntryExitTypeEnum:
      type: integer
      enum:
        - 0
        - 1
      description: |
        Tipo da nota fiscal quando avulsa:
        * 0 - Nota fiscal avulsa de saída
        * 1 - Nota fiscal avulsa de entrada
      example: 1
    ItemTypeEnum:
      type: string
      enum:
        - P
        - S
      description: |
        Tipo do item:
        * P - Produto
        * S - Serviço
      example: P
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    CompanyIdQueryRequired:
      description: Código da empresa
      in: query
      name: companyId
      required: true
      schema:
        example: 1
        type: integer
    StartDateQueryRequired:
      description: Data inicial para filtro de período
      in: query
      name: startDate
      required: true
      schema:
        example: '2023-01-01'
        format: date
        type: string
    EndDateQueryRequired:
      description: Data final para filtro de período
      in: query
      name: endDate
      required: true
      schema:
        example: '2023-01-31'
        format: date
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/bulk-data/v1
