components:
  schemas:
    BillsResponse:
      description: Resposta da consulta de títulos do contas a pagar
      required:
        - resultSetMetadata
        - results
      type: object
      example:
        resultSetMetadata:
          limit: 10
          offset: 0
          total: 1
          count: 1
        results:
          - id: 1000
            debtorId: 1
            creditorId: 100
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          allOf:
            - $ref: '#/components/schemas/ListOfTitlesSearchResultDescription'
          items:
            $ref: '#/components/schemas/Bill'
          example:
            - id: 1000
              debtorId: 1
              creditorId: 100
              documentIdentificationId: NF
              documentNumber: '123456'
              issueDate: '2024-01-01'
              installmentsNumber: 1
              totalInvoiceAmount: 1000
    BillInsert:
      description: Objeto para inserção de título do contas a pagar
      required:
        - baseDate
        - billDate
        - budgetCategories
        - creditorId
        - debtorId
        - discount
        - documentIdentificationId
        - documentNumber
        - dueDate
        - indexId
        - installmentsNumber
        - issueDate
        - notes
        - totalInvoiceAmount
      type: object
      properties:
        debtorId:
          description: Código da empresa
          example: 123
          format: int32
          type: integer
        creditorId:
          description: Código do credor
          example: 123
          format: int32
          type: integer
        documentIdentificationId:
          description: Código do documento
          example: NF | AV
          type: string
        documentNumber:
          description: Número do documento
          example: NF-001
          type: string
        issueDate:
          description: Data de emissão. Formato ISO 8601 (yyyy-MM-dd).
          example: 2018-12-22T00:00:00.000Z
          format: date
          type: string
        installmentsNumber:
          type: integer
          description: Quantidade de parcelas
          format: int32
          minimum: 1
          example: 1
        indexId:
          description: Código do indexador.
          example: 5
          type: integer
        baseDate:
          description: Data base. Formato ISO 8601 (yyyy-MM-dd).
          example: 2018-12-22T00:00:00.000Z
          format: date
          type: string
        dueDate:
          description: Data de vencimento. Formato ISO 8601 (yyyy-MM-dd).
          example: 2018-12-22T00:00:00.000Z
          format: date
          type: string
        billDate:
          description: Data de competência. Formato ISO 8601 (yyyy-MM-dd).
          example: 2018-12-22T00:00:00.000Z
          format: date
          type: string
        totalInvoiceAmount:
          maximum: 9999999999.99
          minimum: 0.01
          type: number
          description: >-
            Valor do título bruto, somando impostos e desconto | Máximo de casas
            decimais: 2 | Exemplo: 108.75
          format: double
          example: 1000
        notes:
          maxLength: 500
          type: string
          description: 'Observação do título | Exemplo: Observação título Dez2017'
          example: Título de exemplo
        discount:
          maximum: 9999999999.99
          minimum: 0
          type: number
          description: 'Valor desconto | Máximo de casas decimais: 2 | Exemplo: 10.00'
          format: double
          example: 0
        budgetCategories:
          $ref: '#/components/schemas/BillBudgetCategoriesProperty'
        taxes:
          type: array
          description: Impostos do título
          items:
            $ref: '#/components/schemas/BillTaxInsert'
          example:
            - taxId: 1
              ibgeCityId: '4205407'
              rate: 5.45
              amount: 95.57
              taxableBaseAmount: 1035
              taxRateMarker: 100
              usesIncomeTaxTable: false
        departmentsCost:
          $ref: '#/components/schemas/BillDepartmentsCostProperty'
        buildingsCost:
          $ref: '#/components/schemas/BillBuildingsCostProperty'
        units:
          $ref: '#/components/schemas/BillUnitsProperty'
    Bill:
      description: Título do contas a pagar
      type: object
      example:
        id: 1000
        debtorId: 1
        creditorId: 100
        documentIdentificationId: NF
        documentNumber: '123456'
        issueDate: '2018-12-22'
        installmentsNumber: 1
        totalInvoiceAmount: 1000
        tenantUrl: https://api.sienge.com.br/suporte/sienge/public/api
        notes: Observação título Dez2017
        discount: 10
        status: S
        originId: AC
        registeredUserId: USER
        registeredBy: User
        registeredDate: '2022-06-10 10:00:00'
        changedUserId: USER
        changedBy: User
        changedDate: '2022-06-10 10:00:00'
        accessKeyNumber: '12312312312312312312312312312312312312312312'
        links:
          - rel: debtor
            href: https://../v1/debtor/1
      properties:
        id:
          type: integer
          description: Identificador único do título
          format: int32
        debtorId:
          description: Código da empresa
          example: 123
          format: int32
          type: integer
        creditorId:
          description: Código do credor
          example: 123
          format: int32
          type: integer
        documentIdentificationId:
          description: Código do documento
          example: NF | AV
          type: string
        documentNumber:
          description: Número do documento
          example: NF-001
          type: string
        issueDate:
          description: Data de emissão. Formato ISO 8601 (yyyy-MM-dd).
          example: 2018-12-22T00:00:00.000Z
          format: date
          type: string
        installmentsNumber:
          type: integer
          description: Quantidade de parcelas
          format: int32
          minimum: 1
          example: 1
        totalInvoiceAmount:
          type: number
          description: 'Valor do título bruto, somando impostos e desconto | Exemplo: 100.00'
          format: double
          example: 1000
        tenantUrl:
          type: string
          description: URL Base das API's
          example: https://api.sienge.com.br/suporte/sienge/public/api
        notes:
          maxLength: 500
          type: string
          description: Observação do título
          example: Observação título Dez2017
        discount:
          type: number
          description: 'Valor de desconto | Exemplo: 10.00'
          format: double
        status:
          maxLength: 1
          type: string
          description: >-
            Tipo de consistência: 'S' - Completo | 'N' - Incompleto | 'I' - Em
            inclusão
          example: S
          enum:
            - S
            - 'N'
            - I
        originId:
          maxLength: 2
          type: string
          description: >-
            Código de origem: 'AC' - Administração de Compras | 'RA' -
            Administração de Obras | 'AI' - Apuração de Impostos | 'CO' -
            Comercial | 'CF' - Conhecimento de Frete | 'CP' - Contas a Pagar |
            'ME' - Contratos e Medições | 'MO' - Controle de Mão de Obra | 'DV'
            - Devolução de Nota Fiscal | 'RF' - Financiamento Bancário | 'FP' -
            Folha de Pagamento | 'FE' - Frota de Equipamentos | 'GI' - Guia de
            Impostos | 'LO' - Locação de Imóveis | 'SE' - Sistemas Externos'
          example: AC
          enum:
            - AC
            - RA
            - AI
            - CO
            - CF
            - CP
            - ME
            - MO
            - DV
            - RF
            - FP
            - FE
            - GI
            - LO
            - SE
        registeredUserId:
          type: string
          description: ID do Usuário que cadastrou o título
          example: USER
        registeredBy:
          type: string
          description: Usuário que cadastrou o título
          example: User
        registeredDate:
          type: string
          description: >-
            Data de cadastro do título | Formato ISO 8601 yyyy-MM-dd HH:mm:ss |
            Exemplo: 2022-06-10 10:00:00
          format: date-time
          example: {}
        changedUserId:
          type: string
          description: ID do Usuário que realizou a última alteração do título
          example: USER
        changedBy:
          type: string
          description: Usuário que realizou a última alteração do título
          example: User
        changedDate:
          type: string
          description: >-
            Data da última alteração do título | Formato ISO 8601 yyyy-MM-dd
            HH:mm:ss | Exemplo: 2022-06-10 10:00:00
          format: date-time
          example: {}
        accessKeyNumber:
          type: string
          description: >-
            Chave de acesso da nota fiscal eletrônica (NF-e) ou do Conhecimento
            de Transporte Eletrônico (CT-e), deve possuir 44 caracteres
          maxLength: 44
          minLength: 44
          example: '35200114200166000187550010000000046842327618'
        purchaseOrderId:
          type: integer
          description: 'Identificador do pedido de compra vinculado ao título | Exemplo: 1'
          format: int32
          nullable: true
          example: 1
        formattedPurchaseOrderId:
          type: string
          description: >-
            Número formatado do pedido de compra vinculado ao título | Exemplo:
            1
          nullable: true
          example: '1'
        contractNumber:
          type: string
          description: 'Número do contrato vinculado ao título | Exemplo: 123A'
          nullable: true
          example: 123A
        measurementNumber:
          type: integer
          description: 'Número da medição vinculada ao título | Exemplo: 1'
          format: int32
          nullable: true
          example: 1
        links:
          $ref: '#/components/schemas/Links'
    BillUpdate:
      description: Objeto para atualização de título do contas a pagar
      type: object
      example:
        documentIdentificationId: NF
        documentNumber: AX123
      properties:
        documentIdentificationId:
          type: string
          description: Identificador do documento
          example: NF
        documentNumber:
          allOf:
            - description: Número do documento
              example: NF-001
              type: string
            - example: AX123
    ElectronicInvoiceBillInsert:
      description: Objeto para inserção de título baseado em nota fiscal eletrônica
      required:
        - accessKeyNumber
        - baseDate
        - billDate
        - budgetCategories
        - documentIdentificationId
        - dueDate
        - indexId
        - installmentsNumber
      type: object
      properties:
        debtorId:
          type: integer
          description: >-
            Código da empresa (não é obrigatório, mas servirá de critério de
            desempate caso exista mais uma empresa com o CNPJ do destinário da
            NFE)
          format: int32
          example: 123
        creditorId:
          type: integer
          description: >-
            Código do credor (não é obrigatório, mas servirá de critério de
            desempate caso exista mais um credor com CPF ou CNPJ do emitente da
            NFE)
          format: int32
          example: 100
        documentIdentificationId:
          type: string
          description: >-
            Código do documento, documento deve ser fiscal e possuir modelo 55
            no Sienge | Exemplo: NFE
          example: NFE
        accessKeyNumber:
          type: string
          description: >-
            Chave de acesso da nota fiscal eletrônica (NF-e) ou do Conhecimento
            de Transporte Eletrônico (CT-e), deve possuir 44 caracteres
          maxLength: 44
          minLength: 44
          example: '35200114200166000187550010000000046842327618'
        installmentsNumber:
          type: integer
          description: Quantidade de parcelas
          format: int32
          minimum: 1
          example: 1
        indexId:
          description: Código do indexador.
          example: 5
          type: integer
        baseDate:
