            Percentual apropriado na unidade |  Máximo de casas decimais: 12 |
            Exemplo: 100.00
          format: double
        principal:
          type: string
          description: Unidade principal ('S' or 'N')
        links:
          $ref: '#/components/schemas/Links'
    Link:
      description: Representa um link para outro recurso.
      properties:
        href:
          description: URL do recurso associado
          example: https://../v1/purchase-..
          type: string
        rel:
          description: Nome da recurso associado
          example: Recurso
          type: string
      type: object
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
    PaymentInformationInserted:
      description: Informação de pagamento inserida com sucesso
  parameters:
    StartDateQueryRequired:
      description: Data inicial para filtro de período
      in: query
      name: startDate
      required: true
      schema:
        example: '2023-01-01'
        format: date
        type: string
    EndDateQueryRequired:
      description: Data final para filtro de período
      in: query
      name: endDate
      required: true
      schema:
        example: '2023-01-31'
        format: date
        type: string
    DebtorIdQuery:
      name: debtorId
      in: query
      description: Código da empresa cadastrada no Sienge
      schema:
        type: integer
    CreditorIdQuery:
      name: creditorId
      in: query
      description: Código do credor cadastrado no Sienge
      schema:
        type: integer
    CostCenterIdQuery:
      name: costCenterId
      in: query
      description: Código do centro de custo cadastrado no Sienge
      schema:
        type: integer
    DocumentsIdentificationIdQuery:
      name: documentsIdentificationId
      in: query
      description: Códigos do documento cadastrado no Sienge
      style: form
      explode: false
      example:
        - NF
        - REC
      schema:
        type: array
        items:
          type: string
        example:
          - NF
          - REC
    DocumentNumberQuery:
      name: documentNumber
      in: query
      description: Número do documento vinculado ao título cadastrado no Sienge
      schema:
        type: string
        format: Max size 20
    StatusQuery:
      name: status
      in: query
      description: |
        Tipo de consistência do título cadastrado no Sienge: 
         * `S` - Completo
         * `N` - Incompleto
         * `I` - Em inclusão
      schema:
        type: string
        enum:
          - S
          - 'N'
          - I
    OriginIdQuery:
      name: originId
      in: query
      description: |
        Código de origem do título cadastrado no Sienge
         * `AC` - Administração de Compras
         * `RA` - Administração de Obras 
         * `AI` - Apuração de Impostos
         * `CO` - Comercial
         * `CF` - Conhecimento de Frete
         * `CP` - Contas a Pagar
         * `ME` - Contratos e Medições
         * `MO` - Controle de Mão de Obra
         * `DV` - Devolução de Nota Fiscal
         * `RF` - Financiamento Bancário
         * `FP` - Folha de Pagamento
         * `FE` - Frota de Equipamentos
         * `GI` - Guia de Impostos
         * `LO` - Locação de Imóveis
         * `SE` - Sistemas Externos
      schema:
        type: string
        format: Max size 2
        enum:
          - AC
          - RA
          - AI
          - CO
          - CF
          - CP
          - ME
          - MO
          - DV
          - RF
          - FP
          - FE
          - GI
          - LO
          - SE
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    BillIdPath:
      name: billId
      in: path
      description: Número do título
      required: true
      schema:
        type: integer
        format: int32
    InstallmentIdPath:
      name: installmentId
      in: path
      description: Número da parcela do título
      required: true
      schema:
        type: integer
        format: int32
    AttachmentDescriptionQuery:
      name: description
      in: query
      description: 'Descrição do anexo | Máximo: 500 caracteres '
      required: true
      schema:
        maxLength: 500
        type: string
    AttachmentIdPath:
      name: attachmentId
      in: path
      description: Código do anexo
      required: true
      schema:
        type: integer
        format: int32
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
