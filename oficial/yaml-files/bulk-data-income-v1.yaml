openapi: 3.1.1
info:
  title: Bulk-data Parcelas do Contas a Receber
  version: 1.24.0
  description: Bulk data de parcelas do contas a receber.
paths:
  /income:
    get:
      x-original-file: bulk-data-income-v1.yaml
      x-audience:
        - public
      tags:
        - Bulk-data Parcelas do Contas a Receber
      summary: Retorna parcelas abertas ou pagas de títulos a receber.
      description: >-
        Retorna as parcelas sem baixa e seus pagamentos (caso possuam), para
        títulos em um período e tipo de período informados. (BULK)
      operationId: bulkdataIncome
      parameters:
        - name: startDate
          in: query
          description: Data de início do período da consulta
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Data do fim do período da consulta
          required: true
          schema:
            type: string
            format: date
        - name: selectionType
          in: query
          description: >-
            Seleção da data do período: I - Data da emissão do título, D - Data
            de vencimento da parcela, P - Data de pagamento da parcela, B - Data
            de competência da parcela
          required: true
          schema:
            type: string
            enum:
              - I
              - D
              - P
              - B
        - $ref: '#/components/parameters/CorrectionIndexerId'
        - $ref: '#/components/parameters/CorrectionDate'
        - $ref: '#/components/parameters/CompanyId'
        - name: costCentersId
          in: query
          description: Códigos de centro de custo cadastrados no Sienge
          style: form
          explode: false
          schema:
            type: array
            example:
              - 1
              - 2
            items:
              type: integer
        - name: changeStartDate
          in: query
          description: >-
            Data Inicial de alteração do Título/Parcela. Buscará apenas
            títulos/parcelas que tiveram alteração durante um intervalo de tempo
            pré-definido. A data final será sempre a data atual.
          schema:
            type: string
            format: date
        - name: completedBills
          in: query
          description: Para filtrar por títulos completos
          schema:
            type: string
            enum:
              - S
        - name: originsIds
          in: query
          description: >-
            Para filtrar pelos códigos dos módulos de origem dos
            títulos/parcelas. Podem ser passados mais de um código de origem por
            vez, por exemplo CR,CO,LO. As opções são - CR (Contas a Receber), CO
            (Comercial), ME (Medições), CA (Contrapartida), CI (Controle de
            Investidores), AR (Administração de Obras), SC (Condomínios), LO
            (Locações), NE (Nota Fiscal Eletrônica), NS (Nota Fiscal de Serviço
            Eletrônica), AC (Administração de Compras), NF (Solicitação de Nota
            Fiscal).
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - CR
                - CO
                - ME
                - CA
                - CI
                - AR
                - SC
                - LO
                - NE
                - NS
                - AC
                - NF
          example:
            - CR
            - CO
        - name: bearersIdIn
          in: query
          description: Filtra somente parcelas que possuam o código do portador informado.
          style: form
          explode: false
          schema:
            type: array
            example:
              - 1
              - 2
            items:
              type: integer
        - name: bearersIdNotIn
          in: query
          description: >-
            Filtra somente parcelas que possuam o código do portador diferentes
            dos informados.
          style: form
          explode: false
          schema:
            type: array
            example:
              - 1
              - 2
            items:
              type: integer
      responses:
        '200':
          description: >-
            Consulta executada com sucesso: parcelas de títulos a receber
            retornadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseBulkDataIncome'
