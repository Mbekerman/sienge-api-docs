  /units/{unitId}/address:
    post:
      tags:
        - Endereço da Unidade
      summary: Insere o endereço da unidade
      operationId: insertUnitAddress
      x-section: Endereço da Unidade
      x-original-file: unit-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/UnitId'
      requestBody:
        description: Objeto para inserção do endereço da unidade.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealEstateUnitAddressDocument'
            example:
              cityId: 1
              streetType: 1
              streetName: Rua Exemplo
              number: '100'
              complement: Apto 101
              neighborhood: Centro
              zipCode: 12345-678
        required: true
      responses:
        '201':
          description: Endereço da unidade inserido com sucesso
        '400':
