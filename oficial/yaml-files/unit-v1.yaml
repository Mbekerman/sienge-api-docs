openapi: 3.1.1
info:
  title: Unidades de Imóveis
  version: 1.24.0
  description: API de Unidades de Imóveis
paths:
  /units/{unitId}:
    get:
      x-original-file: unit-v1.yaml
      x-section: Unidades
      x-audience:
        - public
      tags:
        - Unidades
      summary: Busca a unidade no Sienge
      operationId: getUnit
      parameters:
        - $ref: '#/components/parameters/UnitId'
      responses:
        '200':
          description: A unidade foi encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealEstateUnitDocument'
              example:
                id: 1
                name: Exemplo de Unidade
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Busca detalhada de uma unidade específica no Sienge pelo seu
        identificador único. (REST)
    patch:
      tags:
        - Unidades
      summary: Atualiza informações da Unidade
      operationId: patchUnitsId
      x-section: Unidades
      x-original-file: unit-v1.yaml
      x-audience:
        - public
      parameters:
        - name: unitId
          in: path
          description: Código da unidade para ser atualizada
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        description: Objeto para atualização da unidade.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealEstateUnitUpdateDocument'
            example:
              commercialStock: D
              prizedCompliance: 0
              iptuValue: 100
              realEstateRegistration: '123456'
        required: true
      responses:
        '204':
          description: Unidade atualizada com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Atualização dos dados cadastrais de uma unidade existente no Sienge.
        (REST)
  /units:
    get:
      x-original-file: unit-v1.yaml
      x-section: Unidades
      x-audience:
        - public
      tags:
        - Unidades
      summary: Retorna as unidades ordenadas decrescentemente pelo id
      operationId: getAllUnits
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: enterpriseId
          in: query
          description: Código do empreendimento (centro de custo).
          schema:
            type: integer
            format: int32
            example: 1001
        - name: commercialStock
          in: query
          description: >
            Estoque comercial da unidade.  <br /> <b>Opções:</b>  <br /> C -
            Reservada  <br /> D - Disponível <br /> R - Reserva técnica <br /> E
            - Permuta <br /> M - Mútuo <br /> P - Proposta <br /> V - Vendida
            <br /> L - Locado <br /> T - Transferido
          schema:
            type: string
            example: D
        - name: name
          in: query
          description: Nome/Identificador da unidade.
          schema:
            type: string
            example: Unidade 101
        - name: additionalData
          in: query
          description: |-
            Enums:
              `ALL` - Carrega todos os dados adicionais. Unidades Filhas, Agrupamentos e Valores Especiais.
              `NONE` - Não carrega os dados adicionais.
          schema:
            type: string
            enum:
              - ALL
              - NONE
            example: ALL
      responses:
        '200':
          description: Unidades encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitsResponse'
              example:
                resultSetMetadata:
                  count: 1
                  offset: 0
                  limit: 10
                results:
                  - id: 1
                    name: Unidade Exemplo
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Lista todas as unidades cadastradas, ordenadas de forma decrescente pelo
        id. (REST)
    post:
      tags:
        - Unidades
      summary: Persiste uma Unidade.
      operationId: insert
      x-section: Unidades
      x-original-file: unit-v1.yaml
      x-audience:
        - public
      requestBody:
        description: Objeto para criação da unidade
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealEstateUnitInsertDocument'
            example:
              enterpriseId: 1
              indexerId: 1
              classificationUnit: 1
              propertyTypeId: 1
              situationId: 1
              privateArea: 50
              name: Nova Unidade
              availableDate: '2023-12-01'
              commercialStock: D
              commonArea: 10
              constructionStock: P
              idealFraction: 0.1
              idealFractionSquareMeter: 5
              indexedQuantity: 10
              legalStock: E
              terrainArea: 100
              usableArea: 50
        required: true
      responses:
        '201':
          description: Unidade criada
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Criação de uma nova unidade no sistema. (REST)
  /units/{unitId}/child-unit:
    post:
      tags:
        - Unidades filhas
      summary: Adiciona uma ou mais unidades filhas na unidade pelo ID.
      operationId: addChildUnit
      x-section: Unidades filhas
      x-original-file: unit-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/UnitId'
      requestBody:
        description: Lista de unidades filhas a serem adicionadas.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealEstateChildUnitInsertDocument'
            example:
              propertyTypeId: 1
              privateArea: 20
              commonArea: 10
              idealFraction: 0.5
              idealFractionSquareMeter: 10
              name: Unidade Filha
        required: true
      responses:
        '201':
          description: Unidades filhas adicionadas à unidade com sucesso.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Realiza o vínculo de unidades filhas a uma unidade principal pelo seu
        identificador. (REST)
  /units/{unitId}/groupings:
    get:
      x-original-file: unit-v1.yaml
      x-section: Agrupamentos de unidade
      x-audience:
        - public
      tags:
        - Agrupamentos de unidade
      summary: Busca agrupamentos de unidade no Sienge
      operationId: getUnitsGrouping
      parameters:
        - $ref: '#/components/parameters/UnitId'
      responses:
        '200':
          description: Unidade encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealEstateUnitGroupingDocument'
              example:
                - id: 1
                  name: Agrupamento Exemplo
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Retorna agrupamentos de unidades relacionadas ao id informado. (REST)
  /units/{unitId}/attachments:
    post:
      x-original-file: unit-v1.yaml
      x-section: Anexos de unidade
      x-audience:
        - public
      tags:
        - Anexos de unidade
      summary: Inclui um anexo a unidade.
      operationId: insertUnitAttachment
      parameters:
        - $ref: '#/components/parameters/UnitId'
        - name: description
          in: query
          description: Descrição do anexo da unidade.
          required: true
          schema:
            type: string
            example: Planta da unidade
      requestBody:
        description: >-
          Arquivo para inserção | Tamanho máximo: 70 MB | Tamanho máximo do nome
          do arquivo: 100 caracteres | Apenas 1 Anexo por requisição. Caso seja
          enviado mais de 1 Anexo, apenas o primeiro selecionado será aceito.
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  description: >-
                    Arquivo para inserção | Tamanho máximo: 70 MB | Tamanho
                    máximo do nome do arquivo: 100 caracteres | Somente 1 Anexo
                    por requisição. Caso seja enviado mais de 1 Anexo, o Sienge
                    vai aceitar somente o primeiro selecionado.
                  format: binary
                  example: documento.pdf
            examples:
              exemplo1:
                summary: Exemplo de PDF
                value:
                  file: documento.pdf
        required: true
      responses:
        '201':
          description: Anexo inserido da unidade com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Adiciona um novo anexo ao cadastro da unidade informada. (REST)
  /units/characteristics:
    get:
      x-original-file: unit-v1.yaml
      x-section: Características para unidade
      x-audience:
        - public
      tags:
        - Características para unidade
      summary: Retorna todas características de unidade cadastradas
      operationId: getAllUnitCharacteristics
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Características de unidade encontradas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllUnitCharacteristicsResponseDocument'
              example:
                resultSetMetadata:
                  count: 1
                  offset: 0
                  limit: 10
                results:
                  - id: 1
                    description: Característica de unidade
                  - id: 2
                    description: Outra característica de unidade
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Lista todas as características de unidade cadastradas. (REST)
    post:
      tags:
        - Características para unidade
      summary: Cria uma característica da unidade.
      operationId: insertUnitCharacteristic
      x-section: Características para unidade
      x-original-file: unit-v1.yaml
      x-audience:
        - public
      requestBody:
        description: Objeto para criação da característica de unidade.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealEstateUnitCharacteristicInsertDocument'
            example:
              description: Exemplo de característica criada via API
        required: true
      responses:
        '201':
          description: Característica de unidade criada com sucesso
          headers:
            Location:
              description: URL para acessar a característica de unidade criada
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Cadastro de uma nova característica para a unidade. (REST)
  /units/{unitId}/characteristics:
    put:
      tags:
        - Características para unidade
      summary: Vincula uma ou mais características a uma unidade
      operationId: updateUnitCharacteristics
      x-section: Características para unidade
      x-original-file: unit-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/UnitId'
      requestBody:
        description: >-
          Array de objetos contendo as informações das características a serem
          vinculadas na unidade informada.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealEstateUnitCharacteristicUpdateDocument'
            example:
              - id: 1
                quantity: 2
              - id: 2
                quantity: 1
        required: true
      responses:
        '204':
          description: Características da unidade atualizadas.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Realiza o vínculo de características previamente cadastradas a uma
        unidade. (REST)
  /units/situations:
    get:
      x-original-file: unit-v1.yaml
      x-section: Situações para unidade
      x-audience:
        - public
      tags:
        - Situações para unidade
      summary: Retorna todas situaçãos de unidade cadastradas
      operationId: getAllUnitSituations
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Situações de unidade encontradas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllUnitSituationResponseDocument'
              example:
                resultSetMetadata:
                  count: 2
                  offset: 0
                  limit: 10
                results:
                  - id: 1
                    description: Situação ativa
                  - id: 2
                    description: Situação inativa
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
