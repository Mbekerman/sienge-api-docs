  /units/{unitId}/evaluations:
    get:
      tags:
        - Avaliações de unidade
      summary: Busca avaliações cadastradas para a unidade
      operationId: getUnitEvaluations
      x-section: Avaliações de unidade
      x-original-file: unit-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/UnitId'
      responses:
        '200':
          description: Avaliações da unidade encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetUnitEvaluationListItem'
              example:
                - id: 1
                  evaluationDate: '2024-01-01'
                  evaluationPrice: 100000
                  saleValueDate: '2024-02-01'
                  saleValuePrice: 120000
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Lista avaliações cadastradas para a unidade informada. (REST)
    post:
      tags:
        - Avaliações de unidade
      summary: Cria uma nova avaliação para a unidade
      operationId: createUnitEvaluation
      x-section: Avaliações de unidade
      x-original-file: unit-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/UnitId'
      requestBody:
        description: Dados da avaliação a ser criada.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitEvaluationInsert'
            example:
              evaluationDate: '2024-01-10'
              evaluationPrice: 150000
              saleValueDate: '2024-02-10'
              saleValuePrice: 170000
        required: true
      responses:
        '201':
          description: Avaliação criada com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Cria uma avaliação para a unidade informada. (REST)
components:
  schemas:
    RealEstateUnitDocument:
      description: Schema que representa uma unidade imobiliária.
      type: object
      properties:
        id:
          type: integer
          description: Código
          format: int32
          example: 1
        enterpriseId:
          type: integer
          description: Código do empreendimento ao qual a unidade pertence.
          format: int32
          example: 1
        contractId:
          type: integer
          description: Código do contrato ao qual a unidade pertence.
          format: int32
          example: 1
        indexerId:
          type: integer
          description: Código do indexador
          format: int32
          example: 1
        name:
          type: string
          description: Nome/Identificador
          example: Unidade Exemplo
        propertyType:
          type: string
          description: Tipo de imóvel
          example: Unidade Exemplo
        note:
          type: string
          description: Observação da unidade imobiliária.
          example: Observação Exemplo
        commercialStock:
          type: string
          description: >-
            Estoque comercial (D = Disponível, V = Vendida, L = Locada, C =
            Reservada, R = Reserva Técnica, E = Permuta, M = Mutuo, P =
            Proposta, T = Transferido, G = Vendido/Terceiros, O = Vendida em
            pré-contrato)
          example: D
        latitude:
          type: string
          description: Latitude
          example: '-22.9167'
        longitude:
          type: string
          description: Longitude
          example: '-43.2000'
        legalRegistrationNumber:
          type: string
          description: Matrícula
          example: '123456'
        deliveryDate:
          type: string
          description: Data de entrega
          format: date
          example: '2022-01-01'
        privateArea:
          type: number
          description: Área privativa unidade
          example: 50
        commonArea:
          type: number
          description: Área comum unidade
          example: 5
        terrainArea:
          type: number
          description: Área do terreno unidade
          example: 50
        nonProportionalCommonArea:
          type: number
          description: Área comum de divisão não proporcional
          example: 5
        idealFraction:
          type: number
          description: Fração ideal unidade
          example: 0.5
        idealFractionSquareMeter:
          type: number
          description: Fração ideal unidade em m2*
          example: 2.5
        generalSaleValueFraction:
          type: number
          description: Fração VGV (Valor geral de vendas)
          example: 50
        indexedQuantity:
          type: number
          description: Quantidade indexada
          example: 50
        prizedCompliance:
          type: number
          description: Adimplência premiada
          example: 50
        terrainValue:
          type: number
          description: Valor do terreno
          example: 50
        floor:
          type: string
          description: Pavimento
          example: '1'
        contractNumber:
          type: string
          description: Número do contrato
          example: '123456'
        usableArea:
          type: number
          description: Área útil
          example: 50
        iptuValue:
          type: number
          description: Valor do IPTU
          example: 50
        realEstateRegistration:
          type: string
          description: Inscrição imobiliária
          example: '123456'
        cibCode:
          type: string
          maxLength: 58
          description: Cadastro Imobiliário Brasileiro.
          example: CIB-123456
        incraCode:
          type: string
          maxLength: 17
          description: Código INCRA.
          example: INC-123456789
        locationType:
          $ref: '#/components/schemas/LocationType'
        frameworkType:
          $ref: '#/components/schemas/FrameworkType'
        evaluation:
          type: array
          description: Avaliações e valores de venda da unidade imobiliária.
          items:
            $ref: '#/components/schemas/GetUnitEvaluation'
          example:
            - id: 1
              evaluationDate: '2024-01-01'
              evaluationPrice: 100000
              saleValueDate: '2024-02-01'
              saleValuePrice: 120000
        address:
          $ref: '#/components/schemas/GetUnitAddress'
        childUnits:
          type: array
          description: Unidades Filhas vinculadas à unidade imobiliária.
          items:
            $ref: '#/components/schemas/RealEstateChildUnitsDocument'
          example:
            - id: 1
              name: Unidade Filha Exemplo
        groupings:
          type: array
          description: Agrupamentos
          items:
            $ref: '#/components/schemas/RealEstateUnitGroupingItemDocument'
          example:
            - groupingDescription: Agrupador Exemplo
              valueGroupingDescription: Valor do Agrupamento Exemplo
        specialValues:
          type: array
          description: Valores especiais relacionados à unidade
          items:
            $ref: '#/components/schemas/RealEstateUnitSpecialValuesDocument'
          example:
            - tablePricesID: 1
              indexedQuantity: 100
        links:
          $ref: '#/components/schemas/Links'
    RealEstateUnitUpdateDocument:
      description: Schema para atualização de unidade imobiliária.
      type: object
      properties:
        commercialStock:
          maxLength: 1
          type: string
          description: >-
            Unidades vendidas, vendidas em pré-contrato, reservadas, em proposta
            ou locadas não poderão ter o estoque comercial alterado.</br></br>
            Estoques comerciais disponíveis:




              `D` - Diponível
              `R` - Reserva técnica
              `E` - Permuta
              `M` - Mútuo
              `T` - Transferido
              `G` - Vendido/terceiros
          example: D
          enum:
            - D
            - R
            - E
            - M
            - T
            - G
        prizedCompliance:
          minimum: 0
          type: number
          description: Adimplência premiada. Não pode ser um valor negativo.
          example: 0
        iptuValue:
          minimum: 0
          type: number
          description: Valor do IPTU. Não pode ser um valor negativo.
          example: 0
        realEstateRegistration:
          type: string
          description: Inscrição Imobiliária.
          example: '123456'
        idealFraction:
          type: number
          description: 'Fração ideal. Valores aceitos: numeric(17,8)<br><br>'
          example: 0.05
        cibCode:
          type: string
          maxLength: 58
          description: Cadastro Imobiliário Brasileiro.
          example: CIB-123456
        incraCode:
          type: string
          maxLength: 17
          description: Código INCRA.
          example: INC-123456789
        locationType:
          $ref: '#/components/schemas/LocationType'
        frameworkType:
          $ref: '#/components/schemas/FrameworkType'
    UnitsResponse:
      description: Documento de resposta para busca de unidades.
      required:
        - resultSetMetadata
        - results
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de Unidades retornadas como resultado da pesquisa
          items:
            $ref: '#/components/schemas/RealEstateUnitDocument'
      example:
        resultSetMetadata:
          count: 1
          offset: 0
          limit: 10
        results:
          - id: 1
            name: Unidade Exemplo
    RealEstateUnitInsertDocument:
      description: Schema para criação de uma nova unidade imobiliária.
      required:
        - availableDate
        - commercialStock
        - commonArea
        - constructionStock
        - enterpriseId
        - idealFraction
        - idealFractionSquareMeter
        - indexedQuantity
        - indexerId
        - legalStock
        - privateArea
        - propertyTypeId
        - terrainArea
        - usableArea
      type: object
      properties:
        enterpriseId:
          type: integer
          description: Código do empreendimento.<br><br>
          format: int32
          example: 1
        indexerId:
          type: integer
          description: Código do indexador<br><br>
          format: int32
          example: 1
        classificationUnit:
          type: integer
          description: |-
            Classificação da unidade. <br><br> Valores aceitos:
              `1` - Padrão equivalente à habitação do mercado popular (HMP)
              `2` - Padrão equivalente à habitação de interesse social (HIS)
              `3` - Baixo padrão
              `4` - Médio padrão
              `5` - Alto padrão
              `6` - Altíssimo padrão.
          format: int32
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
          example: 1
        propertyTypeId:
          type: integer
          description: >-
            Código do tipo de imóvel. Visível no cadastro do tipo de
            imóvel.<br><br>
          format: int32
          example: 1
        situationId:
          type: integer
          description: 'Código da situação: 1 - Situação A, 2 - Situação B'
          enum:
            - 1
            - 2
          format: int32
          example: 1
        condominiumValue:
          type: number
          description: 'Valor do condomínio. Valores aceitos: numeric(8,2)<br><br>'
          format: double
          example: 100
        privateArea:
          type: number
          description: 'Área privativa. Valores aceitos: numeric(16,6)<br><br>'
          format: double
          example: 50
        usableArea:
          type: number
          description: 'Área útil. Valores aceitos: numeric(16,6)<br><br>'
          format: double
          example: 50
        commonArea:
          type: number
          description: 'Área comum. Valores aceitos: numeric(16,6)<br><br>'
          format: double
          example: 10
        nonProportionalCommonArea:
          type: number
          description: >-
            Área comum de divisão não proporcional. O campo será informado e
            obrigatório quando a categoria do empreendimento for incorporação.
            Valores aceitos: numeric(16,6)<br><br>
          format: double
          example: 10
        terrainArea:
          type: number
          description: 'Área do terreno. Valores aceitos: numeric(16,6)<br><br>'
          format: double
          example: 100
        terrainValue:
          type: number
          description: 'Valor do terreno. Valores aceitos: numeric(10,2)<br><br>'
          format: double
          example: 100
        idealFraction:
          type: number
          description: 'Fração ideal. Valores aceitos: numeric(17,8)<br><br>'
          format: double
          example: 100
        idealFractionSquareMeter:
          type: number
          description: 'Fração ideal em m². Valores aceitos: numeric(18,8)<br><br>'
          format: double
          example: 100
        indexedQuantity:
          type: number
          description: 'Quantidade indexada. Valores aceitos: numeric(16,6)<br><br>'
          format: double
          example: 100
        iptuValue:
          type: number
          description: 'Valor do IPTU. Valores aceitos: numeric(8,2)<br><br>'
          format: double
          example: 100
        generalSaleValueFraction:
          type: number
          description: >-
            Fração VGV (Valor geral de vendas). Valores aceitos:
            numeric(10,8)<br><br>
          format: double
          example: 100
        prizedCompliance:
          type: number
          description: >-
            Valor da adimplência premiada. Valores aceitos:
            numeric(16,6)<br><br>
          format: double
          example: 100
        realEstateRegistration:
          type: string
          description: 'Inscrição imobiliária. Valores aceitos: varchar(30)<br><br>'
          example: '123456'
        name:
          type: string
          description: 'Nome da unidade. Valores aceitos: varchar(50)<br><br>'
          example: Unidade Exemplo
        commercialStock:
          type: string
          description: |-
            Esoque comercial.</br></br> Valores aceitos:
              `D` - Diponível
              `R` - Reserva técnica
              `E` - Permuta
              `M` - Mútuo
              `T` - Transferido
              `G` - Vendido/terceiros
          example: D
          enum:
            - D
            - R
            - E
            - M
            - T
            - G
        legalStock:
          type: string
          example: E
          description: |-
            Estoque legal.<br><br> Valores aceitos:
              `E` - Escriturado
              `C` - Caucionado
              `H` - Hipotecado
              `P` - Penhorado
              `A` - Alugado
              `L` - Livre
              `F` - Alienação fiduciária
              `U` - Usufruto
              `B` - Bloqueio judicial
              `R` - Arresto
          enum:
            - E
            - C
            - H
            - P
            - A
            - L
            - F
            - U
            - B
            - R
        constructionStock:
          type: string
          description: 'Estoque de obra: P - Projeto, E - Em Construção, C - Concluído'
          enum:
            - P
            - E
            - C
          example: P
        location:
          type: string
          description: 'Localização. Valores aceitos: varchar(30)<br><br>'
          maxLength: 30
          example: Localização
        floor:
          type: string
          description: 'Pavimento. Valores aceitos: varchar(30)<br><br>'
          maxLength: 30
          example: Pavimento
        legalRegistrationNumber:
          type: string
          description: 'Matrícula. Valores aceitos: varchar(15)<br><br>'
          maxLength: 15
          example: Matrícula
        latitude:
          type: string
          description: 'Latitude. Valores aceitos: varchar(20)<br><br>'
          maxLength: 20
          example: Latitude
        longitude:
          type: string
          description: 'Longitude. Valores aceitos: varchar(20)<br><br>'
          maxLength: 20
          example: Longitude
        note:
          type: string
          description: Observação da unidade.
          maxLength: 3800
          example: Observação
        endorsement:
          type: string
          description: >-
            Averbação. Informado quando o campo estoque legal for igual a livre.
            Valores aceitos: varchar(20)<br><br>
          maxLength: 20
          example: Averbação
        availableDate:
          type: string
          description: Data da criação. Formato YYYY-MM-DD. Exemplo -> 2023-12-25
          format: date
          example: '2023-12-25'
        deliveryDate:
          type: string
          description: Data de entrega. Formato YYYY-MM-DD. Exemplo -> 2023-12-25
          format: date
          example: '2023-12-25'
        occupancyDate:
          type: string
          description: Data do habite-se. Formato YYYY-MM-DD. Exemplo -> 2023-12-25
          format: date
          example: '2023-12-25'
        cibCode:
          type: string
          maxLength: 58
          description: Cadastro Imobiliário Brasileiro.
          example: CIB-123456
        incraCode:
          type: string
          maxLength: 17
          description: Código INCRA.
          example: INC-123456789
        locationType:
          $ref: '#/components/schemas/LocationType'
        frameworkType:
          $ref: '#/components/schemas/FrameworkType'
        purchaseDeed:
          type: array
          description: Escritura da unidade.
          example:
            - registry: Registry
              book: Book
              registrationGeneral: Registration
              actNumber: Act Number
              licensePermit: License Permit
              registrationNumber: 012345678A
              comment: Comment
              taxpayerNumber: Taxpayer Number
              writDate: '2023-12-25'
          items:
            $ref: '#/components/schemas/PurchaseDeedInsert'
        landDetails:
          type: array
          description: Detalhes do lote.
          example:
            - registry: Registry
              book: Book
              registrationGeneral: Registration
              actNumber: Act Number
              licensePermit: License Permit
              registrationNumber: 123456789
              comment: Comment
              taxpayerNumber: Taxpayer Number
              writDate: '2023-12-25'
          items:
            $ref: '#/components/schemas/LandDetailsInsert'
        unitGroupings:
          type: array
          example:
            - groupingId: 1
              valueGroupingId: 1
          items:
            type: object
            properties:
              groupingId:
                type: integer
                description: Código do agrupamento.
                format: int32
                example: 1
              valueGroupingId:
                type: integer
                description: Valor do agrupamento.
                format: int32
                example: 1
    RealEstateChildUnitInsertDocument:
      description: Schema para inserção de unidade filha.
      required:
        - commonArea
        - idealFraction
        - idealFractionSquareMeter
        - name
        - privateArea
        - propertyTypeId
      type: object
      properties:
        propertyTypeId:
          type: integer
          description: >-
            Código do tipo de imóvel unidade filha. Visível no cadastro do tipo
            de imóvel.<br><br>
          format: int32
          example: 1
        privateArea:
          type: number
          description: 'Área privativa unidade filha. Valores aceitos: numeric(16,6)<br><br>'
          format: double
          example: 100
        commonArea:
          type: number
          description: 'Área comum unidade filha. Valores aceitos: numeric(16,6)<br><br>'
          format: double
          example: 100
        idealFraction:
          type: number
          description: 'Fração ideal unidade filha. Valores aceitos: numeric(17,8)<br><br>'
          format: double
          example: 100
        idealFractionSquareMeter:
          type: number
          description: 'Fração ideal em m². Valores aceitos: numeric(15,5)<br><br>'
          format: double
          example: 100
        name:
          type: string
          description: 'Nome da unidade filha. Valores aceitos: varchar(50)<br><br>'
          maxLength: 50
          example: Unidade Exemplo
        locationName:
          type: string
          description: 'Localização unidade filha. Valores aceitos: varchar(30)<br><br>'
          maxLength: 30
          example: Localização Exemplo
        note:
          type: string
          description: 'Observação unidade filha. Valores aceitos: varchar(3800)<br><br>'
          maxLength: 3800
          example: Observação Exemplo
    RealEstateUnitGroupingDocument:
      description: Lista de agrupamentos da unidade.
      type: array
      items:
        $ref: '#/components/schemas/RealEstateUnitGroupingItemDocument'
      example:
        - groupingDescription: Agrupador Exemplo
          valueGroupingDescription: Valor Exemplo
    GetAllUnitCharacteristicsResponseDocument:
      description: Documento de resposta para listagem de características de unidade.
      required:
        - resultSetMetadata
        - results
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: >-
            Lista de características de unidade retornadas como resultado da
            pesquisa
          items:
            $ref: '#/components/schemas/RealEstateUnitCharacteristicGetDocument'
          example:
            - id: 1
              description: Característica da unidade
            - id: 2
              description: Característica da unidade
    RealEstateUnitCharacteristicInsertDocument:
      description: Schema para inserção de uma nova característica de unidade.
      required:
        - description
      type: object
      properties:
        description:
          type: string
          description: Característica da unidade.
          example: Unidade com piscina
    RealEstateUnitCharacteristicUpdateDocument:
      type: array
      description: Características para vincular a uma unidade.
      items:
        $ref: '#/components/schemas/RealEstateUnitCharacteristicDocument'
    GetAllUnitSituationResponseDocument:
      description: Documento de resposta para listagem de situações de unidade.
      required:
        - resultSetMetadata
        - results
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de situações de unidade retornadas como resultado da pesquisa
          items:
            $ref: '#/components/schemas/RealEstateUnitSituationGetDocument'
          example:
            - id: 1
              description: Situação ativa
            - id: 2
              description: Situação inativa
    RealEstateUnitSituationInsertDocument:
      description: Schema para inserção de uma nova situação de unidade.
      required:
        - description
      type: object
      properties:
        description:
          type: string
          description: Descrição da situação da unidade.
          example: Situação da unidade
    RealEstateUnitAddressDocument:
      description: Schema para atualização de endereço da unidade imobiliária.
      allOf:
        - $ref: '#/components/schemas/UnitAddressDocument'
    GetUnitEvaluationListItem:
      description: Item de avaliação retornado na listagem da unidade.
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int32
              description: Código da avaliação da unidade.
              example: 1
        - $ref: '#/components/schemas/UnitEvaluationBaseDocument'
    UnitEvaluationInsert:
      description: Dados necessários para inserir uma avaliação de unidade.
      allOf:
        - $ref: '#/components/schemas/UnitEvaluationBaseDocument'
        - type: object
          properties:
            evaluationPrice:
              type: number
              minimum: 0
            saleValuePrice:
              type: number
              description: Valor de venda sugerido da unidade.
              example: 170000
    UnitBasicWebhookPayload:
      type: object
      description: Payload básico para webhooks de unidade
      properties:
        unitId:
          type: integer
          description: Código da unidade
          example: 123
      required:
        - unitId
    LocationType:
      type: string
      description: Tipo de localização. U - Urbano e R - Rural.
      enum:
        - U
        - R
      example: U
    FrameworkType:
      type: integer
      description: |-
        Tipo de enquadramento.
          1 - Imóvel residencial novo
          2 - Imóvel residencial usado
          3 - Lote residencial
          4 - Não residencial
      enum:
        - 1
        - 2
        - 3
        - 4
      example: 1
    GetUnitEvaluation:
      description: Detalhes da avaliação associada à unidade.
      allOf:
        - $ref: '#/components/schemas/UnitEvaluationBaseDocument'
    GetUnitAddress:
      description: Endereço associado à unidade imobiliária.
      allOf:
        - $ref: '#/components/schemas/UnitAddressWithCityDocument'
      example:
        cityId: 1
        city: Cidade Exemplo
        streetType: 1
        streetName: Rua Exemplo
        number: '100'
        complement: Apto 101
        neighborhood: Centro
        zipCode: 12345-678
    RealEstateChildUnitsDocument:
      description: Unidade filha vinculada.
      type: object
      properties:
        name:
          type: string
          description: Descrição da unidade filha
          example: Unidade Filha Exemplo
        order:
          type: string
          description: Numeração
          example: '1'
        privateArea:
          type: number
          description: Área privativa
          example: 10
        commonArea:
          type: number
          description: Área comum
          example: 5
        idealFraction:
          type: number
          description: Fração ideal
          example: 0.5
        idealFractionSquareMeter:
          type: number
          description: Fração ideal em m2*
          example: 2.5
      example:
        name: Unidade Filha Exemplo
        order: '1'
        privateArea: 10
        commonArea: 5
        idealFraction: 0.5
        idealFractionSquareMeter: 2.5
        locationName: Localização Exemplo
        note: Observação Exemplo
    RealEstateUnitGroupingItemDocument:
      description: Item de agrupamento da unidade.
      type: object
      properties:
        groupingDescription:
          type: string
          description: Nome do agrupador
          example: Agrupador Exemplo
        valueGroupingDescription:
          type: string
          description: Nome do valor do agrupamento
          example: Valor Exemplo
    RealEstateUnitSpecialValuesDocument:
      description: Valores especiais relacionados à unidade.
      type: object
      properties:
        tablePricesID:
          type: integer
          description: Identificador da tabela de preços.
          example: 1
        indexedQuantity:
          type: number
          description: Quantidade indexada na tabela de preços.
          example: 100
      example:
        tablePricesID: 1
        indexedQuantity: 100
    Links:
      description: Links para acessar outros recursos
      example:
        - href: https://../v1/purchase-..
          rel: Recurso
      items:
        $ref: '#/components/schemas/Link'
      type: array
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
