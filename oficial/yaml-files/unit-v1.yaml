    post:
      tags:
        - Situações para unidade
      summary: Cria uma situação para uso em unidade.
      operationId: insertUnitSituation
      x-section: Situações para unidade
      x-original-file: unit-v1.yaml
      x-audience:
        - public
      requestBody:
        description: Objeto para criação da situação de unidade.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealEstateUnitSituationInsertDocument'
            example:
              description: Situação de unidade exemplo
              active: true
        required: true
      responses:
        '201':
          description: Situação de unidade criada com sucesso
          headers:
            Location:
              description: URL para acessar a situação de unidade criada
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
