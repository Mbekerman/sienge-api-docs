openapi: 3.1.1
info:
  title: Bulk-data Caixas e Bancos
  version: 1.24.0
  description: Bulk data de movimentos de Caixa e Bancos
paths:
  /bank-movement:
    get:
      tags:
        - Bulk-data Caixas e Bancos
      summary: Retorna movimentos financeiros, caso possua
      description: >-
        Operação para buscar movimentos financeiros de caixa e bancos em modo
        bulk data.

        Permite filtrar por período (data inicial e final), tipo de seleção de
        data (movimentação ou competência),

        empresa, centros de custo, obras e a opção de retornar apenas movimentos
        avulsos.

        Retorna todos os movimentos que atendem aos filtros informados; se não
        houver resultados,

        retorna um array vazio. (BULK)
      operationId: getBankMovements
      parameters:
        - $ref: '#/components/parameters/StartDateQueryRequired'
        - $ref: '#/components/parameters/EndDateQueryRequired'
        - name: selectionType
          in: query
          description: >-
            Seleção da data do período. Para filtrar por data de movimentação
            bancária (M), data de competência da parcela (B). Por padrão ao não
            enviar nenhum valor será filtrado por data de movimentação bancária.
            Se filtrado por data de competência da parcela, não serão
            apresentados movimentos que não tenham títulos vinculados.
          required: false
          schema:
            type: string
            enum:
              - M
              - B
            example: M
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/CostCentersId'
        - name: onlyDetachedMovement
          in: query
          description: >-
            Seleção de movimentos avulsos. Se vazio ou preenchido como 'N',
            serão retornados todos os movimentos. Se preenchido como 'S', serão
            retornados apenas movimentos de caixa e banco avulsos.
          required: false
          schema:
            type: string
            enum:
              - 'N'
              - S
            example: 'N'
        - $ref: '#/components/parameters/BuildingIdQuery'
        - $ref: '#/components/parameters/BuildingUnitId'
        - $ref: '#/components/parameters/CostEstimationSheetId'
      responses:
        '200':
          description: Movimentos financeiros encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseBulkDataBankMovement'
              examples:
                exemplo:
                  value:
                    data:
                      - bankMovementId: 0
                        billId: 0
                        installmentId: 0
                        bankMovementAmount: 0
                        documentIdentificationId: string
                        documentIdentificationName: string
                        documentIdentificationNumber: string
                        bankMovementOriginId: string
                        bankMovementHistoricId: string
                        bankMovementHistoricName: string
                        bankMovementOperationId: 0
                        bankMovementOperationName: string
                        bankMovementOperationType: string
                        bankMovementReconcile: string
                        bankMovementDate: '2018-01-01'
                        billDate: '2018-01-01'
                        accountNumber: string
                        companyId: 0
                        companyName: string
                        groupCompanyId: 0
                        groupCompanyName: string
                        holdingId: 0
                        holdingName: string
                        subsidiaryId: 0
                        subsidiaryName: string
                        creditorId: 0
                        creditorName: string
                        clientId: 0
                        clientName: Cliente Exemplo
                        financialCategories:
                          - companyId: 0
                            companyName: string
                            costCenterId: 0
                            costCenterName: string
                            financialCategoryId: string
                            financialCategoryName: string
                            financialCategoryReducer: string
                            financialCategoryType: string
                            financialCategoryRate: 0
                            businessAreaId: 0
                            businessAreaName: string
                            projectId: 0
                            projectName: string
                            businessTypeId: 0
                            businessTypeName: string
                            groupCompanyId: 0
                            groupCompanyName: string
                            holdingId: 0
                            holdingName: string
                            subsidiaryId: 0
                            subsidiaryName: string
                        departamentCosts:
                          - id: 0
                            name: string
                            rate: 0
                        buldingCosts:
                          - buildingId: 0
                            name: string
                            buildingUnitId: 0
                            buildingUnitName: string
                            costEstimationSheetId: string
                            costEstimationSheetName: string
                            rate: 0
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-audience:
        - public
  /bank-movement/by-movements:
    get:
      tags:
        - Bulk-data Caixas e Bancos
      summary: Retorna movimentos financeiros, caso possua.
      operationId: getBankMovementsByIds
      parameters:
        - name: movementsIds
          in: query
          description: Códigos das movimentações a serem consultadas no Sienge.
          required: true
          schema:
            type: array
            example:
              - 1
            items:
              type: integer
              example: 1
      responses:
        '200':
          description: Movimentos financeiros encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseBulkDataBankMovement'
              examples:
                exemplo:
                  value:
                    data:
                      - bankMovementId: 0
                        billId: 0
                        installmentId: 0
                        bankMovementAmount: 0
                        documentIdentificationId: string
                        documentIdentificationName: string
                        documentIdentificationNumber: string
                        bankMovementOriginId: string
                        bankMovementHistoricId: string
                        bankMovementHistoricName: string
                        bankMovementOperationId: 0
                        bankMovementOperationName: string
                        bankMovementOperationType: string
                        bankMovementReconcile: string
                        bankMovementDate: '2018-01-01'
                        billDate: '2018-01-01'
                        accountNumber: string
                        companyId: 0
                        companyName: string
                        groupCompanyId: 0
                        groupCompanyName: string
                        holdingId: 0
                        holdingName: string
                        subsidiaryId: 0
                        subsidiaryName: string
                        creditorId: 0
                        creditorName: string
                        clientId: 0
                        clientName: string
                        financialCategories:
                          - companyId: 0
                            companyName: string
                            costCenterId: 0
                            costCenterName: string
                            financialCategoryId: string
                            financialCategoryName: string
                            financialCategoryReducer: string
                            financialCategoryType: string
                            financialCategoryRate: 0
                            businessAreaId: 0
                            businessAreaName: string
                            projectId: 0
                            projectName: string
                            businessTypeId: 0
                            businessTypeName: string
                            groupCompanyId: 0
                            groupCompanyName: string
                            holdingId: 0
                            holdingName: string
                            subsidiaryId: 0
                            subsidiaryName: string
                        departamentCosts:
                          - id: 0
                            name: string
                            rate: 0
                        buldingCosts:
                          - buildingId: 0
                            name: string
                            buildingUnitId: 0
                            buildingUnitName: string
                            costEstimationSheetId: string
                            costEstimationSheetName: string
                            rate: 0
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Retorna a lista de Movimentos financeiros (BULK)
      x-audience:
        - public
components:
  schemas:
    GetResponseBulkDataBankMovement:
      type: object
      description: Movimentos financeiros
      properties:
        data:
          type: array
          example:
            - bankMovementId: 1
              billId: 100
              installmentId: 10
              bankMovementAmount: 1000
              documentIdentificationId: DOC123
              documentIdentificationName: Nota Fiscal
              documentIdentificationNumber: NF-001
          description: Lista de movimentos financeiros
          items:
            $ref: '#/components/schemas/BankMovement'
      example:
        data:
          - bankMovementId: 1
            billId: 100
            installmentId: 10
            bankMovementAmount: 1000
            documentIdentificationId: DOC123
            documentIdentificationName: Nota Fiscal
            documentIdentificationNumber: NF-001
            bankMovementOriginId: ORI01
            bankMovementHistoricId: HIST01
            bankMovementHistoricName: Pagamento
            bankMovementOperationId: 2
            bankMovementOperationName: Transferência
            bankMovementOperationType: Crédito
            bankMovementReconcile: Sim
            bankMovementDate: '2018-01-01'
            billDate: '2018-01-01'
            accountNumber: 12345-6
            companyId: 123
            companyName: Empresa Exemplo
            groupCompanyId: 1
            groupCompanyName: Grupo Exemplo
            holdingId: 1
            holdingName: Holding Exemplo
            subsidiaryId: 1
            subsidiaryName: Subsidiária Exemplo
            creditorId: 11
            creditorName: Fornecedor Exemplo
            clientId: 22
            clientName: Cliente Exemplo
            financialCategories: []
            departamentCosts: []
            buldingCosts: []
    BankMovementWebhookPayload:
      description: Payload do webhook de movimento bancário
      type: object
      required:
        - bankMovementId
      properties:
        bankMovementId:
          description: Código do movimento bancário
          example: 1
          format: int32
          type: integer
    BankMovement:
      type: object
      description: Movimento financeiro
      properties:
        bankMovementId:
          description: Código do movimento bancário
          example: 1
          format: int32
          type: integer
        billId:
          description: Identificador do título no Sienge
          example: 5000
          format: int32
          type: integer
        installmentId:
          description: Número da parcela
          example: 1
          format: int32
          type: integer
        bankMovementAmount:
          description: Valor do movimento
          example: 1000
          format: double
          type: number
        documentIdentificationId:
          description: Código do documento
          example: NF | AV
          type: string
        documentIdentificationName:
          description: Nome do documento
          example: Nota Fiscal
          type: string
        documentIdentificationNumber:
          description: Número do documento
          example: NF-001
          type: string
        bankMovementOriginId:
          type: string
          description: Código da Origem do Movimento
          example: ORI01
        bankMovementHistoricId:
          type: string
          description: Código do histórico
          example: HIST01
        bankMovementHistoricName:
          type: string
          description: Nome do histórico
          example: Pagamento
        bankMovementOperationId:
          description: Código da operação
          example: 123
          format: int32
          type: integer
        bankMovementOperationName:
          type: string
          description: Nome da operação
          example: Transferência
        bankMovementOperationType:
          type: string
          description: Tipo da operação
          example: Crédito
        bankMovementReconcile:
          type: string
          description: Conciliado
          example: Sim
        bankMovementDate:
          type: string
          format: date
          description: Data da movimentação
          example: '2018-01-01'
        billDate:
          type: string
          format: date
          description: Data de competência da parcela vinculada à movimentação
          example: '2018-01-01'
        accountNumber:
          description: Número da conta corrente
          example: 1234-5
          type: string
        companyId:
          description: Código da empresa
          example: 123
          format: int32
          type: integer
        companyName:
          description: Nome da empresa
          example: Nome da empresa
          type: string
        groupCompanyId:
          type: integer
          description: Código do grupo empresa.
          example: 1
        groupCompanyName:
          type: string
          description: Nome do grupo empresa.
          example: Grupo Exemplo
        holdingId:
          description: Código da holding
          example: 123
          format: int32
          type: integer
        holdingName:
          description: Nome da holding
          example: Holding Exemplo
          type: string
        subsidiaryId:
          type: integer
          description: Código da Subsidiária
          example: 1
        subsidiaryName:
          type: string
          description: Nome da Subsidiária
          example: Subsidiária Exemplo
        creditorId:
          description: Código do credor
          example: 123
          format: int32
          type: integer
        creditorName:
          description: Nome do credor
          example: Credor Exemplo
          type: string
        clientId:
          description: Código do cliente
          example: 123
          format: int32
          type: integer
        clientName:
          description: Nome do cliente
          example: Nome do cliente
          type: string
        financialCategories:
          allOf:
            - $ref: >-
                #/components/schemas/BankMovementFinancialAppropriationDescription
            - type: array
              items:
                $ref: '#/components/schemas/FinancialCategory'
        departamentCosts:
          type: array
          description: Apropriação de departamento
          items:
            $ref: '#/components/schemas/DepartamentCosts'
        buldingCosts:
          type: array
          description: Apropriação de obra
          items:
            $ref: '#/components/schemas/BuldingCost'
    BankMovementFinancialAppropriationDescription:
      description: Apropriação financeira do movimento
    FinancialCategory:
      type: object
      description: Plano financeiro
      properties:
        companyId:
          description: Código da empresa
          example: 123
          format: int32
          type: integer
        companyName:
          description: Nome da empresa
          example: Nome da empresa
          type: string
        costCenterId:
          description: Código do centro de custo
          example: 123
          format: int32
          type: integer
        costCenterName:
          description: Nome do centro de custo
          example: Centro de Custo Exemplo
          type: string
        financialCategoryId:
          description: Código do plano financeiro
          example: '2010101'
          type: string
        financialCategoryName:
          description: Descrição do plano financeiro
          example: Descrição do plano financeiro
          type: string
        financialCategoryReducer:
          description: Indica se é plano financeiro redutor
          example: S
          type: string
        financialCategoryType:
          description: Indica plano financeiro de receita ou despesa (R/D)
          example: R
          type: string
        financialCategoryRate:
          description: Percentual de apropriação
          example: 100
          format: double
          type: number
        businessAreaId:
          description: Código da área de negócio
          example: 123
          format: int32
          type: integer
        businessAreaName:
          description: Nome da área de negócio
          example: Área de Negócio Exemplo
          type: string
        projectId:
          description: Código do projeto
          example: 123
          format: int32
          type: integer
        projectName:
          description: Nome do projeto
          example: Projeto Exemplo
          type: string
        businessTypeId:
          type: integer
          description: Código do tipo de negócio do centro de custo da apropriação
          example: 3
        businessTypeName:
          type: string
          description: Nome do tipo de negócio do centro de custo da apropriação
          example: Tipo de Negócio Exemplo
        groupCompanyId:
          type: integer
          description: Código do grupo de empresa da conta corrente
          example: 1
        groupCompanyName:
          type: string
          description: Nome do grupo de empresa da conta corrente
          example: Grupo Exemplo
        holdingId:
          description: Código da holding
          example: 123
          format: int32
          type: integer
        holdingName:
          description: Nome da holding
          example: Holding Exemplo
          type: string
        subsidiaryId:
          type: integer
          description: Código da subsidiária da empresa da conta corrente
          example: 1
        subsidiaryName:
          type: string
          description: Nome da subsidiária da empresa da conta corrente
          example: Subsidiária Exemplo
    DepartamentCosts:
      type: object
      description: Apropriação de departamento.
      properties:
        id:
          description: Código do departamento
          example: 123
          format: int32
          type: integer
        name:
          description: Nome do departamento
          example: Departamento Exemplo
          type: string
        rate:
          description: Percentual de apropriação
          example: 100
          format: double
          type: number
    BuldingCost:
      type: object
      description: Apropriação de obra.
      properties:
        buildingId:
          description: Código da obra
          example: 100
          format: int32
          minimum: 0
          type: integer
        name:
          description: Nome da obra
          example: Obra Exemplo
          type: string
        buildingUnitId:
          description: Código da unidade construtiva
          example: 123
          format: int32
          type: integer
        buildingUnitName:
          description: Nome da Unidade Construtiva.
          example: Unidade Exemplo
          type: string
        costEstimationSheetId:
          description: Código do item de orçamento
          example: CE01
          type: string
        costEstimationSheetName:
          description: Nome do item de orçamento
          example: Item Orçamento Exemplo
          type: string
        rate:
          description: Percentual de apropriação
          example: 100
          format: double
          type: number
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    StartDateQueryRequired:
      description: Data inicial para filtro de período
      in: query
      name: startDate
      required: true
      schema:
        example: '2023-01-01'
        format: date
        type: string
    EndDateQueryRequired:
      description: Data final para filtro de período
      in: query
      name: endDate
      required: true
      schema:
        example: '2023-01-31'
        format: date
        type: string
    CompanyIdQuery:
      description: Código da empresa (opcional)
      in: query
      name: companyId
      required: false
      schema:
        example: 1
        type: integer
    CostCentersId:
      description: Códigos de centro de custo cadastrados no Sienge
      in: query
      name: costCentersId
      required: false
      schema:
        example:
          - 123
          - 456
        items:
          example: 456
          type: integer
        type: array
    BuildingIdQuery:
      description: Código da obra (opcional)
      in: query
      name: buildingId
      required: false
      schema:
        example: 123
        format: int32
        type: integer
    BuildingUnitId:
      description: Código da Unidade Construtiva
      in: query
      name: buildingUnitId
      required: false
      schema:
        example: 1
        type: integer
    CostEstimationSheetId:
      description: Código do item de orçamento
      in: query
      name: costEstimationSheetId
      required: false
      schema:
        example: 001.001.001.001
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/bulk-data/v1
webhooks:
  BANK_MOVEMENT_CREATED:
    post:
      tags:
        - Webhooks - Bulk-data Caixas e Bancos
      operationId: webhookBankMovementCreated
      summary: Webhook de movimento bancário criado
      description: Webhook disparado sempre que um movimento bancário é criado
      requestBody:
        description: JSON com os dados do movimento bancário criado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankMovementWebhookPayload'
      responses:
        2XX:
          description: O evento BANK_MOVEMENT_CREATED foi recebido com sucesso
      x-audience:
        - public
  BANK_MOVEMENT_UPDATED:
    post:
      tags:
        - Webhooks - Bulk-data Caixas e Bancos
      operationId: webhookBankMovementUpdated
      summary: Webhook de movimento bancário atualizado
      description: Webhook disparado sempre que um movimento bancário é atualizado
      requestBody:
        description: JSON com os dados do movimento bancário atualizado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankMovementWebhookPayload'
      responses:
