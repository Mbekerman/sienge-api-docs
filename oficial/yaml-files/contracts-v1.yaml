  /supply-contracts/items/purchase-requests:
    get:
      operationId: getSupplyContractsItemsPurchaseRequests
      tags:
        - Contratos de Suprimentos
      summary: Itens de Solicitação atendidas.
      description: >-
        Retorna a lista de Solicitações de Compra vinculadas a um Item
        específico de um Contrato de Suprimentos, agrupadas por Solicitação,
        Item de Solicitação e Categoria, com a soma da quantidade atendida de
        cada agrupamento. (REST)
      parameters:
        - $ref: '#/components/parameters/RequiredDocumentId'
        - $ref: '#/components/parameters/RequiredContractNumber'
        - $ref: '#/components/parameters/RequiredBuildingId'
        - name: buildingUnitId
          in: query
          description: >-
            Código da Unidade Construtiva da Obra vinculada ao Contrato de
            Suprimentos.
          required: true
          schema:
            description: Código da unidade construtiva
            example: 123
            format: int32
            type: integer
        - name: itemNumber
          in: query
          description: Número do Item do Contrato de Suprimentos.
          required: true
          schema:
            type: integer
            format: int32
        - $ref: '#/components/parameters/Limit'
          description: >-
            Quantidade máxima de resultados a serem retornados. Valor default é
            100 e o valor máximo permitido é 200.
        - $ref: '#/components/parameters/Offset'
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default é 0.
      responses:
        '200':
          description: Operação bem sucedida.
          content:
            application/json:
              example:
                resultSetMetadata:
                  count: 1
                  offset: 0
                  limit: 100
                results:
                  - purchaseRequestId: 10
                    purchaseRequestItemId: 1
                    categoryId: 5
                    attendedQuantity: 2.5
              schema:
                type: object
                required:
                  - resultSetMetadata
                  - results
                properties:
                  resultSetMetadata:
                    $ref: '#/components/schemas/ResultSetMetadata'
                  results:
                    type: array
                    description: >-
                      Lista de Solicitações de Compra de origem do Item do
                      Contrato de Suprimentos.
                    example:
                      - purchaseRequestId: 10
                        purchaseRequestItemId: 1
                        categoryId: 5
                        attendedQuantity: 2.5
                    items:
                      $ref: '#/components/schemas/PurchaseRequestOrigemDto'
        '400':
          $ref: '#/components/responses/400'
