openapi: 3.1.1
info:
  title: Contratos de Suprimentos
  version: 1.24.0
  description: APIs para Contratos de Suprimentos
paths:
  /supply-contracts:
    get:
      operationId: getSupplyContracts
      x-section: Contratos
      summary: Consultar contrato
      x-implementation:
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/contract/getcontract/SupplyContractController.java
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.contract.getcontract.SupplyContractController
        method: getContractById
      x-original-file: contracts-v1.yaml
      x-audience:
        - public
      description: >-
        Retorna os dados do contrato filtrado pelos parâmetros informados.
        (REST)
      tags:
        - Contratos
      parameters:
        - $ref: '#/components/parameters/RequiredDocumentId'
        - $ref: '#/components/parameters/RequiredContractNumber'
      responses:
        '200':
          description: Um contrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContractDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /supply-contracts/all:
    get:
      operationId: getSupplyContractsAll
      x-section: Contratos
      summary: Consulta lista de contratos
      x-implementation:
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/contract/getcontract/SupplyContractController.java
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.contract.getcontract.SupplyContractController
        method: getContracts
      x-original-file: contracts-v1.yaml
      x-audience:
        - public
      description: >-
        Retorna lista paginada de contratos no período informado e filtros
        opcionais. (REST)
      tags:
        - Contratos
      parameters:
        - name: contractStartDate
          in: query
          description: >
            Limite inferior para o valor de "data do contrato" dos contratos a
            serem retornados. Contratos cuja "data do contrato" seja menor que o
            limite inferior não serão retornados.


            Formato: `yyyy-MM-dd`
          required: true
          schema:
            description: Data do contrato
            type: string
            format: date
            example: '2018-03-11'
          example: '2022-01-01'
        - name: contractEndDate
          in: query
          description: >
            Limite superior para o valor de "data do contrato" dos contratos a
            serem retornados. Contratos cuja "data do contrato" seja maior que o
            limite superior não serão retornados.


            Formato: `yyyy-MM-dd`
          required: true
          schema:
            description: Data do contrato
            type: string
            format: date
            example: '2018-03-11'
          example: '2022-01-31'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/BuildingId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/statusApproval'
        - $ref: '#/components/parameters/authorization'
        - $ref: '#/components/parameters/consistency'
      responses:
        '200':
          description: Uma lista de contratos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationResultContractDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /supply-contracts/attachments:
    get:
      operationId: getSupplyContractsAttachments
      x-section: Anexos do Contrato
      summary: Retorna o anexo do contrato
      x-implementations:
        - source: >-
            sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/contract/contractattachment/FindSupplyContractAttachmentContentFileController.java
          name: >-
            br.com.softplan.unic.contract.measurement.v1.controller.contract.contractattachment.FindSupplyContractAttachmentContentFileController
          method: download
        - source: >-
            sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/contract/contractattachment/FindSupplyContractAttachmentContentFileController.java
          name: >-
            br.com.softplan.unic.contract.measurement.v1.controller.contract.contractattachment.FindSupplyContractAttachmentContentFileController
          method: downloadBase64
      x-original-file: contracts-v1.yaml
      x-audience:
        - public
      description: >-
        Retorna o arquivo de anexo do contrato de suprimentos especificado.
        (REST)
      tags:
        - Anexos do Contrato
      parameters:
        - $ref: '#/components/parameters/RequiredDocumentId'
        - $ref: '#/components/parameters/RequiredContractNumber'
        - $ref: '#/components/parameters/contractAttachmentNumber'
      responses:
        '200':
          description: >
            Quando utilizada chamada padrão, retorna o anexo.<br/>

            Quando definir no header Accept como `text/plain`, retorna o anexo
            no formato base64
          content:
            application/octet-stream:
              schema:
                format: binary
              example: <binary>
            text/plain:
              schema: {}
              example: VGhpcyBpcyBhIGJhc2U2NC1lbmNvZGVkIGFyY2hpdmUu
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    post:
      operationId: postSupplyContractsAttachments
      x-section: Anexos do Contrato
      summary: Inclui anexo do contrato
      x-implementation:
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/contract/contractattachment/SupplyContractAttachmentController.java
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.contract.contractattachment.SupplyContractAttachmentController
        method: create
      x-original-file: contracts-v1.yaml
      x-audience:
        - public
      description: >-
        Recebe um arquivo e descrição e cria um anexo associado ao contrato
        especificado. (REST)
      tags:
        - Anexos do Contrato
      parameters:
        - $ref: '#/components/parameters/RequiredDocumentId'
        - $ref: '#/components/parameters/RequiredContractNumber'
        - $ref: '#/components/parameters/description'
      requestBody:
        description: Deve enviar no body da requisição o arquivo a ser inserido
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  description: >
                    Arquivo para inserção

                    Tamanho máximo: 70 MB<br/>

                    Tamanho máximo do nome do arquivo: 100 caracteres<br/>

                    Somente 1 anexo por requisição. Caso envie mais de 1,
                    somente o primeiro será aceito.
                  example: <binary>
      responses:
        '201':
          description: Anexo de contrato inserido com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
