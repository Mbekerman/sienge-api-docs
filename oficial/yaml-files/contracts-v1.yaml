        Disparado quando um contrato é totalmente autorizado (sem autorizações
        pendentes).
      requestBody:
        description: JSON com os identificadores do contrato autorizado
        content:
          application/json:
            schema:
              type: object
              required:
                - documentId
                - contractNumber
                - consistent
              properties:
                documentId:
                  description: Código do documento.
                  example: CT
                  type: string
                contractNumber:
                  description: Número do contrato.
                  example: '1234'
                  type: string
                consistent:
                  description: Flag de consistência do contrato
                  type: boolean
                  example: true
      responses:
        2XX:
          description: O evento CONTRACT_AUTHORIZED foi recebido com sucesso
      x-audience:
        - public
  CONTRACT_UNAUTHORIZED:
    post:
      tags:
        - Webhooks - Contratos de Suprimentos
      operationId: webhookContractUnauthorized
      summary: Webhook de contrato desautorizado
      description: >-
        Disparado quando um contrato é desautorizado ou tem sua consistência
        alterada enquanto estiver desautorizado.
      requestBody:
        description: JSON com os identificadores do contrato desautorizado
        content:
          application/json:
            schema:
              type: object
              required:
                - documentId
                - contractNumber
                - consistent
                - disapproved
              properties:
                documentId:
                  description: Código do documento.
                  example: CT
                  type: string
                contractNumber:
                  description: Número do contrato.
                  example: '1234'
                  type: string
                consistent:
                  description: Indica se o contrato está consistente
                  type: boolean
                  example: false
                disapproved:
                  description: Indica se o contrato está reprovado
                  type: boolean
                  example: false
      responses:
        2XX:
          description: O evento CONTRACT_UNAUTHORIZED foi recebido com sucesso
      x-audience:
        - public
