components:
  schemas:
    GetContractDTO:
      description: Objeto contendo os dados do Contrato especificado.
      allOf:
        - $ref: '#/components/schemas/CommonContractDTO'
        - type: object
          properties:
            laborBalance:
              description: Saldo dos valores de mão de obra das obras associadas
              type: number
              example: 1200.15
            materialBalance:
              description: Saldo dos valores de material das obras associadas
              type: number
              example: 1100.25
            securityDeposit:
              $ref: '#/components/schemas/SecurityDepositDTO'
      example:
        companyId: 57
        consistent: false
        contractDate: '2018-03-11'
        contractNumber: '1234'
        contractType: CONTRACTOR
        customerId: 123
        documentId: CT
        endDate: '2020-05-13'
        internalNotes: Uma observação do contrato
        isAuthorized: false
        itemType: RESOURCE
        links:
          - href: https://<tenant>.sienge.com.br/v1/customers/<costumerId>
            rel: customer
        object: Contrato de prestação de serviços para execução de alvenarias.
        registrationType: COMPLETE
        responsibleId: NOME
        responsibleName: NOME SOBRENOME
        startDate: '2019-04-12'
        status: PENDING
        statusApproval: APPROVED
        supplierId: 123
        totalLaborValue: 1455.15
        totalMaterialValue: 1155.15
        priceAgreementId: 1
        priceAgreementVersion: 1
        contractTemplateId: 1
        contractTemplateName: Contrato de prestação de serviços
        disapprovalReason:
          - valor total do contrato excede o limite permitido para o usuário
          - >-
            quantidade já apropriada juntamente com a quantidade contratada está
            acima da quantidade orçada para algum insumo do contrato
          - preço está acima do preço autorizado para algum insumo
          - manutenção de aditivos de contratos
          - valor comprometido excedeu o valor orçado em alguma apropriação
        currentAuthorizationLevel: FIRST_LEVEL
        laborBalance: 1200.15
        materialBalance: 1100.25
        securityDeposit:
          billIssueDate: DUE_DATE
          considerContractItemPaymentCategories: true
          documentId: CAU
          dueDate: '2018-03-11'
          hasDirectBillingDiscount: true
          hasTaxWithhold: true
          incidenceOver: MATERIAL_AND_LABOUR
          indexerId: 4
          paymentCategoryId: '2012011'
          securityDepositBalance: 1300.35
          securityDepositPercentage: 12.15
      x-implementation:
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/contract/getcontract/GetContractDTO.java
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.contract.getcontract.GetContractDTO
    PaginationResultContractDTO:
