    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    PurchaseRequestOrigemDto:
      description: Dados Solicitação de Compras
      properties:
        attendedQuantity:
          description: >-
            Soma da quantidade atendida para a combinação de Solicitação, Item
            de Solicitação e Categoria.
          example: 2.5
          format: double
          type: number
        categoryId:
          description: >-
            Código da Categoria da Solicitação de Compra. Pode ser nulo quando a
            Solicitação não possui Categoria associada.
          example: 5
          format: int32
          nullable: true
          type: integer
        purchaseRequestId:
          description: Número da Solicitação de Compra de origem.
          example: 10
          format: int32
          type: integer
        purchaseRequestItemId:
          description: Número do Item da Solicitação de Compra de origem.
          example: 1
          format: int32
          type: integer
      type: object
    CommonContractDTO:
      description: Objeto contendo dados comuns do Contrato
      type: object
      properties:
        companyId:
          description: Código da empresa
          example: 123
          format: int32
          type: integer
        consistent:
          description: >-
            Retornará `true` se o contrato estiver consistente, caso contrário
            retornará `false`.
          type: boolean
          example: false
        contractDate:
          description: Data do contrato
          type: string
          format: date
          example: '2018-03-11'
        contractNumber:
          description: Número do contrato.
          example: '1234'
          type: string
        contractType:
          description: |
            Código da situação do contrato
            - CONTRACTOR - Contratante
            - CONTRACTED - Contratado
          type: string
          enum:
            - CONTRACTOR
            - CONTRACTED
          example: CONTRACTOR
        customerId:
          description: Identificador do cliente.
          type: integer
          example: 123
        documentId:
          description: Código do documento.
          example: CT
          type: string
        endDate:
          description: Data de término do contrato
          type: string
          format: date
          example: '2020-05-13'
        internalNotes:
          description: Observações internas do contrato
          type: string
          example: Uma observação do contrato
        isAuthorized:
          description: >-
            Retornará `true` se o contrato estiver autorizado, caso contrário
            retornará `false`.
          type: boolean
          example: false
        itemType:
          description: |
            Tipo de item do contrato, podendo ser de Insumo ou de Serviço
            - `RESOURCE` - Insumo
            - `WORKITEM` - Serviço
          type: string
          enum:
            - RESOURCE
            - WORKITEM
          example: RESOURCE
        links:
          description: Links para acesso a outros recursos
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        object:
          description: Objeto do contrato
          type: string
          example: Contrato de prestação de serviços para execução de alvenarias.
        registrationType:
          description: >
            Tipo de cadastro atual do contrato, podendo ser completo ou rápido.

            Um contrato rápido que foi convertido para completo será apresentado
            apenas como contrato completo

            - `COMPLETE` - Contrato completo

            - `FAST` - Contrato rápido
          type: string
          enum:
            - COMPLETE
            - FAST
          example: COMPLETE
        responsibleId:
          description: Identificador do responsável pelo contrato
          type: string
          example: NOME
        responsibleName:
          description: Nome do responsável pelo contrato
          type: string
          example: NOME SOBRENOME
        startDate:
          description: Data de início do contrato
          type: string
          format: date
          example: '2019-04-12'
        status:
          $ref: '#/components/schemas/ContractStatus'
        statusApproval:
          description: >
            Código da situação de aprovação do contrato. Todo contrato nasce com
            situação *APPROVED* e somente será alterado para *DISAPPROVED* se
            for reprovado.

            - `APPROVED` - Aprovado

            - `DISAPPROVED` - Reprovado
          type: string
          enum:
            - APPROVED
            - DISAPPROVED
          example: APPROVED
        supplierId:
          description: Identificador do fornecedor.
          type: integer
          format: int32
          example: 123
        totalLaborValue:
          description: Soma dos totais de mão de obra das obras associadas
          type: number
          example: 1455.15
        totalMaterialValue:
          description: Soma dos totais de material das obras associadas
          type: number
          example: 1155.15
        priceAgreementId:
          type: integer
          format: int32
          example: 1
          description: Número do acordo de preços
        priceAgreementVersion:
          type: integer
          format: int32
          example: 1
          description: Versão do acordo de preços
        contractTemplateId:
          type: integer
          format: int32
          example: 1
          description: Código do tipo de contrato
        contractTemplateName:
          type: string
          example: Contrato de prestação de serviços
          description: Descrição do tipo de contrato
        disapprovalReason:
          type: array
          description: Lista contendo motivos de autorização do contrato
          items:
            type: string
        currentAuthorizationLevel:
          type: string
          description: >-
            Alçada atual do contrato. [ADDENDUM, FIRST_LEVEL, SECOND_LEVEL,
            THIRD_LEVEL, FINAL_APPROVAL, NONE]. Caso a empresa não utilize
            controle de alçadas, contratos pendentes da ‘alçada única’ serão
            considerados como pendentes de FIRST_LEVEL
          example: FIRST_LEVEL
          enum:
            - ADDENDUM
            - FIRST_LEVEL
            - SECOND_LEVEL
            - THIRD_LEVEL
            - FINAL_APPROVAL
            - NONE
    SecurityDepositDTO:
