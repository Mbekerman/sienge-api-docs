            billingBrokerId:
              type: integer
              description: Código do corretor de faturamento.
              example: 456
            billingBrokerName:
              type: string
              description: Nome do corretor de faturamento.
              example: Maria Santos
            billWasPaid:
              type: boolean
              description: Retorna se o título do corretor foi paga.
              example: false
            billId:
              type: integer
              description: Número do título a pagar gerado para este corretor.
              format: int32
              example: 789
            name:
              type: string
              description: Nome completo do corretor vinculado.
              example: João Silva
            percentage:
              type: number
              description: Porcentagem de participação do valor base. Formato -> 35.00
              example: 35
            value:
              type: number
              description: Valor total da parcela. Formato -> 28000.00
              example: 28000
            firstPayment:
              type: string
              description: >-
                Data do primeiro vencimento da parcela. Formato YYYY-MM-DD.
                Exemplo -> 1990-12-25.
              example: '2025-01-15'
            installmentNumbers:
              type: number
              description: Total de parcelas.
              example: 12
            indexerId:
              type: number
              description: Indexador da parcela.
              example: 1
            baseDate:
              type: string
              description: >-
                Data base do indexador da parcela. Formato YYYY-MM-DD. Exemplo
                -> 1990-12-25.
              example: '2025-01-01'
            documentNumber:
              type: string
              description: Número do documento.
              example: DOC-456
            documentId:
              description: Código do documento
              example: NF | AV
              type: string
            installments:
              type: array
              description: Lista de parcelas de uma comissão.
              items:
                $ref: '#/components/schemas/CommissionBrokerInstallmentsDocument'
    CommissionReleaseCompositionDocument:
