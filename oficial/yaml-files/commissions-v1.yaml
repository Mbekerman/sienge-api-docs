    CommissionBrokerInsertDocument:
      description: >-
        Estrutura para criação de um corretor vinculado a uma comissão,
        incluindo dados obrigatórios para cálculo, identificação e
        personalização de parcelas.
      required:
        - baseDate
        - firstPayment
        - id
        - indexerId
        - installmentsNumber
        - percentage
        - value
      allOf:
        - $ref: '#/components/schemas/BuildAppropriationWriteDocument'
        - type: object
          properties:
            id:
              type: integer
              description: Código do corretor a ser vinculado à comissão.
              format: int32
              example: 123
            percentage:
              type: number
              description: Porcentagem de comissão. Formato -> 12.00
              example: 12
            value:
              type: number
              description: Valor da comissão. Formato -> 1200.00
              example: 1200
            firstPayment:
              type: string
              description: Primeiro vencimento. Formato YYYY-MM-DD. Exemplo -> 1990-12-31.
              example: '2025-01-31'
            baseDate:
              type: string
              description: Data base. Formato YYYY-MM-DD. Exemplo -> 1990-12-25.
              example: '2025-01-01'
            installmentsNumber:
              maximum: 200
              minimum: 1
              type: integer
              description: Número de parcelas a serem geradas.
              format: int32
              example: 12
            indexerId:
              type: integer
              description: Código do indexador a ser vinculado à comissão.
              format: int32
              example: 1
            documentNumber:
              type: string
              description: >
                Número do documento.

                Este campo só é lido caso a propriedade "released", da comissão,
                seja verdadeiro. Neste caso, este campo se torna obrigatório.
              example: DOC-789
            documentId:
              type: string
              description: >
                Código do documento.

                Este campo só é lido caso a propriedade "released", da comissão,
                seja verdadeiro. Neste caso, este campo se torna obrigatório.
              example: ID-101
            installments:
              type: array
              description: >-
                Parcelas para criação da comissão, utilizado para criação
                personalizada de parcelas. Não obrigatório.
              items:
                required:
                  - dueDate
                  - number
                  - value
                type: object
                properties:
                  number:
                    type: number
                    description: Número da parcela (quando já criada).
                    format: int32
                    example: 1
                  value:
                    type: number
                    description: Valor da parcela da comissão.
                    format: double
                    example: 1000
                  dueDate:
                    type: string
                    description: >-
                      Vencimento da parcela. Formato YYYY-MM-DD. Exemplo ->
                      1990-12-31.
                    example: '2025-01-31'
    CommissionBrokerGetOneDocument:
      description: >-
