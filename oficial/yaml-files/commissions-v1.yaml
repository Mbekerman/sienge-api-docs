openapi: 3.1.1
info:
  title: Comissões
  version: 1.24.0
  description: Consulta e inclusão de comissões.
paths:
  /commissions:
    get:
      x-original-file: commissions-v1.yaml
      x-section: Parcelas das Comissões
      x-audience:
        - public
      tags:
        - Parcelas das Comissões
      summary: Busca as parcelas das comissões.
      operationId: getComissions
      parameters:
        - name: unitId
          in: query
          description: O código do id da unidade.
          schema:
            type: integer
            example: 101
        - name: contractId
          in: query
          description: O número do contrato a ser filtrado
          schema:
            type: integer
            example: 12345
        - name: brokerId
          in: query
          description: O número do corretor a ser filtrado
          schema:
            type: integer
            example: 456
        - name: companyId
          in: query
          description: O número da empresa a ser filtrada
          schema:
            type: integer
            example: 1
        - name: enterpriseId
          in: query
          description: O número do empreendimento a ser filtrado
          schema:
            type: integer
            example: 789
        - name: startingDueDate
          in: query
          description: >
            Data inicial de vencimento para filtrar comissões de acordo com a
            parcela vigente. Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-01-01'
        - name: endingDueDate
          in: query
          description: >
            Data final de vencimento para filtrar comissões de acordo com a
            parcela vigente. Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-12-31'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - name: commissionFilterType
          in: query
          description: |-
            Enums:
              `ALL` - Filtra por todas as comissões.
              `PAID` - Filtra pelas comissões pagas.
              `UNPAID` - Filtra pelas comissões não pagas.
              `AWAITING_RELEASE` - Filtra pelas comissões que estão aguardando liberação.
              `RELEASED` - Filtra pelas comissões liberadas.
          schema:
            type: string
            enum:
              - ALL
              - PAID
              - UNPAID
              - AWAITING_RELEASE
              - RELEASED
            example: ALL
      responses:
        '200':
          description: Parcelas encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionGetDocument'
              examples:
                resultadoBuscaComissoes:
                  summary: Exemplo de resposta de busca de comissões
                  value:
                    count: 1
                    offset: 0
                    limit: 10
                    results:
                      - id: 123
                        salesContractId: 123456
                        firstPayment: '2025-01-01'
                        indexerId: 0
                        installmentsNumber: 5
                        percentage: 50
                        value: 80000
                        baseValue: 80000
                        released: false
                        brokers: []
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Busca as parcelas das comissões por filtro. (REST)
    post:
      tags:
        - Comissão
      summary: Persiste a comissão.
      operationId: insertCommission
      x-section: Comissão
      x-original-file: commissions-v1.yaml
      x-audience:
        - public
      requestBody:
        description: Objeto para criação da comissão
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionInsertDocument'
            example:
              salesContractId: 456
              firstPayment: '2025-01-01'
              id: 123
              indexerId: 0
              installmentsNumber: 5
              percentage: 50
              value: 80000
              baseValue: 80000
              released: false
              brokers:
                - baseDate: '2025-01-01'
                  firstPayment: '2025-01-01'
                  id: 123
                  indexerId: 0
                  installmentsNumber: 5
                  percentage: 50
                  value: 80000
                  documentNumber: '123'
                  documentId: DOC-123
                  departmentId: 1
                  buildingId: 1
                  constructUnitId: 1
                  resourceItem: 1
        required: true
      responses:
        '201':
          description: Comissão criada
          content:
            application/json:
              schema:
                type: integer
                description: Código da comissão gerada.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Persiste uma comissão. (REST)
  /commissions/{commissionId}:
    get:
      x-original-file: commissions-v1.yaml
      x-section: Comissão
      x-audience:
        - public
      tags:
        - Comissão
      summary: Busca uma comissão pelo ID.
      operationId: loadCommission
      parameters:
        - $ref: '#/components/parameters/CommissionId'
      responses:
        '200':
          description: Comissão encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionGetOneDocument'
              example:
                id: 123
                customerId: 456
                enterpriseId: 789
                salesContractId: 101
                salesContractNumber: '123456'
                customerName: João da Silva
                enterpriseName: Residencial Vista Park
                blockEditReason: ''
                blockEdit: false
                baseValue: 180000
                createdDate: '2025-01-01'
                released: true
                brokers:
                  - id: 123
                    billingBrokerId: 456
                    billingBrokerName: Maria Oliveira
                    billWasPaid: false
                    billId: 789
                    name: Maria Oliveira
                    percentage: 35
                    value: 28000
                    firstPayment: '2025-01-01'
                    installmentNumbers: 12
                    indexerId: 789
                    baseDate: '2025-01-01'
                    documentNumber: '12345678901'
                    documentId: '12345678901'
                    nuDaysForReleaseCommission: 1
                    departmentId: 123
                    departmentName: Departamento Comercial
                    buildingId: 123
                    buildingIdKey: 123
                    buildingAppropriationLevel: 4
                    buildingName: Obra Torre A
                    constructUnitId: 456
                    constructUnitName: Unidade Construtiva A
                    resourceItem: 123
                    resourceItemReference: 01.001.001.001
                    resourceItemName: Serviços de Corretagem
                    installments:
                      - number: 1
                        value: 1000
                        dueDate: '2025-01-01'
                      - number: 2
                        value: 1000
                        dueDate: '2025-02-01'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Busca uma comissão por ID. (REST)
    delete:
      x-original-file: commissions-v1.yaml
      x-section: Comissão
      x-audience:
        - public
      tags:
        - Comissão
      summary: Deleta uma comissão pelo ID.
      operationId: deleteCommission
      parameters:
        - $ref: '#/components/parameters/CommissionId'
      responses:
        '204':
          description: Comissão deletada
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Deleta uma comissão por ID. (REST)
    patch:
      tags:
        - Comissão
      summary: Altera uma comissão pelo ID.
      operationId: patchCommission
      x-section: Comissão
      x-original-file: commissions-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/CommissionId'
      requestBody:
        description: Informações para alteração da comissão
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionBrokersPatchDocument'
            example:
              brokers:
                - brokerId: 789
                  percentage: 50
                  baseDate: '2025-01-01'
                  installments:
                    - dueDate: '2025-01-01'
                      number: 1
                      value: 1000
        required: true
      responses:
        '204':
          description: Comissão editada
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Altera uma comissão por ID. (REST)
  /commissions/authorize:
    patch:
      tags:
        - Parcelas das Comissões
      summary: Autoriza, ou desautoriza as parcelas de comissão.
      operationId: authorizationCommissionInstallments
      x-section: Parcelas das Comissões
      x-original-file: commissions-v1.yaml
      x-audience:
        - public
      requestBody:
        description: >-
          Objeto de atualização da situação das parcelas (de "Aguardando
          Autorização" para "Aguardando Liberação", e vice-versa).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionInstallmentsAuthorizeDocument'
        required: true
      responses:
        '204':
          description: Operação realizada (autorização/desautorização).
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Realiza autorização, ou desfaz autorização das parcelas. (REST)
  /commissions/cancel:
    patch:
      tags:
        - Parcelas das Comissões
      summary: Cancela ou desfaz cancelamento das parcelas de comissão.
      operationId: cancelCommissionInstallments
      x-section: Parcelas das Comissões
      x-original-file: commissions-v1.yaml
      x-audience:
        - public
      requestBody:
        description: >-
          Objeto de atualização da situação das parcelas (de "Aguardando
          Autorização" para "Cancelada", e vice-versa).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionInstallmentsCancelDocument'
        required: true
      responses:
        '204':
          description: Operação realizada (cancelamento/ativação).
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Realiza cancelamento, ativação das parcelas. (REST)
  /commissions/release:
    post:
      tags:
        - Parcelas das Comissões
      summary: Libera parcelas de comissão para pagamento.
      operationId: releaseCommissionInstallments
      x-section: Parcelas das Comissões
      x-original-file: commissions-v1.yaml
      x-audience:
        - public
      requestBody:
        description: Objeto para liberação das parcelas de comissão.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionInstallmentsReleaseDocument'
            example:
              brokerId: 789
              documentId: DOC-123
              documentNumber: '123'
              baseDate: '2025-01-01'
              emissionDate: '2025-01-01'
              firstPayment: '2025-01-01'
              installments: 12
              value: 1000
              releases:
                - brokerId: 789
                  commissionId: 123
                  installments:
                    - 1
                    - 2
                    - 3
        required: true
      responses:
        '201':
          description: Parcelas liberadas com sucesso.
          content:
            application/json:
              schema:
                type: integer
                description: Número do título de nota fiscal gerado.
              example: 456
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Realiza liberação das parcelas. (REST)
  /commissions/{commissionId}/brokers/{brokerId}:
    delete:
      x-original-file: commissions-v1.yaml
      x-section: Corretor da Comissão
      x-audience:
        - public
      tags:
        - Corretor da Comissão
      summary: Remove corretor de uma comissão por ID.
      operationId: deleteCommissionBroker
      parameters:
        - $ref: '#/components/parameters/CommissionId'
        - $ref: '#/components/parameters/BrokerId'
      responses:
        '204':
          description: >-
            Corretor é deletado. Caso seja o único corretor da comissão, ela
            também será deletada.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Deleta corretor de uma comissão por ID. (REST)
  /commissions/{commissionId}/brokers:
    post:
      tags:
        - Corretor da Comissão
      summary: Inclui corretores adicionais em uma comissão existente.
      operationId: addCommissionBrokers
      x-section: Corretor da Comissão
      x-original-file: commissions-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/CommissionId'
      requestBody:
        description: Lista de corretores a ser adicionado na comissão.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionBrokersPostPatchDocument'
            example:
              brokers:
                - baseDate: '2025-01-01'
                  documentId: DOC-123
                  documentNumber: '123'
                  firstPayment: '2025-01-01'
                  id: 123
                  indexerId: 1
                  installmentsNumber: 2
                  percentage: 10
                  value: 100
                  departmentId: 1
                  buildingId: 1
                  constructUnitId: 1
                  resourceItem: 1
        required: true
      responses:
        '201':
          description: Corretores adicionados à comissão com sucesso.
          content:
            application/json:
              schema:
                type: integer
                description: Código da comissão que os corretores foram adicionados.
              example: 123
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Adiciona um ou mais corretores na comissão por ID. (REST)
  /commissions/countFilters:
    get:
      x-original-file: commissions-v1.yaml
      x-section: Parcelas das Comissões
      x-audience:
        - public
      tags:
        - Parcelas das Comissões
      summary: Consulta totalizadores agrupados por status das parcelas.
      operationId: getComissionsCountFilters
      parameters:
        - name: unitId
          in: query
          description: Id da unidade.
          schema:
            type: integer
            example: 101
        - name: contractId
          in: query
          description: Id do contrato a ser filtrado
          schema:
            type: integer
            example: 12345
        - name: brokerId
          in: query
          description: Id do corretor a ser filtrado
          schema:
            type: integer
            example: 456
        - name: enterpriseId
          in: query
          description: Id do empreendimento a ser filtrado
          schema:
            type: integer
            example: 789
        - name: startingDueDate
          in: query
          description: >-
            Data inicial de vencimento para filtrar comissões de acordo com a
            parcela. Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-01-01'
        - name: endingDueDate
          in: query
          description: >-
            Data final de vencimento para filtrar comissões de acordo com a
            parcela. Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-12-31'
      responses:
        '200':
          description: Sucesso no retorno do totalizador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionCountFilterDocument'
              example:
                total: 25
                released: 10
                pending: 12
                canceled: 3
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Retorna um totalizador agrupado por situação das parcelas. (REST)
  /commissions/configurations/brokers:
    get:
      x-original-file: commissions-v1.yaml
      x-section: Configurações de Corretores
      x-audience:
        - public
      tags:
        - Configurações de Corretores
      summary: Busca a lista de configurações de corretores.
      operationId: findBrokerConfiguration
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - name: filter
          in: query
          description: Nome ou código do corretor para filtragem.
          schema:
            type: string
            example: João Silva
      responses:
        '200':
          description: Configurações encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerConfigurationGetDocument'
              examples:
                exemploConfiguracaoCorretor:
                  summary: Exemplo de configuração padrão de corretor
                  value:
                    installments: 5
                    percentage: 10
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Consulta uma lista de configurações de corretores. (REST)
    post:
      tags:
        - Configurações de Corretores
      summary: Persiste a configuração de um corretor.
      operationId: insertBrokerConfiguration
      x-section: Configurações de Corretores
      x-original-file: commissions-v1.yaml
      x-audience:
        - public
      requestBody:
        description: >
          Objeto para persistência da configuração.

          Configurar um corretor pode ser útil para <b>carregamento automático
          das informações</b> do corretor em específico, no momento de criação
          de uma comissão.

          A configuração é uma <b>sugestão de preenchimento</b>. O usuário ainda
          pode alterar as informações na tela.
        content:
          application/json:
            schema:
              required:
                - brokerId
              properties:
                brokerId:
                  type: integer
                  description: ID do corretor da comissão.
                  format: int32
                  example: 123
              allOf:
                - $ref: '#/components/schemas/BrokerConfigurationPatchDocument'
        required: true
      responses:
        '201':
          description: Configuração criada
          content:
            application/json:
              schema:
                type: integer
                description: Código da configuração gerada.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Persiste uma configuração de corretor. (REST)
  /commissions/configurations/brokers/{brokerId}:
    delete:
      x-original-file: commissions-v1.yaml
      x-section: Configurações de Corretores
      x-audience:
        - public
      tags:
        - Configurações de Corretores
      summary: Deleta a configuração do corretor por ID.
      operationId: deleteBrokerConfiguration
      parameters:
        - $ref: '#/components/parameters/BrokerId'
      responses:
        '204':
          description: Configuração corretor deletada com sucesso.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Deleta um registro de configuração do corretor por ID. (REST)
    patch:
      tags:
        - Configurações de Corretores
      summary: Atualiza a configuração de um corretor.
      operationId: patchBrokerConfiguration
      x-section: Configurações de Corretores
      x-original-file: commissions-v1.yaml
      x-audience:
        - public
