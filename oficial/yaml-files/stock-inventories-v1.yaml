openapi: 3.1.1
info:
  title: Estoque de Insumos
  version: 1.24.0
  description: Operações relacionadas ao fluxo de estoque de insumos.
paths:
  /stock-inventories/{costCenterId}/items:
    get:
      operationId: getStockInvestorIdItems
      x-section: Itens em Estoque
      x-original-file: stock-inventories-v1.yaml
      x-audience:
        - public
      tags:
        - Itens em Estoque
      summary: Retorna os insumos no estoque do centro de custo informado.
      description: >-
        Retorna um array contendo as informações atuais de todos os insumos que
        estão no estoque do centro de custo informado. Insumos que estão com
        quantidade em estoque zerada não serão retornados. Cada item do array
        representa o estoque para uma combinação específica de insumo, detalhe e
        marca, conforme a organização desses dados no Sienge. (REST)
      parameters:
        - $ref: '#/components/parameters/CostCenterIdPath'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            Retorna um array contendo as informações atuais de todos os insumos
            que estão no estoque do centro de custo informado. Se não houver
            nenhum, retorna um array vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseStockInventoryItems'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /stock-inventories/{costCenterId}/items/{resourceId}/building-appropriation:
    get:
      operationId: getStockInvestorIdItemsIdBuildingAppropriation
      x-section: Itens em Estoque
      x-original-file: stock-inventories-v1.yaml
      x-audience:
        - public
      tags:
        - Itens em Estoque
      summary: Busca apropriações de obra do insumo em estoque
      description: >-
        Busca as apropriações de obra do insumo em estoque no centro de custo
        (REST)
      parameters:
        - $ref: '#/components/parameters/CostCenterIdPath'
        - name: resourceId
          in: path
          description: Código do insumo em estoque
          required: true
          schema:
            type: integer
            format: int32
          example: 1001
        - name: detailId
          in: query
          description: Código do detalhe do insumo
          required: false
          schema:
            type: integer
            format: int32
          example: 3
        - name: trademarkId
          in: query
          description: Código da marca do insumo
          required: false
          schema:
            type: integer
            format: int32
          example: 42
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            Retorna um array contendo a apropriação com quantidade do insumo em
            estoque no centro de custo informado. Se não houver nenhum, retorna
            um array vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseAppropriationResources'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /stock-reservations:
    get:
      operationId: getStockReservations
      x-section: Reservas de Estoque
      x-original-file: stock-inventories-v1.yaml
      x-audience:
        - public
      tags:
        - Reservas de Estoque
      summary: Busca as reservas consistentes de forma paginada
      description: >-
        Retorna um array contendo todas as reservas consistentes de forma
        paginada. (REST)
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            Retorna um array contendo as reservas que estão no sistema de
            estoque e, se não existir nenhuma, retorna um array vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseReservations'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /stock-reservations/{reservationId}/items:
    get:
      operationId: getStockReservationsIdItems
      x-section: Reservas de Estoque
      x-original-file: stock-inventories-v1.yaml
      x-audience:
        - public
      tags:
        - Reservas de Estoque
      summary: Busca os itens da reserva de estoque informada
      description: >-
        Retorna um array contendo todos os itens da reserva de estoque informada
        de forma paginada. (REST)
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: >-
            Retorna um array contendo todas os itens da reserva de estoque
            informada, se não existir nenhuma, retorna um array vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseReservationItems'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /stock-movements:
    post:
      operationId: postStockMovements
      x-section: Movimentos de Estoque
      x-original-file: stock-inventories-v1.yaml
      x-audience:
        - public
      tags:
        - Movimentos de Estoque
      summary: Cria um movimento de estoque para um ou mais insumos
      description: >-
        Cria um movimento de estoque de entrada ou de saída, para um ou mais
        insumos. (REST)
      requestBody:
        description: Informações do movimento a ser cadastrado
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementPostDto'
      responses:
        '201':
          description: O movimento de estoque foi criado com sucesso.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /stock-movements/transfer:
    post:
      operationId: postStockMovementsTransfer
      x-section: Movimentos de Estoque
      x-original-file: stock-inventories-v1.yaml
      x-audience:
        - public
      tags:
        - Movimentos de Estoque
      summary: Realiza um movimento transferência.
      requestBody:
        description: Informações do movimento de transferência a ser cadastrado
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferStockMovementPostDto'
      responses:
        '201':
          description: O movimento de transferência foi criado com sucesso.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: ' (REST)'
  /stock-reservations/{reservationId}/movements:
    post:
      operationId: postStockReservationsIdmovements
      x-section: Reservas de Estoque
      x-original-file: stock-inventories-v1.yaml
      summary: Cria movimento para reserva
      x-audience:
        - public
      tags:
        - Reservas de Estoque
      description: Cria um movimento que atende a reserva. (REST)
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        description: Informações do movimento a ser criado para atender a reserva.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationMovementPostDto'
      responses:
        '201':
          description: >-
            O movimento de estoque para atender a reserva foi criado com
            sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationCreatedDto'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /inventory-movements/{id}:
    get:
      operationId: getInventoryMovementsId
      x-original-file: stock-inventories-v1.yaml
      summary: Consulta movimentação específica
      x-audience:
        - public
      tags:
        - Estoque de Insumos
      description: Retorna uma movimentação de estoque. (REST)
      parameters:
        - name: id
          in: path
          description: Id da movimentação de estoque.
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Retorna uma movimentação de estoque
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStockMovementItemDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /inventory-movements:
    get:
      operationId: getInventoryMovements
      x-original-file: stock-inventories-v1.yaml
      summary: Lista movimentações de estoque
      x-audience:
        - public
      tags:
        - Estoque de Insumos
      description: >-
        Retorna uma coleção de movimentações de estoque de forma paginada.
        (REST)
      parameters:
        - name: documentId
          in: query
          description: Id do documento do movimento de estoque.
          required: false
          schema:
            type: string
          example: DOC
        - name: movementNumber
          in: query
          description: Número do movimento de estoque
          required: false
          schema:
            type: string
          example: '10'
        - name: movementTypeId
          in: query
          description: Código do tipo de movimento de estoque.
          required: false
          schema:
            type: integer
            format: int32
          example: 1
        - $ref: '#/components/parameters/StartDateQuery'
          description: >-
            Data de início da busca (data do movimento de estoque) no formato:
            yyyy-MM-dd. Exemplo: 2018-03-01
        - $ref: '#/components/parameters/EndDateQuery'
          description: >-
            Data de fim da busca (data do movimento de estoque) no formato:
            yyyy-MM-dd. Exemplo: 2018-03-11
        - name: costCenterId
          in: query
          description: Identificador do centro de custo do movimento de estoque.
          required: false
          schema:
            type: integer
            format: int32
          example: 1001
        - $ref: '#/components/parameters/BuildingIdQuery'
          description: Código da obra do movimento de estoque.
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            Retorna um array contendo os movimentos de estoque que obedecem os
            parâmetros informados. Se não existir nenhum, retorna um array
            vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseStockMovement'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  schemas:
    GetResponseStockInventoryItems:
      description: >-
        Representa a lista de itens de movimentação de estoque retornados como
        resultado da requisição
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          items:
            $ref: '#/components/schemas/StockInventoryItemDto'
          example:
            - itemId: 1
              resourceId: 1001
              resourceDescription: Cimento Portland
              detailId: 3
              detailDescription: CP II-E-32
              trademarkId: 42
              trademarkDescription: ACME SA
              quantity: 3000.2348
              unitOfMeasure: kg
              averagePrice: 0.44
    GetResponseAppropriationResources:
      description: Representa a lista de apropriações com quantidade do insumo em estoque
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          items:
            $ref: '#/components/schemas/StockInventoryItemAppropriationDto'
          example:
            - buildingUnitId: 1
              sheetItemId: 42
              costEstimationItemReference: 08.004.001
              quantity: 5.2
    GetResponseReservations:
      description: Representa a lista de reservas  que estão no sistema de estoque
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          items:
            $ref: '#/components/schemas/StockReservationDto'
          example:
            - id: 223
              responsible:
                id: 42
                name: Guilherme da Silva
              reservationDate: '2020-04-28'
              movementType:
                id: 3
                description: Transferência
              sourceCostCenter:
                id: 1
                description: Taj Mahal
              destinationCostCenter:
                id: 6
                description: Torre Eifel
              status: PENDING
              notes: Lorem ipsum dolor sit amet.
              createdBy: JOAO
              createdAt: '2020-11-24T14:20:00.000-03:00'
              modifiedBy: MARIANA
              modifiedAt: '2020-11-24T14:20:00.000-03:00'
    GetResponseReservationItems:
      description: Representa a lista de itens da reserva de estoque
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          items:
            $ref: '#/components/schemas/StockReservationItemDto'
          example:
            - itemId: 3
              resource:
                id: 1001
                description: Cimento Portland
                detail:
                  id: 3
                  description: CP II-E-32
                trademark:
                  id: 42
                  description: ACME SA
              destinationResource:
                id: 1001
                description: Areia
                detail:
                  id: 1
                  description: Areia Fina
              quantity: 33.4444
              unitOfMeasure: kg
              notes: Lorem ipsum dolor sit amet.
              deliveries:
                - date: '2020-04-28'
                  quantity: 4.2222
                  deliveredQuantity: 2.1111
                  cancelled: false
    MovementPostDto:
      type: object
      description: >-
        Informações para inclusão de um movimento de estoque que pode ser de
        entrada ou de saída. O que vai determinar se o movimento é de entrada ou
        de saída, é o tipo de movimento que é informado no campo movementTypeId.
        O movimento cadastrado representa a entrada ou saída de estoque de um ou
        mais insumos.
      properties:
        documentId:
          description: >-
            Código do (tipo de) documento. Deve referenciar um documento já
            cadastrado no Sienge.
          type: string
          example: CONS
        movementNumber:
          description: Número do movimento. Aceita valores com no máximo 12 caracteres.
          type: string
          example: '132'
        movementDate:
          description: >-
            Data do movimento no formato YYYY-MM-DD de acordo com a norma ISO
            8601.
          type: string
          example: '2020-04-28'
        movementTypeId:
          description: >-
            Código do tipo de movimento. Deve referenciar um tipo de movimento
            ativo, já cadastrado no Sienge. É o tipo de movimento informado aqui
            que vai determinar se o movimento que está sendo criado é de entrada
            ou de saída, pois isso já estará definido no próprio cadastro do
            tipo de movimento. Apenas tipos de movimento que são exclusivamente
            de entrada ou de saída serão aceitos aqui. Ou seja, tipos que
            referem-se à movimentos que são simultaneamente de entrada e saída,
            como transferências ou realocações de estoque, não serão aceitos.
          type: integer
          example: 2
        costCenterId:
          description: >-
            Código do centro de custo do movimento. Deve referenciar um centro
            de custo já cadastrado no Sienge.
          type: integer
          example: 47
        departmentId:
          description: >-
            Código do departamento do movimento. Deve referenciar um
            departamento já cadastrado no Sienge. Essa informação só será
            armazenada nos movimentos do tipo "Devolução". Além disso, de acordo
            com as configurações definidas no parâmetro 293 do Sienge, esse
            campo pode ou não ser obrigatório para movimentos de devolução.
          type: integer
          example: 3
        notes:
          description: Observações do movimento. Campo opcional.
          type: string
          example: Lorem ipsum dolor sit amet.
        items:
          description: >-
            Array com os itens (insumos) que estão sendo movimentados. Deve ser
            informado pelo menos um item.
          type: array
          items:
            $ref: '#/components/schemas/MovementItemPostDto'
      example:
        documentId: CONS
        movementNumber: '132'
        movementDate: '2020-04-28'
        movementTypeId: 2
        costCenterId: 47
        departmentId: 3
        notes: Lorem ipsum dolor sit amet.
        items:
          - resourceId: 1001
            detailId: 3
            trademarkId: 18
            quantity: 3000.2348
            unitPrice: 200.4321
            unitOfMeasure: sc
            buildingAppropriations:
              - buildingUnitId: 2
                sheetItemId: 42
                percentage: 100
    TransferStockMovementPostDto:
      type: object
      description: >-
        Informações para transferência de estoque entre centros de custo e/ou
        departamentos.
      required:
        - documentId
        - movementDate
        - movementTypeId
        - sourceCostCenterId
        - destinationCostCenterId
        - items
      properties:
        documentId:
          type: string
          description: Código do tipo de documento.
          example: TR
        movementNumber:
          type: string
          description: >-
            Número do movimento. Opcional, gerado automaticamente se não
            informado.
          example: '123'
        movementDate:
          type: string
          format: date
          description: Data do movimento no formato YYYY-MM-DD.
          example: '2025-09-18'
        movementTypeId:
          type: integer
          description: Código do tipo de movimento.
          example: 3
        notes:
          type: string
          description: Observações gerais da transferência.
          example: Lorem ipsum dolor sit amet.
        sourceCostCenterId:
          type: integer
          description: Código do centro de custo de origem transferência.
          example: 300
        sourceDepartmentId:
          type: integer
          nullable: true
          description: Código do departamento de origem (opcional).
          example: 10
        destinationCostCenterId:
          type: integer
          description: Código do centro de custo de destino transferência.
          example: 367
        destinationDepartmentId:
          type: integer
          nullable: true
          description: Código do departamento de destino (opcional).
          example: 20
        items:
          type: array
          description: Lista de itens a serem transferidos.
          items:
            $ref: '#/components/schemas/TransferStockMovementItemPostDto'
      example:
        documentId: TR
        movementNumber: '123'
        movementDate: '2025-09-18'
        movementTypeId: 3
        notes: Lorem ipsum dolor sit amet.
        sourceCostCenterId: 300
        sourceDepartmentId: 10
        destinationCostCenterId: 367
        destinationDepartmentId: 20
        items:
          - source:
              resourceId: 4697
              detailId: 1
              trademarkId: 1
              quantity: 1
              unitOfMeasure: un
              buildingAppropriations:
                - buildingUnitId: 2
                  sheetItemId: 42
                  percentage: 100
            destination:
              resourceId: 4697
              detailId: 1
              trademarkId: 1
              unitPrice: 100
              buildingAppropriations:
                - buildingUnitId: 2
                  sheetItemId: 42
                  percentage: 100
    ReservationMovementPostDto:
      description: Representa o movimento de reserva a ser cadastrado
      type: object
      properties:
        documentId:
          description: >-
            Identificador do (tipo de) documento. Deve referenciar um documento
            já cadastrado no Sienge.
          type: string
          example: CONS
        movementNumber:
          description: >-
            Número do movimento de reserva. Aceita valores com no máximo 12
            caracteres. Não pode existir um movimento com a mesma combinação
            documento/número. Caso o campo não seja informado será gerado um
            número para o movimento.
          type: string
          example: '132'
        sourceDepartmentId:
          description: >-
            Código do departamento para apropriação de origem. Deve referenciar
            um departamento já cadastrado no Sienge. Essa informação só será
            armazenada em reservas de entrada e saída (exemplo transferência).
            Além disso, de acordo com as configurações definidas no parâmetro
            293 do Sienge, esse campo pode ou não ser obrigatório.
          type: integer
          example: 3
        destinationDepartmentId:
          description: >-
            Código do departamento para apropriação de destino. Deve referenciar
            um departamento já cadastrado no Sienge. Essa informação só será
            armazenada em reservas de entrada e saída (exemplo transferência).
            Além disso, de acordo com as configurações definidas no parâmetro
            293 do Sienge, esse campo pode ou não ser obrigatório.
          type: integer
          example: 3
        items:
          description: Lista de insumos da reserva que estarão no movimento a ser gerado.
          type: array
          items:
            description: >-
              Dados do insumo e de suas saídas que estarão no movimento a ser
              gerado.
            type: object
            properties:
              itemId:
                description: Id único e imutável do item de reserva.
                type: integer
                example: 3
              deliveries:
                description: Lista de saídas que serão atendidas.
                type: array
                items:
                  description: Dados do atendimento da saída.
                  type: object
                  properties:
                    date:
                      description: >-
                        Data da saída no formato YYYY-MM-DD de acordo com a
                        norma ISO 8601.
                      type: string
                      example: '2020-04-28'
                    movementAmount:
                      description: >-
                        Quantidade atendida pelo movimento para esta saída. Deve
                        ser maior que 0 e não pode ser maior que o valor
                        disponível nesta saída. Com precisão de até 4 casas
                        decimais.
                      type: number
                      example: 4.2222
              buildingAppropriations:
                description: >-
                  Apropriações de obra origem do insumo que está sendo
                  movimentado. Esse conjunto de itens representa um rateio da
                  quantidade movimentada do insumo, entre um ou mais itens do
                  orçamento da obra do centro de custo do movimento. Os itens de
                  orçamento referenciados em cada item de apropriação devem ser
                  do nível (na estrutura analítica do orçamento) correspondente
                  ao nível de apropriação definido na respectiva obra (por
                  exemplo: etapa, subetapa, serviço etc.). Importante: se a obra
                  do movimento possuir nível de apropriação definido como
                  "obra", este campo não deve ser preenchido, ou o array deve
                  estar vazio, já que nesses casos não pode haver apropriação a
                  nível de itens de orçamento.
                type: array
                items:
                  $ref: '#/components/schemas/BuildingAppropriationItemPostDto'
              destinationBuildingAppropriations:
                description: >-
                  Apropriações da obra destino. Este campo deve ser preenchido
                  somente quando o movimento for do tipo entrada e saída
                  (exemplo: transferência) e a obra destino exigir apropriação
                  em itens de orçamento (exemplo: etapa, subetapa, serviço
                  etc.). Caso contrário, este campo não deve ser preenchido ou o
                  array deve estar vazio.
                type: array
                items:
                  $ref: '#/components/schemas/BuildingAppropriationItemPostDto'
      example:
        documentId: CONS
        movementNumber: '132'
        sourceDepartmentId: 3
        destinationDepartmentId: 3
        items:
          - itemId: 3
            deliveries:
              - date: '2020-04-28'
                movementAmount: 4.2222
            buildingAppropriations:
              - buildingUnitId: 2
                sheetItemId: 42
                percentage: 100
            destinationBuildingAppropriations:
              - buildingUnitId: 2
                sheetItemId: 42
                percentage: 100
