    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    StockInventoryItemDto:
      type: object
      description: >-
        Representa o estoque para uma combinação específica de insumo, detalhe e
        marca, conforme a organização desses dados no Sienge. Como o detalhe e a
        marca são informações opcionais no estoque do Sienge, esses valores
        podem não estar preenchidos.
      properties:
        itemId:
          description: Código do item.
          type: integer
          example: 1
        resourceId:
          description: Identificador do insumo.
          type: integer
          example: 1001
        resourceDescription:
          description: Descrição do insumo em estoque.
          type: string
          example: Cimento Portland
        detailId:
          description: Código do detalhe. Pode ser null.
          type: integer
          example: 3
        detailDescription:
          description: Descrição do detalhe. Pode ser null.
          type: string
          example: CP II-E-32
        trademarkId:
          description: Código da marca. Pode ser null.
          type: integer
          example: 42
        trademarkDescription:
          description: Descrição da marca. Pode ser null.
          type: string
          example: ACME SA
        quantity:
          description: Quantidade em estoque.
          type: number
          example: 3000.2348
        unitOfMeasure:
          description: >-
            Símbolo da unidade de medida básica do insumo (que é a unidade
            utilizada no controle de estoque).
          type: string
          example: kg
        averagePrice:
          description: Custo médio (preço médio).
          type: number
          example: 0.44
    StockInventoryItemAppropriationDto:
      type: object
      description: >-
        Representa a apropriação de um insumo em estoque, segregado por detalhe
        e marca.
      properties:
        buildingUnitId:
          description: Código da unidade construtiva da obra.
          type: integer
          format: int64
          example: 1
        sheetItemId:
          description: >-
            Id do item de orçamento. Deve referenciar um item de orçamento já
            cadastrado no Sienge, na respectiva planilha de orçamento
            (considerando a obra do centro de custo do movimento e a unidade
            construtiva informada). Além disso, o item de orçamento não pode
            estar bloqueado para apropriações e não pode estar duplicado dentro
            do mesmo item de movimento.
          type: integer
          example: 42
        costEstimationItemReference:
          description: Referência do item do orçamento.
          type: string
          example: 08.004.001
        quantity:
          description: Quantidade apropriada do insumo.
          type: number
          format: double
          example: 5.2
    StockReservationDto:
      type: object
      description: Dados da reserva.
      properties:
        id:
          description: Número da reserva no Sienge.
          type: integer
          example: 223
        responsible:
          type: object
          description: Responsável pela reserva.
          properties:
            id:
              type: integer
              description: Código do responsável.
              example: 42
            name:
              type: string
              description: Nome do responsável.
              example: Guilherme da Silva
        reservationDate:
          description: >-
            Data da reserva no formato YYYY-MM-DD de acordo com a norma ISO
            8601.
          type: string
          example: '2020-04-28'
        movementType:
          type: object
          description: Tipo de movimento.
          properties:
            id:
              description: Código do tipo de movimento
              type: integer
              example: 3
            description:
              description: Descrição do tipo de movimento.
              type: string
              example: Transferência
        sourceCostCenter:
          type: object
          description: Centro de custo de origem.
          properties:
            id:
              description: Código do centro de custo de origem.
              type: integer
              example: 1
            description:
              description: Nome do centro de custo de origem.
              type: string
              example: Taj Mahal
        destinationCostCenter:
          type: object
          description: Centro de custo de destino.
          properties:
            id:
              description: Código do centro de custo de destino.
              type: integer
              example: 6
            description:
              description: Nome do centro de custo de destino.
              type: string
              example: Torre Eifel
        status:
          description: Situação da reserva.
          type: string
          example: PENDING
          enum:
            - PENDING
            - PARTIALLY_FULFILLED
            - FULFILLED
            - CANCELLED
        notes:
          description: Observações do movimento.
          type: string
          example: Lorem ipsum dolor sit amet.
        createdBy:
          description: Código do Usuário que cadastrou a reserva.
          type: string
          example: JOAO
        createdAt:
          description: >-
            Data e hora da criação da reserva no formato
            yyyy-MM-ddTHH:mm:ss.SSSXXX de acordo com a norma ISO 8601.
          type: string
          example: '2020-11-24T14:20:00.000-03:00'
        modifiedBy:
          description: Código do último usuário que modificou a reserva.
          type: string
          example: MARIANA
        modifiedAt:
          description: >-
            Data e hora da modificação da reserva no formato
            yyyy-MM-ddTHH:mm:ss.SSSXXX de acordo com a norma ISO 8601.
          type: string
          example: '2020-11-24T14:20:00.000-03:00'
    StockReservationItemDto:
      type: object
      description: Dados do item da reserva.
      properties:
        itemId:
          description: Identificador único e imutável do item de reserva.
          type: integer
          example: 3
        resource:
          description: Dados do insumo. Pode ser null.
          type: object
          properties:
            id:
              description: Código do insumo.
              type: integer
              example: 1001
            description:
              description: Descrição do insumo.
              type: string
              example: Cimento Portland
            detail:
              description: Detalhe do insumo. Pode ser null.
              type: object
              properties:
                id:
                  description: Código do detalhe.
                  type: integer
                  example: 3
                description:
                  description: Descrição do detalhe.
                  type: string
                  example: CP II-E-32
            trademark:
              description: Marca do insumo. Pode ser null.
              type: object
              properties:
                id:
                  description: Código da marca.
                  type: integer
                  example: 42
                description:
                  description: Descrição da marca.
                  type: string
                  example: ACME SA
        destinationResource:
          description: >-
            Dados do insumo destino. Pode ser null. Este campo só será
            preenchido caso seja uma reserva para transferência entre obras com
            diferentes tabelas de insumo. Nesses casos, esse campo conterá os
            dados do insumo na obra destino.
          type: object
          properties:
            id:
              description: Código do insumo destino.
              type: integer
              example: 1001
            description:
              description: Descrição do insumo destino.
              type: string
              example: Cimento Portland
            detail:
              description: Detalhe do insumo destino. Pode ser null.
              type: object
              properties:
                id:
                  description: Código do detalhe do insumo destino.
                  type: integer
                  example: 1
                description:
                  description: Descrição do detalhe do insumo destino.
                  type: string
                  example: Areia Fina
        quantity:
          description: Quantidade reservada para este insumo.
          type: number
          example: 33.4444
        unitOfMeasure:
          description: Símbolo da unidade de movimento a qual a quantidade se refere.
          type: string
          example: kg
        notes:
          description: Observações do item de reserva. Pode ser null.
          type: string
          example: Lorem ipsum dolor sit amet.
        deliveries:
          description: Saídas da reserva.
          type: array
          items:
            $ref: '#/components/schemas/DeliveryDto'
    MovementItemPostDto:
      type: object
      description: >-
        Informações de um insumo (combinação de insumo, detalhe e marca) que
        está sendo movimentado no estoque.
      properties:
        resourceId:
          description: >-
            Código do insumo. Deve referenciar um insumo ativo, já cadastrado no
            Sienge, na obra do respectivo centro de custo do movimento.
          type: integer
          example: 1001
        detailId:
          description: >-
            Código do detalhe. Campo opcional. Se for preenchido, deve
            referenciar um detalhe ativo, já cadastrado no Sienge, associado ao
            respectivo insumo da obra.
          type: integer
          example: 3
        trademarkId:
          description: >-
            Código da marca. Campo opcional. Se for preenchido, deve referenciar
            uma marca ativa, já cadastrada no Sienge, associada ao respectivo
            insumo da obra.
          type: integer
          example: 18
        quantity:
          description: >-
            Quantidade movimentada do insumo, referindo-se à unidade de
            movimento que está sendo informada (ex. sacos, unidades, quilos
            etc.). Aceita apenas números maiores que zero, com até 4 casas
            decimais.
          type: number
          example: 3000.2348
        unitPrice:
          description: >-
            Preço unitário do insumo. Em movimentos de entrada o preço é
            obrigatorio, em movimentos de saída este campo é desconsiderado,
            pois considerará o preço existente no Sienge. Aceita apenas valores
            maiores que zero, com até 4 casas decimais.
          type: number
          example: 200.4321
        unitOfMeasure:
          description: >-
            Símbolo da unidade de movimento a qual a quantidade se refere. Deve
            referenciar uma unidade de movimento ativa, já cadastrada no Sienge,
            associada ao respectivo insumo da obra.
          type: string
          example: sc
        buildingAppropriations:
          description: >-
            Apropriações de obra do insumo que está sendo movimentado. Esse
            conjunto de itens representa um rateio da quantidade movimentada do
            insumo, entre um ou mais itens do orçamento da obra do centro de
            custo do movimento. Os itens de orçamento referenciados em cada item
            de apropriação devem ser do nível (na estrutura analítica do
            orçamento) correspondente ao nível de apropriação definido na
            respectiva obra (por exemplo: etapa, subetapa, serviço etc.).
            Importante: se a obra do movimento possuir nível de apropriação
            definido como "obra", este campo não deve ser preenchido, ou o array
            deve estar vazio, já que nesses casos não pode haver apropriação a
            nível de itens de orçamento.

            Caso o parâmetro 833 estiver configurado como apropriação
            automática, as apropriações serão aplicadas automaticamente para os
            itens de saída conforme descrição acima.
          type: array
          items:
            $ref: '#/components/schemas/BuildingAppropriationItemPostDto'
    TransferStockMovementItemPostDto:
      description: Informações itens de transferência de estoque entre centros de custo.
      type: object
      required:
        - source
        - destination
      properties:
        source:
          $ref: '#/components/schemas/TransferStockMovementItemSourceDto'
        destination:
          $ref: '#/components/schemas/TransferStockMovementItemDestinationDto'
    BuildingAppropriationItemPostDto:
      type: object
      description: >-
        Item que faz parte de um conjunto de apropriações de obra de um insumo
        movimentado. Referencia um item do orçamento de obra, com o respectivo
        percentual de rateio.
      properties:
        buildingUnitId:
          description: >-
            Código da unidade construtiva. Deve referenciar uma unidade
            construtiva já cadastrada no Sienge, na obra do respectivo centro de
            custo do movimento e que esteja com a situação "Liberada".
          type: integer
          example: 2
        sheetItemId:
          description: >-
            Identificador do item de orçamento. Deve referenciar um item de
            orçamento já cadastrado no Sienge, na respectiva planilha de
            orçamento (considerando a obra do centro de custo do movimento e a
            unidade construtiva informada). Além disso, o item de orçamento não
            pode estar bloqueado para apropriações e não pode estar duplicado
            dentro do mesmo item de movimento.
          type: integer
          example: 42
        percentage:
          description: >-
            Percentual de rateio do respectivo item de orçamento nas
            apropriações de obra do insumo. Deve ser um número maior que zero,
            menor ou igual a 100, com precisão de até 12 casas decimais. A soma
            dos percentuais de todos os itens de apropriação de um insumo
            movimentado deve ser igual a 100.
          type: number
          example: 100
    GetStockMovementDTO:
