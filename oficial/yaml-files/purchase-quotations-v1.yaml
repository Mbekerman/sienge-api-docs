          description: Referência do item da negociação
          maxLength: 30
        selectedOption:
          type: boolean
          example: true
          description: Opção escolhida para compra
        internalNotes:
          type: string
          example: Observação interna sobre o insumo deste fornecedor
          description: Observação interna
          maxLength: 4000
        supplierNotes:
          type: string
          example: Observação sobre o fornecedor da negociação
          description: Observação do fornecedor
          maxLength: 4000
        negotiationDeliveries:
          type: array
          description: Entregas da negociação
          items:
            $ref: '#/components/schemas/PurchaseQuotationNegotiationDeliveryUpdate'
          example:
            - negotiationDeliveryNumber: 1
              deliveryDate: '2019-02-15'
              deliveryQuantity: 5.5
            - deliveryDate: '2019-02-16'
              deliveryQuantity: 5
    PurchaseQuotationComparisonMapReportPdfUrl:
      description: >-
        Representa a lista de links para download dos relatórios de mapa de
        comparação.
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de links para download dos relatórios de mapa de comparação.
          items:
            $ref: '#/components/schemas/UrlReportResults'
          example:
            - urlReport: >-
                https://cliente.sienge.com.br/sienge/visualizar-relatorio?arquivo=6470620993408717174&formato=pdf
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    PurchaseQuotationWithNegotiation:
      description: Represanta a lista de cotações com negociações retornadas como resultado
      type: object
      properties:
        purchaseQuotationId:
          type: integer
          format: int64
          example: 1
          description: Id da cotação de preços.
        buyerId:
          type: string
          example: ANON_BUYER
          description: Id do comprador cadastrado na cotação.
        consistent:
          type: boolean
          example: true
          description: >-
            Retornará verdadeiro se a cotação estiver consistente, caso
            contrário retornará falso.
        status:
          $ref: '#/components/schemas/PurchaseQuotationStatusEnum'
        quotationDate:
          type: string
          example: '2018-03-11'
          description: 'Data da cotação no formato: yyyy-MM-dd.'
        responseDate:
          type: string
          example: '2018-03-11'
          description: 'Data limite para retorno no formato: yyyy-MM-dd.'
        suppliers:
          type: array
          description: Fornecedores da cotação.
          items:
            $ref: '#/components/schemas/QuotationSupplierDTO'
    DeliveryRequirementQuotation:
      description: Representa a necessidade
      type: object
      required:
        - requirementDate
        - requirementQuantity
      properties:
        requirementDate:
          type: string
          format: date
          example: '2019-01-25'
          description: 'Data da necessidade no formato ISO 8601 com máscara: yyyy-MM-dd'
        requirementQuantity:
          type: number
          format: double
          example: 80
          description: Quantidade necessitada na cotação
    QuotationFreightTypeEnum:
      type: string
      description: Tipo do frete.
      enum:
        - NONE
        - INCLUDED
        - PAID
      default: NONE
      example: INCLUDED
    FreightTypeForGeneratedPurchaseOrderEnum:
      type: string
      description: Tipo de frete para pedidos de compra.
      enum:
        - PROPORTIONAL
        - TOTAL
      default: TOTAL
      example: PROPORTIONAL
    PaymentTerms:
      description: Representa as condições de pagamento de uma negociação.
      type: object
      required:
        - paymentTerms
      properties:
        description:
          type: string
          example: Descrição da condição de pagamento do Fornededor X
          description: Texto livre para a descrição da condição de pagamento
        selected:
          type: boolean
          default: false
          example: true
          description: True ou False para indicar a condição selecionada
        paymentTerms:
          type: array
          description: Lista das parcelas da condição de pagamento
          items:
            $ref: '#/components/schemas/PaymentTerm'
    PurchaseQuotationNegotiationDeliveryUpdate:
      description: Representa a entrega da negociação a ser atualizada
      type: object
      required:
        - deliveryDate
        - deliveryQuantity
      properties:
        negotiationDeliveryNumber:
          type: integer
          format: int32
          description: Número da entrega do item da negociação
          example: 1
        deliveryDate:
          type: string
          format: date
          description: 'Data da entrega no formato ISO 8601 com a máscara: yyyy-MM-dd'
          example: '2019-02-15'
        deliveryQuantity:
          type: number
          format: double
          description: Quantidade da entrega
          example: 5.5
    UrlReportResults:
      description: Representa os resultados de um relatório.
      type: object
      properties:
        urlReport:
          type: string
          description: Url do relatório em PDF do Mapa de Comparação.
          example: >-
            https://cliente.sienge.com.br/sienge/visualizar-relatorio?arquivo=6470620993408717174&formato=pdf
    PurchaseQuotationStatusEnum:
      type: string
      description: Status da cotação de preços.
      enum:
        - Registrada
        - Negociação em andamento
        - Negociação fechada
        - Aquisição encaminhada
        - Enviada para serviço
        - Enviada para o portal do fornecedor
        - Cancelada
      example: Registrada
    QuotationSupplierDTO:
      type: object
      description: Fornecedor da cotação e sua última negociação.
      properties:
        supplierId:
          description: Código do fornecedor
          example: 236
          format: int32
          type: integer
        supplierName:
          description: Nome do fornecedor.
          type: string
          example: Fornecedor
        latestNegotiation:
          description: Última negociação com o fornecedor.
          type: array
          items:
            $ref: '#/components/schemas/QuotationSupplierNegotiationDTO'
    PaymentTerm:
      description: Representa uma condição de pagamento.
      type: object
      required:
        - numberOfdays
        - percentage
      properties:
        numberOfdays:
          type: integer
          format: int32
          example: 10
          description: >-
            Quantidade de dias que será usado para calcular as parcelas, a
            partir da data de previsão de entrega
        percentage:
          type: number
          format: double
          example: 100
          description: >-
            Percentual da parcela referente ao valor total do pedido. A soma dos
            valores dos percentuais das parcelas deve ser 100%
    QuotationSupplierNegotiationDTO:
      type: object
      description: Negociação do fornecedor.
      properties:
        negotiationId:
          description: Código da negociação com o fornecedor
          type: integer
          example: 1
        responseDate:
          description: Data da resposta da negociação no formato yyyy-MM-dd
          type: string
          example: '2022-08-11'
        discount:
          description: Desconto da negociação
          type: number
          example: 10.1
        shippingCosts:
          description: Frete geral
          type: number
          example: 0
        itemsShipping:
          description: Frete dos itens negociados
          type: number
          example: 0
        ipiShippingFlag:
          $ref: '#/components/schemas/IpiShippingFlagEnum'
        ipiShippingCosts:
          description: Custos de frete para IPIs
          type: number
          example: 12.99
        otherCosts:
          description: Outros custos presentes na negociação.
          type: number
          example: 12.99
        totalItemsCosts:
          description: Custo total dos itens da negociação.
          type: number
          example: 12.99
        totalItemsNegotiationCosts:
          description: Custo total dos itens da negociação escolhidos.
          type: number
          example: 12.99
        authorized:
          description: >-
            Retornará verdadeiro se a negociação estiver autorizada, caso
            contrário retornará falso.
          type: boolean
          example: true
        disapprovalReason:
          type: array
          description: >-
            Lista de códigos que identificam os motivos de desautorização da
            negociação.




              * LAST_NEGOTIATION_EDITOR_NOT_AUTHORIZED - O último usuário a salvar a negociação não está autorizado a incluir/alterar negociações.
          items:
            type: string
            enum:
              - LAST_NEGOTIATION_EDITOR_NOT_AUTHORIZED
          example:
            - LAST_NEGOTIATION_EDITOR_NOT_AUTHORIZED
    IpiShippingFlagEnum:
      type: string
      description: Indica se está sendo aplicado IPI sobre o frete.
      enum:
        - S
        - 'N'
      example: S
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    StartDateQuery:
      description: Data inicial para filtro de período (opcional)
      in: query
      name: startDate
      required: false
      schema:
        example: '2023-01-01'
        format: date
        type: string
    EndDateQuery:
      description: Data final para filtro de período (opcional)
      in: query
      name: endDate
      required: false
      schema:
        example: '2023-01-31'
        format: date
        type: string
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    PurchaseQuotationId:
      description: Id da Cotação de Preço
      example: 1
      in: path
      name: purchaseQuotationId
      required: true
      schema:
        format: int32
        type: integer
    PurchaseQuotationItemNumber:
      description: Número do Item da Cotação de Preço
      example: 3
      in: path
      name: purchaseQuotationItemNumber
      required: true
      schema:
        format: int64
        type: integer
    QuotationItemNumber:
      description: Número do Item da Cotação de Preço.
      example: 3
      in: path
      name: quotationItemNumber
      required: true
      schema:
        format: int64
        type: integer
    BuildingIdQuery:
      description: Código da obra (opcional)
      in: query
      name: buildingId
      required: false
      schema:
        example: 123
        format: int32
        type: integer
    StartDateQueryRequired:
      description: Data inicial para filtro de período
      in: query
      name: startDate
      required: true
      schema:
        example: '2023-01-01'
        format: date
        type: string
    EndDateQueryRequired:
      description: Data final para filtro de período
      in: query
      name: endDate
      required: true
      schema:
        example: '2023-01-31'
        format: date
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
webhooks:
  PURCHASE_QUOTATION_NEGOTIATION_AUTHORIZATION_CHANGED:
    post:
      tags:
        - Webhooks - Cotações de Preços
      operationId: purchaseQuotationNegotiationAuthorizationChanged
      summary: Autorização da negociação alterada
      description: >-
        Sempre que a autorização da negociação de cotação de um fornecedor
        mudar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purchaseQuotationId:
                  type: integer
                  format: int32
                  example: 236
                  description: Código da cotação de preços
                supplierId:
                  type: integer
                  format: int32
                  example: 1
                  description: Código do fornecedor
                negotiationId:
                  type: integer
                  format: int32
                  example: 1
                  description: Código da negociação
                authorized:
                  type: boolean
                  example: true
                  description: Indica se a negociação está autorizada
                consistent:
                  type: boolean
                  example: true
                  description: Indica se a negociação está consistente
                changedAt:
                  description: >-
                    Data e hora da modificação no formato
                    yyyy-MM-dd'T'HH:mm:ss.SSSXXX
                  example: '2024-08-19T14:20:00.123-03:00'
                  format: date-time
                  type: string
              required:
                - purchaseQuotationId
                - supplierId
                - negotiationId
                - authorized
                - consistent
                - changedAt
            example:
              purchaseQuotationId: 1024
              supplierId: 1
              negotiationId: 1
              authorized: true
              consistent: true
              changedAt: '2024-08-19T14:20:00.123-03:00'
      responses:
        '200':
          description: >-
            Confirmação de recebimento do evento de alteração de autorização do
            pedido de compra.
      x-audience:
        - public
