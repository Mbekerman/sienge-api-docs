        trademarkId:
          type: integer
          format: int32
          example: 2
          description: Código da marca do item
        quotedQuantity:
          type: number
          format: double
          example: 10.5
          description: Quantidade cotada
        negotiatedQuantity:
          type: number
          format: double
          example: 10.5
          description: Quantidade negociada
        unitPrice:
          type: number
          format: double
          example: 5.5
          description: Preço Unitário
        discount:
          type: number
          format: double
          example: 10
          description: Valor de desconto monetário
        discountPercentage:
          type: number
          format: double
          example: 1
          description: Percentual de desconto monetário
        increasePercentage:
          type: number
          format: double
          example: 2
          description: Percentual de acréscimo monetário
        ipiTaxPercentage:
          type: number
          format: double
          example: 1
          description: Percentual de IPI (Imposto sobre Produtos Industrializados)
        issTaxPercentage:
          type: number
          format: double
          example: 2
          description: Percentual de ISS (Imposto Sobre Serviços)
        icmsTaxPercentage:
