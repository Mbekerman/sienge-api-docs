        purchaseRequestId:
          type: integer
          format: int32
          example: 375
          description: Número da solicitação de compra
        purchaseRequestItemNumber:
          type: integer
          format: int32
          example: 1
          description: Número do item da solicitação de compra
        deliveryRequirementNumber:
          type: integer
          format: int32
          example: 2
          description: Número da entrega do item da solicitação de compra
    PurchaseQuotationItemSupplierInsert:
      description: Representa o fornecedor do item de cotação a ser cadastrado
      type: object
      required:
        - supplierId
      properties:
        supplierId:
          description: Código do fornecedor
          example: 236
          format: int32
          type: integer
    PurchaseQuotationNegotiationUpdate:
      description: Representa os dados da negociação a ser atualizada
      type: object
      properties:
        supplierAnswerDate:
          type: string
          format: date
          example: '2020-12-31'
