openapi: 3.1.1
info:
  title: Cotações de Preços
  version: 1.24.0
  description: >-
    Operações relacionadas ao fluxo de cotações de preços, itens, fornecedores e
    negociações relacionadas a cotações.
paths:
  /purchase-quotations:
    post:
      operationId: postPurchaseQuotations
      x-section: Cotação de Preço
      x-original-file: purchase-quotations-v1.yaml
      summary: Cria cotação de preço
      x-audience:
        - public
      description: Cria uma cotação de preço. (REST)
      tags:
        - Cotação de Preço
      requestBody:
        description: Cotação de preço a ser cadastrada
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseQuotationInsert'
      responses:
        '201':
          description: Cotação de preço cadastrada
          headers:
            Location:
              description: URI do recurso criado, contendo o ID da cotação de preço.
              schema:
                type: string
                format: uri
                example: >-
                  https://suporte.sienge.com.br/sienge/api/v1/purchase-quotations/10024
              example: >-
                https://suporte.sienge.com.br/sienge/api/v1/purchase-quotations/10024
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /purchase-quotations/all/negotiations:
    get:
      operationId: getPurchaseQuotationsAllNegotiations
      x-section: Cotação de Preço
      x-original-file: purchase-quotations-v1.yaml
      summary: Lista cotações com negociações
      x-audience:
        - public
      tags:
        - Cotação de Preço
      description: Busca todas as cotações com negociações (REST)
      parameters:
        - name: quotationNumber
          required: false
          in: query
          description: >-
            Código da cotação


            Obs.: Caso seja informado o parametro <code>quotationNumber</code>
            não devem ser informados os campos <code>startDate</code> e
            <code>endDate</code>.
          schema:
            type: integer
          example: 12
        - name: supplierId
          required: false
          in: query
          description: Código do fornecedor da negociação
          schema:
            type: integer
          example: 1
        - name: buyerId
          required: false
          in: query
          description: Código do comprador da negociação
          schema:
            type: string
          example: USER
        - $ref: '#/components/parameters/StartDateQuery'
          description: >-
            Data de inicio da busca. Formato ISO 8601 yyyy-MM-dd. *Parametro
            obrigatório quando quotationNumber não for informado.
        - $ref: '#/components/parameters/EndDateQuery'
          description: >-
            Data de fim da busca. Formato ISO 8601 yyyy-MM-dd. *Parametro
            obrigatório quando quotationNumber não for informado.
        - name: authorized
          required: false
          in: query
          description: Filtro para negociações autorizadas ou não autorizadas
          schema:
            type: boolean
          example: true
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - NEGOTIATION_IN_PROGRESS
              - NEGOTIATION_CLOSED
              - ACQUISITION_FORWARDED
              - SENT_FOR_SERVICE
          description: |-
            Status da cotação de preços.




              * NEGOTIATION_IN_PROGRESS - Negociação em andamento,
              * NEGOTIATION_CLOSED - Negociação finalizada,
              * ACQUISITION_FORWARDED - Aquisição encaminhada,
              * SENT_FOR_SERVICE - Enviada para serviço
          example: NEGOTIATION_IN_PROGRESS
        - name: consistency
          required: false
          in: query
          schema:
            type: string
            enum:
              - IN_INCLUSION
              - CONSISTENT
              - INCONSISTENT
          description: |-
            Status da consistência da cotação de preços.




              * IN_INCLUSION - Em inclusão,
              * CONSISTENT - Consistente,
              * INCONSISTENT - Inconsistente
          example: CONSISTENT
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Consulta de cotações bem sucedida
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/PaginatedResponseOfPurchaseQuotationWithNegotiation
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /purchase-quotations/{purchaseQuotationId}/items:
    post:
      operationId: postPurchaseQuotationsIdItems
      x-section: Item de Cotação de Preço
      x-original-file: purchase-quotations-v1.yaml
      summary: Adiciona itens à cotação
      x-audience:
        - public
      tags:
        - Item de Cotação de Preço
      description: Cria um item de cotação de preço (REST)
      parameters:
        - $ref: '#/components/parameters/PurchaseQuotationId'
      requestBody:
        description: Item de cotação de preço a ser cadastrada
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseQuotationItemInsert'
            example:
              buildingId: 500
              productId: 1002
              detailId: 1
              trademarkId: 2
              quantity: 80
              unitySymbol: sc
              notes: Observação do item da cotação
              deliveryRequirements:
                - requirementDate: '2019-01-25'
                  requirementQuantity: 80
      responses:
        '201':
          description: Item de cotação de preço cadastrado
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /purchase-quotations/{purchaseQuotationId}/items/from-purchase-request:
    post:
      operationId: postPurchaseQuotationsIdItemsFromsPurchaseRequest
      x-section: Item de Cotação de Preço
      x-original-file: purchase-quotations-v1.yaml
      summary: Adiciona itens de solicitação
      x-audience:
        - public
      tags:
        - Item de Cotação de Preço
      description: Cria item de cotação com base na entrega da solicitação (REST)
      parameters:
        - $ref: '#/components/parameters/PurchaseQuotationId'
      requestBody:
        description: >-
          Entrega do item da solicitação de compra a ser utilizado para criar um
          item de cotação de preço
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/PurchaseRequestItemDeliveryRequirementInsert
            example:
              purchaseRequestId: 375
              purchaseRequestItemNumber: 1
              deliveryRequirementNumber: 2
      responses:
        '201':
          description: Item cadastrado com base na entrega da solicitação
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /purchase-quotations/{purchaseQuotationId}/items/{purchaseQuotationItemNumber}/suppliers:
    post:
      operationId: postPurchaseQuotationsIdItemsFromsPurchaseRequestSuppliers
      x-section: Fornecedor de Item de Cotação de Preço
      x-original-file: purchase-quotations-v1.yaml
      summary: Adiciona fornecedores ao item
      x-audience:
        - public
      tags:
        - Fornecedor de Item de Cotação de Preço
      description: Inclui um fornecedor no item da cotação de preço (REST)
      parameters:
        - $ref: '#/components/parameters/PurchaseQuotationId'
        - $ref: '#/components/parameters/PurchaseQuotationItemNumber'
      requestBody:
        description: Fornecedor a ser incluído no item da cotação de preço
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseQuotationItemSupplierInsert'
            example:
              supplierId: 15
      responses:
        '201':
          description: Fornecedor adicionado ao item da cotação de preço
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /purchase-quotations/{purchaseQuotationId}/suppliers/{supplierId}/negotiations:
    post:
      operationId: postPurchaseQuotationsIdSuppliersId
      x-section: Negociação de Cotação de Preço com o Fornecedor
      x-original-file: purchase-quotations-v1.yaml
      summary: Cria negociação com fornecedor
      x-audience:
        - public
      tags:
        - Negociação de Cotação de Preço com o Fornecedor
      description: Inclui uma nova negociação de cotação para um fornecedor (REST)
      parameters:
        - $ref: '#/components/parameters/PurchaseQuotationId'
        - name: supplierId
          in: path
          description: Id do Fornecedor do Item da Cotação de Preço
          required: true
          schema:
            type: integer
            format: int64
          example: 15
      responses:
        '201':
          description: Negociação da Cotação de Preço com Fornecedor incluída com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /purchase-quotations/{purchaseQuotationId}/suppliers/{supplierId}/negotiations/latest/authorize:
    patch:
      operationId: patchPurchaseQuotationsIdSuppliersIdNegotiationsLatestAuthorize
      x-section: Negociação de Cotação de Preço com o Fornecedor
      x-original-file: purchase-quotations-v1.yaml
      summary: Autoriza negociação
      x-audience:
        - public
      tags:
        - Negociação de Cotação de Preço com o Fornecedor
      description: Autoriza última negociação de cotação para o fornecedor (REST)
      parameters:
        - $ref: '#/components/parameters/PurchaseQuotationId'
        - name: supplierId
          in: path
          description: Id do fornecedor
          required: true
          schema:
            type: integer
            format: int32
          example: 15
      responses:
        '204':
          description: Operação finalizada com sucesso.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /purchase-quotations/{purchaseQuotationId}/suppliers/{supplierId}/negotiations/{negotiationNumber}:
    put:
      operationId: putPurchaseQuotationsIdSuppliersIdNegotiationsId
      x-section: Negociação de Cotação de Preço com o Fornecedor
      x-original-file: purchase-quotations-v1.yaml
      summary: Atualiza negociação
      x-audience:
        - public
      tags:
        - Negociação de Cotação de Preço com o Fornecedor
      description: Atualiza uma negociação de cotação de um fornecedor (REST)
      parameters:
        - $ref: '#/components/parameters/PurchaseQuotationId'
        - name: supplierId
          in: path
          description: Id do Fornecedor da Cotação de Preço
          required: true
          schema:
            type: integer
            format: int64
          example: 15
        - name: negotiationNumber
          in: path
          description: Número da negociação a ser atualizada
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        description: Dados da negociação a ser atualizada
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseQuotationNegotiationUpdate'
      responses:
        '204':
          description: Negociação da Cotação de Preço com Fornecedor atualizada com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /purchase-quotations/{purchaseQuotationId}/suppliers/{supplierId}/negotiations/{negotiationNumber}/items/{quotationItemNumber}:
    put:
      operationId: putPurchaseQuotationsIdSuppliersIdNegotiationsIdItemsId
      x-section: Item de Negociação de Cotação de Preço com Fornecedor
      x-original-file: purchase-quotations-v1.yaml
      summary: Atualiza item da negociação
      x-audience:
        - public
      tags:
        - Item de Negociação de Cotação de Preço com Fornecedor
      description: Item para atualização ou inclusão de novas entregas (REST)
      parameters:
        - $ref: '#/components/parameters/PurchaseQuotationId'
        - name: supplierId
          in: path
          description: Código do Fornecedor
          required: true
          schema:
            type: integer
            format: int64
          example: 71
        - name: negotiationNumber
          in: path
          description: Número da Negociação com o Fornecedor
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - $ref: '#/components/parameters/QuotationItemNumber'
      requestBody:
        description: >-
          Item da Negociação a ser atualizado. Podem ser incluídas novas
          entregas ou atualizar as existentes
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseQuotationNegotiationItemUpdate'
      responses:
        '204':
          description: Item da Negociação atualizada com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /purchase-quotations/comparison-map/pdf:
    get:
      operationId: getPurchaseQuotationsComparisonMapPdf
      x-section: Relatório de Mapa de Cotações
      x-original-file: purchase-quotations-v1.yaml
      summary: Gera PDF comparativo
      x-audience:
        - public
      tags:
        - Relatório de Mapa de Cotações
      description: Gera relatório em PDF do mapa de cotações e retorna URL. (REST)
      parameters:
        - name: purchaseQuotationId
          required: false
          in: query
          description: >-
            Código da cotação


            Obs.: Caso seja informado o parametro
            <code>purchaseQuotationId</code> não devem ser enviados os campos
            <code>buyerId</code>, <code>startDate</code> e <code>endDate</code>.
          schema:
            type: integer
          example: 1
        - name: supplierId
          required: false
          in: query
          description: Código do fornecedor da cotação
          schema:
            type: integer
          example: 12
        - name: buyerId
          required: false
          in: query
          description: Código do comprador
          schema:
            type: string
          example: USER
        - $ref: '#/components/parameters/BuildingIdQuery'
          description: Código da obra da cotação
        - $ref: '#/components/parameters/StartDateQueryRequired'
          description: >-
            Data de inicio do relatório de Mapa de Cotação. *Parametro
            obrigatório quando purchaseQuotationId não for informado.
        - $ref: '#/components/parameters/EndDateQueryRequired'
          description: >-
            Data de fim do relatório de Mapa de Cotação. *Parametro obrigatório
            quando purchaseQuotationId não for informado.
        - name: shortPrintFlag
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Imprime o relatorio resumido do mapa de cotações.
          example: false
        - name: printGeneralDataFlag
          in: query
          required: true
          schema:
            type: boolean
            default: true
          description: >-
            Imprime os dados gerais do mapa de cotações.


            *Parametro obrigatório quando <code>shortPrintFlag</code> estiver
            como <code>false</code>
          example: true
        - name: printNumberRequestsOriginatedQuotationsFlag
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Imprimir número das solicitações que originaram as cotações.
          example: false
        - name: highlightHighestAndLowestPriceFlag
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Destacar maior e menor preço.


            Obs: O parametro deve estar marcado como <code>false</code> caso
            <code>shortPrintFlag</code> esteja como <code>true</code>
          example: false
        - name: highlightChosenSupplierFlag
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Destacar fornecedor escolhido.


            Obs: O parametro deve estar marcado como <code>false</code> caso
            <code>shortPrintFlag</code> esteja como <code>true</code>
          example: false
        - name: displayTradingAuthorizationHistoryFlag
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Apresentar o histórico de autorização de negociação.


            Obs: O parametro deve estar marcado como <code>false</code> caso
            <code>shortPrintFlag</code> esteja como <code>true</code>
          example: false
        - name: displaySupplierGroupPerPageFlag
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Apresentar bloco de fornecedores por página.


            Obs: O parametro deve estar marcado como <code>false</code> caso
            <code>shortPrintFlag</code> esteja como <code>true</code>
          example: false
        - name: printQuotedPriceFlag
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Imprimir preço orçado.


            Obs: O parametro deve estar marcado como <code>false</code> caso
            <code>shortPrintFlag</code> esteja como <code>true</code>
          example: false
        - name: printInternalObservationFlag
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Imprimir observação interna dos insumos nas cotações.
          example: false
        - name: showTheBestAndLastPriceConsideringDetailAndBrandFlag
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            Apresentar o melhor e último preço considerando detalhe/marca.


            Obs: O parametro deve estar marcado como <code>false</code> caso
            <code>shortPrintFlag</code> esteja como <code>true</code>
          example: false
      responses:
        '200':
          description: Mapa de comparação
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/PurchaseQuotationComparisonMapReportPdfUrl
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  schemas:
    PurchaseQuotationInsert:
      description: Represanta a cotação de preço a ser cadastrada
      type: object
      required:
        - buyerId
        - date
      properties:
        buyerId:
          type: string
          description: Id do comprador (Usuário do Sienge)
          example: USER
        date:
          type: string
          format: date
          description: 'Data da cotação no formato ISO 8601 com a máscara: yyyy-MM-dd'
          example: '2019-01-21'
    PaginatedResponseOfPurchaseQuotationWithNegotiation:
      description: >-
        Represanta a lista de cotações com negociações retornadas como resultado
        da requisição
      type: object
      required:
        - resultSetMetadata
        - results
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseQuotationWithNegotiation'
          example:
            - purchaseQuotationId: 1
              buyerId: ANON_BUYER
              consistent: true
              status: Negociação em andamento
              quotationDate: '2018-03-11'
              responseDate: '2018-03-11'
              suppliers:
                - supplierId: 1
                  supplierName: Fornecedor
                  latestNegotiation:
                    - negotiationId: 1
                      responseDate: '2022-08-11'
                      discount: 10.1
                      shippingCosts: 0
                      itemsShipping: 0
                      ipiShippingFlag: S
                      ipiShippingCosts: 12.99
                      otherCosts: 12.99
                      totalItemsCosts: 12.99
                      totalItemsNegotiationCosts: 12.99
                      authorized: true
                      disapprovalReason: []
    PurchaseQuotationItemInsert:
      description: Representa o item de cotação de preço a ser cadastrado
      type: object
      required:
        - buildingId
        - productId
        - quantity
        - unitySymbol
        - deliveryRequirements
      properties:
        buildingId:
          type: integer
          format: int32
          example: 500
          description: Código da obra
        productId:
          type: integer
          format: int32
          example: 1002
          description: Código do insumo
        detailId:
          type: integer
          format: int32
          example: 1
          description: Código do detalhe do item de cotação
        trademarkId:
          type: integer
          format: int32
          example: 2
          description: Código da marca do item de cotação
        quantity:
          type: number
          format: double
          example: 80
          description: Quantidade do item de cotação
        unitySymbol:
          type: string
          example: sc
