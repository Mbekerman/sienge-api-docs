openapi: 3.1.1
info:
  title: Bulk-data Insumos da Obra
  version: 1.24.0
  description: API Bulk Data de Insumos da Obra.
paths:
  /building/resources:
    get:
      x-original-file: bulk-data-building-resource-v1.yaml
      x-audience:
        - public
      tags:
        - Bulk-data Insumos da Obra
      summary: Retorna Insumos associados à Obra por detalhe e marca
      operationId: getBuildingResources
      parameters:
        - $ref: '#/components/parameters/BuildingIdQueryRequired'
          description: >-
            Identificador único da obra para filtrar os insumos e suas
            apropriações associadas
        - $ref: '#/components/parameters/StartDateQueryRequired'
          description: Data de início, somente aplicado nas Apropriações Atendidas
        - $ref: '#/components/parameters/EndDateQueryRequired'
          description: Data de Término, somente aplicado nas Apropriações Atendidas
        - name: resourcesIds
          in: query
          description: >-
            Códigos dos Insumos a serem consultados.  Cada código deve ser um
            número inteiro, positivo e com, no máximo, 5 dígitos.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          example:
            - 12345
            - 54321
            - 11111
        - name: includeDisbursement
          in: query
          description: >-
            Parâmetro para trazer os desembolsos dos insumos associados à
            composição dos Itens de Orçamento. Não serão apresentadas
            informações de desembolso para Itens do Orçamento com preço
            informado.  Esse parâmetro é falso como padrão.
          schema:
            type: boolean
            default: false
        - name: bdi
          in: query
          description: >-
            Tipo de BDI ou percentual específico a ser utilizado no cálculo dos
            preços orçados.

            - Para o tipo de BDI os valores válidos são:
              - BUILDING (Obra)
              - RESOURCE_GROUPS (Grupos de insumo)
            - Para um percentual específico de BDI informar um valor numérico no
            formato "###.##" entre 0.00 e 999.99.
          schema:
            type: string
            default: '0.00'
        - name: laborBurden
          in: query
          description: >-
            Tipo de encargos sociais ou percentual específico a ser utilizado no
            cálculo dos preços orçados.

            - Para o tipo de encargos sociais os valores válidos são:
              - BUILDING (Obra)
              - RESOURCE_GROUPS (Grupos de insumo)
            - Para um percentual específico de encargos sociais informar um
            valor numérico no formato "###.##" entre 0.00 e 999.99.
          schema:
            type: string
            default: '0.00'
      responses:
        '200':
          description: >-
            Retorna um array dos Insumos associados à uma Obra por detalhe e
            marca. Se não existir nenhum, retorna um array vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBulkDataBuildingResource'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna um array dos Insumos associados à uma Obra por detalhe e marca.
        Observação: Não serão retornados os Insumos do tipo Item de Transporte e
        Item de Incidência. (BULK)
components:
  schemas:
    ResponseBulkDataBuildingResource:
      type: object
      description: >-
        Resposta contendo a lista de insumos associados a uma obra com seus
        respectivos detalhes, incluindo preços, categorias e apropriações
      properties:
        data:
          type: array
          example: []
          items:
            $ref: '#/components/schemas/BuildingResourceDto'
    BuildingResourceDto:
      type: object
      description: >-
        Representa um insumo de construção associado a uma obra específica,
        incluindo seus detalhes técnicos, características comerciais,
        informações de estoque e aspectos financeiros
      properties:
        id:
          type: integer
          description: Código do Insumo.
          example: 1
        buildingId:
          type: integer
          description: Código da Obra.
          example: 7
        buildingName:
          type: string
          description: Nome da Obra.
          example: Condomínio da Felicidade
        description:
          type: string
          description: Descrição do Insumo.
          example: Cimento
        unitOfMeasure:
          type: string
          description: Unidade de Medida.
          example: kg
        unitPrice:
          type: number
          description: Preço Unitário, com precisão de 4 casas decimais.
          example: 40.1236
        priceDate:
          type: string
          description: Data do preço.
          example: {}
        priceCategory:
          type: string
          description: >-
            Tipo de preço. [CALCULATED, INFORMED_BY_UNIT_PRICE, COMPOSITE,
            INFORMED_BY_HOUR].
          example: INFORMED_BY_UNIT_PRICE
        resourceCode:
          type: string
          description: Código auxiliar.
          example: MA001
        category:
          type: string
          description: >-
            Tipo do Insumo [EQUIPMENT, LABOR, MATERIAL, OTHER, OFFICE_SUPPLY,
            FUELS_AND_LUBRICANTS, MAINTENANCE_MATERIAL].
          example: MATERIAL
        resourceGroup:
          type: string
          description: Descrição Grupo de Insumo.
          example: Materiais de Consumo
        synonym:
          type: string
          description: Sinônimos do Insumo.
          example: cimento, massa, concreto
        financialCategory:
          type: string
          description: Descrição da Conta Financeira.
          example: Orçamento empresarial
        taxClassification:
          type: string
          description: Classificação Fiscal.
          example: CM001
        productTax:
          type: string
          description: Descrição do Produto Fiscal.
          example: Argamassa Pré-fabricada de Cimento
        isActive:
          type: boolean
          description: Situação do Insumo (Ativo = true, Inativo = false).
          example: true
        detailId:
          type: integer
          description: Id do Detalhe.
          example: 1
        detailDescription:
          type: string
          description: Descrição do Detalhe.
          example: CP II E 32
        trademarkId:
          type: integer
          description: Id da Marca.
          example: 1
        trademarkDescription:
          type: string
          description: Descrição da Marca.
          example: ACME
        minimumStock:
          type: number
          description: Estoque mínimo.
          example: 20
        maximumStock:
          type: number
          description: Estoque máximo.
          example: 200
        estimatedDeliveryTime:
          type: integer
          description: Tempo de entrega estimado em dias.
          example: 2
        hasServiceFeature:
          type: boolean
          description: Insumo com característica de Serviço para Desembolso.
          example: true
        deliveryInterval:
          type: integer
          description: Intervalo de entregas em dias para Desembolso.
          example: 15
        installments:
          type: array
          description: Parcelas.
          items:
            $ref: '#/components/schemas/InstallmentDto'
        movementUnits:
          type: array
          description: Unidades de Movimento.
          items:
            $ref: '#/components/schemas/MovementUnitDto'
        notes:
          type: array
          description: Observações do Insumo.
          items:
            $ref: '#/components/schemas/NoteDto'
        buildingCostEstimationItems:
          type: array
          description: Itens do Orçamento onde o Insumo está contido.
          items:
            $ref: '#/components/schemas/CostEstimateResourceDto'
        disbursements:
          type: array
          description: >-
            Relação de desembolsos do insumo. Cada item possui o ano, mês, valor
            e quantidade do desembolso. O cálculo de desembolso vai considerar
            percentuais de execução dos serviços.  Quando a definição do custo
            da tarefa no planejamento estiver incompleta, valor e quantidade dos
            desembolsos podem ser menores que as que constam no orçamento. A
            diferença também pode ser observada no "Relatório de Composições dos
            Custos da Tarefa".
          items:
            $ref: '#/components/schemas/DisbursementDto'
        remainingDisbursement:
          type: number
          description: >-
            Desembolso restante ou não vinculado no período. Valor que não pôde
            ser associado a um mês de execução. Cenário pode acontecer quando o
            intervalo de entrega do insumo é maior do que o período de
            planejamento que ele está vinculado. Pode ocorrer também quando pula
            um mês que tem execução. Valor monetário.
          example: 0
        buildingAppropriations:
          type: object
          properties:
            pending:
              type: array
              description: >-
                Apropriações pendentes são compostas por saldos de pedidos de
                compras e saldos de contratos do suprimentos. Os retornos serão
                em conformidade com a regra de negócio que já existe, conforme
                "Relatório de Apropriações de Insumos".
              items:
                $ref: '#/components/schemas/BuildingAppropriationDto'
            attended:
              type: array
              description: >-
                Apropriações atendidas são compostas por notas fiscais de compra
                e medições registradas. Os retornos serão em conformidade com a
                regra de negócio que já existe, conforme "Relatório de
                Apropriações de Insumos".
              items:
                $ref: '#/components/schemas/BuildingAppropriationDtoNF'
          description: Apropriações de Obra do Insumo.
    InstallmentDto:
      type: object
      description: >-
        Representa as condições de pagamento parcelado para recursos de
        construção, incluindo o prazo em dias e o percentual de cada parcela do
        desembolso financeiro
      properties:
        disbursementDays:
          type: integer
          description: Quantidade de dias.
          example: 30
        disbursementPercent:
          type: number
          description: percentual de desembolso.
          example: 50
    MovementUnitDto:
      type: object
      description: >-
        Representa uma unidade de movimentação para recursos de construção,
        incluindo seu símbolo, descrição e fatores de conversão para outras
        unidades de medida, permitindo o controle preciso do estoque e da
        utilização dos materiais
      properties:
        unitOfMeasureSymbol:
          type: string
          description: Unidade de medida.
          example: sc
        unitOfMeasureDescription:
          type: string
          description: Descrição da unidade de medida.
          example: Saca
        conversionFactor:
          type: number
          description: Fator de conversão.
          example: 1
        isDefault:
          type: boolean
          description: Unidade medida padrão
          example: true
        isActive:
          type: boolean
          description: Situação da unidade de medida.
          example: true
    NoteDto:
      type: object
      description: >-
        Representa os registros de apropriações de recursos por meio de notas
        fiscais, incluindo informações sobre quantidade, valor, data e
        documentos relacionados, permitindo o rastreamento e controle das
        entradas efetivas de materiais na obra
      properties:
        description:
          type: string
          description: Descrição
          example: Observação teste
    CostEstimateResourceDto:
      type: object
      description: >-
        Representa um item de orçamento associado a um recurso de construção,
        detalhando sua localização na estrutura organizacional da obra (EDT),
        quantidades, valores e identificação da unidade construtiva
      properties:
        buildingUnitId:
          type: integer
          description: >-
            Identificador único da unidade construtiva, utilizado para
            referenciar a estrutura física específica dentro do projeto.
          example: 1
        buildingUnitName:
          description: Nome da Unidade Construtiva.
          example: Unidade Exemplo
          type: string
        wbsCode:
          description: >-
            Código de referência do item de orçamento, representando a posição
            do mesmo na Estrutura de Decomposição do Trabalho (EDT).
          example: 01.001.000.001
          type: string
        description:
          description: Descrição do item de orçamento.
          example: Alvenaria de Tijolo Furado
          type: string
        sheetItemId:
          description: >-
            Identificador único imutável do item de orçamento no contexto da
            planilha (unidade construtiva).
          example: 25
          type: integer
        totalPrice:
          type: number
          description: >-
            Preço total calculo do insumo para o item de orçamento, com precisão
            de 2 casas.
          example: 1800.5
        quantity:
          type: number
          description: >-
            Quantidade total orçada do insumo para o item de orçamento, com
            precisão de 4 casas decimais.
          example: 560.3205
    DisbursementDto:
      type: object
      description: >-
        Define o fluxo financeiro mensal projetado para recursos de construção,
        calculado com base nos cronogramas de execução e planejamento da obra
      properties:
        year:
          description: Ano do Desembolso
          example: 2022
          type: number
        month:
          description: Mês do Desembolso
          example: 10
          type: number
        value:
          description: Valor do Desembolso
          example: 2500
          type: number
        quantity:
          type: number
          description: Quantidade do Desembolso
          example: 2
    BuildingAppropriationDto:
      type: object
      description: >-
        Representa o registro de apropriações e alocações de recursos em uma
        obra, incluindo detalhes sobre documentação, valores, quantidades e sua
        vinculação com itens do orçamento e unidades construtivas
      properties:
        documentLabel:
          type: string
          description: Código do Documento
          example: CT/0001
        date:
          type: string
          description: >-
            Data de Emissão do Título para Apropriações de Pedido, Contratos e
            Notas Fiscais. Para Medições é retornado a Data da Medição.
          example: {}
        costEstimationItemReference:
          type: string
          description: >-
            Código de referência do item de orçamento na EDT (Estrutura de
            Decomposição do Trabalho)
          example: 00.000.000.001
        costEstimationItemDescription:
          type: string
          description: Descrição do Item do Orçamento
          example: Alvenaria de Tijolo Furado
        buildingUnitId:
          type: integer
          description: Identificador único da unidade construtiva da obra.
          example: 1
        buildingUnitName:
          type: string
          description: Identificação da Unidade Construtiva.
          example: Observação teste
        quantity:
          type: number
          description: Quantidade Apropriada.
          example: 2000.1234
        percentage:
          type: number
          description: Percentual Apropriado.
          example: 25
        value:
          type: number
          description: Valor Apropriado.
          example: 2500
    BuildingAppropriationDtoNF:
      description: >-
        Representa o registro de apropriações de notas fiscais em obras,
        estendendo o DTO base para incluir dados específicos de documentos
        fiscais como a data de movimentação, permitindo rastrear o histórico das
        transações e sua contabilização no sistema
      allOf:
        - $ref: '#/components/schemas/BuildingAppropriationDto'
        - type: object
          properties:
            movementDate:
              type: string
              description: >-
                Data de movimento da Nota Fiscal. *Este campo só estará presente
                em apropriações originadas de Notas Fiscais.
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    BuildingIdQueryRequired:
      description: Código da obra (obrigatório)
      in: query
      name: buildingId
      required: true
      schema:
        example: 123
        format: int32
        type: integer
    StartDateQueryRequired:
      description: Data inicial para filtro de período
      in: query
      name: startDate
      required: true
      schema:
        example: '2023-01-01'
        format: date
        type: string
    EndDateQueryRequired:
      description: Data final para filtro de período
      in: query
      name: endDate
      required: true
      schema:
        example: '2023-01-31'
        format: date
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/bulk-data/v1
