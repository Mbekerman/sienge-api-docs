openapi: 3.1.1
info:
  title: Contratos de Vendas
  version: 1.24.0
  description: APIs para consulta, inclusão, alteração e exclusão de contratos de vendas.
paths:
  /sales-contracts:
    get:
      x-original-file: sales-contracts-v1.yaml
      x-section: Contrato
      x-audience:
        - public
      tags:
        - Contrato
      summary: Busca contratos de vendas ordenados pelo código.
      operationId: loadSalesContracts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: customerId
          in: query
          description: Código do cliente do contrato.
          schema:
            type: integer
            format: int32
            example: 1
        - name: companyId
          in: query
          description: Código da empresa a ser consultada
          schema:
            type: integer
            format: int32
            example: 1
        - name: enterpriseId
          in: query
          description: Id do empreendimento a ser consultado
          schema:
            type: integer
            format: int32
            example: 1
        - name: enterpriseName
          in: query
          description: Nome do empreendimento
          schema:
            type: string
            example: Residencial Primavera
        - name: externalId
          in: query
          description: Identificador externo
          schema:
            type: string
            example: EXT-001
        - name: unitId
          in: query
          description: Código da unidade
          schema:
            type: integer
            format: int32
            example: 1
        - name: number
          in: query
          description: Número do contrato a ser consultado
          schema:
            type: string
            example: CONTR-2025-0001
        - name: situation
          in: query
          description: >-
            Situação do contrato: * `0` - Solicitado * `1` - Autorizado * `2` -
            Emitido * `3` - Cancelado
          schema:
            type: array
            items:
              type: integer
          example:
            - 2
        - name: createdAfter
          in: query
          description: >-
            Data inicial para filtrar contratos pela data em que foram
            cadastrados. Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-01-01'
        - name: createdBefore
          in: query
          description: >-
            Data final para filtrar contratos pela data em que foram
            cadastrados. Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-01-01'
        - name: modifiedAfter
          in: query
          description: >-
            Data inicial para filtrar contratos pela data da última atualização.
            Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-01-01'
        - name: modifiedBefore
          in: query
          description: >-
            Data final para filtrar contratos pela data da última atualização.
            Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-01-01'
        - name: onlyContractsWithoutCommission
          in: query
          description: Considerar somente contratos sem comissão de venda.
          schema:
            type: boolean
            default: false
            example: false
        - name: initialIssueDate
          in: query
          description: >-
            Filtro para consultar contratos a partir da data de emissão
            informada. Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-01-01'
        - name: finalIssueDate
          in: query
          description: >-
            Filtro para consultar contratos até a data de emissão informada.
            Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-01-01'
        - name: initialCancelDate
          in: query
          description: >-
            Filtro para consultar contratos distratados a partir da data de
            distrato informada. Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-01-01'
        - name: finalCancelDate
          in: query
          description: >-
            Filtro para consultar contratos distratados até a da data de
            distrato informada. Formato: yyyy-MM-dd.
          schema:
            type: string
            example: '2025-01-01'
      responses:
        '200':
          description: Contratos encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesContractsGetArray'
              example:
                resultSetMetadata:
                  count: 1
                  limit: 10
                  offset: 0
                results:
                  - id: 1234
                    companyId: 10
                    internalCompanyId: 100
                    companyName: Softplan S.A.
                    enterpriseId: 20
