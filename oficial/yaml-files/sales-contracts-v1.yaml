    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    SalesContractId:
      name: salesContractId
      in: path
      description: Id do contrato de vendas.
      required: true
      schema:
        type: integer
        format: int32
    AttachmentId:
      description: ID do anexo
      in: path
      name: attachmentId
      required: true
      schema:
        format: int32
        type: integer
    GuarantorId:
      name: guarantorId
      in: path
      description: Id do avalista.
      required: true
      schema:
        type: integer
        format: int32
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
webhooks:
  SALES_CONTRACT_CREATED:
    post:
      tags:
        - Webhooks - Contratos de Vendas
      summary: Contrato de venda criado
      description: Sempre que um contrato de venda é criado
      operationId: salesContractCreatedWebhook
      requestBody:
        description: Dados do evento de criação de contrato
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesContractWebhookPayload'
            example:
              salesContractId: 123
        required: true
      responses:
        2XX:
          description: O evento SALES_CONTRACT_CREATED foi processado com sucesso
      x-audience:
        - public
  SALES_CONTRACT_UPDATED:
    post:
      tags:
        - Webhooks - Contratos de Vendas
      summary: Contrato de venda atualizado
      description: >-
        Sempre que um contrato de venda é atualizado (não recebe esse evento
        quando o contrato é emitido)
      operationId: salesContractUpdatedWebhook
      requestBody:
        description: Dados do evento de atualização de contrato
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesContractWebhookPayload'
            example:
              salesContractId: 123
        required: true
      responses:
        2XX:
          description: O evento SALES_CONTRACT_UPDATED foi processado com sucesso
      x-audience:
        - public
  SALES_CONTRACT_REMOVED:
    post:
      tags:
        - Webhooks - Contratos de Vendas
      summary: Contrato de venda removido
      description: Sempre que um contrato de venda é removido
      operationId: salesContractRemovedWebhook
      requestBody:
        description: Dados do evento de remoção de contrato
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesContractWebhookPayload'
            example:
              salesContractId: 123
        required: true
      responses:
        2XX:
          description: O evento SALES_CONTRACT_REMOVED foi processado com sucesso
      x-audience:
        - public
  SALES_CONTRACT_ISSUED:
    post:
      tags:
        - Webhooks - Contratos de Vendas
      summary: Contrato de venda emitido
      description: Sempre que um contrato de venda é emitido
      operationId: salesContractIssuedWebhook
      requestBody:
        description: Dados do evento de emissão de contrato
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesContractWebhookPayload'
            example:
              salesContractId: 123
        required: true
      responses:
        2XX:
          description: O evento SALES_CONTRACT_ISSUED foi processado com sucesso
      x-audience:
        - public
  SALES_CONTRACT_CANCELED:
    post:
      tags:
        - Webhooks - Contratos de Vendas
      summary: Contrato de venda cancelado
      description: Sempre que um contrato de venda é cancelado
      operationId: salesContractCanceledWebhook
      requestBody:
        description: Dados do evento de cancelamento de contrato
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesContractWebhookPayload'
            example:
              salesContractId: 123
        required: true
      responses:
        2XX:
          description: O evento SALES_CONTRACT_CANCELED foi processado com sucesso
      x-audience:
        - public
