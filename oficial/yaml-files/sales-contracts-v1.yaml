        - name: description
          in: query
          description: Descrição do anexo do contrato de vendas.
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  description: >-
                    Arquivo para inserção de anexo | Tamanho máximo: 70 MB |
                    Tamanho máximo do nome do arquivo: 100 caracteres | Somente
                    1 Anexo por requisição. Caso seja enviado mais de 1 Anexo, o
                    Sienge vai aceitar somente o primeiro selecionado.
                  format: binary
                  example: documento.pdf
            examples:
              exemplo1:
                summary: Exemplo de PDF
                value:
                  file: documento.pdf
        required: true
        description: Objeto para criação do anexo.
