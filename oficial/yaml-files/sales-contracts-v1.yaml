          type: array
          description: Lista de contratos retornados como resultado da pesquisa.
          items:
            $ref: '#/components/schemas/SalesContractGetDocument'
          example:
            - id: 1234
              companyId: 10
              internalCompanyId: 100
              companyName: Softplan S.A.
              enterpriseId: 20
              internalEnterpriseId: 200
              enterpriseName: Residencial Primavera
              receivableBillId: 555
              cancellationPayableBillId: 777
              contractDate: '2025-07-01'
              issueDate: '2025-07-02'
              accountingDate: '2025-07-03'
              expectedDeliveryDate: '2026-01-31'
              keysDeliveredAt: '2026-02-15'
              number: CONTR-2025-0001
              externalId: EXT-001
              correctionType: A
              situation: Ativo
              discountType: Nenhum
              discountPercentage: 0
              value: 350000
              totalSellingValue: 350000
              cancellationDate: '2025-12-31'
              totalCancellationAmount: 0
              cancellationReason: Desistência do comprador
              financialInstitutionNumber: '001'
              financialInstitutionDate: '2025-12-31'
              proRataIndexer: 1
              interestType: C
              interestPercentage: 1.5
              fineRate: 2
              lateInterestCalculationType: M
              dailyLateInterestValue: 0
              containsRemadeInstallments: false
              specialClause: Apartamento entregue mobiliado
              postHandoverIndexerId: 2
              postHandoverIndexerName: IGPM
              postHandoverInterestType: P
              postHandoverInterestPercentage: 1.5
              nfeContractType: 1
              nfeContractTypeDescription: 01.01.01 - Promessa / compromisso de compra e venda
              salesContractCustomers:
                - id: 1,
                  name: João Silva,
                  main: true,
                  spouse: false,
                  participationPercentage: 100,
    SalesContractInsertDocument:
      type: object
      description: Informações para criação do contrato de vendas
      properties:
        enterpriseId:
          type: integer
          description: Código do empreendimento ao qual o contrato será vinculado.
          format: int32
          example: 1
        externalId:
          type: string
          description: Identificador externo do contrato, gerado por outro sistema.
          example: A1
        number:
          type: string
          description: Número do contrato para inclusão.
          example: CONTR-2025-0001
        contractDate:
          type: string
          description: Data do contrato. Formato YYYY-MM-DD. Exemplo -> 1990-12-25.
          example: {}
        expectedDeliveryDate:
          type: string
          description: >
            Data de previsão de entrega. Formato YYYY-MM-DD. Exemplo ->
            1990-12-25. Este é um campo novo que passará a ser obrigatório.
          example: {}
        keysDeliveredAt:
          type: string
          example: {}
          description: >
            Data de entrega de chaves. Formato YYYY-MM-DD. Exemplo ->
            1990-12-25.

            Este campo era usado como data de previsão de entrega e passará a
            ser utilizado para a data de entrega de chaves.

            Caso o json contenha apenas este campo, continuará sendo preenchido
            como data de previsão de entrega, não preenchendo a data de entrega
            de chaves.

            A data informada neste campo será preenchida como data de entrega de
            chaves, apenas quando o campo 'expectedDeliveryDate' estiver
            preenchido.

            Este comportamento foi adotado por se tratar de um campo obrigatório
            no cadastro de contrato.'
        accountingDate:
          type: string
          description: Data contábil. Formato YYYY-MM-DD. Exemplo -> 1990-12-25.
          example: {}
        readjustAfterOf:
          type: string
          description: >-
            Corrigir parcelas a partir. Informar quando o campo 'correctionType'
            for 'A' .Formato YYYY-MM-DD. Exemplo -> 1990-12-25.
          example: {}
        saleType:
          type: string
          description: >-
            Tipo do contrato: C - Contrato, A - Alienação Fiduciária, P -
            Permuta
          enum:
            - C
            - A
            - P
          example: C
        correctionType:
          type: string
          description: 'Tipo de correção: A - Anual, M - Mensal'
          enum:
            - A
            - M
          example: A
        anualCorrectionType:
          type: string
          description: >-
            Tipo de correção anual: A - Aniversário, F - Fixa, M - Mensal, P -
            Programada
          enum:
            - A
            - F
            - M
            - P
          example: A
        generateResidue:
          type: string
          description: >-
            Gerar resíduo: S - Sim, N - Não (Campo pode ser informado quando
            'correctionType' for 'A')
          enum:
            - S
            - 'N'
          example: S
        diluteResidue:
          type: string
          description: >-
            Diluir valor do resíduo: S - Sim, N - Não (Campo pode ser informado
            quando 'correctionType' for 'A' e o campo 'generateResidue' for 'S')
          enum:
            - S
            - 'N'
          example: S
        financialPlanAccount:
          type: string
          description: Conta do plano financeiro. Informar apenas números. Exemplo -> 10101
          example: '10101'
        value:
          type: number
          description: Valor total do contrato. Formato -> 80000.00
          example: 80000
        totalSellingValue:
          type: number
          description: Preço total de venda. Formato -> 80000.00
          example: 80000
        note:
          type: string
          description: >-
            Observação do contrato. Texto livre com tamanho máximo aceito de
            3800 caracteres.
          example: Contrato de venda de unidade residencial.
        readjustEach:
          type: integer
          description: >-
            Corrigir parcelas a cada. Número de meses para correção dos valores
            das parcelas do contrato. Informar entre 1 e 12 . Exemplo -> (12
            para um contrato com correção anual e 1 para contrato com correção
            mensal).
          format: int32
          example: 12
        readjustMonth:
          type: integer
          description: >-
            Mês de reajuste. Informar o número correspondente ao mês de
            correção. Campo pode ser informado quando o campo
            'anualCorrectionType' for 'P', Valores aceitos de 1 a 12, valor
            padrão 1 .
          format: int32
          example: 1
        lateInterestDaily:
          type: boolean
          example: true
          description: >-
            Indica o tipo de cálculo de acréscimo de mora. Informe 'true' para
            ('D' - Diário) ou 'false' para ('M' - Mensal).<br> Caso não
            informado, por padrão, o tipo de cálculo de acréscimo de juros
            moratórios será (Mensal).<br> Os campos considerados para o cálculo
            serão os referentes ao tipo de cálculo de juros moratórios informado
            através deste campo.
        proRataIndexer:
          type: integer
          description: >-
            Id do indexador de pró-rata. Usado apenas para acréscimo de mora
            mensal.
          format: int32
          example: 1
        interestType:
          type: string
          description: >-
            Tipo de juros para acréscimos de mora: C - Composto, S - Simples
            (padrão: S, usado apenas para acréscimo de mora mensal)
          enum:
            - C
            - S
          example: C
        interestPercentage:
          type: number
          description: >-
            Percentual/taxa de juros ao mês para acréscimos de mora. Usado
            apenas para acréscimo de mora mensal.
          format: double
          example: 1.2
        fineRate:
          type: number
          description: >-
            Percentual de multa de acréscimo de mora. Apenas para acréscimo de
            mora mensal.
          format: double
          example: 1.2
        dailyLateInterestValue:
          type: number
          description: >-
            Valor de mora diário em reais. Usado apenas para acréscimo de mora
            diário.
          format: double
          example: 1.2
        housingProgram:
          type: string
          description: 'Programa habitacional: S - Sim, N - Não'
          enum:
            - S
            - 'N'
          example: S
        discountType:
          type: string
          description: >-
            Tipo de desconto do contrato: A - Anual, D - Diário, F - Fixo, M -
            Mensal
          enum:
            - A
            - D
            - F
            - M
          example: A
        discountPercentage:
          type: number
          description: Percentual de desconto a ser inserido no contrato.
          format: double
          example: 1.2
        specialClause:
          type: string
          description: >-
            Cláusula especial. Texto livre com tamanho máximo aceito de 3800
