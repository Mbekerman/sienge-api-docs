    SalesContractNfeContractTypeResponse:
      type:
        - integer
        - 'null'
      format: int32
      description: >-
        Tipo de contrato (NFe) do contrato. É null quando o tipo não foi
        informado no contrato. Valores: 1 = 01.01.01 - Promessa / compromisso de
        compra e venda; 2 = 01.01.02 - Compra e venda definitiva; 3 = 01.02.03 -
        Promessa / compromisso de dação em pagamento; 4 = 01.02.04 - Dação em
        pagamento definitiva; 5 = 04.13 - Permuta envolvendo exclusivamente bens
        imóveis (com ou sem torna); 6 = 04.15 - Permuta não enquadrada nos itens
        anteriores.
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - null
      example: 1
    SalesContractNfeContractTypeDescription:
      type:
        - string
        - 'null'
      description: >-
        Descrição do tipo de contrato (NFe) no formato 'código da operação -
        texto'. Campo somente leitura, derivado de 'nfeContractType'; não deve
        ser usado como chave. É null quando 'nfeContractType' é null.
      example: 01.01.01 - Promessa / compromisso de compra e venda
    Links:
      description: Links para acessar outros recursos
      example:
        - href: https://../v1/purchase-..
          rel: Recurso
      items:
        $ref: '#/components/schemas/Link'
      type: array
