openapi: 3.1.1
info:
  title: Reparcelamentos - Conta a Receber
  version: 1.24.0
  description: API de reparcelamentos.
paths:
  /remade-installments:
    get:
      x-original-file: remade-installments-v1.yaml
      x-section: Reparcelamento
      x-audience:
        - public
      tags:
        - Reparcelamento
      summary: Busca os reparcelamentos das parcelas no Sienge
      description: Busca os dados de reparcelamentos das parcelas no Sienge (REST)
      operationId: findRemadeInstallments
      parameters:
        - $ref: '#/components/parameters/BillReceivableId'
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/CostCenterId'
        - $ref: '#/components/parameters/OptionalCustomerId'
        - $ref: '#/components/parameters/RemadeDueDateStart'
        - $ref: '#/components/parameters/RemadeDueDateEnd'
      responses:
        '200':
          description: Reparcelamento(s) encontrado(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRemadeInstallmentsResponse'
              example:
                resultSetMetadata:
                  count: 100
                  offset: 1
                  limit: 20
                results:
                  - receivableBillId: 1
                    remadeDate: '2019-01-01'
                    customerDescription: Customer
                    remadeInstallmentsDescription: 1, 2, 3, 4
                    remadeValue: 100.99
                    generatedInstallmentsDescription: 5, 6, 7
                    generatedValue: 155.99
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    post:
      tags:
        - Reparcelamento
      summary: Realiza um reparcelamento.
      description: Realiza o reparcelamento das parcelas informadas. (REST)
      operationId: insertRemadeInstallment
      x-section: Reparcelamento
      x-original-file: remade-installments-v1.yaml
      x-audience:
        - public
      requestBody:
        description: Objeto para realizar o reparcelamento
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/RemadeInstallmentParameter'
            example:
              billReceivableId: 12345
              remadeDate: '2025-06-20'
              calculationDate: '2025-06-21'
              installments: 1/2/3/4
              builtInterestRule: A
              interestPresentValue: 10.5
              differenceType: A
              operationType: R
              remadeType: R
              remadeDescription: Reparcelamento de exemplo
              confirmLastReadjustmentDateChange: 'N'
              paymentConditions:
                - conditionTypeId: PM
                  totalValue: 1000
                  installmentsNumber: 5
                  firstPayment: '2025-07-01'
                  bearerId: 789
                  matchMaturities: S
                  indexerId: 55
                  baseDate: '2025-06-01'
                  interestType: P
                  interestPercentage: 1.5
                  monthsGracePeriod: 2
                  baseDateInterest: '2025-06-01'
        required: true
      responses:
        '201':
          description: Reparcelamento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedInstallment'
              example:
                installmentId: 101
                builtInterestValue: 50.75
                originalValue: 500
                originalDebitBalance: 2000
                amortizationValue: 450
                dueDate: '2025-07-01'
                baseDate: '2025-06-01'
                conditionType: PM
                indexerCode: 55
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    delete:
      tags:
        - Reparcelamento
      summary: Exclui um reparcelamento
      description: Exclui o reparcelamento de um título na data informada (REST)
      operationId: deleteRemadeInstallment
      x-section: Reparcelamento
      x-audience:
        - public
      parameters:
        - name: billReceivableId
          in: query
          description: Identificador único do título reparcelado
          required: true
          schema:
            type: integer
            format: int32
          example: 12345
        - name: remadeDate
          in: query
          description: 'Data do reparcelamento (formato: yyyy-MM-dd)'
          required: true
          schema:
            type: string
            format: date
          example: '2019-01-01'
        - name: validateGeneratedCollection
          in: query
          description: >-
            Se false, ignora a verificação de cobrança gerada nas parcelas antes
            de excluir. Omitir equivale a true
          required: false
          schema:
            type: boolean
            default: true
          example: true
      responses:
        '204':
          description: Exclusão realizada com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  schemas:
    GetRemadeInstallmentsResponse:
      required:
        - resultSetMetadata
        - results
      type: object
      description: Lista de reparcelamentos encontrados
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de reparcelamentos como resultado da pesquisa
          items:
            $ref: '#/components/schemas/CreatedRemadeInstallment'
          example:
            - receivableBillId: 1
              remadeDate: '2019-01-01'
              customerDescription: Customer
              remadeInstallmentsDescription: 1, 2, 3, 4
              remadeValue: 100.99
              generatedInstallmentsDescription: 5, 6, 7
              generatedValue: 155.99
    RemadeInstallmentParameter:
      type: object
      description: Corpo da requisição para realizar o reparcelamento
      properties:
        billReceivableId:
          type: integer
          description: Número do Título à ser reparcelado.
          format: int32
          example: 12345
        remadeDate:
          type: string
          description: Data do reparcelamento. Formato yyyy-MM-dd. Exemplo -> 1990-12-25.
          example: {}
        calculationDate:
          type: string
          description: Correção até. Formato yyyy-MM-dd. Exemplo -> 1990-12-25.
          example: {}
        installments:
          type: string
          description: Id das parcelas que serão reparceladas.
          example: 1/2/3/4
        builtInterestRule:
          type: string
          description: >-
            Indica qual valor da parcela com juros price deve ser usado no
            momento do reparcelamento: A - Valor Amortizado (sem juros
            embutido), I - Valor Integral (com juros embutido), V - Valor
            Presente
          enum:
            - A
            - I
            - V
          example: V
        interestPresentValue:
          type: number
          description: >-
            Valor do Juros presente, caso o atributo <code>builtInterestRule
            </code> enviado como "V"
          example: 1
        differenceType:
          type: string
          description: >-
            Tipo da diferença caso o valor de parcelas geradas for maior que o
            valor reparcelado: A - Aditivo, J - Juros, C - Correção
          enum:
            - A
            - J
            - C
          example: C
        operationType:
          type: string
          description: >-
            Tipo de operação para o reparcelamento: R - Remade (processo padrão
            com geração de novas parcelas), D - Delete (exclusão de parcelas sem
            geração de novas)
          enum:
            - R
            - D
          example: R
        remadeType:
          type: string
          description: >-
            Tipo de reparcelamento desejado: R - Reparcelamento, F - Alteração
            de financiamento, A - Acordo financeiro
          default: R
          enum:
            - R
            - F
            - A
          example: R
        remadeDescription:
          type: string
          description: Campo de texto para detalhamento sobre o reparcelamento.
          example: Reparcelamento de exemplo
        confirmLastReadjustmentDateChange:
          type: string
          description: >-
            Confirmação para alterar a data do último reajuste. <br> Requerido
            quando o parâmetro 291 estiver ativo e o título possuir correção
            anual. <br> Informar:<br> 'S' - Sim, alterar a data <br> 'N' - Não
            alterar a data
          default: 'N'
          enum:
            - S
            - 'N'
          example: 'N'
        paymentConditions:
          type: array
          description: Lista de Condição de Pagamento.
          items:
            $ref: '#/components/schemas/RemadeInstallmentsPaymentConditions'
          example:
            - conditionTypeId: PM
              totalValue: 1000
              installmentsNumber: 5
              firstPayment: '2025-07-01'
              bearerId: 789
              matchMaturities: S
              indexerId: 55
              baseDate: '2025-06-01'
              interestType: P
              interestPercentage: 1.5
              monthsGracePeriod: 2
              baseDateInterest: '2025-06-01'
    GeneratedInstallment:
      type: object
      properties:
        installmentId:
          type: integer
          description: Id da parcela.
          example: 101
        builtInterestValue:
          type: number
          description: Valor do juros embutido.
          example: 0
        originalValue:
          allOf:
            - description: Valor original da parcela.
              example: 1000
              type: number
          example: 500
        originalDebitBalance:
          type: number
          description: Saldo devedor original.
          example: 0
        amortizationValue:
          type: number
          description: Valor amortizado.
          example: 0
        dueDate:
          allOf:
            - description: Data de vencimento. Formato ISO 8601 (yyyy-MM-dd).
              example: 2018-12-22T00:00:00.000Z
              format: date
              type: string
          example: '2025-07-01'
        baseDate:
          type: string
          description: Data Base.
          example: '2025-06-01'
        conditionType:
          type: string
          description: Código do tipo de condição.
          example: PM
        indexerCode:
          allOf:
            - description: Código do indexador.
              example: 5
              type: integer
          example: 12
      description: Parcelas Geradas pelo Reparcelamento.
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    CreatedRemadeInstallment:
      type: object
      description: Dados de um reparcelamento.
      properties:
        receivableBillId:
          allOf:
            - $ref: '#/components/schemas/ReceivableBillCodeDescription'
            - type: integer
              format: int32
          example: 1
        remadeDate:
          type: string
          description: 'Data do reparcelamento. Formato esperado: yyyy-MM-dd.'
          format: date
          example: {}
        customerDescription:
          type: string
          description: Nome do cliente do título
          example: Ana
        remadeInstallmentsDescription:
          type: string
          description: Número das parcelas reparceladas
          example: 1, 2, 3, 4
        remadeValue:
          type: number
          description: Valor total das parcelas reparceladas
          format: double
          example: 100.99
        generatedInstallmentsDescription:
          type: string
          description: Número das parcelas geradas pelo reparcelamento
          example: 5, 6, 7
        generatedValue:
          type: number
          description: Valor total das parcelas geradas pelo reparcelamento
          format: double
          example: 155.99
    RemadeInstallmentsPaymentConditions:
      type: object
      properties:
        conditionTypeId:
          type: string
          description: Id da condição de pagamento
          example: PM
        totalValue:
          type: number
          description: Total do valor do reparcelamento.
        installmentsNumber:
          type: integer
          description: >-
            Quantidade de parcelas a serem geradas pelo
            <code>Reparcelamento</code>
        firstPayment:
          type: string
          description: >-
            Data do primeiro vencimento das parcelas geradas pelo
            reparcelamento.
        bearerId:
          allOf:
            - $ref: '#/components/schemas/BearerIdDescription'
            - type: integer
        matchMaturities:
          type: string
          description: 'Vencimentos podem coincidir com outras parcelas: S - Sim, N - Não'
          enum:
            - S
            - 'N'
        indexerId:
          type: integer
          description: Código do Indexador.
        baseDate:
          type: string
          description: Data base de cálculo do indexador.
        interestType:
          type: string
          description: >-
            Tipo do juros aplicado: N - Nenhum, P - Price, A - S.A.C, S -
            Simples, C - Composto, F - Fixo
          enum:
            - 'N'
            - P
            - A
            - S
            - C
            - F
        interestPercentage:
          type: number
          description: Percentual ao período.
        monthsGracePeriod:
          type: integer
          description: Meses de carência.
        baseDateInterest:
          type: string
          description: Data base para juros. Formato yyyy-MM-dd. Exemplo -> 1990-12-25.
      description: Condição de Pagamento
    ReceivableBillCodeDescription:
      description: Código do título
    BearerIdDescription:
      description: Código do portador
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    BillReceivableId:
      description: Número do título a receber
      in: query
      name: billReceivableId
      schema:
        example: 12345
        type: integer
    CompanyId:
      description: Código da empresa (opcional)
      in: query
      name: companyId
      schema:
        example: 101
        type: integer
    CostCenterId:
      description: Código do centro de custo (opcional)
      in: query
      name: costCenterId
      required: false
      schema:
        type: integer
    OptionalCustomerId:
      description: Código do cliente (opcional)
      in: query
      name: customerId
      schema:
        example: 1001
        type: integer
    RemadeDueDateStart:
      description: Data inicial para filtro do reparcelamento<br>(yyyy-MM-dd)
      in: query
      name: dueDateStart
      schema:
        format: date
        type: string
    RemadeDueDateEnd:
      description: Data final para filtro do reparcelamento<br>(yyyy-MM-dd)
      in: query
      name: dueDateEnd
      schema:
        format: date
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
