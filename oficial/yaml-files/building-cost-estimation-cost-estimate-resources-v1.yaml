openapi: 3.1.1
info:
  title: Insumos Orçados
  version: 1.24.0
  description: API de insumos orçados.
paths:
  /building-cost-estimations/{buildingId}/cost-estimate-resources:
    get:
      tags:
        - Insumos Orçados
      operationId: getBuildingCostEstimationsCostEstimateResources
      x-original-file: building-cost-estimation-cost-estimate-resources-v1.yaml
      description: Retorna um array com todos os insumos orçados na obra (REST)
      x-audience:
        - public
      summary: Retorno um array com todos os insumos orçados
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BuildingUnitIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  responses:
    '200':
      description: Requisição bem-sucedida, retorna um array com os insumos orçados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetResponseCostEstimateResources'
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  schemas:
    GetResponseCostEstimateResources:
      description: >-
        Retorna um array com todos os insumos orçados. Se não existir nenhum,
        retorna um array vazio.
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          items:
            $ref: '#/components/schemas/CostEstimateResource'
          example:
            - id: 1
              name: Insumo 1
              buildingUnitId: 1
      example:
        resultSetMetadata:
          offset: 0
          limit: 100
          count: 1
        results:
          - id: 1
            name: Insumo 1
            buildingUnitId: 1
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    CostEstimateResource:
      description: Dados de um insumo orçado.
      type: object
      properties:
        id:
          description: Id do insumo
          example: 1001
          format: int32
          type: integer
        sheetItemId:
          description: >-
            Identificador único imutável do item de orçamento no contexto da
            planilha (unidade construtiva).
          example: 25
          type: integer
        sheetItemWbsCode:
          description: >-
            Código de referência do item de orçamento, representando a posição
            do mesmo na Estrutura de Decomposição do Trabalho (EDT).
          example: 01.001.000.001
          type: string
        resourceCode:
          description: Código auxiliar do insumo
          example: M1354
          type: string
        description:
          description: Descrição do insumo
          example: Cimento Portland
          type: string
        unitOfMeasure:
          description: Símbolo da unidade de medida básica do insumo
          example: kg
          type: string
        quantity:
          description: Quantidade de insumos com precisão de 6 casas.
          example: 23.323022
          type: number
        unitPrice:
          description: Preço unitário do insumo com precisão de 4 casas.
          example: 9.0009
          type: number
        totalPrice:
          description: Preço total do insumo com precisão de 4 casas.
          example: 209.9111
          type: number
        priceDate:
          description: Data do preço unitário do insumo.
          example: {}
          type: string
        detailId:
          type: integer
          example: 5
          description: Código do detalhe. Pode ser nulo.
        detailDescription:
          type: string
          example: CP II-E-32
          description: Descrição do detalhe. Pode ser nulo.
        trademarkId:
          type: integer
          example: 42
          description: Código da marca. Pode ser nulo.
        trademarkDescription:
          type: string
          example: ACME SA
          description: Descrição da marca. Pode ser nulo.
        buildingUnitId:
          description: Código da unidade construtiva
          example: 123
          format: int32
          type: integer
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  parameters:
    BuildingIdPath:
      description: Identificador único da obra
      in: path
      name: buildingId
      required: true
      schema:
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    BuildingUnitIdQuery:
      in: query
      name: buildingUnitId
      description: Código da unidade construtiva utilizado como filtro da consulta.
      required: false
      schema:
        description: Código da unidade construtiva
        example: 123
        format: int32
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
