      summary: Consulta diário específico
      operationId: getConstructionDailyReportIdId
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: Identificador único da obra no qual o diário será vinculado
        - name: constructionDailyId
          in: path
          description: Código do diário de obra
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Retorna detalhes do Diário de Obra requisitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructionDailyReportDtoGet'
