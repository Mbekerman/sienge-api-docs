        - $ref: '#/components/parameters/BuildingIdPath'
          description: Identificador único da obra onde o diário está sendo registrado
        - name: constructionDailyId
          in: path
          description: Identificador único do diário de obra que será excluído
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Sem conteúdo.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Deleta um Diário de Obra, exceto aqueles que tenham sido usados em uma
        Integração. (REST)
  /construction-daily-report/{buildingId}/{constructionDailyId}/attachments:
    post:
      x-original-file: construction-daily-report-v1.yaml
      x-section: Anexos do Diário de Obra
      x-audience:
        - public
      tags:
        - Anexos do Diário de Obra
      summary: Adiciona anexo ao diário
      operationId: getConstructionDailyReportIdIdAttachments
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: código da Obra
        - name: constructionDailyId
          in: path
          description: código do Diário de Obra.
          required: true
          schema:
            type: integer
        - name: description
          in: query
          description: 'Descrição do anexo | Máximo: 500 caracteres '
          required: true
          schema:
            maxLength: 500
            type: string
        - name: localId
          in: query
          description: 'Só é aceito para os arquivos do tipo imagem: JPG, JPEG e PNG'
          schema:
            type: integer
        - name: showInReports
          in: query
          description: 'Somente aceitam true arquivos do tipo imagem: JPG, JPEG e PNG'
          schema:
            type: boolean
      requestBody:
        description: Arquivo a ser anexado ao Diário de Obra
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  description: >-
                    Arquivo para inserção | Tipo: multipart/form-data | Tamanho
                    máximo: 70 MB | Tamanho máximo do nome do arquivo: 100
                    caracteres | Somente 1 Anexo por requisição.  Caso seja
                    enviado mais de 1 Anexo, o Sienge vai aceitar somente o
                    primeiro selecionado.
                  format: binary
                  example: example.pdf
        required: true
      responses:
        '201':
          description: Anexo inserido com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Inclui anexo em um Diário de Obra (REST)
