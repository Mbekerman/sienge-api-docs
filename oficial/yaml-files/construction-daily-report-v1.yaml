openapi: 3.1.1
info:
  title: Diário de Obra
  version: 1.24.0
  description: >-
    Gerencia registros diários de atividades, equipes, equipamentos e eventos
    ocorridos durante a execução da obra, permitindo documentação detalhada com
    anexos e localização
paths:
  /construction-daily-report:
    get:
      x-original-file: construction-daily-report-v1.yaml
      x-audience:
        - public
      tags:
        - Diário de Obra
      summary: Retorna os Diários das Obras paginados.
      operationId: getConstructionDailyReport
      parameters:
        - $ref: '#/components/parameters/BuildingIdQuery'
        - $ref: '#/components/parameters/StartDateQuery'
          description: >-
            Data de início da busca (data do Diário de Obra) no formato:
            yyyy-MM-dd. Exemplo: 2018-03-01
        - $ref: '#/components/parameters/EndDateQuery'
          description: >-
            Data de fim da busca (data do Diário de Obra) no formato:
            yyyy-MM-dd. Exemplo: 2018-03-11
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Consulta de Diários de Obra realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructionDailyReportsDtoPaginated'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Retorna os Diários das Obras paginados (REST)
    post:
      tags:
        - Diário de Obra
      summary: Cadastra novo diário de obra
      operationId: postConstructionDailyReport
      requestBody:
        description: Dados para cadastro de um Diário de Obra
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstructionDailyReportDto'
        required: true
      responses:
        '201':
          description: um novo diário de obra cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructionDailyReportsDtoForReponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: construction-daily-report-v1.yaml
      description: >-
        Cadastra um Diário de Obra, com informações de tarefas, ocorrências,
        equipes e equipamentos. (REST)
      x-audience:
        - public
  /construction-daily-report/{buildingId}/{constructionDailyId}:
    get:
