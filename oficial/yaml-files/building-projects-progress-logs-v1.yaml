openapi: 3.1.1
info:
  title: Acompanhamentos de Obra
  version: 1.24.0
  description: >-
    API responsavel por gerenciar e controlar o acompanhamento de obras,
    permitindo o registro de medições e o controle de percentuais de avanço.
paths:
  /building-projects/{buildingId}/progress-logs:
    post:
      tags:
        - Acompanhamentos de Obra
      summary: Atualiza percentual de avanço físico das Tarefas.
      operationId: getBuildingProjectsIdProgressLogs
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: Código da Obra, necessario para criar uma nova Medição.
      requestBody:
        description: >-
          Dados para geração da Medição, com data e itens a serem medidos. É
          necessário passar apenas as Tarefas que tenham tido algum avanço
          físico realizado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressLogDtoForPost'
        required: true
      responses:
        '201':
          description: Uma nova Medição foi criada com sucesso.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: building-projects-progress-logs-v1.yaml
      x-audience:
        - public
      description: ' (REST)'
  /building-projects/progress-logs:
    get:
      x-original-file: building-projects-progress-logs-v1.yaml
      x-audience:
        - public
      tags:
        - Acompanhamentos de Obra
      summary: Consulta progressos do Planejamento de Obras.
      operationId: getBuildingProjectsProgressLogs
      parameters:
        - $ref: '#/components/parameters/BuildingIdQuery'
          description: >-
            Código da Obra relacionada ao Planejamento cujo progresso deve ser
            consultado
        - name: buildingUnitId
          in: query
          description: >-
            Unidade Construtiva da Obra.  Ao informar uma Unidade Construtiva, o
            resultado da consulta será somente as Medições que possuirem Itens
            medidos para a Unidade Construtiva informada. O uso desse parâmetro
            obriga que seja informado um valor no parâmetro buildingId.
          schema:
            type: integer
            format: int32
        - name: measurementStartDate
          in: query
          description: >-
            Data de início da busca (data da Medição) no formato: yyyy-MM-dd.
            Exemplo: 2022-03-01
          schema:
            type: string
        - name: measurementEndDate
          in: query
          description: >-
            Data de fim da busca (data da Medição) no formato: yyyy-MM-dd.
            Exemplo: 2022-03-11
          schema:
            type: string
        - name: consistent
          in: query
          description: >-
            Busca somente Medições consistentes quando true ou somente
            inconsistentes quando false
          schema:
            type: boolean
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: >-
            Consulta de progressos do Planejamento de Obras realizada com
            sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfProgressLogDtosFotGet'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Consulta os progressos do Planejamento de Obras. A data de início e fim
        da busca podem ser informadas para restringir a busca. Além disso, é
        possível buscar apenas Medições consistentes ou inconsistentes. Caso a
        Unidade Construtiva seja informada, o resultado da consulta será somente
        as Medições que possuirem Itens medidos para a Unidade Construtiva
        informada. (REST)
  /building-projects/{buildingId}/progress-logs/{measurementNumber}:
    get:
      x-original-file: building-projects-progress-logs-v1.yaml
      x-audience:
        - public
      tags:
        - Acompanhamentos de Obra
      summary: Consulta o progresso do Planejamento de uma Obra.
      operationId: getBuildingProjectsIdProgressLogsId
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: >-
            Código da Obra, necessario para consultar o progresso do
            Planejamento da Obra.
        - name: measurementNumber
          in: path
          description: Identificador numérico da Medição de progresso da obra
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: >-
            Consulta realizada com sucesso. Retorna os dados de progresso do
            planejamento da obra solicitada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressLogDto'
              example:
                id: 1
                date: '2023-05-10'
                buildingId: 1
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Recupera as informações de um progresso específico do Planejamento de
        uma Obra. (REST)
  /building-projects/{buildingId}/progress-logs/{measurementNumber}/items/{buildingUnitId}:
    get:
      x-original-file: building-projects-progress-logs-v1.yaml
      x-audience:
        - public
      tags:
        - Acompanhamentos de Obra
      summary: Consulta itens de uma medição específica.
      operationId: getBuildingProjectsIdProgressLogsIdItemsId
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: Código da Obra cujo progresso do Planejamento está sendo consultado
        - name: measurementNumber
          in: path
          description: Número da Medição
          required: true
          schema:
            type: integer
            format: int32
        - name: buildingUnitId
          in: path
          description: Código da Unidade Construtiva da Obra
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: >-
            Consulta realizada com sucesso. Retorna os itens detalhados da
            medição específica para a unidade construtiva selecionada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOfMeasurementItemDtos'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Recupera as informações dos itens de uma medição específica do
        Planejamento de uma Obra. (REST)
components:
  schemas:
    ProgressLogDtoForPost:
      type: object
      description: >-
        Representa o progresso de uma Obra em uma determinada data. O progresso
        é composto por uma lista de Tarefas com seus respectivos percentuais
        medidos.
      properties:
        date:
          type: string
          description: Data da Medição
          format: yyyy-MM-dd
          example: {}
        items:
          type: array
          description: >-
            Lista de Tarefas com percentual medido. Não é necessário informar
            Tarefas que não tiveram mudanças de avanço fisíco, apenas as que
            tiverem um percentual atualizado desde a última Medição registrada.
          items:
            $ref: '#/components/schemas/ProgressLogItemDtoForPost'
          example:
            - buildingUnitId: 1
              taskId: 109
              cumulativePercentage: 80
            - buildingUnitId: 2
              taskId: 110
              cumulativePercentage: 65.5
    ListOfProgressLogDtosFotGet:
      required:
        - resultSetMetadata
        - results
      type: object
      description: Lista paginada de medições de progresso do planejamento de obras
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: >-
            Lista de progresso do Planejamento de Obras retornadas como
            resultado da Requisição
          items:
            $ref: '#/components/schemas/ProgressLogDtoForGet'
          example:
            - buildingId: 1
              measurementNumber: 2
              date: '2022-03-11'
              responsibleId: NOME
              responsibleName: NOME SOBRENOME
              consistent: false
              statusApproval: APROVADA
    ProgressLogDto:
      description: >-
        Representa os dados de uma medição de progresso do planejamento de
        obras, incluindo observações e unidades construtivas
      allOf:
        - $ref: '#/components/schemas/ProgressLogDtoForGet'
        - type: object
          properties:
            notes:
              type: string
              description: Observação da Medição
              example: Uma observação da Medição.
            buildingUnits:
              type: array
              description: >-
                Lista contendo apenas as Unidades Construtivas cujas Tarefas
                possuem valores medidos de avanço físico.
              items:
                $ref: '#/components/schemas/BuildingUnitDto'
    ListOfMeasurementItemDtos:
      required:
        - resultSetMetadata
        - results
      type: object
      description: >-
        Lista paginada de itens de uma medição específica do Planejamento de uma
        Obra.
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de itens da Medição.
          items:
            $ref: '#/components/schemas/MeasurementItemDto'
          example:
            - taskId: 1
              presentationId: 1
              summary: true
              description: Alvenaria de Tijolo Furado
              unitOfMeasurement: m2
              plannedQuantity: 1000.3254
              measuredQuantity: 102.9362
              unitPrice: 10
              cumulativePercentage: 58.56
              measureBalance: 325.4825
    ProgressLogItemDtoForPost:
      type: object
      description: >-
        Representa um item de progresso de uma tarefa específica dentro de uma
        unidade construtiva, contendo seu percentual acumulado de avanço.
      properties:
        buildingUnitId:
          type: number
          description: >-
            Identificador único da Planilha de Tarefas (sheetId), que é
            representado pelo código da Unidade Construtiva.
          example: 1
        taskId:
          type: number
          description: Identificador único da tarefa no sistema de planejamento de obras
          example: 109
        cumulativePercentage:
          type: number
          description: Percentual acumulado de avanço da Tarefa
          example: 80
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    ProgressLogDtoForGet:
      type: object
      description: >-
        Representa os dados básicos de uma medição de progresso do planejamento
        de obras
      properties:
        buildingId:
          type: integer
          description: >-
            Identificador único da obra utilizado para rastreamento e controle
            das medições
          example: 1
        measurementNumber:
          type: integer
          description: Identificador numérico da Medição do planejamento da obra
          example: 2
        date:
          type: string
          description: 'Data da Medição no formato: yyyy-MM-dd.'
          example: {}
        responsibleId:
          type: string
          description: Id do responsável pela Medição.
          example: NOME
        responsibleName:
          type: string
          description: Nome do responsável pela Medição.
          example: NOME SOBRENOME
        consistent:
          type: boolean
          description: >-
            Retornará verdadeiro se Medição estiver consistente, caso contrário
            retornará falso.
          example: false
        statusApproval:
          type: string
          description: >-
            Código da situação de aprovação da Medição. [APROVADA, REPROVADA,
            EM_ELABORACAO, EM_APROVACAO]
          example: APROVADA
    BuildingUnitDto:
      type: object
      description: Representa uma unidade construtiva de uma obra
      properties:
        id:
          type: number
          description: Id da Unidade Construtiva
          example: 1
        description:
          type: string
          description: Descrição da Unidade Construtiva
          example: Bloco A
    MeasurementItemDto:
      type: object
      description: Representa um item de medição de uma tarefa do planejamento de obra
      properties:
        taskId:
          type: integer
          description: Código Interno da Tarefa
          example: 1
        presentationId:
          type: integer
          description: Código Visível da Tarefa
          example: 1
        summary:
          type: boolean
          description: Indica se o Item é Agrupador
          example: true
        description:
          type: string
          description: Descrição da tarefa
          example: Alvenaria de Tijolo Furado
        unitOfMeasurement:
          type: string
          description: >-
            Indica a unidade de dimensionamento físico utilizada para
            quantificar a tarefa (ex. m², m³, kg, un)
          example: m2
        plannedQuantity:
          type: number
          description: >-
            Quantidade total planejada para esta Tarefa com precisão de 4 casas
            decimais
          example: 1000.3254
        measuredQuantity:
          type: number
          description: >-
            Quantidade que foi registrada nesta medição com precisão de 4 casas
            decimais
          example: 102.9362
        unitPrice:
          type: number
          description: >-
            Preço Unitário da Tarefa, sem BDI, sem Encargos Sociais e Preço por
            Composição da Planilha. Com precisão de 2 casas decimais
          example: 25.58
        cumulativeMeasuredQuantity:
          type: number
          description: >-
            Quantidade acumulada considerando a soma deste e todos os registros
            anteriores. Com precisão de 4 casas decimais
          example: 585.735
        cumulativePercentage:
          type: number
          description: >-
            percentual acumulado considerando  a soma de todas as quantidades já
            registradas para este evento dividido pela quantidade planejada. Com
            precisão de 2 casas decimais
          example: 58.56
        measureBalance:
          type: number
          description: >-
            Saldo quantitativo a medir desta Tarefa com precisão de 4 casas
            decimais.
          example: 325.4825
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    BuildingIdPath:
      description: Identificador único da obra
      in: path
      name: buildingId
      required: true
      schema:
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    BuildingIdQuery:
      description: Código da obra (opcional)
      in: query
      name: buildingId
      required: false
      schema:
        example: 123
        format: int32
        type: integer
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
