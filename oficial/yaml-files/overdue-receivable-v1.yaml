openapi: 3.1.1
info:
  title: Geração de Cobrança de Parcelas Vencidas
  version: 1.24.0
  description: Geração de cobrança de parcelas vencidas (automação bancária)
paths:
  /overdue-receivable-bill:
    post:
      tags:
        - Geração de Cobrança de Parcelas Vencidas
      summary: Registra cobrança de parcelas vencidas
      operationId: postOverdueReceivableBill
      requestBody:
        description: Informações para registrar cobrança de parcelas vencidas.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverdueReceivableInputDto'
        required: true
      responses:
        '201':
          description: Cobrança gerada com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: overdue-receivable-v1.yaml
      description: >-
        Cria nova cobrança para parcelas em atraso com configurações de juros,
        multa e agrupamento. (REST)
      x-audience:
        - public
components:
  schemas:
    OverdueReceivableInputDto:
      type: object
      description: >-
        Dados necessários para registrar cobrança de parcelas vencidas com
        configurações de juros e multa
      required:
        - checkingAccountId
        - companyId
        - correctAnnualInstallment
        - groupedInstalments
        - installments
        - newDueDate
        - receivableBillId
      properties:
        receivableBillId:
          description: Identificador do título a receber
          example: 10
          format: int32
          type: integer
        companyId:
          type: integer
          description: Identificador empresa da conta corrente
          format: int32
          example: 1
        checkingAccountId:
          type: string
          description: Código da conta corrente
          example: 6538-2
        newDueDate:
          type: string
          format: date
          description: Data do vencimento da cobrança
          example: '2021-01-01'
        interestPercentage:
          type: number
          description: Porcentagem de juros
          example: 5.98
        finePercentage:
          type: number
          description: Porcentagem de multa
          example: 5.98
        insurancepercentage:
          type: number
          description: Porcentagem de seguro
          example: 5.98
        correctAnnualInstallment:
          type: boolean
          description: Corrigir parcelas com correção anual
          example: true
        groupedInstalments:
          type: boolean
          description: Agrupar parcelas em uma única cobrança
          example: true
        installments:
          type: array
          description: Lista das parcelas vencidas
          example:
            - installmentId: 123
            - installmentId: 456
          items:
            required:
              - installmentId
            type: object
            properties:
              installmentId:
                description: Identificador da parcela do título
                example: 1
                format: int32
                type: integer
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
