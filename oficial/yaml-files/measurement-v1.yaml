      description: Lista os itens medidos na medição solicitada. (REST)
      tags:
        - Itens da Medição de Contrato
      parameters:
        - $ref: '#/components/parameters/RequiredDocumentId'
        - $ref: '#/components/parameters/RequiredContractNumber'
        - $ref: '#/components/parameters/RequiredBuildingId'
        - $ref: '#/components/parameters/requiredMeasurementNumber'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: >-
            Retorna um array com os itens medidos nesta medição. Caso não
