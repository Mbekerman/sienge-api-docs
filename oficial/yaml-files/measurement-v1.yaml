openapi: 3.1.1
info:
  title: Medições de Contratos de Suprimentos
  version: 1.24.0
  description: API para Medições de Contratos de Suprimentos
paths:
  /supply-contracts/measurements:
    get:
      operationId: getMeasurements
      x-section: Medição de Contrato
      summary: Consulta medições
      x-implementation:
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/measurement/MeasurementController.java
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.measurement.MeasurementController
        method: getById
      x-original-file: measurement-v1.yaml
      x-audience:
        - public
      description: Retorna os dados da medição informada. (REST)
      tags:
        - Medição de Contrato
      parameters:
        - $ref: '#/components/parameters/RequiredDocumentId'
        - $ref: '#/components/parameters/RequiredContractNumber'
        - $ref: '#/components/parameters/RequiredBuildingId'
        - $ref: '#/components/parameters/requiredMeasurementNumber'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    post:
      operationId: postSupplyContractsMeasurementsAttachments
      x-section: Medição de Contrato
      summary: Cria uma nova medição para o respectivo contrato e obra.
      x-implementation:
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/measurement/PostMeasurementController.java
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.measurement.PostMeasurementController
        method: post
      x-original-file: measurement-v1.yaml
      x-audience:
        - public
      description: Cadastra uma nova medição para o contrato e a obra informados. (REST)
      tags:
        - Medição de Contrato
      parameters:
        - $ref: '#/components/parameters/RequiredDocumentId'
        - $ref: '#/components/parameters/RequiredContractNumber'
        - $ref: '#/components/parameters/RequiredBuildingId'
      requestBody:
        description: Informações da medição a ser cadastrada.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMeasurementDto'
      responses:
        '201':
          description: A medição foi criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementCreatedDto'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /supply-contracts/measurements/all:
    get:
      operationId: listMeasurements
      x-section: Medições de Contratos
      summary: Consulta medições de contratos
      x-implementation:
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/measurement/allmeasurements/MeasurementsController.java
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.measurement.allmeasurements.MeasurementsController
        method: get
      x-original-file: measurement-v1.yaml
      x-audience:
        - public
      description: Lista medições de contratos conforme os filtros informados. (REST)
      tags:
        - Medições de Contratos
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/ContractNumber'
        - $ref: '#/components/parameters/BuildingId'
        - $ref: '#/components/parameters/measurementNumber'
        - name: contractSupplierId
          in: query
          description: Id do Fornecedor do Contrato (Contratante)
          schema:
            type: integer
            format: int32
        - name: contractCustomerId
          in: query
          description: Id do Cliente do Contrato (Contratada)
          schema:
            type: integer
            format: int32
        - $ref: '#/components/parameters/measurementDate'
        - name: measurementStartDate
          in: query
          description: >
            Limite inferior para o valor de "data da medição" das medições a
            serem retornadas. Medições cuja "data da medição" seja menor que o
            limite inferior não serão retornadas.


            Formato: `yyyy-MM-dd`
          schema:
            description: |
              Data da medição

              Formato: `yyyy-MM-dd`
            type: string
            format: date
            example: '2021-04-18'
          example: '2022-01-01'
        - name: measurementEndDate
          in: query
          description: >
            Limite superior para o valor de "data da medição" das medições a
            serem retornadas. Medições cuja "data da medição" seja maior que o
            limite superior não serão retornadas.


            Formato: `yyyy-MM-dd`
          schema:
            description: |
              Data da medição

              Formato: `yyyy-MM-dd`
            type: string
            format: date
            example: '2021-04-18'
          example: '2022-01-31'
        - name: statusApproval
          in: query
          description: |
            Código da situação de aprovação da medição.
            - `D` - DISAPPROVED
            - `A` - APPROVED
          schema:
            type: string
            enum:
              - D
              - A
        - name: authorization
          in: query
          description: |
            Status de autorização da medição.
            - `T` - Todos
            - `S` - Reprovados
            - `A` - Aprovados
            - `N` - Aguardando autorização
          schema:
            type: string
            enum:
              - T
              - S
              - A
              - 'N'
        - name: consistency
          in: query
          description: |
            Status da situação de consistência da medição.
            - `T` - Todos
            - `S` - Consistente
            - `N` - Inconsistente
            - `I` - Inclusão
          schema:
            type: string
            enum:
              - T
              - S
              - 'N'
              - I
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Requisição executada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationResultMeasurementsResultDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /supply-contracts/measurements/attachments:
    get:
      operationId: getSupplyContractsMeasurementsAttachments
      x-section: Anexos de Medição de Contrato
      summary: Download anexos de medição de contrato
      x-implementation:
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/measurement/attachmentdownload/MeasurementAttachmentContentFileController.java
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.measurement.attachmentdownload.MeasurementAttachmentContentFileController
        method: download
      x-original-file: measurement-v1.yaml
      x-audience:
        - public
      description: Realiza o download dos anexos de uma medição de contrato. (REST)
      tags:
        - Anexos de Medição de Contrato
      parameters:
        - $ref: '#/components/parameters/RequiredDocumentId'
        - $ref: '#/components/parameters/RequiredContractNumber'
        - $ref: '#/components/parameters/RequiredBuildingId'
        - $ref: '#/components/parameters/requiredMeasurementNumber'
        - name: attachmentNumber
          in: query
          description: Número do anexo
          required: true
          schema:
            description: Identificador numérico do anexo
            type: integer
            example: 3
      responses:
        '200':
          description: Operação bem sucedida
          content:
            application/json:
              schema:
                type: string
                format: binary
            file:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    post:
      operationId: postSupplyContractsMeasurementsAttachmentsAll
      x-section: Anexos de Medição de Contrato
      summary: Inclui anexos de medição de contrato
      x-implementation:
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/measurement/attachment/MeasurementAttachmentController.java
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.measurement.attachment.MeasurementAttachmentController
        method: insertAttachment
      x-original-file: measurement-v1.yaml
      x-audience:
        - public
      description: Insere novos anexos em uma medição de contrato. (REST)
      tags:
        - Anexos de Medição de Contrato
      parameters:
        - $ref: '#/components/parameters/RequiredDocumentId'
        - $ref: '#/components/parameters/RequiredContractNumber'
        - $ref: '#/components/parameters/RequiredBuildingId'
        - $ref: '#/components/parameters/requiredMeasurementNumber'
        - name: description
          in: query
          description: Descrição do anexo de medição
          required: true
          schema:
            type: string
            maxLength: 500
      requestBody:
        description: Deve enviar no body da requisição o arquivo a ser anexado na medição
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  description: >-
                    Arquivo para inserção em anexo da medição | Tipo:
                    multipart/form-data | Tamanho máximo: 70 MB | Tamanho máximo
                    do nome do arquivo: 100 caracteres | Somente 1 Anexo por
                    requisição.  Caso seja enviado mais de 1 Anexo, o Sienge vai
                    aceitar somente o primeiro selecionado.
                  type: string
                  format: binary
                  example: <binary>
      responses:
        '201':
          description: Anexo de medição inserido com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /supply-contracts/measurements/attachments/all:
