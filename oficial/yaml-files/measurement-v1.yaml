      x-section: Itens da Medição de Contrato
      summary: Retorna um array com os itens medidos nesta medição.
      x-implementation:
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/measurement/MeasurementItemsController.java
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.measurement.MeasurementItemsController
