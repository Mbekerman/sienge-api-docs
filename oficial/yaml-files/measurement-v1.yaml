          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationResultMeasurementItemDTO'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  schemas:
    MeasurementDTO:
      description: Objeto contendo dados da medição
      type: object
      properties:
        authorized:
          description: >-
            Retornará verdadeiro se medição estiver autorizada, caso contrário
            retornará falso.
          type: boolean
          example: true
        buildingId:
          description: Código da obra
          example: 100
          format: int32
          minimum: 0
          type: integer
        consistent:
          description: >-
            Retornará verdadeiro se medição estiver consistente, caso contrário
            retornará falso.
          type: boolean
          example: false
        contractNumber:
          description: Número do contrato.
          example: '1234'
          type: string
        directBillingValue:
          description: Total em descontos do faturamento direto
          type: number
          format: double
          example: 200
        discountsValue:
          description: Total em Descontos nesta medição
          type: number
          format: double
          example: 50
        documentId:
          description: Código do documento.
          example: CT
          type: string
        dueDate:
          description: Data de vencimento. Formato ISO 8601 (yyyy-MM-dd).
          example: 2018-12-22T00:00:00.000Z
          format: date
          type: string
        earnestMoneyValue:
          description: Total em Sinal nesta medição
          type: number
          format: double
          example: 50
        exchangeValue:
          description: Total em Permuta nesta medição
          type: number
          format: double
          example: 50
        indexesPriceChange:
          description: Reajuste por índices
          type: number
          format: double
          example: 30
        laborCost:
          description: Total medido de mão de obra
          type: number
          format: double
          example: 1000
        materialCost:
          description: Total medido de material
          type: number
          format: double
          example: 500
        measuredTotal:
          description: >-
            Total Medido = Total Medido de Material + Total Medido de Mão de
            Obra
          type: number
          format: double
          example: 1500
        measurementDate:
          description: |
            Data da medição

            Formato: `yyyy-MM-dd`
          type: string
          format: date
          example: '2021-04-18'
        measurementNumber:
          description: Número da Medição
          type: integer
