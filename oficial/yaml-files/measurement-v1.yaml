      x-original-file: measurement-v1.yaml
      x-audience:
        - public
      description: Lista anexos de medições de contrato conforme o período. (REST)
      tags:
        - Anexos de Medição de Contrato
      parameters:
        - name: measurementStartDate
          in: query
          description: >
            Data inicial (inclusive) para filtrar as medições pelo campo "data
            da medição". Registros com data anterior ao limite não serão
            retornados.


            Formato: `yyyy-MM-dd`
          required: true
          schema:
            description: |
              Data da medição

              Formato: `yyyy-MM-dd`
            type: string
            format: date
            example: '2021-04-18'
          example: '2022-01-01'
        - name: measurementEndDate
          in: query
          description: >
            Data final (inclusive) para filtrar as medições pelo campo "data da
            medição". Registros com data posterior ao limite não serão
            retornados.


            Formato: `yyyy-MM-dd`
          required: true
          schema:
            description: |
              Data da medição

              Formato: `yyyy-MM-dd`
            type: string
            format: date
            example: '2021-04-18'
          example: '2022-01-31'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/ContractNumber'
        - $ref: '#/components/parameters/BuildingId'
        - $ref: '#/components/parameters/measurementNumber'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Listagem concluída com sucesso
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/PaginationResultMeasurementAttachmentMetadataDTO
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /supply-contracts/measurements/authorize:
    patch:
      operationId: patchSupplyContractsMeasurementsAuthorize
      x-section: Autorização da Medição
      summary: Autoriza uma Medição que está aguardando autorização
      x-implementation:
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/measurement/authorize/AuthorizeMeasurementController.java
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.measurement.authorize.AuthorizeMeasurementController
        method: authorize
      x-original-file: measurement-v1.yaml
      x-audience:
        - public
      description: >-
        Somente notificará caso esteja configurado para "Sempre enviar aviso ao
        responsável" (REST)
      tags:
