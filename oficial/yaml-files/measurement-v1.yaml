      parameters:
        - $ref: '#/components/parameters/RequiredDocumentId'
        - $ref: '#/components/parameters/RequiredContractNumber'
        - $ref: '#/components/parameters/RequiredBuildingId'
        - $ref: '#/components/parameters/requiredMeasurementNumber'
      requestBody:
        description: Observação sobre a autorização do contrato
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationDTO'
      responses:
        '204':
          description: Medição autorizada com sucesso.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /supply-contracts/measurements/clearing:
