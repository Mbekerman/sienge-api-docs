          description: Número do item do Pedido de Compra atendido
        sequentialNumber:
          type: integer
          format: int32
          example: 5455
          description: >-
            Número sequencial único da nota fiscal de compra. O número
            sequencial é uma chave única e está disponível apenas para controle
            interno do cadastro de nota fiscal.
        invoiceItemNumber:
          type: integer
          format: int32
          example: 1
          description: Número do item
        deliveryDate:
          type: string
          format: yyyy-MM-dd
          example: '2019-07-15'
          description: Data da entrega
        quantityDelivery:
          type: number
          format: double
          example: 84
          description: Quantidade entregue
    AppropriationFlagEnum:
      type: string
      description: |-
        Utilizar apropriação de obra idêntica a da nota fiscal.




          - `S` - Sim
          - `N` - Não
      enum:
        - S
        - 'N'
      example: S
    DirectBillingFlagEnum:
      type: string
      description: |-
        Considerar no valor a vincular do faturamento direto.




          - `S` - Sim
          - `N` - Não
      enum:
        - S
        - 'N'
      example: S
    FlagStockMovementEnum:
      type: string
      description: |-
        Considerar o movimento de estoque.




          - `S` - Sim
          - `N` - Não
      enum:
        - S
        - 'N'
      example: 'N'
    PatrimonyTypeEnum:
      type: string
      description: |-
        Tipo do patrimônio.




          - `P` - Pendente
          - `C` - Cancelado
      enum:
        - P
        - C
      example: P
    PurchaseInvoiceItemIbsTaxOutput:
      description: >-
        IBS (Imposto sobre Bens e Serviços) do item da nota fiscal de compra. A
        base de cálculo, o CST e a classificação tributária (cClassTrib) são
        compartilhados entre IBS e CBS e são informados somente neste objeto.
        Alíquotas e percentuais são expressos em percentual (ex.: 0.10 = 0,10%)
        e retornados como registrados, sem recálculo pela API. Os campos
        presumedCreditId, cstId e taxClassificationId podem ser null
        (presumedCreditId quando não há crédito presumido; cstId e
        taxClassificationId quando o código não puder ser resolvido); os demais
        campos são sempre preenchidos.
      type: object
      properties:
        ibsCbsCalculationBasis:
          type: number
          format: double
          description: Base de cálculo do IBS/CBS
          example: 1000
        cstId:
          type:
            - string
            - 'null'
          description: >-
            Código da situação tributária (CST) do IBS/CBS. É o código textual
            do CST, não um identificador numérico. É null quando o código não
            puder ser resolvido.
          example: '000'
        taxClassificationId:
          type:
            - string
            - 'null'
          description: >-
            Código da classificação tributária (cClassTrib) do IBS/CBS. É o
            código textual da classificação, não um identificador numérico. É
            null quando o código não puder ser resolvido.
          example: '000001'
        presumedCreditId:
          type:
            - string
            - 'null'
          description: >-
            Código de crédito presumido do IBS. É o código textual do crédito
            presumido, não um identificador numérico. É null quando não há
            crédito presumido.
          example: '1'
        stateIbsRate:
          type: number
          format: double
          description: Alíquota do IBS estadual (percentual)
          example: 0.1
        stateIbsReducedRate:
          type: number
          format: double
          description: Alíquota de redução do IBS estadual (percentual)
          example: 0
        stateIbsEffectiveRate:
          type: number
          format: double
          description: Alíquota efetiva do IBS estadual (percentual)
          example: 0.1
        percentageDeferralIbsState:
          type: number
          format: double
          description: Percentual de diferimento do IBS estadual
          example: 0
        stateIbsDeferralValue:
          type: number
          format: double
          description: Valor de diferimento do IBS estadual
          example: 0
        stateIbsValue:
          type: number
          format: double
          description: Valor do IBS estadual tributado
          example: 1
        municipalIbsRate:
          type: number
          format: double
          description: Alíquota do IBS municipal (percentual)
          example: 0
        municipalIbsReducedRate:
          type: number
          format: double
          description: Alíquota de redução do IBS municipal (percentual)
          example: 0
        municipalIbsEffectiveRate:
          type: number
          format: double
          description: Alíquota efetiva do IBS municipal (percentual)
          example: 0
        percentageDeferralIbsMunicipal:
          type: number
          format: double
          description: Percentual de diferimento do IBS municipal
          example: 0
        municipalIbsDeferralValue:
          type: number
          format: double
          description: Valor de diferimento do IBS municipal
          example: 0
        municipalIbsValue:
          type: number
          format: double
          description: Valor do IBS municipal tributado
          example: 0
        percentageIbsPresumedCredit:
          type: number
          format: double
          description: Percentual de crédito presumido do IBS
          example: 0
        ibsPresumedCreditValue:
          type: number
          format: double
          description: Valor de crédito presumido do IBS
          example: 0
    PurchaseInvoiceItemCbsTaxOutput:
      description: >-
        CBS (Contribuição sobre Bens e Serviços) do item da nota fiscal de
        compra. A base de cálculo, o CST e a classificação tributária
        (cClassTrib) são compartilhados com o IBS e são informados somente em
        ibsTax, por isso não se repetem neste objeto. Alíquotas e percentuais
        são expressos em percentual (ex.: 0.90 = 0,90%) e retornados como
        registrados, sem recálculo pela API. Se ibsTax vier null e cbsTax vier
        preenchido, a base de cálculo, o CST e a classificação tributária não
        são retornados, pois existem apenas em ibsTax. O campo presumedCreditId
        é null quando não há crédito presumido; os demais campos são sempre
        preenchidos.
      type: object
      properties:
        presumedCreditId:
          type:
            - string
            - 'null'
          description: >-
            Código de crédito presumido do CBS. É o código textual do crédito
            presumido, não um identificador numérico. É null quando não há
            crédito presumido.
          example: '1'
        cbsRate:
          type: number
          format: double
          description: Alíquota do CBS (percentual)
          example: 0.9
        cbsReducedRate:
          type: number
          format: double
          description: Alíquota de redução do CBS (percentual)
          example: 0
        cbsEffectiveRate:
          type: number
          format: double
          description: Alíquota efetiva do CBS (percentual)
          example: 0.9
        percentageDeferralCbs:
          type: number
          format: double
          description: Percentual de diferimento do CBS
          example: 0
        cbsDeferralValue:
          type: number
          format: double
          description: Valor de diferimento do CBS
          example: 0
        cbsValue:
          type: number
          format: double
          description: Valor do CBS tributado
          example: 9
        percentageCbsPresumedCredit:
          type: number
          format: double
          description: Percentual de crédito presumido do CBS
          example: 0
        cbsPresumedCreditValue:
          type: number
          format: double
          description: Valor de crédito presumido do CBS
          example: 0
    PurchaseInvoiceItemIsTaxOutput:
      description: >-
        IS (Imposto Seletivo) do item da nota fiscal de compra. Alíquotas são
        expressas em percentual (ex.: 0.10 = 0,10%) e retornadas como
        registradas, sem recálculo pela API. Todos os campos são sempre
        preenchidos quando o objeto é retornado.
      type: object
      properties:
        isCalculationBasis:
          type: number
          format: double
          description: Base de cálculo do IS
          example: 1000
        isRate:
          type: number
          format: double
          description: Alíquota do IS (percentual)
          example: 0
        isSpecificRatePerMeasurementUnit:
          type: number
          format: double
          description: Alíquota específica do IS por unidade de medida apropriada
          example: 0
        isValue:
          type: number
          format: double
          description: Valor do IS
          example: 0
    PurchaseInvoiceItemRegularTaxOutput:
      description: >-
        Tributação regular do IBS e do CBS do item da nota fiscal de compra. O
        CST e a classificação tributária (cClassTrib) regulares são os do IBS; o
        CBS não possui esses códigos na API. Quando o item possui apenas IBS, os
        campos do CBS são null; quando possui apenas CBS, os campos do IBS são
        null. Alíquotas são expressas em percentual (ex.: 0.10 = 0,10%) e
        retornadas como registradas, sem recálculo pela API. O CST e a
        classificação tributária (cClassTrib) regulares são null quando não
        informados no item. Campos sem valor registrado são retornados como
        null.
      type: object
      properties:
        cstId:
          type:
            - string
            - 'null'
          description: >-
            Código da situação tributária (CST) regular do IBS. É o código
            textual do CST, não um identificador numérico.
          example: '000'
        taxClassificationId:
          type:
            - string
            - 'null'
          description: >-
            Código da classificação tributária (cClassTrib) regular do IBS. É o
            código textual da classificação, não um identificador numérico.
          example: '000001'
        stateIbsEffectiveRate:
          type:
            - number
            - 'null'
          format: double
          description: Alíquota efetiva regular do IBS estadual (percentual)
          example: 0.1
        stateIbsValue:
          type:
            - number
            - 'null'
          format: double
          description: Valor regular do IBS estadual
          example: 1
        municipalIbsEffectiveRate:
          type:
            - number
            - 'null'
          format: double
          description: Alíquota efetiva regular do IBS municipal (percentual)
          example: 0
        municipalIbsValue:
          type:
            - number
            - 'null'
          format: double
          description: Valor regular do IBS municipal
          example: 0
        cbsEffectiveRate:
          type:
            - number
            - 'null'
          format: double
          description: Alíquota efetiva regular do CBS (percentual)
          example: 0.9
        cbsValue:
          type:
            - number
            - 'null'
          format: double
          description: Valor regular do CBS
          example: 9
    Link:
      description: Representa um link para outro recurso.
      properties:
        href:
          description: URL do recurso associado
          example: https://../v1/purchase-..
          type: string
        rel:
          description: Nome da recurso associado
          example: Recurso
          type: string
      type: object
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    SequentialNumber:
      description: Número sequencial da nota fiscal
      example: 1712
      in: path
      name: sequentialNumber
      required: true
      schema:
        format: int32
        type: integer
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    StartDateQuery:
      description: Data inicial para filtro de período (opcional)
      in: query
      name: startDate
      required: false
      schema:
        example: '2023-01-01'
        format: date
        type: string
    EndDateQuery:
      description: Data final para filtro de período (opcional)
      in: query
      name: endDate
      required: false
      schema:
        example: '2023-01-31'
        format: date
        type: string
    CompanyIdQuery:
      description: Código da empresa (opcional)
      in: query
      name: companyId
      required: false
      schema:
        example: 1
        type: integer
    DocumentId:
      description: Identificador do documento.
      in: query
      name: documentId
      schema:
        description: Código do documento.
        example: CT
        type: string
    InvoiceItemNumber:
      description: Número do item da Nota Fiscal
      example: 22
      in: query
      name: invoiceItemNumber
      required: false
      schema:
        format: int32
        type: integer
    PurchaseOrderItemNumber:
      description: Número do item do pedido de compra
      example: 1
      in: query
      name: purchaseOrderItemNumber
      required: false
      schema:
        format: int32
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
