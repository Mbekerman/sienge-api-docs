                      - knowledgeNumber: '123456789'
                        knowledgeType: CTe
                        knowledgeValue: 100
                        knowledgeDate: '2021-04-23'
                        freightType: CIF
                        freightIpiFlag: 'N'
                        freightIpiTax: 0
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    post:
      operationId: postPurchaseInvoices
      x-original-file: purchase-invoices-v1.yaml
      x-audience:
        - public
      tags:
        - Nota Fiscal de Compra
      summary: Cadastra uma nota fiscal de compra.
      description: >-
        Inserção dos dados que fazem parte das informações principais da nota
        fiscal de compra. O primeiro passo para cadastrar uma nota é inserir
        essas informações, que são compostos por dados essenciais como, por
        exemplo, empresa, fornecedor e o número da nota fiscal. Com essas
        informações inseridas, o próximo passo é incluir os demais dados da
        nota, como, por exemplo, os seus itens. (REST)
      requestBody:
        description: Dados da nota fiscal de compra a ser inserida.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseInvoiceHeaderInsertInput'
            example:
              documentId: NF
              number: '6546523'
              series: '123'
              supplierId: 10
              companyId: 29
              movementTypeId: 1
              movementDate: '2021-04-23'
              issueDate: '2021-04-23'
              notes: Compra de materiais faltantes para a obra XPTO
      responses:
        '201':
          description: Informações principais da nota fiscal inserida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseInvoiceHeaderInsertOutput'
              example:
                sequentialNumber: 5455
                documentId: NF
                number: '6546523'
                series: '123'
                supplierId: 236
                companyId: 29
                movementTypeId: 1
                movementDate: '2021-04-23'
                issueDate: '2021-04-23'
                consistency: I
                notes: Compra de materiais faltantes para a obra XPTO
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /purchase-invoices/{sequentialNumber}/items/purchase-orders/delivery-schedules:
    post:
      operationId: postPurchaseInvoicesIdItemsPurchaseOrdersDeliverySchedules
      x-section: Item da Nota Fiscal de compra
      x-original-file: purchase-invoices-v1.yaml
      x-audience:
        - public
      tags:
        - Item da Nota Fiscal de compra
      summary: Insere itens em uma nota fiscal já existente
      description: >-
        Inserção de itens em nota fiscal a partir de entregas de pedidos de
        compra.


        Permite vincular entregas de itens de pedidos de compra a uma nota
        fiscal já existente.

        Durante o processo, o sistema valida:


        * A existência dos pedidos de compra informados;

        * A existência das entregas vinculadas aos pedidos;

        * Se as entregas não estão canceladas;

        * Se há saldo disponível para faturamento. (REST)
      parameters:
        - $ref: '#/components/parameters/SequentialNumber'
      requestBody:
        description: Dados dos itens da nota fiscal de compra a serem inseridos
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseInvoiceItemOrderInsertInput'
            example:
              deliveriesOrder:
                - purchaseOrderId: 457
                  itemNumber: 2
                  deliveryScheduleNumber: 1
                  deliveredQuantity: 4.5
                  keepBalance: true
              copyNotesPurchaseOrders: true
              copyNotesResources: false
              copyAttachmentsPurchaseOrders: true
      responses:
        '201':
          description: Itens da nota fiscal inseridos com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseInvoiceItemInsertOutput'
              example:
                sequentialNumber: 92
                invoiceItemNumber: 2
                deliveredQuantity: 15.3
                unitPrice: 10.5
                netPrice: 7.3
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /purchase-invoices/deliveries-attended:
    get:
      operationId: getPurchaseInvoicesDeliveriesAttended
      x-section: Entregas Atendidas
      x-original-file: purchase-invoices-v1.yaml
      x-audience:
        - public
      tags:
        - Entregas Atendidas
      summary: Lista das entregas atendidas
      description: >-
        Retorna os itens atendidos entre o pedido de compra e a nota fiscal
        (REST)
      parameters:
        - name: billId
          in: query
          description: >-
            Id do título da Nota Fiscal.


            Obs.: Se não for informado, é necessário informar o sequentialNumber
            ou purchaseOrderId.
          example: 2104
          required: false
          schema:
            type: integer
            format: int32
        - name: sequentialNumber
          in: query
          description: >-
            Número sequencial da Nota Fiscal.


            Obs.:  Se não for informado é necessário informar o billId ou
            purchaseOrderId.
          required: false
          schema:
            type: integer
            format: int32
          example: 190
        - name: purchaseOrderId
          in: query
          description: >-
            Id do Pedido de Compra.


            Obs.: Se não for informado é necessário informar o sequentialNumber
            ou billId.
          required: false
          schema:
            type: integer
            format: int32
          example: 128
        - $ref: '#/components/parameters/InvoiceItemNumber'
        - $ref: '#/components/parameters/PurchaseOrderItemNumber'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista de entregas Atendidas
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/PaginatedResponseOfDeliveryAttendedItemList
              example:
                links: []
                resultSetMetadata:
                  limit: 100
                  offset: 0
                  count: 1
                results:
                  - deliveryItemPurchaseOrderNumber: 1
                    purchaseOrderItemAttendedNumber: 2
                    sequentialNumber: 190
                    invoiceItemNumber: 1
                    deliveryDate: '2019-07-15'
                    quantityDelivery: 84
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  schemas:
    PurchaseInvoiceRequest:
      description: Representa uma nota fiscal de compra.
      type: object
      properties:
        supplierId:
          description: Código do fornecedor
          example: 236
          format: int32
          type: integer
        number:
          type: string
          example: '6546523'
          description: Número da nota fiscal.
        companyId:
          type: integer
          format: int32
          example: 29
          description: Código da empresa responsável pela emissão da nota fiscal de compra
        documentId:
          type: string
          example: NF
          description: Código do documento da nota fiscal
        createdBy:
          type: string
          example: USER
          description: >-
            Usuário responsável pelo cadastro da nota fiscal de compra nas
            informações de controle.
        modifiedBy:
          type: string
          example: ANOTHERUSER
          readOnly: true
          description: >-
            Usuário que modificou a nota fiscal de compra nas informações de
            controle.
        movementTypeId:
          type: integer
          format: int32
          example: 1
          description: Código do tipo de movimento.
        billId:
          type: integer
          format: int32
          description: Id do título vinculado à nota fiscal de compra
          example: 2104
        evaluationId:
          type: integer
          format: int32
          description: Id da avaliação.
          example: 1515
        consistency:
          $ref: '#/components/schemas/InvoiceConsistencyEnum'
        createdAt:
          type: string
          example: '2018-03-11T14:20:00.000-03:00'
          readOnly: true
          description: >-
            Data de criação da nota fiscal de compra nas informações de controle
            no formato yyyy-MM-dd'T'HH:mm:ss.SSSXXX.
        modifiedAt:
          type: string
          example: '2018-04-02T18:20:00.000-03:00'
          readOnly: true
          description: >-
            Data de modificação da nota fiscal de compra nas informações de
            controle no formato yyyy-MM-dd'T'HH:mm:ss.SSSXXX.
        issueDate:
          type: string
          format: date
          example: '2021-04-23'
          description: Data de emissão.
        movementDate:
          type: string
          format: date
          example: '2021-04-23'
          description: Data do movimento.
        itemsTotalAmount:
          type: number
          format: double
          description: Valor total dos itens da nota fiscal de compra.
