  /purchase-invoices:
    get:
      operationId: getPurchaseInvoices
      x-original-file: purchase-invoices-v1.yaml
      x-audience:
        - public
      tags:
        - Nota Fiscal de Compra
      summary: Lista notas fiscais de compra
      description: Retorna uma lista paginada de notas fiscais de compra. (REST)
      parameters:
        - $ref: '#/components/parameters/StartDateQuery'
        - $ref: '#/components/parameters/EndDateQuery'
        - $ref: '#/components/parameters/CompanyIdQuery'
        - name: supplierId
          in: query
          required: false
          description: Código do fornecedor
          schema:
            description: Código do fornecedor
            example: 236
            format: int32
            type: integer
        - $ref: '#/components/parameters/DocumentId'
        - name: series
          in: query
          required: false
          description: Série da nota fiscal
          schema:
            type: string
          examples:
            value: {}
        - name: number
          in: query
          required: false
          description: Número da nota fiscal
          schema:
            type: string
            example: '6546523'
            description: Número da nota fiscal.
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada de notas fiscais de compra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseInvoicesListResponse'
              example:
                links:
                  - href: /sienge/api/v1/purchase-invoices?limit=10&offset=10
                    rel: next
                resultSetMetadata:
                  limit: 10
                  offset: 0
                  count: 1
                results:
                  - sequentialNumber: 5455
                    documentId: NF
                    number: '6546523'
                    series: '123'
                    supplierId: 236
                    companyId: 29
                    movementTypeId: 1
                    movementDate: '2021-04-23'
                    issueDate: '2021-04-23'
                    consistency: I
                    createdBy: USER
                    modifiedBy: ANOTHERUSER
                    createdAt: '2021-04-23T10:30:00.000-03:00'
                    modifiedAt: '2021-04-24T15:20:00.000-03:00'
                    billId: 2104
                    evaluationId: 1515
