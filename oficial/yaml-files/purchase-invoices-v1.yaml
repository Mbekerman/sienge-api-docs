  /purchase-invoices/{sequentialNumber}/items/{itemNumber}/buildings-appropriations:
    get:
      description: >-
        Retorna as apropriações de obra de um item específico de uma nota fiscal
        de compra. (REST)
      operationId: getPurchaseInvoicesIdItemsIdBuildingsAppropriations
      x-original-file: purchase-invoices-v1.yaml
      x-audience:
        - public
      tags:
        - Nota Fiscal de Compra
      summary: Consulta apropriações de obra do item da nota fiscal
      parameters:
        - $ref: '#/components/parameters/SequentialNumber'
        - name: itemNumber
          in: path
          description: Número do item da nota fiscal de compra
          required: true
          schema:
            type: integer
            format: int32
          example: 1
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista de apropriações de obra do item
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/PurchaseInvoiceItemBuildingsAppropriationsResponse
              example:
