                    discount: 50
                    valueOtherExpenses: 20
                    freightAmount: 100
                    freightItemsAmount: 80
                    freightIpiFlag: 'N'
                    freightIpiTax: 0
                    notes: Compra de materiais faltantes para a obra XPTO
                    differenceIpiAmount: 0
