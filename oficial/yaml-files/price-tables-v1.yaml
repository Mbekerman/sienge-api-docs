openapi: 3.1.1
info:
  title: Tabela de Preços
  version: 1.24.0
  description: Consulta de Tabelas de Preços.
paths:
  /price-tables:
    get:
      x-original-file: price-tables-v1.yaml
      x-audience:
        - public
      tags:
        - Tabela de Preços
      summary: Retorna a última versão das tabelas de preços.
      operationId: getPricetables
      parameters:
        - name: companyId
          in: query
          description: O código da empresa.
          schema:
            type: integer
            example: 1
        - name: enterpriseId
          in: query
          description: O código do empreendimento.
          schema:
            type: integer
            example: 1001
        - name: enterpriseIdView
          in: query
          description: O código externo do empreendimento.
          schema:
            type: integer
            example: 2001
        - name: projectId
          in: query
          description: O código do projeto do empreendimento.
          schema:
            type: integer
            example: 501
        - name: tableName
          in: query
          description: Nome da tabela.
          schema:
            type: string
            example: Tabela Padrão
        - name: startOfTerm
          in: query
          description: >
            Data de início de vigência. Formato YYYY-MM-DD. Exemplo ->
            1990-12-25.
          schema:
            type: string
            example: '2025-01-01'
        - name: endOfTerm
          in: query
          description: Data final de vigência. Formato YYYY-MM-DD. Exemplo -> 1990-12-25.
          schema:
            type: string
            example: '2025-12-31'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tabelas de preços retornadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceTablesGetAllDocument'
              example:
                results:
                  - id: 1
                    version: 3
                    companyId: 99
                    name: Tabela de Preços 2025
                    startDate: '2025-01-01'
                    endDate: '2025-12-31'
                    status: Ativa
                    createdBy: userName
                    createdAt: '2025-01-01T10:00:00Z'
                    updatedAt: '2025-06-01T15:00:00Z'
                resultSetMetadata:
                  offset: 0
                  limit: 10
                  count: 1
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Busca a última versão das tabelas de preços. (REST)
components:
  schemas:
    PriceTablesGetAllDocument:
      type: object
      description: Documento de resposta contendo a lista de tabelas de preços.
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de tabelas de preços retornadas como resultado da pesquisa.
          items:
            $ref: '#/components/schemas/PriceTablesDocument'
          example:
            - id: 1
              version: 3
              companyId: 99
              name: Tabela de Preços 2025
              startDate: '2025-01-01'
              endDate: '2025-12-31'
              status: Ativa
              createdBy: userName
              createdAt: '2025-01-01T10:00:00Z'
              updatedAt: '2025-06-01T15:00:00Z'
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    PriceTablesDocument:
      type: object
      description: Documento contendo as informações de uma tabela de preços.
      properties:
        id:
          type: integer
          description: Código da tabela de preços.
          format: int32
          example: 1
        version:
          type: integer
          description: Número da versão.
          format: int32
          example: 1
        companyId:
          type: integer
          description: Código da empresa.
          format: int32
          example: 1
        enterpriseId:
          type: integer
          description: Código do empreendimento da tabela de preços.
          format: int32
          example: 1001
        enterpriseIdView:
          type: integer
          description: Código externo do empreendimento da tabela de preços.
          format: int32
          example: 2001
        projectId:
          type: integer
          description: Código do projeto do empreendimento.
          format: int32
          example: 501
        tableName:
          type: string
          description: Nome da tabela de preços.
          example: Tabela Padrão
        tableVersionName:
          type: string
          description: Nome da versão.
          example: Versão 1.0
        startOfTerm:
          type: string
          description: >-
            Data de início de vigência (Formato ISO 8601 yyyy-MM-dd | Exemplo:
            2020-11-24).
          format: date
          example: '2025-01-01'
        endOfTerm:
          type: string
          description: >-
            Data de fim de vigência (Formato ISO 8601 yyyy-MM-dd | Exemplo:
            2020-11-24).
          example: '2025-12-31'
          format: date
        notes:
          type: string
          description: Observações.
          example: Tabela válida para o primeiro semestre
        paymentConditions:
          type: array
          description: Condições de pagamento.
          items:
            $ref: '#/components/schemas/PriceTablesConditionsDocument'
        units:
          type: array
          description: Unidades com valores especiais.
          items:
            $ref: '#/components/schemas/PriceTablesUnitsDocument'
    PriceTablesConditionsDocument:
      type: object
      description: Documento contendo as condições de pagamento de uma tabela de preços.
      properties:
        order:
          type: integer
          description: Número de ordem da condição.
          format: int32
          example: 1
        paymentConditionType:
          type: string
          description: Tipo de condição de pagamento.
          example: À Vista
        installmentsNumber:
          type: integer
          description: Quantidade de parcelas da condição da tabela de preços.
          format: int32
          example: 1
        series:
          type: integer
          description: Número de série da condição.
          format: int32
          example: 1
        interestType:
          type: string
          description: Tipo de juros.
          example: Simples
        percentageByPeriod:
          type: number
          description: Porcentagem de juros por período.
          example: 1.5
        unitValuePercentage:
          type: number
          description: Porcentagem do valor da unidade.
          example: 100
        indexer:
          type: string
          description: Tipo de indexador.
          example: IGPM
        baseDate:
          type: string
          description: >-
            Data base de juros (Formato ISO 8601 yyyy-MM-dd | Exemplo:
            2020-11-24).
          format: date
          example: '2025-01-01'
    PriceTablesUnitsDocument:
      type: object
      description: Documento contendo as unidades vinculadas a uma tabela de preços.
      properties:
        id:
          type: integer
          description: Número de identificação da unidade.
          format: int32
          example: 1
        indexedQuantity:
          type: number
          description: Quantidade indexada da unidade da tabela de preços.
          example: 1
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
