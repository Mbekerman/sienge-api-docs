openapi: 3.1.1
info:
  title: Calendários de Obra
  version: 1.24.0
  description: Operações relacionadas ao gerenciamento de calendários de obras.
paths:
  /building-projects/{buildingId}/calendar:
    get:
      x-original-file: building-calendar-v1.yaml
      x-section: Calendários
      x-audience:
        - public
      tags:
        - Calendários
      summary: Retorna config do calendário de planejamento da obra
      operationId: getBuildingProjectCalendar
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: >-
            Identificador único da obra utilizado para acessar os recursos do
            calendário, folgas e configurações de planejamento
      responses:
        '200':
          description: >-
            Retorna um objeto JSON com as datas de início e término do
            calendário da obra, se está considerando feriados e folgas do
            cadastro geral e se está considerando sábados e domingos como dias
            de trabalho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDto'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna um objeto JSON com as configurações do calendário usado no
        planejamento da obra. O planejamento em questão é identificado pelo
        respectivo código da obra (buildingId), considerando por padrão a versão
        atual do planejamento. (REST)
    put:
      tags:
        - Calendários
      summary: Insere calendário em nova versão do planejamento da obra
      operationId: putBuildingProjectCalendar
      x-section: Calendários
      x-original-file: building-calendar-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: Código identificador único da obra
      requestBody:
        description: >-
          Dados do calendário a ser inserido na nova versão do planejamento da
          obra
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarDto'
        required: true
      responses:
        '200':
          description: >-
            Retorna um objeto JSON com as datas de início e término da obra do
            jeito que elas foram salvas no Sienge.  Essas datas podem não
            coincidir com as datas enviadas no PUT. No Sienge ocorrem algumas
            validações de datas para manter a consistência do planejamento,
            mantendo a duração das tarefas em dias e, para tal, prorroga  a data
            final da obra se necessário. Então caso deseje alterar as datas do
            calendário de modo que a duração das tarefas não caibam dentro do
            período da obra,  o fim da obra será prorrogado para as tarefas
            manterem suas durações. As tarefas sempre serão priorizadas, então
            se for tentado alterar uma data de início da obra e houver alguma
            tarefa que se inicia antes dessa data,  a data desta tarefa será
            adotada como a inicial da obra. O Sienge ajusta as datas de ínicio e
            término para dias úteis, ou seja caso as datas enviadas não forem
            dias úteis, o sistema adota e salva o próxima dia útil.
          content:
            'application/json:':
              schema:
                $ref: '#/components/schemas/PutCalendarResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Insere um calendário em uma nova versão da planilha de planejamento de
        uma obra. O planejamento em questão é identificado pelo respectivo
        código da obra (buildingId), considerando por padrão a versão atual do
        planejamento. (REST)
  /building-projects/{buildingId}/calendar/days-off:
    get:
      x-original-file: building-calendar-v1.yaml
      x-section: Folgas
      x-audience:
        - public
      tags:
        - Folgas
      summary: Retorna datas dos dias de folga no período da obra
      operationId: getBuildingProjectCalendarDayoffs
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: >-
            Identificador único da obra para consultar dias de folga do
            calendário
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: >-
            Retorna um array com a lista de datas de folga e a descrição dentro
            do período da obra; Retorna um array vazio caso não existam dias de
            folga no período.
          content:
            'application/json:':
              schema:
                $ref: '#/components/schemas/GetResponseDayOff'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna um array com as datas dos dias de folga no período da obra e
        suas descrições. O planejamento em questão é identificado pelo
        respectivo código da obra (buildingId), considerando por padrão a versão
        atual do planejamento. (REST)
    post:
      tags:
        - Folgas
      summary: Insere folgas no calendário da obra
      operationId: postBuildingProjectCalendarDayoffs
      x-section: Folgas
      x-original-file: building-calendar-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: Identificador único da obra para inserir folgas no calendário
      requestBody:
        description: >-
          Array de folgas. Caso já exista uma folga com a mesma data, sua
          descrição será sobrescrita.
            Data da Folga: Campo obrigatório. Deve observar o intervalo de início e fim da obra.
        content:
          application/json:
            schema:
              type: array
              example:
                - date: '2020-12-25'
                  description: natal
                - date: '2020-05-01'
                  description: dia do trabalho
              items:
                $ref: '#/components/schemas/DayOffDTO'
        required: true
      responses:
        '201':
          description: Folgas inseridas com sucesso. Não retorna conteúdo.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Insere folgas no calendário da obra em uma nova versão da planilha de
        planejamento. O planejamento em questão é identificado pelo respectivo
        código da obra (buildingId), considerando por padrão a versão atual do
        planejamento. (REST)
    delete:
      tags:
        - Folgas
      summary: Remove folgas do calendário da obra
      operationId: deleteBuildingProjectCalendarDayoffs
      x-section: Folgas
      x-original-file: building-calendar-v1.yaml
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/BuildingIdPath'
          description: Código da obra do calendário
        - name: dayOffDTOForDelete
          in: query
          description: DTO com as datas de folga a serem removidas
          required: true
          schema:
            $ref: '#/components/schemas/DayOffDTOForDelete'
      responses:
        '204':
          description: Dias de folga inseridos com sucesso. Não retorna conteúdo.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Remove folgas do calendário da obra em uma nova versão da planilha de
        planejamento. O planejamento em questão é identificado pelo respectivo
        código da obra (buildingId), considerando por padrão a versão atual do
        planejamento. (REST)
components:
  schemas:
    CalendarDto:
      type: object
      description: >-
        Representação do calendário da obra com suas configurações de dias de
        trabalho
      properties:
        projectStartDate:
          type: string
          description: Data de início da obra no formato yyyy-MM-dd
          example: {}
        projectFinishDate:
          type: string
          description: Data de término da obra no formato yyyy-MM-dd
          example: {}
        considerHolidaysAndDaysOffInGeneralRegister:
          type: boolean
          description: >-
            Indica se os feriados e folgas do cadastro geral estão sendo
            considerados
          example: true
        considerSaturdaysAsWorkingDay:
          type: boolean
          description: Indica se os sábados são considerados dias de trabalho
          example: true
        considerSundaysAsWorkingDay:
          type: boolean
          description: Indica se os domingos são considerados dias de trabalho
          example: true
    PutCalendarResponse:
      type: object
      description: Representação da resposta ao atualizar o calendário da obra
      properties:
        projectStartDate:
          type: string
          description: >-
            Data de início da obra (no formato yyyy-MM-dd) que define o primeiro
            dia do calendário do projeto
          example: {}
        projectFinishDate:
          type: string
          description: >-
            Data de término da obra (no formato yyyy-MM-dd) que define o último
            dia do calendário do projeto
          example: {}
    GetResponseDayOff:
      type: object
      description: Resposta contendo a lista de dias de folga do calendário da obra
      example:
        resultSetMetadata:
          count: 1
          limit: 10
          offset: 0
        results:
          - date: '2016-12-25'
            description: Natal
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          items:
            $ref: '#/components/schemas/DayOffDTO'
    DayOffDTO:
      type: object
      description: Representação de um dia de folga no calendário da obra
      properties:
        date:
          type: string
          description: Data da folga no calendário em formato yyyy-MM-dd
          example: {}
        description:
          type: string
          description: Descrição da folga no calendário
          example: natal
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    DayOffDTOForDelete:
      type: object
      description: >-
        Objeto que representa uma data específica a ser removida do calendário
        de folgas da obra, utilizado na operação de exclusão de folgas
      example:
        date: '2016-10-11'
      properties:
        date:
          type: string
          description: >-
            Data específica a ser removida do calendário de folgas da obra
            (formato yyyy-MM-dd)
          example: {}
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    BuildingIdPath:
      description: Identificador único da obra
      in: path
      name: buildingId
      required: true
      schema:
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
