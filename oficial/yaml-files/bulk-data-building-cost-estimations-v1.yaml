openapi: 3.1.1
info:
  title: Bulk-data Itens de Orçamento
  version: 1.24.0
  description: API de consulta de Itens de Orçamentos de Obra
paths:
  /building-cost-estimation-items:
    get:
      operationId: getBuildingCostEstimationItems
      x-original-file: bulk-data-building-cost-estimations-v1.yaml
      x-audience:
        - public
      tags:
        - Bulk-data Itens de Orçamento
      summary: Lista itens de orçamento de obras (todas as versões)
      parameters:
        - name: dataDate
          in: query
          description: |-
            Data de referência para o cálculo dos seguintes campos:




              - scheduledPercentComplete
              - percentComplete
              - measuredQuantity

            Formato da data: yyyy-mm-dd (notação full-date definida no RFC 3339)
            Default value: data atual do sistema no formato yyyy-mm-dd
          required: false
          schema:
            type: string
            format: date
            example: {}
        - $ref: '#/components/parameters/BuildingIdQuery'
        - name: adjustmentIndexId
          in: query
          description: >-
            Código do indexador de correção monetária cadastrado no Sienge.

            Os preços e valores monetários retornados pela API serão corrigidos
            por este indexador, exceto os preços base.

            - Se este parâmetro não for informado, nenhuma correção será
            realizada.

            - Se este parâmetro for informado, o parâmetro "adjustmentDate" deve
            ser informado obrigatoriamente.
          required: false
          schema:
            type: integer
            format: int32
            example: 3
        - name: adjustmentDate
          in: query
          description: >-
            Data para correção monetária do indexador. Os preços e valores
            monetários retornados pela API serão corrigidos para essa data,
            exceto os preços base. Formato da data: yyyy-mm-dd (notação
            full-date definida no RFC 3339)
          required: false
          schema:
            type: string
            format: date
            example: {}
        - $ref: '#/components/parameters/BdiQuery'
        - $ref: '#/components/parameters/LaborBurdenQuery'
        - name: includeDisbursments
          in: query
          description: >-
            Parâmetro para trazer os desembolsos das tarefas relacionadas a
            Itens de Orçamento cujo insumo possui característica de Serviço para
            Desembolso. Caso esse parâmetro seja informado como true, é
            obrigatório também informar o parâmetro "dataDate". Esse parâmetro é
            falso como padrão.
          required: false
          schema:
            default: false
            description: Flag para incluir desembolsos (true/false). Default false.
            example: false
            type: boolean
      responses:
        '200':
          description: >-
            Retorna um array com todos os itens de todas as planilhas de todas
            as versões de orçamento de todas as obras. Se não existir nenhum,
            retorna um array vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseBuildingCostEstimationItemDto'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: ' (BULK)'
components:
  schemas:
    GetResponseBuildingCostEstimationItemDto:
      description: >-
        Resposta do endpoint que encapsula a coleção de Itens de Orçamento de
        Obras retornados pela consulta.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BuildingCostEstimationItemDto'
          examples:
            - - buildingId: 7
                buildingName: Condomínio da Felicidade
                buildingStatus: IN_PROGRESS
                projects:
                  - id: 7
                    name: Empreendimento Condomínio da Felicidade
                versionNumber: 3
                buildingUnitId: 1
                buildingUnitName: Salão de festas
                id: 45
                wbsCode: 01.001.000.001
                workItemId: 2344
                description: Alvenaria de Tijolo Furado
                unitOfMeasure: m2
                quantity: 560.3205
                unitPrice: 9.0009
                totalPrice: 5043.39
                baseTotalPrice: 5000.05
                scheduledPercentComplete: 26.4987
                percentComplete: 24.9879
                measuredQuantity: 140.0123
                pricesByCategory:
                  - category: MATERIAL
                    unitPrice: 9.0009
                    totalPrice: 5043.39
                    baseTotalPrice: 5000.05
                tasks:
                  - id: 10
                    presentationId: 1
                    description: Colocação de rejunto
                    percentage: 50
                    value: 2500
                    remainingDisbursments: 0
                    Disbursments:
                      - year: 2022
                        month: 10
                        value: 2500
              - buildingId: 12
                buildingName: Residencial Aurora
                buildingStatus: COST_ESTIMATING
                projects:
                  - id: 12
                    name: Empreendimento Residencial Aurora
                versionNumber: 1
                buildingUnitId: 3
                buildingUnitName: Bloco B - Apto 203
                id: 88
                wbsCode: 02.010.005.020
                workItemId: 9876
                description: Pintura interna látex PVA
                unitOfMeasure: m2
                quantity: 120.5
                unitPrice: 18.75
                totalPrice: 2250
                baseTotalPrice: 2200
                scheduledPercentComplete: 75
                percentComplete: 72.5
                measuredQuantity: 87
                pricesByCategory:
                  - category: MATERIAL
                    unitPrice: 12.5
                    totalPrice: 1500
                    baseTotalPrice: 1450
                  - category: LABOR
                    unitPrice: 6.25
                    totalPrice: 750
                    baseTotalPrice: 750
                tasks:
                  - id: 21
                    presentationId: 2
                    description: Aplicação de tinta
                    percentage: 100
                    value: 2250
                    remainingDisbursments: 0
                    Disbursments:
                      - year: 2025
                        month: 8
                        value: 2250
      example:
        data:
          - buildingId: 7
            buildingName: Condomínio da Felicidade
            buildingStatus: IN_PROGRESS
            projects:
              - id: 7
                name: Empreendimento Condomínio da Felicidade
            versionNumber: 3
            buildingUnitId: 1
            buildingUnitName: Salão de festas
            id: 45
            wbsCode: 01.001.000.001
            workItemId: 2344
            description: Alvenaria de Tijolo Furado
            unitOfMeasure: m2
            quantity: 560.3205
            unitPrice: 9.0009
            totalPrice: 5043.39
            baseTotalPrice: 5000.05
            scheduledPercentComplete: 26.4987
            percentComplete: 24.9879
            measuredQuantity: 140.0123
            pricesByCategory:
              - category: MATERIAL
                unitPrice: 9.0009
                totalPrice: 5043.39
                baseTotalPrice: 5000.05
            tasks:
              - id: 10
                presentationId: 1
                description: Colocação de rejunto
                percentage: 50
                value: 2500
                remainingDisbursments: 0
                Disbursments:
                  - year: 2022
                    month: 10
                    value: 2500
    BuildingCostEstimationItemDto:
      description: >-
        Representa um Item de Orçamento de Obra, incluindo identificação,
        unidade construtiva, quantidades, preços (total, base e por categoria),
        além de indicadores de planejamento e medição (percentuais e quantidades
        medidas).
      type: object
      properties:
        buildingId:
          description: Código da obra.
          type: integer
          example: 7
        buildingName:
          description: Nome da obra.
          type: string
          example: Condomínio da Felicidade
        buildingStatus:
          description: Situação da obra.
          type: string
          example: IN_PROGRESS
          enum:
            - COST_ESTIMATING
            - IN_PROGRESS
            - FINISHED_WITH_FINANCIAL_PENDENCIES
            - FINISHED_WITHOUT_FINANCIAL_PENDENCIES
        projects:
          description: >-
            Projetos vinculados aos centros de custo associados à obra do item
            de orçamento. Se a obra não possuir centros de custo associados, ou
            se estes não estiverem vinculados a projetos, este array estará
            vazio.
          type: array
          items:
            $ref: '#/components/schemas/ProjectDto'
        versionNumber:
          description: Número da respectiva versão do orçamento.
          type: integer
          example: 3
        buildingUnitId:
          description: Código da unidade construtiva
          example: 123
          format: int32
          type: integer
        buildingUnitName:
          description: Nome da Unidade Construtiva.
          example: Unidade Exemplo
          type: string
        id:
          description: >-
            Identificador único imutável do item de orçamento no contexto da
            planilha (unidade construtiva).
          example: 25
          type: integer
        wbsCode:
          description: >-
            Código de referência do item de orçamento, representando a posição
            do mesmo na Estrutura de Decomposição do Trabalho (EDT).
          example: 01.001.000.001
          type: string
        workItemId:
          description: Código do serviço. Em itens agrupadores, esse campo será null.
          type: integer
          example: 2344
        description:
          description: Descrição do item de orçamento.
          example: Alvenaria de Tijolo Furado
          type: string
        unitOfMeasure:
          description: Unidade de medida usada para o item de orçamento.
          type: string
          example: m2
        quantity:
          description: >-
            Quantidade orçada para o item de orçamento, com precisão de 4 casas
            decimais. Esse valor leva em consideração o número de repetições da
            respectiva unidade construtiva.
          type: number
          example: 560.3205
        unitPrice:
          description: >-
            Preço unitário do item de orçamento com precisão de 4 casas.
            Equivalente a soma dos preços unitários de cada tipo de preço do
            serviço.
          type: number
          example: 9.0009
        totalPrice:
          description: >-
            Preço total do item de orçamento com precisão de 2 casas.
            Equivalente a soma dos preços totais de cada tipo de preço do item.
          type: number
          example: 5043.39
        baseTotalPrice:
          description: >-
            Preço total base do item de orçamento com precisão de 2 casas.
            Equivalente a soma dos preços totais base de cada tipo de preço do
            item. Neste preço base são considerados apenas os preços "puros" dos
            insumos e serviços que compõem o item de orçamento, ou seja, neste
            preço não é aplicado BDI, encargos sociais nem correção por
            indexador.
          type: number
          example: 5000.05
        scheduledPercentComplete:
          description: >-
            Percentual previsto (planejado) de execução do item de orçamento,
            considerando a data informada no parâmetro "dataDate". Esse
            percentual é calculado com base na ligação do respectivo item de
            orçamento com as tarefas do planejamento da obra. O valor desse
            campo tem precisão de até 12 casas decimais. Esse campo só será
            preenchido em itens da versão atual do orçamento de cada obra, já a
            ligação do orçamento com o planejamento de obra só exise na versão
            atual (essa ligação não é versionada). Ou seja, em versões
            anteriores esse campo será null. Em itens agrupadores, esse campo
            também será null.
          type: number
          example: 26.4987
        percentComplete:
          description: >-
            Percentual medido do item de orçamento, considerando a data
            informada no parâmetro "dataDate". Esse percentual é calculado com
            base na ligação do respectivo item de orçamento com as tarefas do
            planejamento da obra e com as medições do acompanhamento de obra.
            Para o cálculo, serão consideradas todas as medições da obra
            cadastradas até a data informada no parâmetro "dataDate". O valor
            desse campo tem precisão de até 12 casas decimais. Esse campo só
            será preenchido em itens da versão atual do orçamento de cada obra,
            já a ligação do orçamento com o planejamento de obra só exise na
            versão atual (essa ligação não é versionada). Ou seja, em versões
            anteriores esse campo será null. Em itens agrupadores, esse campo
            também será null.
          type: number
          example: 24.9879
        measuredQuantity:
          description: >-
            Quantidade medida do item de orçamento, considerando a data
            informada no parâmetro "dataDate". Essa quantidade é calculada com
            base na ligação do respectivo item de orçamento com as tarefas do
            planejamento da obra e com as medições do acompanhamento de obra.
            Para o cálculo, serão consideradas todas as medições da obra
            cadastradas até a data informada no parâmetro "dataDate". O valor
            desse campo tem precisão de até 4 casas decimais. Esse campo só será
            preenchido em itens da versão atual do orçamento de cada obra, já a
            ligação do orçamento com o planejamento de obra só exise na versão
            atual (essa ligação não é versionada). Ou seja, em versões
            anteriores esse campo será null. Em itens agrupadores, esse campo
            também será null.
          type: number
          example: 140.0123
        pricesByCategory:
          type: array
          items:
            $ref: '#/components/schemas/PriceByCategory'
        tasks:
          type: array
          description: >-
            Relação de tarefas associadas ao item de orçamento, detalhando a
            descrição, seu percentual representativo e seu valor.
          items:
            $ref: '#/components/schemas/TaskDto'
        api-error:
          description: >-
            Quando não ocorrer nenhuma falha no carregamento dos itens de
            orçamento, esse campo não estará presente nos objetos retornados. Se
            durante o carregamento ocorrer alguma falha no lado do servidor, o
            array de itens de orçamento será fechado com os itens carregados até
            então, e um objeto extra será adicionado ao final do array contendo
            apenas este campo preenchido com a respectiva mensagem de erro.
          type: string
      example:
        buildingId: 7
        buildingName: Condomínio da Felicidade
        buildingStatus: IN_PROGRESS
        projects:
          - id: 7
            name: Empreendimento Condomínio da Felicidade
        versionNumber: 3
        buildingUnitId: 1
        buildingUnitName: Salão de festas
        id: 45
        wbsCode: 01.001.000.001
        workItemId: 2344
        description: Alvenaria de Tijolo Furado
        unitOfMeasure: m2
        quantity: 560.3205
        unitPrice: 9.0009
        totalPrice: 5043.39
        baseTotalPrice: 5000.05
        scheduledPercentComplete: 26.4987
        percentComplete: 24.9879
        measuredQuantity: 140.0123
        pricesByCategory:
          - category: MATERIAL
            unitPrice: 9.0009
            totalPrice: 5043.39
            baseTotalPrice: 5000.05
        tasks:
          - id: 10
            presentationId: 1
            description: Colocação de rejunto
            percentage: 50
            value: 2500
            remainingDisbursments: 0
            Disbursments:
              - year: 2022
                month: 10
                value: 2500
    ProjectDto:
      description: >-
        Projeto associado à obra/centro de custo, utilizado para contextualizar
        os Itens de Orçamento retornados.
      type: object
      properties:
        id:
          description: Código do projeto
          example: 123
          format: int32
          type: integer
        name:
          description: Nome do projeto
          example: Projeto Exemplo
          type: string
      example:
        id: 7
        name: Empreendimento Condomínio da Felicidade
    PriceByCategory:
      description: >-
        Detalhamento de preços do item de orçamento por categoria de insumo (por
        exemplo, material e mão de obra), contendo preços unitário, total e
        opcionalmente o preço total base.
      properties:
        baseTotalPrice:
          description: >-
            Preço total base para o tipo de insumo correspondente com precisão
            de 2 casas. Neste preço base são considerados apenas os preços
            "puros" dos insumos e serviços que compõem o item de orçamento, ou
            seja, neste preço não é aplicado BDI, encargos sociais nem correção
            por indexador.
          example: 5000.05
          type: number
        category:
          $ref: '#/components/schemas/ResourceCategoryEnum'
        totalPrice:
          description: >-
            Preço total para o tipo de insumo correspondente com precisão de 2
            casas
          example: 209.91
          type: number
        unitPrice:
          description: >-
            Preço unitário para o tipo de insumo correspondente com precisão de
            4 casas
          example: 9.0009
          type: number
      type: object
    TaskDto:
      description: >-
        Tarefa do planejamento vinculada ao Item de Orçamento, com percentual
        representativo, valor e respectivos desembolsos ao longo do tempo.
      type: object
      properties:
        id:
          description: Identificador único imutável da tarefa
          example: 10
          type: number
        presentationId:
          description: >-
            Código visível da tarefa, representa a posição dela na estrutura do
            planejamento
          example: 1
          type: number
        description:
          description: Descrição da Tarefa
          type: string
          example: Colocação de rejunto
        percentage:
          description: Percentual representativo do item na tarefa
          type: number
          example: 50
        value:
          description: Valor da tarefa
          type: number
          example: 2500
        remainingDisbursments:
          description: >-
            Desembolsos restantes ou Desembolsos não vinculados no Período.
            Valor que não pôde ser associado a um mês de execução. Cenário pode
            acontecer quando o intervalo de entrega do insumo é maior do que o
            período de planejamento que ele está vinculado. Pode ocorrer também
            quando pula um mês que tem execução
          type: number
          example: 0
        Disbursments:
          $ref: '#/components/schemas/Disbursments'
      example:
        id: 10
        presentationId: 1
        description: Colocação de rejunto
        percentage: 50
        value: 2500
        remainingDisbursments: 0
        Disbursments:
          - year: 2022
            month: 10
            value: 2500
    ResourceCategoryEnum:
      description: Categoria do insumo
      enum:
        - EQUIPMENT
        - LABOR
        - INCREMENTAL_COST_ITEM
        - MATERIAL
        - TRANSPORT_ITEM
        - OTHER
        - OFFICE_SUPPLY
        - FUELS_AND_LUBRICANTS
        - MAINTENANCE_MATERIAL
      example: MATERIAL
      type: string
    Disbursments:
      type: array
      description: >-
        Relação de desembolsos associados à tarefa. Cada item possui o ano, mês
        e valor do desembolso. O cálculo de Desembolso vai considerar
        percentuais de execução dos serviços. Não serão apresentadas informações
        de desembolso para Tarefas vinculadas à Itens do Orçamento com preço
        informado.
      items:
        $ref: '#/components/schemas/Disburment'
      example:
        - year: 2022
          month: 10
          value: 2500
    Disburment:
      description: >-
        Parcela de desembolso associada a uma tarefa, identificada por ano, mês
        e valor.
      type: object
      properties:
        year:
          description: Ano do Desembolso
          example: 2022
          type: number
        month:
          description: Mês do Desembolso
          example: 10
          type: number
        value:
          description: Valor do Desembolso
          example: 2500
          type: number
      example:
        year: 2022
        month: 10
        value: 2500
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    BuildingIdQuery:
      description: Código da obra (opcional)
      in: query
      name: buildingId
      required: false
      schema:
        example: 123
        format: int32
        type: integer
    BdiQuery:
      description: >-
        Tipo de BDI ou percentual específico a ser utilizado no cálculo dos
        preços orçados.

        - Para o tipo de BDI os valores válidos são:
          - BUILDING (Obra)
          - RESOURCE_GROUPS (Grupos de insumo)
          - WORK_ITEMS (Serviços)
        - Para um percentual específico de BDI informar um valor numérico no
        formato "###.##" entre 0.00 e 999.99.
      example: BUILDING
      in: query
      name: bdi
      required: false
      schema:
        oneOf:
          - enum:
              - BUILDING
              - RESOURCE_GROUPS
              - WORK_ITEMS
            type: string
