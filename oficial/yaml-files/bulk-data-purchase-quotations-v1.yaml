openapi: 3.1.1
info:
  title: Bulk-data Cotações de preços
  version: 1.24.0
  description: Operações relacionadas a cotações de preços.
paths:
  /purchase-quotations:
    get:
      operationId: getBulkPurchaseQuotations
      x-original-file: bulk-data-purchase-quotations-v1.yaml
      x-audience:
        - public
      tags:
        - Bulk-data Cotações de preços
      summary: Retorna cotações com itens, fornecedores e negociações.
      description: Retorna cotações de preço com itens, fornecedores e negociações. (BULK)
      parameters:
        - $ref: '#/components/parameters/StartDateQueryRequired'
          description: >-
            Data de início da busca (data da cotação). Formato ISO 8601
            yyyy-MM-dd
        - $ref: '#/components/parameters/EndDateQueryRequired'
          description: Data de fim da busca (data da cotação). Formato ISO 8601 yyyy-MM-dd
        - name: originatedPurchaseOrder
          in: query
          description: >-
            Parâmetro para filtrar apenas cotações que originaram pedidos de
            compra.  Esse parâmetro é falso como padrão.
          required: false
          schema:
            type: boolean
            default: false
            example: false
      responses:
        '200':
          description: >-
            Retorna um array com todas as cotações de preços contendo os itens
            da cotação, fornecedores e suas negociações. Se não existir nenhum,
            retorna um array vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponsePurchaseQuotationDTO'
        '400':
          description: |-
            Ocorreu um erro um dos seguintes erros:
              - O parâmetro startDate não foi informado.
              - O parâmetro endDate não foi informado.
              - O parâmetro endDate informado é maior que o startDate.          
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  schemas:
    GetResponsePurchaseQuotationDTO:
      type: object
      description: 'Resposta da busca de cotações de preços.      '
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseQuotationDTO'
          example:
            - purchaseQuotationId: 7
              registeredDate: '2022-08-01'
              lastModification: '2022-08-10'
              purchaseQuotationDate: '2022-08-05'
              sentDate: '2022-08-09'
              responseDeadline: '2022-08-15'
              notes: Observações da cotação
              minNumberOfSuppliers: 1
              suggestedNumberOfSuppliers: 3
              buyerId: JOAO
              purchaseQuotationItems:
                - purchaseQuotationItemId: 1
                  buildingId: 7
                  productId: 100
                  productDescription: Aço
                  detailId: 5
                  detailDescription: CA60 4.2mm
                  trademarkId: 2
                  trademarkDescription: Marca do aço
                  quantity: 100.9
                  unitySimbol: kg
                  notes: Aço para obra xyz
              purchaseQuotationSuppliers:
                - supplierId: 77
                  negotiations:
                    - negotiationId: 1
                      registeredDate: '2022-08-10'
                      responseDate: '2022-08-11'
                      expirationDate: '2022-08-15'
                      sellersName: Vendedor
                      totalValue: 88.9
                      discount: 10.1
                      freight: 0
                      itemsFreight: 0
                      negotiationItems:
                        - purchaseQuotationItemId: 1
                          productId: 100
                          productDescription: Aço
                          detailId: 5
                          detailDescription: CA60 4.2mm
                          trademarkId: 2
                          trademarkDescription: Marca do aço
                          quotedQuantity: 100.9
                          negotiatedQuantity: 90
                          unitPrice: 1.1
                          discount: 10.1
                          discountPercentage: 0
                          increasePercentage: 0
                          ipiTaxPercentage: 0
                          issTaxPercentage: 0
                          icmsTaxPercentage: 0
                          freightUnitPrice: 0
                          reference: Referência do item negociado.
                          selectedOption: true
    PurchaseQuotationDTO:
      type: object
      description: Cotação com seus insumos, fornecedores e negociações.
      properties:
        purchaseQuotationId:
          description: Código da cotação.
          type: integer
          example: 7
        registeredDate:
          description: Data de registro da cotação no formato yyyy-MM-dd.
          type: string
          example: '2022-08-01'
        lastModification:
          description: Data da última modificação na cotação no formato yyyy-MM-dd.
          type: string
          example: '2022-08-10'
        purchaseQuotationDate:
          description: Data da cotação no formato yyyy-MM-dd.
          type: string
          example: '2022-08-05'
        sentDate:
          description: Data do envio da cotação no formato yyyy-MM-dd.
          type: string
          example: '2022-08-09'
        responseDeadline:
          description: Prazo de resposta da cotação no formato yyyy-MM-dd.
          type: string
          example: '2022-08-15'
        notes:
          description: Observação interna da cotação.
          type: string
          example: Observações da cotação
        minNumberOfSuppliers:
          description: Número mínimo de fornecedores da cotação.
          type: integer
          example: 1
        suggestedNumberOfSuppliers:
          description: Número de fornecedores a sugerir da cotação.
          type: integer
          example: 3
        buyerId:
          description: Comprador da cotação.
          type: string
          example: JOAO
        purchaseQuotationItems:
          description: Insumos da cotação.
          type: array
          items:
            $ref: '#/components/schemas/PurchaseQuotationItemDTO'
        purchaseQuotationSuppliers:
          description: >-
            Fornecedores da cotação, dentro de cada fornecedor são retornadas
            suas respectivas negociações.
          type: array
          items:
            $ref: '#/components/schemas/PurchaseQuotationSupplierDTO'
        api-error:
          description: >-
            Quando não ocorrer nenhuma falha no carregamento das cotações de
            preço, esse campo não estará presente nos objetos retornados. Se
            durante o carregamento ocorrer alguma falha no lado do servidor, o
            array de cotações de preço será fechado com os itens carregados até
            então, e um objeto extra será adicionado ao final do array contendo
            apenas este campo preenchido com a respectiva mensagem de erro.
          type: string
          example: Falha ao carregar cotações de preço
    PurchaseQuotationItemDTO:
      type: object
      description: Insumo da cotação.
      properties:
        purchaseQuotationItemId:
          description: Código do item da cotação.
          type: integer
          example: 1
        buildingId:
          description: Código da obra para o qual o insumo foi cotado.
          type: integer
          example: 7
        productId:
          description: Código do insumo cotado.
          type: integer
          example: 100
        productDescription:
          description: Nome do insumo cotado.
          type: string
          example: Aço
        detailId:
          description: Código do detalhe do insumo cotado.
          type: integer
          example: 5
        detailDescription:
          description: Descrição do detalhe do insumo cotado.
          type: string
          example: CA60 4.2mm
        trademarkId:
          description: Código da marca do insumo cotado.
          type: integer
          example: 2
        trademarkDescription:
          description: Marca do insumo cotado.
          type: string
          example: Marca do aço
        quantity:
          description: Quantidade cotada.
          type: number
          example: 100.9
        unitySimbol:
          description: Símbolo da unidade de medida.
          type: string
          example: kg
        notes:
          description: Observação interna do insumo cotado.
          type: string
          example: Aço para obra xyz
    PurchaseQuotationSupplierDTO:
      type: object
      description: Fornecedor da cotação e suas negociações.
      properties:
        supplierId:
          description: Código do fornecedor.
          type: integer
          example: 77
        negotiations:
          description: Negociações com o fornecedor.
          type: array
          items:
            $ref: '#/components/schemas/PurchaseQuotationNegotiationDTO'
    PurchaseQuotationNegotiationDTO:
      type: object
      description: Negociação do fornecedor com seus respectivos insumos negociados.
      properties:
        negotiationId:
          description: Código da negociação com o fornecedor.
          type: integer
          example: 1
        registeredDate:
          description: Data de registro da negociação no formato yyyy-MM-dd.
          type: string
          example: '2022-08-10'
        responseDate:
          description: Data da resposta da negociação no formato yyyy-MM-dd.
          type: string
          example: '2022-08-11'
        expirationDate:
          description: Data de validade da negociação no formato yyyy-MM-dd.
          type: string
          example: '2022-08-15'
        sellersName:
          description: Nome do vendedor.
          type: string
          example: Vendedor
        totalValue:
          description: Valor total da negociação.
          type: number
          example: 88.9
        discount:
          description: Desconto da negociação.
          type: number
          example: 10.1
        freight:
          description: Frete geral.
          type: number
          example: 0
        itemsFreight:
          description: Frete dos itens negociados.
          type: number
          example: 0
        negotiationItems:
          description: Insumos da negociação.
          type: array
          items:
            $ref: '#/components/schemas/PurchaseQuotationNegotiationItemDTO'
    PurchaseQuotationNegotiationItemDTO:
      type: object
      description: Item da negociação.
      properties:
        purchaseQuotationItemId:
          description: >-
            Código do item da cotação, serve para identificar a qual item da
            cotação este item de negociação se refere.
          type: integer
          example: 1
        productId:
          description: Código do insumo da negociação.
          type: integer
          example: 100
        productDescription:
          description: Nome do insumo negociado.
          type: string
          example: Aço
        detailId:
          description: Código do detalhe do insumo negociado.
          type: integer
          example: 5
        detailDescription:
          description: Descrição do detalhe do insumo negociado.
          type: string
          example: CA60 4.2mm
        trademarkId:
          description: Código da marca do insumo negociado.
          type: integer
          example: 2
        trademarkDescription:
          description: Marca do insumo negociado.
          type: string
          example: Marca do aço
        quotedQuantity:
          description: Quantidade cotada deste insumo.
          type: number
          example: 100.9
        negotiatedQuantity:
          description: Quantidade negociada deste insumo.
          type: number
          example: 90
        unitPrice:
          description: Preço unitário.
          type: number
          example: 1.1
        discount:
          description: Desconto.
          type: number
          example: 10.1
        discountPercentage:
          description: Desconto percentual aplicado ao insumo.
          type: number
          example: 0
        increasePercentage:
          description: Aumento percentual aplicado ao insumo.
          type: number
          example: 0
        ipiTaxPercentage:
          description: Percentual de IPI aplicado ao insumo.
          type: number
          example: 0
        issTaxPercentage:
          description: Percentual de ISS aplicado ao insumo.
          type: number
          example: 0
        icmsTaxPercentage:
          description: Percentual de ICMS aplicado ao insumo.
          type: number
          example: 0
        freightUnitPrice:
          description: Frete unitário do insumo.
          type: number
          example: 0
        reference:
          description: Referência do item negociado.
          type: string
          example: Referência do item
        selectedOption:
          description: Indica este item foi selecionado para compra.
          type: boolean
          example: true
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    StartDateQueryRequired:
      description: Data inicial para filtro de período
      in: query
      name: startDate
      required: true
      schema:
        example: '2023-01-01'
        format: date
        type: string
    EndDateQueryRequired:
      description: Data final para filtro de período
      in: query
      name: endDate
      required: true
      schema:
        example: '2023-01-31'
        format: date
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/bulk-data/v1
