openapi: 3.1.1
info:
  title: Centro de Custos
  version: 1.24.0
  description: API para listagem de centro de custos
paths:
  /cost-centers/{costCenterId}:
    get:
      tags:
        - Centro de Custos
      summary: Busca todos os centros de custo no Sienge.
      operationId: getCostCenter
      x-section: Centro de Custos
      x-audience:
        - public
      parameters:
        - name: costCenterId
          in: path
          description: Código do centro de custo a ser apresentado
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Centro de custo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedCostCenter'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Retorna centro de custo encontrado (REST)
  /cost-centers/{costCenterId}/available:
    get:
      tags:
        - Centro de Custos
      summary: Busca centro de custo com contas correntes disponíveis.
      operationId: getCostCenterAvailable
      x-section: Centro de Custos
      x-audience:
        - public
      parameters:
        - name: costCenterId
          in: path
          description: Código do centro de custo a ser apresentado.
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Centro de custo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedCostCenterAvailable'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna centro de custo encontrado com contas correntes disponíveis
        (REST)
  /cost-centers:
    get:
      tags:
        - Centro de Custos
      summary: Busca todos centros de custos ordenados pelo codigo id.
      operationId: getAllCostCenters
      x-section: Centro de Custos
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Todos centros de custos encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseCostCenters'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Retoirna todos centros de custos (REST)
  /cost-centers/immediate-register-settings:
    get:
      tags:
        - Configurações de Registro ATO
      summary: Busca configurações de registro ATO no centro de custo.
      operationId: getImmediateRegisterSettings
      x-section: Configurações de Registro ATO
      x-audience:
        - public
      parameters:
        - $ref: '#/components/parameters/RequiredCostCenterId'
      responses:
        '200':
          description: Configurações de registro ATO encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImmediateRegisterSettings'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: Retorna configurações de registro ATO (REST)
components:
  schemas:
    DetailedCostCenter:
      type: object
      description: Centro de custo Detalhado
      allOf:
        - $ref: '#/components/schemas/BaseCostCenter'
      properties:
        buildingSectors:
          type: array
          description: Setores/obras
          items:
            $ref: '#/components/schemas/BuildingSector'
      example:
        id: 0
        name: string
        idCompany: 0
        cnpj: string
        buildingSectors:
          - id: string
            name: string
            accountableId: string
            accountableName: string
    DetailedCostCenterAvailable:
      type: object
      description: Centro de custo com contas correntes disponíveis
      allOf:
        - $ref: '#/components/schemas/BaseCostCenter'
      properties:
        availableAccounts:
          type: array
          items:
            $ref: '#/components/schemas/Available'
          example:
            - accountNumber: '1'
              accountName: Conta 1
      example:
        id: 0
        name: string
        idCompany: 0
        cnpj: string
        availableAccounts:
          - accountNumber: 1.01.01.001
            accountName: Caixa Geral
    GetResponseCostCenters:
      type: object
      description: Lista de centros de custos
      properties:
        costCenters:
          type: array
          items:
            $ref: '#/components/schemas/BaseCostCenter'
          example:
            - id: 1
              name: Centro de custo 1
              idCompany: 1
              cnpj: 11.111.111/1111-11
      example:
        costCenters:
          - id: 1
            name: Centro de custo 1
            idCompany: 1
            cnpj: 11.111.111/1111-11
    ImmediateRegisterSettings:
      type: object
      description: Configurações de registro ATO
      properties:
        costCenterId:
          type: integer
          format: int32
          description: Código centro de custo
          example: 1
        companyId:
          description: Código da empresa
          example: 123
          format: int32
          type: integer
        accountNumber:
          description: Número da conta corrente
          example: 1234-5
          type: string
        registerType:
          type: string
          description: Tipo de registro
          example: '1'
        receiveCondition:
          type: string
          description: Condição de recebimento
          example: '1'
    BaseCostCenter:
      type: object
      description: Centro de custo
      properties:
        id:
          description: Código do centro de custo
          example: 123
          format: int32
          type: integer
        name:
          description: Nome do centro de custo
          example: Centro de Custo Exemplo
          type: string
        idCompany:
          description: Código da empresa
          example: 123
          format: int32
          type: integer
        cnpj:
          type: string
          description: CNPJ do centro de custos
          example: 11.111.111/1111-11
    BuildingSector:
      type: object
      description: Setor/obra
      properties:
        id:
          type: string
          description: Código do setor/obra
          example: '123'
        name:
          type: string
          description: Nome do do setor/obra
          example: Setor Administrativo
        accountableId:
          type: string
          description: Código do responsável do setor/obra
          example: '456'
        accountableName:
          type: string
          description: Nome do responsável do setor/obra
          example: João Silva
    Available:
      type: object
      description: Conta corrente disponível
      properties:
        accountNumber:
          type: string
          description: código da conta corrente disponível
          example: 1.01.01.001
        accountName:
          type: string
          description: nome da conta corrente disponível
          example: Caixa Geral
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    RequiredCostCenterId:
      description: Código do centro de custo (obrigatório)
      in: query
      name: costCenterId
      required: true
      schema:
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
