    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    OperationTypeEnum:
      type: integer
      enum:
        - 0
        - 1
      description: |
        Tipo de operação:
        * 0 - Entrada
        * 1 - Saída
      example: 1
    DestinationOperationEnum:
      type: integer
      enum:
        - 1
        - 2
        - 3
      description: |
        Destino da operação:
        * 1 - Operação interna
        * 2 - Operação interestadual
        * 3 - Operação com exterior
      example: 1
    EmissionPurposeEnum:
      type: integer
      enum:
        - 1
        - 2
        - 3
        - 4
      description: |
        Finalidade de emissão:
        * 1 - NF-e normal
        * 2 - NF-e complementar
        * 3 - NF-e de ajuste
        * 4 - Devolução de mercadoria
      example: 4
    BuyerPresenceIndicatorEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 9
      description: |
        Indicador de presença do comprador:
        * 0 - Não se aplica
        * 1 - Operação presencial
        * 2 - Operação não presencial, pela Internet
        * 3 - Operação não presencial, Teleatendimento
        * 4 - NFC-e em operação com entrega a domicílio
        * 5 - Operação presencial, fora do estabelecimento
        * 9 - Operação não presencial, outros
      example: 0
    EmissionProcessEnum:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
      description: >
        Processo de emissão da NF-e:

        * 0 - Emissão de NF-e com aplicativo do contribuinte

        * 1 - Emissão de NF-e avulsa pelo Fisco

        * 2 - Emissão de NF-e avulsa, pelo contribuinte com seu certificado
        digital, através do site do Fisco

        * 3 - Emissão NF-e pelo contribuinte com aplicativo fornecido pelo Fisco
      example: 0
    EnvironmentTypeEnum:
      type: integer
      enum:
        - 1
        - 2
      description: |
        Tipo de ambiente:
        * 1 - Produção
        * 2 - Homologação
      example: 2
