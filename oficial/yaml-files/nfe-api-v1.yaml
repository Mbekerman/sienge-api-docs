        - name: nfeKey
          in: path
          description: Chave de acesso da Nota Fiscal Eletronica contendo 44 caracteres
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntregaRetirada'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna os dados dos locais de entrega e de retirada vinculados a uma
        Nota Fiscal Eletrônica, identificada pela chave de acesso informada no
        caminho da requisição. (REST)
  /nfes/{nfeKey}/linked-nfes:
