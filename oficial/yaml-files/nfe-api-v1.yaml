      summary: Consulta formas de pagamento da nota
      operationId: loadPayments
      parameters:
        - name: nfeKey
          in: path
          description: Chave de acesso contendo 44 caracteres
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Operação conluida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponsePagamento'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna as formas de pagamento associadas a uma Nota Fiscal Eletrônica,
        identificada por sua chave de acesso. (REST)
  /nfes/{nfeKey}/deliveries:
    get:
      x-original-file: nfe-api-v1.yaml
      x-section: Notas Fiscais
      x-audience:
        - public
      tags:
        - Notas Fiscais
      summary: Consulta locais de entrega e retirada da nota
      operationId: loadDeliveries
