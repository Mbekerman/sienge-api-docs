        especificado na nota fiscal, identificado pela chave de acesso e código
        do item. (REST)
components:
  schemas:
    GetResponseNfeDocuments:
      required:
        - resultSetMetadata
        - results
      type: object
      description: Lista de Notas fiscais retornadas como resultado da pesquisa
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Documents'
          example:
            - codigoNumericoNota: 677
              codigoUfEmitente: 42
              chaveAcessoNota: '42170182845322000104557880000006331000006772'
              naturezaDaOperacao: teste
              codigoModeloNfe: 55
              modeloDocumentoFiscal: NF-e emitida em substituição ao modelo 1 ou 1A
              serieDocumentoFiscal: 788
              numeroDocumentoFiscal: 633
              dataEmissaoDocumentoFiscal: 25/12/2017
              dataSaidaEntradaMercadoria: 25/12/2017
              codigoTipoOperacao: 1
              tipoOperacao: Saída
              codigoDestinoOperacao: 1
              localDestinoOperacao: Operação interna
              codigoFinalidadeDeEmissao: 4
              finalidadeEmissao: Devolução de mercadoria
              codigoIndicadorPresencaComprador: 0
