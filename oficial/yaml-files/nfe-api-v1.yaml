openapi: 3.1.1
info:
  title: Notas Fiscais Eletrônicas de Produto
  version: 1.24.0
  description: >-
    API REST que expõe os dados das Notas Fiscais Eletrônicas recebidas no
    sistema por meio dos processos de importação via SEFAZ ou upload manual de
    arquivos
paths:
  /nfes:
    get:
      x-original-file: nfe-api-v1.yaml
      x-section: Notas Fiscais
      x-audience:
        - public
      tags:
        - Notas Fiscais
      summary: Consulta notas fiscais emitidas por período
      operationId: loadAllNfeDocuments
      parameters:
        - $ref: '#/components/parameters/StartDateQueryRequired'
          description: >-
            Data de início da busca (data emissão) no formato: yyyy-MM-dd.
            Exemplo: 2016-08-13
        - $ref: '#/components/parameters/EndDateQueryRequired'
          description: >-
            Data de fim da busca (data emissão) no formato: yyyy-MM-dd. Exemplo:
            2017-08-13
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseNfeDocuments'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna as notas fiscais eletrônicas de produto emitidas dentro do
        intervalo definido por startDate e endDate, ordenadas por data de
        emissão. É possível paginar os resultados utilizando os parâmetros limit
        e offset. O formato esperado das datas é yyyy-MM-dd. (REST)
  /nfes/{nfeKey}:
    get:
      x-original-file: nfe-api-v1.yaml
      x-section: Notas Fiscais
      x-audience:
        - public
      tags:
        - Notas Fiscais
      summary: Consulta nota fiscal pela chave de acesso
      operationId: loadNfesByNfeKey
      parameters:
        - name: nfeKey
          in: path
          description: Chave de acesso da nfe de 44 caracteres
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documents'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna os dados completos de uma nota fiscal eletrônica de produto a
        partir da sua chave de acesso de 44 dígitos. A chave deve ser informada
        como parâmetro de path. (REST)
  /nfes/{nfeKey}/issuers-recipients:
    get:
      x-original-file: nfe-api-v1.yaml
      x-section: Notas Fiscais
      x-audience:
        - public
      tags:
        - Notas Fiscais
      summary: Consulta emitente e destinatário da nota
      operationId: loadIssuersAndRecipients
      parameters:
        - name: nfeKey
          in: path
          description: Chave de acesso da nfe com 44 caracteres
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sucesso na operação de retorno dos dados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Emitente'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna os dados do emitente e do destinatário de uma Nota Fiscal
        Eletrônica a partir da chave de acesso fornecida no path. Essa operação
        é útil para identificar as partes envolvidas em uma transação fiscal
        registrada no sistema. (REST)
  /nfes/{nfeKey}/payments:
    get:
      x-original-file: nfe-api-v1.yaml
      x-section: Notas Fiscais
      x-audience:
        - public
      tags:
