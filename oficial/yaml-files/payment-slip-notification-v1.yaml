openapi: 3.1.1
info:
  title: Geração de Boleto (Segunda Via)
  version: 1.24.0
  description: Geração e envio de boletos de segunda via por e-mail
paths:
  /payment-slip-notification:
    get:
      x-original-file: payment-slip-notification-v1.yaml
      x-audience:
        - public
      tags:
        - Geração de Boleto (Segunda Via)
      summary: Gera link para boleto de segunda via.
      operationId: getPaymentSlipNotification
      parameters:
        - name: billReceivableId
          in: query
          description: Código do título, apenas números
          required: true
          schema:
            type: integer
            example: 12345
        - name: installmentId
          in: query
          description: Código da parcela do título, apenas números
          required: true
          schema:
            type: integer
            example: 67890
      responses:
        '200':
          description: Boleto gerado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentSlipNotificationResultDto'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Gera o link para boleto de segunda via do título e parcela informado,
        assim como o número digitável do boleto. O link expira em 5 minutos.
        (REST)
    post:
      tags:
        - Geração de Boleto (Segunda Via)
      summary: Envia boleto de segunda via por e-mail para o cliente
      operationId: postPaymentSlipNotification
      requestBody:
        description: Informações para enviar o boleto
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoletoParameterDTO'
        required: true
      responses:
        '201':
          description: Boleto enviado com sucesso
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-original-file: payment-slip-notification-v1.yaml
      description: >-
        Envia o boleto de segunda via do título e parcela informado, no e-mail
        do respectivo cliente do título. (REST)
      x-audience:
        - public
components:
  schemas:
    GetPaymentSlipNotificationResultDto:
      description: Resposta contendo metadados e lista de boletos
      required:
        - resultSetMetadata
        - results
      type: object
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          maxItems: 200
          description: Lista de unidades retornadas como resultado da pesquisa.
          items:
            $ref: '#/components/schemas/BoletoUrlDto'
          example:
            - urlReport: https://example.com/boleto/12345
              digitableNumber: '34191790010104351004791020150008291070026000'
              fileName: boleto.pdf
              parameter1207: '12345'
      example:
        resultSetMetadata:
          count: 7000
          offset: 1200
          limit: 200
        results:
          - urlReport: https://example.com/boleto/12345
            digitableNumber: '34191790010104351004791020150008291070026000'
            fileName: boleto.pdf
            parameter1207: '12345'
    BoletoParameterDTO:
      description: Dados necessários para envio de boleto de segunda via por e-mail
      required:
        - emailBody
        - emailCustomer
        - emailTitle
        - installmentId
        - receivableBillId
      type: object
      properties:
        receivableBillId:
          description: Identificador do título a receber
          example: 10
          format: int32
          type: integer
        installmentId:
          description: Identificador da parcela do título
          example: 1
          format: int32
          type: integer
        emailCustomer:
          type: string
          description: E-mail o qual a segunda via do boleto será enviado
          example: cliente@example.com
        emailTitle:
          type: string
          description: >-
            Texto do título a ser colocado no e-mail enviado ao cliente do
            título
          example: Segunda Via do Boleto
        emailBody:
          type: string
          description: Texto do corpo a ser colocado no e-mail enviado ao cliente do título
          example: >-
            Prezado cliente, segue em anexo a segunda via do seu boleto. Favor
            efetuar o pagamento até a data de vencimento.
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    BoletoUrlDto:
      description: Dados do boleto gerado incluindo URL e número digitável
      type: object
      properties:
        urlReport:
          type: string
          description: Url para download da segunda via do boleto.
          example: https://example.com/boleto/12345
        digitableNumber:
          type: string
          description: Número digitável do boleto.
          example: '34191790010104351004791020150008291070026000'
        fileName:
          type: string
          description: Nome do arquivo gerado.
          example: boleto.pdf
        parameter1207:
          type: string
          description: Parâmetro de criptografia (param 1207)
          example: '12345'
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
