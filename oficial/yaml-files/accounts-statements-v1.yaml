openapi: 3.1.1
info:
  title: Extrato de Contas
  version: 1.24.0
  description: API REST para Extrato de contas.
paths:
  /accounts-statements:
    get:
      x-original-file: accounts-statements-v1.yaml
      x-audience:
        - public
      tags:
        - Extrato de Contas
      summary: Retorna a lista de movimentações associadas a contas.
      operationId: listStatements
      parameters:
        - $ref: '#/components/parameters/StartDateQueryRequired'
        - $ref: '#/components/parameters/EndDateQueryRequired'
        - $ref: '#/components/parameters/AccountNumber'
        - $ref: '#/components/parameters/CompanyIdQuery'
        - $ref: '#/components/parameters/CompanyGroupId'
        - name: reconcile
          in: query
          description: >-
            Quando true, retorna somente movimentos não conciliados. O filtro é
            aplicado no nível do movimento e pode ser combinado com o período.
            Quando ausente ou false, nenhum filtro adicional de conciliação é
            aplicado.
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: >-
            Retorna a lista de movimentações financeiras associados a contas do 
            Sienge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponseAccountStatement'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      description: >-
        Retorna a lista de movimentações financeiras associados a contas do 
        Sienge, com data dentro do periodo informado nos parâmetros. (REST)
components:
  schemas:
    GetResponseAccountStatement:
      type: object
      description: Lista de movimentações
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: >-
            Lista de movimentações financeiras retornadas como resultado da
            pesquisa
          items:
            $ref: '#/components/schemas/Statement'
          example:
            - id: 1
              value: 999.99
              date: '2018-01-01'
              documentNumber: Jan2018
              description: Pagamento fornecedor.
              documentId: NFE
              type: Income
              reconciliationDate: '2018-01-01'
              companyId: 123
              billId: 1
              installmentNumber: 1
              statementOrigin: CP
              statementType: Pagamento
              statementTypeNotes: ''
              accountNumber: 1234-5
              budgetCategories:
                - percentage: 100
                  links:
                    - href: string
                      rel: string
              links:
                - href: string
                  rel: string
      example:
        resultSetMetadata:
          count: 1
          offset: 0
          limit: 1
        results:
          - id: 1
            value: 999.99
            date: '2018-01-01'
            documentNumber: Jan2018
            description: Pagamento fornecedor.
            documentId: NFE
            type: Income
            reconciliationDate: '2018-01-01'
            companyId: 123
            billId: 1
            installmentNumber: 1
            statementOrigin: CP
            statementType: Pagamento
            statementTypeNotes: ''
            accountNumber: 1234-5
            budgetCategories:
              - percentage: 100
                links:
                  - href: string
                    rel: string
            links:
              - href: string
                rel: string
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    Statement:
      type: object
      properties:
        id:
          type: integer
          description: Id da movimentação financeira (Interno Sienge)
          format: int32
          example: 1
        value:
          type: number
          description: Valor da movimentação financeira
          format: double
          example: 999.99
        date:
          type: string
          description: >-
            Data da movimentação financeira (Formato ISO 8601 yyyy-MM-dd |
            Exemplo: 2018-01-01)
          format: date
          example: '2018-01-01'
        documentNumber:
          description: Número do documento
          example: NF-001
          type: string
        description:
          description: Observação do movimento
          example: Pagamento fornecedor.
          type: string
        documentId:
          description: Código do documento
          example: NF | AV
          type: string
        type:
          type: string
          description: Tipo de movimentação financeira (Entrada ou Saída)
          example: Income
        reconciliationDate:
          type: string
          description: >-
            Data de conciliação da movimentação financeira (Formato ISO 8601
            yyyy-MM-dd | Exemplo: 2018-01-01)
          format: date
          example: '2018-01-01'
        companyId:
          description: Código da empresa
          example: 123
          format: int32
          type: integer
        billId:
          type: integer
          description: >-
            Número do título vinculado a movimentação financeira Contas a pagar
            se type = Expense Contas a receber se type = Income
          format: int32
          example: 1
        installmentNumber:
          type: integer
          description: >-
            Número da parcela do título vinculado a movimentação financeira
            Contas a pagar se type = Expense Contas a receber se type = Income
          format: int32
          example: 1
        statementOrigin:
          type: string
          description: Sistema de origem da movimentação financeira
          example: CP
        statementType:
          type: string
          description: Nome da operação financeira da movimentação
          example: Pagamento
        statementTypeNotes:
          type: string
          description: Descrição do histórico da movimentação
          example: Descrição da movimentacao financeira
        accountNumber:
          description: Número da conta corrente
          example: 1234-5
          type: string
        budgetCategories:
          type: array
          description: Apropriações financeiras da movimentação financeira
          items:
            $ref: '#/components/schemas/BudgetCategory'
        links:
          $ref: '#/components/schemas/Links'
      description: Movimentação financeira
    BudgetCategory:
      type: object
      properties:
        percentage:
          type: number
          description: >-
            Percentual apropriado para plano financeiro e centro de custo
            associados
          format: double
          example: 100
        links:
          $ref: '#/components/schemas/Links'
      description: Apropriações financeiras da movimentação
    Links:
      description: Links para acessar outros recursos
      example:
        - href: https://../v1/purchase-..
          rel: Recurso
      items:
        $ref: '#/components/schemas/Link'
      type: array
    Link:
      description: Representa um link para outro recurso.
      properties:
        href:
          description: URL do recurso associado
          example: https://../v1/purchase-..
          type: string
        rel:
          description: Nome da recurso associado
          example: Recurso
          type: string
      type: object
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    StartDateQueryRequired:
      description: Data inicial para filtro de período
      in: query
      name: startDate
      required: true
      schema:
        example: '2023-01-01'
        format: date
        type: string
    EndDateQueryRequired:
      description: Data final para filtro de período
      in: query
      name: endDate
      required: true
      schema:
        example: '2023-01-31'
        format: date
        type: string
    AccountNumber:
      description: Número da conta cadastrada no Sienge
      in: query
      name: accountNumber
      schema:
        type: string
    CompanyIdQuery:
      description: Código da empresa (opcional)
      in: query
      name: companyId
      required: false
      schema:
        example: 1
        type: integer
    CompanyGroupId:
      description: Código do grupo de empresas cadastrado no Sienge
      in: query
      name: companyGroupId
      schema:
        format: int32
        type: integer
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
