    PaginatedResponseOfPurchaseOrderAttachment:
      description: Lista de anexos de Pedidos de Compra retornadas
      type: object
      required:
        - resultSetMetadata
        - results
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: >-
            Lista de anexos de Pedidos de Compra retornadas como resultado da
            requisição
          items:
            $ref: '#/components/schemas/PurchaseOrderAttachment'
        links:
          $ref: '#/components/schemas/Links'
      example:
        resultSetMetadata:
          count: 1
          offset: 0
          limit: 100
        results:
          - purchaseOrderId: 1
            attachmentNumber: 4
            description: Anexo X
            name: anexo_x.pdf
    SupplierEvaluationCriteria:
      description: Lista de critérios de avaliação do fornecedor
      type: object
      properties:
        remainderList:
          type: array
          items:
            $ref: '#/components/schemas/SupplierEvaluationCriteriaRemainderList'
        defaultList:
          type: array
          items:
            $ref: '#/components/schemas/SupplierEvaluationCriteriaDefaultList'
        rangeMin:
          type: integer
          format: int64
          example: 0
          description: Número mínimo do intervalo das avaliações
        rangeMax:
          type: integer
          format: int64
          example: 10
          description: Número máximo do intervalo das avaliações
      example:
        remainderList:
          - id: 1
            description: Qualidade do produto
            weight: 5
        defaultList:
          - id: 2
            description: Prazo de entrega
            weight: 5
        rangeMin: 0
        rangeMax: 10
    Evaluation:
      type: object
      description: Avaliação do fornecedor
      properties:
        notes:
          type: string
          description: Observação para avaliação
          example: Observação para avaliação
        evaluatedCriteria:
          type: array
          description: Lista de critérios a serem avaliados com suas respectivas notas.
          items:
            $ref: '#/components/schemas/EvaluatedCriterion'
      example:
        notes: Observação para avaliação
        evaluatedCriteria:
          - criterionId: 1
            value: 6.5
    Links:
      description: Links para acessar outros recursos
      example:
        - href: https://../v1/purchase-..
          rel: Recurso
      items:
        $ref: '#/components/schemas/Link'
      type: array
    PurchaseOrderStatusEnum:
      type: string
      description: |-
        Situação do Pedido de Compra.




          - `PENDING` - Pendente
          - `PARTIALLY_DELIVERED` - Parcialmente entregue
          - `FULLY_DELIVERED` - Totalmente atendido
          - `CANCELED` - Cancelado
      enum:
        - PENDING
        - PARTIALLY_DELIVERED
        - FULLY_DELIVERED
        - CANCELED
      example: PENDING
    ConsistencyEnum:
      type: string
      description: |-
        Status da situação de consistência do Pedido de compra.




          - `IN_INCLUSION` - Em inclusão
          - `CONSISTENT` - Consistente
          - `INCONSISTENT` - Inconsistente
      enum:
        - IN_INCLUSION
        - CONSISTENT
        - INCONSISTENT
      example: IN_INCLUSION
    OrderFreightTypeEnum:
      type: string
      description: |-
        Modalidade do frete do pedido de compra.




          - `NI` - Não incidente
          - `CIF` - Incluso
          - `FOB` - A pagar
      enum:
        - NI
        - CIF
        - FOB
      example: NI
    FreightIpiFlagEnum:
      description: |-
        Considerar o valor do IPI no frete.
          - `S` - Sim
          - `N` - Não
      enum:
        - S
        - 'N'
      example: S
      type: string
    PurchaseQuotation:
      description: Cotação atendida pelo item do pedido
      type: object
      properties:
        purchaseQuotationId:
          type: integer
          format: int64
          example: 1
          description: Número da cotação
        purchaseQuotationItemId:
          type: integer
          format: int64
          example: 1
          description: Número item da cotação
    PurchaseOrderItemDeliverySchedule:
      description: Previsão de entrega de um item de pedido de compra
      type: object
      properties:
        deliveryScheduleNumber:
          type: integer
          format: int64
          example: 1
          description: Número da previsão de entrega
        sheduledDate:
          type: string
          example: '2018-03-11'
          description: 'Data da previsão de entrega no formato: yyyy-MM-dd.'
        sheduledQuantity:
          type: number
          format: double
          example: 100
          description: Quantidade prevista para entrega
        deliveredQuantity:
          type: number
          format: double
          example: 50
          description: Quantidade já entregue
        openQuantity:
          type: number
          format: double
          example: 50
          description: >-
            Saldo da entrega

            Caso a diferença entre sheduledQuantity e deliveredQuantity for
            maior que zero e o openQuantity estiver igual a zero, significa que
            o saldo foi cancelado
      example:
        deliveryScheduleNumber: 1
        sheduledDate: '2018-03-11'
        sheduledQuantity: 100
        deliveredQuantity: 50
        openQuantity: 50
    PurchaseOrderItemBuildingAppropriation:
      description: Apropriação de obra de um item do pedido de compra
      type: object
      properties:
        buildingUnitId:
          type: integer
          format: int64
          example: 1
          description: Código da unidade construtiva da obra
        costEstimationItemReference:
          type: string
          example: 08.004.001
          description: Referência do item do orçamento
        percentage:
          type: number
          format: double
          example: 5.88
          description: Percentual apropriado
    InstallmentPaymentCondition:
      type: object
      description: Parcela das condição de pagamento
      properties:
        installmentId:
          type: integer
          example: 1
          description: Id da parcela
        numberOfdays:
          type: integer
          example: 10
          description: Quantidade de dias
        percentage:
          type: number
          format: double
          example: 25
          description: Percentual da parcela
    ObservationDTO:
      description: >-
        Objeto contendo a observação relacionada a aprovação ou reprovação do
        contrato
      properties:
        observation:
          description: >-
            Observação que será concatenada as observações de autorização e
            desautorização.
          example: Texto enviado via Api
          maxLength: 300
          type: string
      type: object
      x-implementation:
        name: >-
          br.com.softplan.unic.contract.measurement.v1.controller.contract.authorization.ObservationDTO
        source: >-
          sienge/SiengeAPI-Contratos-medicoes/src/main/java/br/com/softplan/unic/contract/measurement/v1/controller/contract/authorization/ObservationDTO.java
    PurchaseOrderAttachment:
      description: Anexo de um pedido de compra
      type: object
      properties:
        purchaseOrderId:
          type: integer
          format: int64
          example: 5760
          description: Id pedido de compra
        attachmentNumber:
          type: integer
          format: int64
          example: 4
          description: Número do Anexo do pedido de compra
        name:
          type: string
          example: document_escaneado.pdf
          description: Nome do arquivo de anexo do Pedido de Compra
        description:
          type: string
          example: Document Escaneado 01/08/2019
          description: Descrição do Anexo do Pedido de Compra
    SupplierEvaluationCriteriaRemainderList:
      type: object
      description: Lista complementar de critérios de avaliação do fornecedor
      properties:
        id:
          type: integer
          example: 1
          description: Id do critério de avaliação
        description:
          type: string
          example: Qualidade do produto
          description: Descrição critério de avaliação
        weight:
          type: integer
          example: 1
          description: Peso do cálculo da média
    SupplierEvaluationCriteriaDefaultList:
      type: object
      description: Lista padrão dos critério de avaliação do fornecedor
      properties:
        id:
          type: integer
          example: 1
          description: Identificador do critério de avaliação
        description:
          type: string
          example: Prazo de entrega
          description: Descrição do critério de avaliação
        weight:
          type: integer
          example: 1
          description: Peso do cálculo da média
    EvaluatedCriterion:
      type: object
      description: Critério a ser avaliado
      properties:
        criterionId:
          type: integer
          format: int64
          example: 1
          description: Código do critério a ser avaliado
        value:
          type: number
          format: double
          example: 6.5
          description: Nota atribuída ao critério.
    Link:
      description: Representa um link para outro recurso.
      properties:
        href:
          description: URL do recurso associado
          example: https://../v1/purchase-..
          type: string
        rel:
          description: Nome da recurso associado
          example: Recurso
          type: string
      type: object
    StatusApprovalEnum:
      type: string
      description: |-
        Situação de aprovação do Pedido de Compra.




          - `APPROVED` - Aprovado
          - `DISAPPROVED` - Reprovado
      enum:
        - APPROVED
        - DISAPPROVED
      example: DISAPPROVED
    ErrorMessage:
      description: Descrição dos erros no processamento da requisição
      properties:
        clientMessage:
          description: Mensagem de resposta para o usuário
          example: Você deve informar o query param xpto
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        developerMessage:
          description: Mensagem de resposta para análise do desenvolvedor
          example: Parâmetro obrigatório xpto ausente
          maxLength: 1000
          pattern: ^.{1,1000}$
          type: string
        errors:
          description: Lista de erros
          example:
            - field: xpto
              message: campo xpto ausente
          items:
            example:
              field: xpto
              message: campo xpto ausente
            properties:
              field:
                description: Campo inválido
                example: name
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
              message:
                description: Razão pela qual o campo foi considerado inválido
                example: O campo name não está presente
                maxLength: 1000
                pattern: ^.{1,1000}$
                type: string
            type: object
          maxItems: 100
          type: array
        status:
          description: Status Http
          example: 400
          format: int32
          maximum: 599
          minimum: 100
          type: integer
      required:
        - status
        - developerMessage
        - clientMessage
      type: object
  responses:
    '400':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: A requisição contém dados inválidos ou incompletos.
                developerMessage: Parâmetro obrigatório ausente
                status: 400
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema na requisição
    '401':
      description: Problema na autenticação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 401
                developerMessage: Erro na autenticação
                clientMessage: >-
                  Ocorreu um erro na autenticação. Verifique suas credenciais,
                  chave ou token de acesso.
    '403':
      description: Problema na autorização
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 403
                developerMessage: Ocorreu um erro na autorização
                clientMessage: >-
                  Você tentou realizar uma operação para a qual não tem
                  autorização.
    '404':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: O recurso que tentou acessar não existe.
                developerMessage: Recurso não encontrado
                status: 404
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Recurso não encontrado
    '415':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar um conteúdo cujo tipo não é suportado pela
                  operação.
                developerMessage: Content-Type não suportado.
                status: 415
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Tipo de conteúdo não suportado.
    '422':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Você tentou enviar dados que, embora sejam de um tipo
                  suportado, possuem algum problema em sua estrutura.
                developerMessage: Unprocessable entity.
                status: 422
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Problema nos dados enviados
    '429':
      description: Consumo abusivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            default:
              value:
                status: 429
                developerMessage: Violação do Rate Limit
                clientMessage: >-
                  Você fez mais requisições do que o permitido. Espere um pouco
                  e tente novamente.
    '500':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: Ocorreu um erro no servidor.
                developerMessage: Erro Interno
                status: 500
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Erro interno no servidor
    '503':
      content:
        application/json:
          examples:
            default:
              value:
                clientMessage: >-
                  Nossos serviços estão temporariamente indisponíveis. Tente
                  novamente em alguns minutos.
                developerMessage: Servidor temporariamente indisponível.
                status: 503
          schema:
            $ref: '#/components/schemas/ErrorMessage'
      description: Servidor temporariamente indisponível
  parameters:
    BuildingIdQuery:
      description: Código da obra (opcional)
      in: query
      name: buildingId
      required: false
      schema:
        example: 123
        format: int32
        type: integer
    Limit:
      description: Quantidade máxima de resultados a serem retornados na página.
      in: query
      name: limit
      required: false
      schema:
        default: 100
        example: 100
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    Offset:
      description: Deslocamento a partir do começo da lista.
      in: query
      name: offset
      required: false
      schema:
        default: 0
        example: 600
        format: int32
        maximum: 2147483647
        minimum: 0
        type: integer
    PurchaseOrderId:
      description: >-
        Id do Pedido de Compra


        Obs: Este campo deve seguir o padrão de acordo com o parâmetro 415 do
        Sienge. Esse parâmetro possui as seguintes configurações:


        Sequêncial contínuo: Apenas inserir o número do Pedido de Compra. Ex:
        "/purchase-orders/123"

        Sequêncial contínuo anual: O campo possui no total 8 caracteres. Os 2
        primeiros corresponde ao ano do pedido. Os demais são o número do pedido
        preenchidos com 0 à esquerda. Ex: No sienge o pedido é representado
        assim: "123/19". Porém na API seria assim: "/purchase-orders/19000123"
      example: 1
      in: path
      name: purchaseOrderId
      required: true
      schema:
        format: int64
        type: integer
    PurchaseOrderItemNumberParam:
      description: Número do item do Pedido de Compra
      example: 1
      in: path
      name: itemNumber
      required: true
      schema:
        format: int32
        type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
tags: []
security:
  - basicAuth: []
servers:
  - url: https://api.sienge.com.br/{subdominio-do-cliente}/public/api/v1
webhooks:
  PURCHASE_ORDER_AUTHORIZATION_CHANGED:
    post:
      tags:
        - Webhooks - Pedidos de Compra
      operationId: purchaseOrderAuthorizationChanged
      summary: Autorização do pedido alterada
      description: Sempre que a autorização do pedido de compra mudar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purchaseOrderId:
                  type: integer
                  description: Código (ID) do pedido de compra
                  example: 1027
                authorized:
                  type: boolean
                  description: Indica se o pedido está autorizado
                  example: true
                consistent:
                  type: boolean
                  description: Indica se o pedido está consistente
                  example: true
                changedAt:
                  description: >-
                    Data e hora da modificação no formato
                    yyyy-MM-dd'T'HH:mm:ss.SSSXXX
                  example: '2024-08-19T14:20:00.123-03:00'
                  format: date-time
                  type: string
              required:
                - purchaseOrderId
                - authorized
                - consistent
                - changedAt
            example:
              purchaseOrderId: 1024
              authorized: true
              consistent: true
              changedAt: '2024-08-19T14:20:00.123-03:00'
      responses:
        '200':
          description: >-
            Confirmação de recebimento do evento de alteração de autorização do
            pedido de compra.
      x-audience:
        - public
  PURCHASE_ORDER_GENERATED_FROM_NEGOCIATION:
    post:
      tags:
        - Webhooks - Pedidos de Compra
      operationId: purchaseOrderGeneratedFromNegotiation
      summary: Pedido gerado via negociação
      description: Sempre que um pedido de compra for gerado a partir de uma negociação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purchaseOrderId:
                  type: integer
                  description: Código (ID) do pedido de compra
                  example: 1027
                purchaseQuotationId:
                  type: integer
                  description: Identificador da cotação de compra
                  example: 501
                supplierId:
                  type: integer
                  description: Identificador do fornecedor
                  example: 3001
                negotiationNumber:
                  type: integer
                  description: Número da negociação
                  example: 77
                authorized:
                  type: boolean
                  description: Indica se o pedido está autorizado
                  example: true
              required:
                - purchaseOrderId
                - purchaseQuotationId
                - supplierId
                - negotiationNumber
                - authorized
            example:
              purchaseOrderId: 1025
              purchaseQuotationId: 501
              supplierId: 3001
              negotiationNumber: 77
              authorized: true
      responses:
        '200':
          description: >-
            Confirmação de recebimento do evento de geração de pedido de compra
            a partir de negociação.
      x-audience:
        - public
  PURCHASE_ORDER_ITEM_MODIFIED:
    post:
      tags:
        - Webhooks - Pedidos de Compra
      operationId: purchaseOrderItemModified
      summary: Itens do pedido modificados
      description: Sempre que tiver alguma alteração nos itens do pedido de compra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purchaseOrderId:
                  type: integer
                  description: Código (ID) do pedido de compra
                  example: 1027
              required:
                - purchaseOrderId
            example:
              purchaseOrderId: 1026
      responses:
        '200':
          description: >-
            Confirmação de recebimento do evento de modificação de itens do
            pedido de compra.
      x-audience:
        - public
  PURCHASE_ORDER_FINANCIAL_FORECAST_UPDATED:
    post:
      tags:
        - Webhooks - Pedidos de Compra
      operationId: purchaseOrderFinancialForecastUpdated
      summary: Previsão financeira atualizada
      description: >-
        Sempre que houver alterações nos campos departamento e centro de custo
        das previsões financeiras dos pedidos de compra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purchaseOrderId:
                  type: integer
                  description: Código (ID) do pedido de compra
                  example: 1027
              required:
                - purchaseOrderId
            example:
              purchaseOrderId: 1027
      responses:
        '200':
          description: >-
            Confirmação de recebimento do evento de atualização da previsão
            financeira do pedido de compra.
      x-audience:
        - public
