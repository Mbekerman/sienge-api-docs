openapi: 3.1.1
info:
  title: Pedidos de Compra
  version: 1.24.0
  description: Operações relacionadas a um Pedido de Compra.
paths:
  /purchase-orders:
    get:
      description: Retorna uma lista de pedidos de compra. (REST)
      operationId: getPurchaseOrders
      x-original-file: purchase-orders-v1.yaml
      x-audience:
        - public
      tags:
        - Pedidos de Compra
      summary: Consulta pedidos de compra
      parameters:
        - in: query
          name: startDate
          required: false
          description: 'Data de início da busca (data do pedido) no formato: yyyy-MM-dd.'
          schema:
            type: string
            format: date
            example: '2018-03-01'
        - in: query
          name: endDate
          required: false
          description: 'Data de fim da busca (data do pedido) no formato: yyyy-MM-dd.'
          schema:
            type: string
            format: date
            example: '2018-03-11'
        - in: query
          name: status
          required: false
          description: >-
            As situações do pedido de compra são:  "PENDING" - Pendente,
            "PARTIALLY_DELIVERED" - Parcialmente entregue, "FULLY_DELIVERED" -
            Totalmente atendido, "CANCELED" - Cancelado
          schema:
            $ref: '#/components/schemas/PurchaseOrderStatusEnum'
        - in: query
          name: authorized
          required: false
          description: >-
            Para retornar apenas pedidos de compra autorizados informe o valor
            "true" e para pedidos de compra desautorizados informe "false". Caso
            não seja informado retornará ambos
          schema:
            type: boolean
            example: true
        - in: query
          name: supplierId
          required: false
          description: Id do fornecedor do pedido de compra.
          schema:
            type: integer
            example: 1
        - $ref: '#/components/parameters/BuildingIdQuery'
          description: Código da obra do pedido de compra.
        - in: query
          name: buyerId
          required: false
          description: Id do comprador (Usuário do Sienge).
          schema:
            type: string
            example: '1'
        - in: query
          name: statusApproval
          required: false
          description: Código da situação de aprovação do pedido de compra.
          schema:
            $ref: '#/components/schemas/StatusApprovalEnum'
        - in: query
          name: consistency
          required: false
          schema:
            $ref: '#/components/schemas/ConsistencyEnum'
          description: |
            Status da situação de consistência do Pedido de compra.




             * IN_INCLUSION - Em inclusão,
             * CONSISTENT - Consistente,
             * INCONSISTENT - Inconsistente
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista de pedidos de compra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponseOfPurchaseOrder'
              example:
                links:
                  - href: string
                    rel: string
                resultSetMetadata:
                  count: 0
                  offset: 0
                  limit: 100
                results:
                  - id: 1
                    formattedPurchaseOrderId: '1'
                    status: PENDING
                    authorized: true
                    disapproved: false
                    deliveryLate: true
                    consistent: CONSISTENT
                    supplierId: 10
                    buildingId: 15
                    buyerId: comprador
                    date: '2018-03-11'
                    salesRepresentativeId: 1
                    internalNotes: Lorem ipsum dolor sit amet.
                    costCenterId: 100
                    departamentId: 1
                    companyBillId: 5
                    transporterId: 3
                    forecastDocumentId: PPC
                    forecastBillId: 1990
                    indexerId: 0
                    discount: 30.15
                    increase: 5.1
                    totalAmount: 15200.85
                    directBillingDocumentId: CT
                    directBillingContractNumber: 221
                    directBillingJustificationId: 2
                    createdBy: USER
                    createdAt: '2018-03-11T14:20:00.000-03:00'
                    modifiedBy: ANOTHERUSER
                    modifiedAt: '2018-04-02T18:20:00.000-03:00'
                    authorizedAt: '2018-04-02T18:20:00.000-03:00'
                    sentDate: '2018-04-02T18:20:00.000-03:00'
                    freightType: NI
                    freightAmount: 0
                    freightItemsAmount: 0
                    freightIpiFlag: 'N'
                    totalFreight: 0
                    notes: Lorem ipsum dolor sit amet.
                    paymentCondition: À vista
                    tenantUrl: https://api.sienge.com.br/dev.local/sienge/public/api
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
