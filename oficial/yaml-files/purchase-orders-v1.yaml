      type: object
      required:
        - resultSetMetadata
        - results
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de apropriações de obra de um item do pedido de compra.
          items:
            $ref: '#/components/schemas/PurchaseOrderItemBuildingAppropriation'
          example:
            - buildingUnitId: 1
              costEstimationItemReference: 08.004.001
              percentage: 5.88
            - buildingUnitId: 2
              costEstimationItemReference: 08.004.002
              percentage: 5.88
    PurchaseOrderTotalization:
      description: Totalização do pedido de compra
      type: object
      properties:
        itemsTotalAmount:
          type: integer
          format: double
          example: 25010
          description: Valor total dos itens
        discountAmount:
          type: integer
          format: double
          example: 620
          description: Valor do desconto do Pedido Compra
        freightItemsAmount:
          type: integer
          format: double
          example: 5200
          description: Valor dos itens do frete
        transporterId:
          type: integer
          format: int64
          example: 296
          description: Identificador do transportador
        paymentConditionDescription:
          type: string
          example: 10/20/30
          description: Descrição da condição de pagamento
        installmentsPaymentCondition:
          type: array
          description: Lista das parcelas das condições de pagamento
          items:
            $ref: '#/components/schemas/InstallmentPaymentCondition'
      example:
        itemsTotalAmount: 25010
        discountAmount: 620
        freightItemsAmount: 5200
        transporterId: 296
        paymentConditionDescription: 10/20/30
        installmentsPaymentCondition:
          - installmentId: 1
            numberOfdays: 10
            percentage: 25
    PurchaseOrderDirectBilling:
      description: Faturamento direto de um pedido de compra
      type: object
      properties:
        supplierId:
          description: Código do fornecedor
          example: 236
          format: int32
          type: integer
        buildingId:
          type: integer
          format: int64
