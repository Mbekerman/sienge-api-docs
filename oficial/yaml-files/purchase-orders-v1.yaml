  /purchase-orders/{purchaseOrderId}/items/{itemNumber}/purchase-requests:
    get:
      tags:
        - Pedidos de Compra
      summary: Itens de Solicitação atendidas.
      description: >-
        Retorna a lista de Solicitações de Compra vinculadas a um Item
        específico de um Pedido de Compra, agrupadas por Solicitação, Item de
        Solicitação e Categoria, com a soma da quantidade atendida de cada
        agrupamento. (REST)
      operationId: getPurchaseOrdersIdItemsIdPurchaseRequests
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
        - $ref: '#/components/parameters/PurchaseOrderItemNumberParam'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Operação bem sucedida.
          content:
            application/json:
              example:
                resultSetMetadata:
                  count: 1
                  offset: 0
                  limit: 100
                results:
                  - purchaseRequestId: 10
                    purchaseRequestItemId: 1
                    categoryId: 5
                    attendedQuantity: 2.5
              schema:
                type: object
                required:
                  - resultSetMetadata
                  - results
                properties:
                  resultSetMetadata:
                    $ref: '#/components/schemas/ResultSetMetadata'
                  results:
                    type: array
                    description: >-
                      Lista de Solicitações de Compra de origem do Item do
                      Pedido de Compra.
                    example:
                      - purchaseRequestId: 10
                        purchaseRequestItemId: 1
                        categoryId: 5
                        attendedQuantity: 2.5
                    items:
                      $ref: '#/components/schemas/PurchaseRequestOrigemDto'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
