components:
  schemas:
    PaginatedResponseOfPurchaseOrder:
      description: Lista de pedidos de compra retornadas
      type: object
      required:
        - links
        - resultSetMetadata
        - results
      properties:
        links:
          $ref: '#/components/schemas/Links'
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: Lista de Pedidos de Compra retornadas como resultado da requisição
          items:
            $ref: '#/components/schemas/PurchaseOrder'
          example:
            - id: 1
              formattedPurchaseOrderId: '1'
              status: PENDING
              authorized: true
              disapproved: false
              deliveryLate: true
              consistent: CONSISTENT
              supplierId: 10
              buildingId: 15
              buyerId: comprador
              date: '2018-03-11'
              salesRepresentativeId: 1
              internalNotes: Lorem ipsum dolor sit amet.
              costCenterId: 100
              departamentId: 1
              companyBillId: 5
              transporterId: 3
              forecastDocumentId: PPC
              forecastBillId: 1990
              indexerId: 0
              discount: 30.15
              increase: 5.1
              totalAmount: 15200.85
              directBillingDocumentId: CT
              directBillingContractNumber: 221
              directBillingJustificationId: 2
              createdBy: USER
              createdAt: '2018-03-11T14:20:00.000-03:00'
              modifiedBy: ANOTHERUSER
              modifiedAt: '2018-04-02T18:20:00.000-03:00'
              authorizedAt: '2018-04-02T18:20:00.000-03:00'
              sentDate: '2018-04-02T18:20:00.000-03:00'
              freightType: NI
              freightAmount: 0
              freightItemsAmount: 0
              freightIpiFlag: 'N'
              totalFreight: 0
              notes: Lorem ipsum dolor sit amet.
              paymentCondition: À vista
              tenantUrl: https://api.sienge.com.br/dev.local/sienge/public/api
    PurchaseOrder:
      description: Pedido de compra
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: Identificador do pedido de compra
        formattedPurchaseOrderId:
          type: string
          example: '1'
          description: Id do pedido de compra formatado de acordo com o parâmetro 415
        status:
          $ref: '#/components/schemas/PurchaseOrderStatusEnum'
        authorized:
          type: boolean
          example: true
          description: >-
            Retornará verdadeiro se pedido de compra estiver autorizado, caso
            contrário retornará falso.
        disapproved:
          type: boolean
          example: false
          description: >-
            Retornará verdadeiro se pedido de compra estiver reprovado, caso
            contrário retornará falso.
        deliveryLate:
          type: boolean
          example: true
          description: >-
            Retornará verdadeiro se um dos itens do pedido de compra estiver com
            alguma entrega em atraso, caso contrário retornará falso.
        consistent:
          $ref: '#/components/schemas/ConsistencyEnum'
        supplierId:
          description: Código do fornecedor
          example: 236
          format: int32
          type: integer
        buildingId:
          type: integer
          format: int64
          example: 15
          description: Identificador da obra vinculada ao pedido de compra
        buyerId:
          type: string
          example: comprador
          description: Identificador do comprador (Usuário do Sienge)
        date:
          type: string
          example: '2018-03-11'
          description: 'Data do pedido de compra no formato: yyyy-MM-dd.'
        salesRepresentativeId:
          type: integer
          example: 1
          description: Id do representante de venda
        internalNotes:
          type: string
          example: Lorem ipsum dolor sit amet.
          description: Observação interna do pedido.
        costCenterId:
          type: integer
          format: int64
          example: 100
          description: Id do centro de custo do pedido de compra
        departamentId:
          type: integer
          format: int64
          example: 1
          description: Id do departamento
        companyBillId:
          type: integer
          format: int64
          example: 5
          description: Id da empresa de cobrança
        transporterId:
          type: integer
          format: int64
          example: 3
          description: Id do transportador
        forecastDocumentId:
          type: string
          example: PPC
          description: Id do documento de previsão
        forecastBillId:
          type: integer
          format: int64
          example: 1990
          description: Número do título de previsão
        indexerId:
          type: integer
          format: int64
          example: 0
          description: Código do indexador do título de previsão
        discount:
          type: number
          format: double
          example: 30.15
          description: Valor do desconto
        increase:
          type: number
          format: double
          example: 5.1
          description: Outras despesas
        totalAmount:
          type: number
          format: double
          example: 15200.85
          description: Total do pedido de compra
        directBillingDocumentId:
          type: string
          example: CT
          description: Código do documento de pré-faturamento direto
        directBillingContractNumber:
          type: integer
          example: 221
          description: Número do contrato de pré-faturamento direto
        directBillingJustificationId:
          type: integer
          format: int64
          example: 2
          description: Id da justificativa de pré-faturamento direto
        createdBy:
          type: string
          example: USER
          description: Id do usuário que criou o pedido de compra
        createdAt:
          type: string
          example: '2018-03-11T14:20:00.000-03:00'
          description: >-
            Data de criação do pedido de compra no formato:
            yyyy-MM-dd'T'HH:mm:ss.SSSXXX.
        modifiedBy:
          type: string
          example: ANOTHERUSER
          description: Id do usuário que modificou o pedido de compra
        modifiedAt:
          type: string
          example: '2018-04-02T18:20:00.000-03:00'
          description: >-
            Data de modificação do pedido de compra no formato:
            yyyy-MM-dd'T'HH:mm:ss.SSSXXX.
        authorizedAt:
          type: string
          example: '2018-04-02T18:20:00.000-03:00'
          description: >-
            Data da última aprovação do pedido de compra no formato:
            yyyy-MM-dd'T'HH:mm:ss.SSSXXX.
        sentDate:
          type: string
          example: '2018-04-02T18:20:00.000-03:00'
          description: >-
            Data do último e-mail enviado do pedido de compra no formato:
            yyyy-MM-dd'T'HH:mm:ss.SSSXXX.
        freightType:
          $ref: '#/components/schemas/OrderFreightTypeEnum'
        freightAmount:
          type: number
          format: double
          example: 0
          description: Valor do frete.
        freightItemsAmount:
          type: number
          format: double
          example: 0
          description: Valor do frete nos itens.
        freightIpiFlag:
          $ref: '#/components/schemas/FreightIpiFlagEnum'
        totalFreight:
          type: number
          format: double
          example: 0
          description: Valor do frete adicionado o ipi;
        notes:
          type: string
          example: Lorem ipsum dolor sit amet.
          description: Observação do pedido.
        paymentCondition:
          type: string
          example: À vista
          description: Descrição condição de pagamento
        tenantUrl:
          type: string
          example: https://api.sienge.com.br/dev.local/sienge/public/api
          description: URL do tenant
    PaginatedResponseOfPurchaseOrderItem:
      description: Lista de items de um pedido de compra retornadas
      type: object
      required:
        - resultSetMetadata
        - results
      properties:
        resultSetMetadata:
          $ref: '#/components/schemas/ResultSetMetadata'
        results:
          type: array
          description: >-
            Lista de items de um pedido de compra retornadas como resultado da
            requisição
          items:
            $ref: '#/components/schemas/PurchaseOrderItem'
      example:
        resultSetMetadata:
          count: 1
          offset: 0
          limit: 100
        results:
          - itemNumber: 1
            buildingCostDatebaseId: 1
            resourceId: 1
            resourceDescription: Cimento
            resourceCode: M0012
            resourceReference: Cimento de Exemplo
            detailId: 1
            detailDescription: Detalhe X
            trademarkId: 1
            trademarkDescription: Marca X
            unitOfMeasure: kg
            quantity: 100
            estimatedPrice: 0
            unitPrice: 10.99
            netPrice: 10.99
            freightUnitPrice: 0
            discount: 0
            discountPercentage: 0
            increasePercentage: 0
            imcsTaxPercentage: 0
            ipiTaxPercentage: 0
            issTaxPercentage: 0
            notes: string
            purchaseQuotations:
              - purchaseQuotationId: 1
                purchaseQuotationItemId: 1
    PurchaseOrderItem:
      description: Item do pedido de compra
      type: object
      properties:
        itemNumber:
          type: integer
          format: int64
          example: 1
          description: Número do item do pedido de compra.
        buildingCostDatebaseId:
          type: integer
          format: int64
          example: 1
          description: Código da tabela de custo unitário na obra
        resourceId:
          type: integer
          format: int64
          example: 1
          description: Id do insumo
        resourceDescription:
          type: string
          example: Cimento
          description: Descrição do insumo
        resourceCode:
          type: string
          example: M0012
          description: Código auxiliar do insumo do item
        resourceReference:
          type: string
          example: Cimento de Exemplo
          description: Referência do insumo
        detailId:
          type: integer
          format: int64
          example: 1
          description: Id do detalhe do insumo
        detailDescription:
          type: string
          example: Detalhe X
          description: Descrição do detalhe do insumo
        trademarkId:
          type: integer
          format: int64
          example: 1
          description: Id da marca do insumo
        trademarkDescription:
          type: string
          example: Marca X
          description: Descrição da marca do insumo
        unitOfMeasure:
          type: string
          example: kg
          description: Unidade de medida do insumo
        quantity:
          type: number
          format: double
          example: 100
          description: Quantidade do insumo do pedido de compra
        estimatedPrice:
          type: number
          format: double
          example: 0
          description: Preço estimado.
        unitPrice:
          type: number
          format: double
          example: 10.99
          description: Preço unitário
        netPrice:
          type: number
          format: double
          example: 10.99
          description: Preço unitário liquido
        freightUnitPrice:
          type: number
          format: double
          example: 0
          description: Preço unitário do frete
        discount:
          type: number
          format: double
          example: 0
          description: Valor do desconto do item
        discountPercentage:
          type: number
          format: double
          example: 0
          description: Percentual do desconto
        increasePercentage:
          type: number
          format: double
          example: 0
          description: Percentual do acréscimo
        imcsTaxPercentage:
          type: number
          format: double
          example: 0
          description: Percentual referente ao ICMS
        ipiTaxPercentage:
          type: number
          format: double
          example: 0
          description: Percentual referente ao IPI
        issTaxPercentage:
          type: number
          format: double
          example: 0
          description: Percentual referente ao ISS
        notes:
          type: string
          description: Observações
          example: Observações
        purchaseQuotations:
          type: array
          description: Lista de cotações atendidas pelo item do pedido
          items:
            $ref: '#/components/schemas/PurchaseQuotation'
      example:
        itemNumber: 1
        buildingCostDatebaseId: 1
        resourceId: 1
        resourceDescription: Cimento
        resourceCode: M0012
        resourceReference: Cimento de Exemplo
        detailId: 1
        detailDescription: Detalhe X
        trademarkId: 1
        trademarkDescription: Marca X
        unitOfMeasure: kg
        quantity: 100
        estimatedPrice: 0
        unitPrice: 10.99
        netPrice: 10.99
        freightUnitPrice: 0
        discount: 0
        discountPercentage: 0
        increasePercentage: 0
        imcsTaxPercentage: 0
        ipiTaxPercentage: 0
        issTaxPercentage: 0
        notes: string
        purchaseQuotations:
          - purchaseQuotationId: 1
            purchaseQuotationItemId: 1
    ResultSetMetadata:
      description: Descrição dos dados de paginação
      example:
        count: 200
        limit: 100
        offset: 0
      properties:
        count:
          description: >-
            Total de resultados disponíveis na base de dados como resultado da
            pesquisa efetuada
          example: 2000
          format: int64
          maximum: 99999
          minimum: 0
          type: integer
        limit:
          default: 100
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default são 100 e o valor máximo permitdo são 200.
          example: 100
          format: int32
          maximum: 200
          minimum: 1
          type: integer
        offset:
          default: 0
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default são 0.
          example: 0
          format: int32
          maximum: 999999
          minimum: 0
          type: integer
      required:
        - count
        - offset
        - limit
      type: object
    PurchaseRequestOrigemDto:
      description: Dados Solicitação de Compras
      properties:
        attendedQuantity:
          description: >-
            Soma da quantidade atendida para a combinação de Solicitação, Item
            de Solicitação e Categoria.
          example: 2.5
          format: double
          type: number
        categoryId:
          description: >-
            Código da Categoria da Solicitação de Compra. Pode ser nulo quando a
            Solicitação não possui Categoria associada.
          example: 5
          format: int32
          nullable: true
          type: integer
        purchaseRequestId:
          description: Número da Solicitação de Compra de origem.
          example: 10
          format: int32
          type: integer
        purchaseRequestItemId:
          description: Número do Item da Solicitação de Compra de origem.
          example: 1
          format: int32
          type: integer
      type: object
    PaginatedResponseOfPurchaseOrderItemDeliverySchedule:
      description: Lista de entregas de um item de pedido de compra retornadas
